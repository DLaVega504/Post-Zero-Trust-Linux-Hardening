---
- name: "Universal Zero-Trust Linux Hardening Framework (Stage 2 - Production Core)"
  hosts: "hardened_nodes"
  become: true  
  gather_facts: true
  gather_subset:
    - "!all"
    - "!min"
    - "hardware"
    - "distribution"

  vars:
    os_crypt_name: "cryptroot"
    vault_crypt_name: "secure_vault"
    perf_mount_opts: "noatime,space_cache=v2,compress=zstd:1"
    
    is_workstation: "{{ ansible_facts['chassis_type'] | lower in ['laptop', 'notebook', 'desktop', 'chassis'] if 'chassis_type' in ansible_facts else true }}"
    
    calculated_swap_mb: >-
      {{
        4096 if not (is_workstation | bool) else
        (ansible_facts['memtotal_mb'] | int * 2) if (ansible_facts['memtotal_mb'] | int <= 7168) else
        (ansible_facts['memtotal_mb'] | int + 3072) if (ansible_facts['memtotal_mb'] | int > 7168 and ansible_facts['memtotal_mb'] | int <= 16384) else
        4096
      }}

    use_hybrid_zram: "{{ ansible_facts['memtotal_mb'] | int <= 16384 }}"
    use_earlyoom: "{{ ansible_facts['memtotal_mb'] | int < 6144 if 'memtotal_mb' in ansible_facts else true }}"

  tasks:
    - name: "PREFLIGHT | Ingest multi-distribution security baseline mappings file"
      ansible.builtin.include_vars:
        file: "vars_mapping.yml"
        name: "distro_blueprint"

    - name: "PREFLIGHT | Map host platform validation variables based on distro"
      ansible.builtin.set_fact:
        target_env: >-
          {{
            distro_blueprint.arch_vars if ansible_facts['os_family'] == 'Archlinux' else
            distro_blueprint.debian_vars if ansible_facts['os_family'] == 'Debian' else
            distro_blueprint.fedora_vars if ansible_facts['os_family'] == 'RedHat' else
            distro_blueprint.suse_vars
          }}

    - name: "PREFLIGHT | Deploy baseline core defensive software profiles"
      ansible.builtin.package:
        name: "{{ target_env.core_packages }}"
        state: "present"
        update_cache: true
      when: "target_env.core_packages is defined and not ansible_check_mode"

    - name: "GPU RECON | Scan local host physical PCI bus for discrete graphics controllers"
      ansible.builtin.shell: "cat /sys/bus/pci/devices/*/vendor"
      register: pci_vendor_dump
      changed_when: false
      check_mode: false

    - name: "GPU RECON | Map structural hardware asset discovery booleans"
      ansible.builtin.set_fact:
        has_nvidia: "{{ '0x10de' in pci_vendor_dump.stdout | default('') }}"
        has_amd: "{{ '0x1002' in pci_vendor_dump.stdout | default('') or '0x1022' in pci_vendor_dump.stdout | default('') }}"

    - name: "GPU PROVISION | Execute proprietary graphic stack deployments for NVIDIA hardware"
      ansible.builtin.package:
        name: >-
          {{
            ['nvidia', 'nvidia-utils', 'lib32-nvidia-utils'] if ansible_facts['os_family'] == 'Archlinux' else
            ['nvidia-driver', 'nvidia-kernel-dkms', 'nvidia-smi'] if ansible_facts['os_family'] == 'Debian' else
            ['akmod-nvidia', 'xorg-x11-drv-nvidia-cuda'] if ansible_facts['os_family'] == 'RedHat' else
            ['nvidia-gfxG06-kmp-default', 'x11-video-nvidiaG06']
          }}
        state: "present"
      become: true
      when:
        - "has_nvidia | bool"
        - "is_workstation | bool"
        - "not ansible_check_mode"

    - name: "STORAGE | Mount top-level Btrfs root partition (ID 5) to staging area"
      ansible.posix.mount:
        path: "/mnt/btrfs_root"
        src: "/dev/disk/by-uuid/{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | map(attribute='uuid') | first }}"
        fstype: "btrfs"
        opts: "rw,noatime,subvolid=5"
        state: "mounted"
      become: true
      when: "not ansible_check_mode"

    - name: "STORAGE | Check existing subvolumes on the top-level tree"
      ansible.builtin.command: "btrfs subvolume list /mnt/btrfs_root"
      register: live_subvol_check
      become: true
      changed_when: false
      when: "not ansible_check_mode"

    - name: "STORAGE | Dynamically forge missing subvolume nodes on ID 5 root tree"
      ansible.builtin.command: "btrfs subvolume create /mnt/btrfs_root/{{ item.name }}"
      loop: "{{ target_env.subvolumes }}"
      become: true
      when: 
        - "not ansible_check_mode"
        - "target_env.subvolumes is defined"
        - "item.name != '@' and item.name != '@rootfs' and item.name != 'root'"
        - "item.name not in live_subvol_check.stdout"
      register: subvolumes_created

    - name: "STORAGE | Secure existing directory data states before remount triggers"
      ansible.builtin.shell: |
        if [ -d "{{ item.dest }}" ] && [ "$(ls -A {{ item.dest }} 2>/dev/null)" ]; then
          mkdir -p /mnt/target_subvol
          mount -t btrfs -o rw,{{ perf_mount_opts }},subvol={{ item.name }} /dev/mapper/cryptroot /mnt/target_subvol
          rsync -aHAX {{ item.dest }}/ /mnt/target_subvol/
          umount /mnt/target_subvol
          rm -rf {{ item.dest }}/*
        fi
      loop: "{{ target_env.subvolumes }}"
      become: true
      when: 
        - "not ansible_check_mode"
        - "target_env.subvolumes is defined"
        - "item.name != '@' and item.name != '@rootfs' and item.name != 'root'"
        - "subvolumes_created.changed"

    - name: "STORAGE | Safely teardown staging area mount allocations"
      ansible.posix.mount:
        path: "/mnt/btrfs_root"
        state: "absent"
      become: true
      when: "not ansible_check_mode"
    - name: "SWAP DETECT | Query kernel swap tables natively"
      ansible.builtin.shell: "swapon --show=TYPE | grep -q 'partition' && echo 'true' || echo 'false'"
      register: raw_swap_type_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SWAP DETECT | Establish system block partition evaluation booleans"
      ansible.builtin.set_fact:
        has_swap_partition: "{{ raw_swap_type_check.stdout | default('false') | bool }}"

    - name: "HARDENING | Mount Btrfs parent swap subvolume tree safely to unblock file allocation"
      ansible.posix.mount:
        path: "/swap"
        src: "/dev/mapper/cryptroot"
        fstype: "btrfs"
        opts: "rw,{{ perf_mount_opts }},subvol=@swap"
        dump: "0"
        passno: "0"
        state: "mounted"
      become: true
      when: "not has_swap_partition | bool"

    - name: "HARDENING | Release kernel swap file lock to prevent text file busy errors"
      ansible.builtin.command: "swapoff /swap/swapfile"
      become: true
      failed_when: false
      changed_when: false
      when: 
        - "not ansible_check_mode"
        - "not has_swap_partition | bool"

    - name: "HARDENING | Check the size of the existing physical swap file"
      ansible.builtin.stat:
        path: "/swap/swapfile"
      register: swapfile_stat
      when: "not has_swap_partition | bool"

    - name: "HARDENING | Dynamically forge or resize physical swap file"
      ansible.builtin.command: "dd if=/dev/zero of=/swap/swapfile bs=1M count={{ calculated_swap_mb }} status=progress"
      become: true
      when: >
        not has_swap_partition | bool and
        not ansible_check_mode and 
        (not swapfile_stat.stat.exists or swapfile_stat.stat.size != (calculated_swap_mb | int * 1024 * 1024))
      register: swapfile_allocated

    - name: "HARDENING | Ensure physical swap file path exists"
      ansible.builtin.file:
        path: "/swap/swapfile"
        state: "touch"
        owner: "root"
        group: "root"
        mode: "0600"
      become: true
      when: "not has_swap_partition | bool"

    - name: "HARDENING | Format and secure physical swap file structures"
      ansible.builtin.file:
        path: "/swap/swapfile"
        owner: "root"
        group: "root"
        mode: "0600"
        state: "touch"
      become: true
      when: "not has_swap_partition | bool"

    - name: "HARDENING | Run mkswap on modified swap allocation"
      ansible.builtin.command: "mkswap /swap/swapfile"
      become: true
      when: 
        - "not has_swap_partition | bool"
        - "swapfile_allocated.changed and not ansible_check_mode"
    
    - name: "LOGGING | Output calculated system swap file deployment metrics"
      ansible.builtin.debug:
        msg: "========================================================\n[✔] SUCCESS: Swap file created -> Size: {{ (calculated_swap_mb | int / 1024) | round(1) }} GB ({{ calculated_swap_mb }} MB)\n========================================================"
      when: "not has_swap_partition | bool"

    - name: "SNAPPER | Check if root config file physically exists"
      ansible.builtin.stat:
        path: "/etc/snapper/configs/root"
      register: snapper_root_config_file
      become: true

    - name: "SNAPPER | Initialize root snapshot allocation container profile"
      ansible.builtin.command: "snapper -c root create-config /"
      become: true
      when: 
        - "not snapper_root_config_file.stat.exists"
        - "not ansible_check_mode"

    - name: "SNAPPER | Force strict rolling 2-day timeline retention values"
      ansible.builtin.lineinfile:
        path: "/etc/snapper/configs/root"
        regexp: "^##?{{ item.key }}="
        line: "{{ item.key }}=\"{{ item.val }}\""
        state: "present"
      become: true
      loop:
        - { key: "TIMELINE_MIN_AGE", val: "1800" }
        - { key: "TIMELINE_LIMIT_HOURLY", val: "0" }
        - { key: "TIMELINE_LIMIT_DAILY", val: "2" }
        - { key: "TIMELINE_LIMIT_WEEKLY", val: "0" }
        - { key: "TIMELINE_LIMIT_MONTHLY", val: "0" }
        - { key: "TIMELINE_LIMIT_YEARLY", val: "0" }
      when: "not ansible_check_mode"

    - name: "SNAPPER | Drop custom twice-a-day systemd scheduling execution tools"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - { name: "snapper-baseline.service", content: "[Unit]\nDescription=Automated Zero-Trust Security Snapshot Baseline\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/snapper -c root create --description \"Automated Zero-Trust Post-Hardening Baseline Checkpoint\"" }
        - { name: "snapper-baseline.timer", content: "[Unit]\nDescription=Trigger Automated Snapper Snapshot Twice Daily at 10AM and 4PM\n\n[Timer]\nOnCalendar=*-*-* 10,16:00:00\nPersistent=true\n\n[Install]\nWantedBy=timers.target" }
      notify: "Reload Systemd Configuration"
      become: true

    - name: "SNAPPER | Deploy distribution pre/post package manager terminal hook utilities"
      ansible.builtin.copy:
        dest: "{{ item.dest }}"
        content: "{{ item.content }}"
        owner: "root"
        group: "root"
        mode: "{{ item.mode | default('0644') }}"
      loop:
        - { dest: "/etc/apt/apt.conf.d/80snapper", mode: "0644", content: "DPkg::Pre-Invoke {\"snapper create --type pre --print-number --description 'APT Upgrade/Install Operation Initiation' > /tmp/snapper-apt-num || true\";};\nDPkg::Post-Invoke {\"[ -f /tmp/snapper-apt-num ] && snapper create --type post --pre-number=$(cat /tmp/snapper-apt-num) --description 'APT Upgrade/Install Operation Conclusion' && rm -f /tmp/snapper-apt-num || true\";};", condition: "Debian" }
        - { dest: "/usr/libexec/dnf/plugins/snapper_hook.py", mode: "0755", content: "from dnfpluginscore import DnfPlugin\nclass SnapperHook(DnfPlugin):\n name='snapper_hook'\n def __init__(self, base, cli):\n  super(SnapperHook, self).__init__(base, cli)\n  self.pre_num = None\n def pre_transaction(self):\n  import subprocess\n  try: self.pre_num = subprocess.check_output(['snapper', 'create', '--type', 'pre', '--print-number', '--description', 'DNF Core Package Modification Loop']).strip().decode()\n  except: pass\n def post_transaction(self):\n  import subprocess\n  if self.pre_num:\n   try: subprocess.call(['snapper', 'create', '--type', 'post', '--pre-number', self.pre_num, '--description', 'DNF Core Package Modification End'])\n   except: pass", condition: "RedHat" }
      when: "ansible_facts['os_family'] == item.condition and not ansible_check_mode"

    - name: "SNAPPER | Synchronize GRUB recovery system menus daemon"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: "started"
        enabled: true
      loop:
        - "snapper-baseline.timer"
        - "snapper-timeline.timer"
        - "snapper-cleanup.timer"
        - "{{ 'grub-btrfsd' if ansible_facts['os_family'] != 'Suse' else 'snapper' }}"
      become: true
      ignore_errors: "{{ ansible_check_mode }}"

    - name: "ELEVATION | Enforce explicit privilege elevation layout definitions"
      ansible.builtin.copy:
        content: "{{ target_username | default('vega') }} ALL=(ALL:ALL) ALL"
        dest: "/etc/sudoers.d/{{ target_username | default('vega') }}"
        owner: "root"
        group: "root"
        mode: "0440"
        validate: "visudo -cf %s"
      become: true
    - name: "VAULT ENGINE | Construct automated multi-layer binary wrapper utilities"
      ansible.builtin.copy:
        dest: "/usr/bin/vault"
        content: |
          #!/usr/bin/env bash
          # High-Security Universal Cross-Distribution Vault Automation Management Utility
          set -e
          VAULT_DEV="/dev/mapper/secure_vault"
          VAULT_MOUNT="/vault"
          PART_TARGET=$(blkid -t TYPE=crypto_LUKS -o device | grep -E '(3|2)$' | head -n 1)

          if [ "$EUID" -ne 0 ]; then
              echo "[-] ERROR: This secure data wrapper requires root context elevation. Invoke via sudo." >&2
              exit 1
          fi

          case "$1" in
              open)
                  if mountpoint -q "$VAULT_MOUNT"; then
                      echo "[*] NOTICE: High-security detached storage vault space is ALREADY open and mounted."
                      exit 0
                  fi
                  echo "[+] Unlocking Argon2id encrypted partition wrapper tracking sectors..."
                  cryptsetup open "$PART_TARGET" secure_vault --key-file /etc/secure/vault.key
                  echo "[+] Mounting isolated Btrfs subvolume nodes to path parameters..."
                  mkdir -p "$VAULT_MOUNT"
                  mount -o rw,noatime,compress=zstd:1,subvol=@secure "$VAULT_DEV" "$VAULT_MOUNT"
                  echo "[✔] Success: Hidden vault parameters are armed and accessible at $VAULT_MOUNT"
                  ;;
              close)
                  if ! mountpoint -q "$VAULT_MOUNT"; then
                      echo "[*] NOTICE: Vault boundary path parameters are already verified unmounted."
                      if [ -e "$VAULT_DEV" ]; then cryptsetup close secure_vault; fi
                      exit 0
                  fi
                  echo "[+] Flushing residual storage allocation tracks from disk queues..."
                  sync
                  umount -l "$VAULT_MOUNT"
                  echo "[+] Purging active hardware decryption keys from volatile memory loops..."
                  cryptsetup close secure_vault || true
                  echo "[✔] Success: Cryptographic data vault container successfully sealed."
                  ;;
              *)
                  echo "Usage: vault {open|close}" >&2
                  exit 1
                  ;;
          esac
        owner: "{{ target_username | default('vega') }}"
        group: "{{ target_env.admin_group | default('wheel') }}"
        mode: "0750"
      become: true

    - name: "VAULT ENGINE | Map structural non-login shortcuts and environment aliases"
      ansible.builtin.copy:
        dest: "/etc/profile.d/vault-shortcuts.sh"
        content: |
          # Automated Data Vault Management Shortcut Mappings
          alias vault-open="sudo /usr/bin/vault open"
          alias vault-close="sudo /usr/bin/vault close"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true

    - name: "VAULT ENGINE | Append global environment sourcing configuration hooks"
      ansible.builtin.blockinfile:
        path: "/etc/bash.bashrc"
        marker: "# {mark} ANSIBLE MANAGED VAULT ALIASES"
        block: |
          if [ -f /etc/profile.d/vault-shortcuts.sh ]; then . /etc/profile.d/vault-shortcuts.sh; fi
        create: true
        owner: "root"
        group: "root"
        mode: "0644"
      become: true

    - name: "HARDENING | Commit zero-trust filesystem layouts directly to fstab"
      ansible.posix.mount:
        path: "{{ item.dest }}"
        src: "/dev/mapper/cryptroot"
        fstype: "btrfs"
        opts: "rw,{{ perf_mount_opts }},nodev,nosuid{{ ',noexec' if item.dest not in ['/', '/home', '/swap'] else '' }},subvol={{ item.name }}"
        dump: "0"
        passno: "0"
        state: "present"
      become: true
      loop: "{{ target_env.subvolumes }}"
      when: 
        - "target_env.subvolumes is defined"
        - "item.dest != '/swap' and item.dest != '/'"

    - name: "HARDENING | Commit specialized zero-trust transient and virtual mount structures"
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: "{{ item.fstype }}"
        opts: "{{ item.opts }}"
        dump: "0"
        passno: "0"
        state: "present"
      become: true
      loop:
        - { path: "/swap", src: "/dev/mapper/cryptroot", fstype: "btrfs", opts: "rw,nodatacow,noatime,subvol=@swap" }
        - { path: "/tmp", src: "tmpfs", fstype: "tmpfs", opts: "defaults,noexec,nosuid,nodev,size=50%" }
        - { path: "/dev/shm", src: "tmpfs", fstype: "tmpfs", opts: "defaults,noexec,nosuid,nodev,size=1G" }
        - { path: "/proc", src: "proc", fstype: "proc", opts: "remount,defaults,nosuid,nodev,noexec,hidepid=2,gid=26" }
        - { path: "none", src: "/swap/swapfile", fstype: "swap", opts: "defaults,pri=10,discard,nodev,nosuid,noexec" }
      when: "not has_swap_partition | bool"

    - name: "HARDENING | Deploy personal kernel hardening sysctl drop-in"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-kernel-hardening.conf"
        content: |
          kernel.dmesg_restrict = 1
          kernel.kptr_restrict = 2
          net.ipv4.ip_forward = 0
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.tcp_syncookies = 1
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Kernel Parameters"

    - name: "HARDENING | Deploy personal memory tuning sysctl drop-in"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-memory-tuning.conf"
        content: |
          {% if ansible_facts['memtotal_mb'] | int <= 7168 %}
          vm.swappiness = 150
          vm.page_cluster = 0
          {% elif ansible_facts['memtotal_mb'] | int <= 16384 %}
          vm.swappiness = 100
          vm.page_cluster = 0
          {% else %}
          vm.swappiness = 10
          vm.page_cluster = 3
          {% endif %}
          vm.dirty_background_ratio = 5
          vm.dirty_ratio = 10
          vm.vfs_cache_pressure = 500
          vm.compaction_proactiveness = 80
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Kernel Parameters"

    - name: "HARDENING | Deploy personal flatpak namespace sysctl drop-in"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-flatpak-namespaces.conf"
        content: |
          kernel.unprivileged_userns_clone = 1
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Kernel Parameters"

    - name: "ENDPOINT SECURITY | Deploy Fail2ban and USBGuard"
      ansible.builtin.package:
        name:
          - fail2ban
          - usbguard
        state: "present"

    - name: "USBGUARD | Check if baseline hardware policy rules are defined"
      ansible.builtin.stat:
        path: "/etc/usbguard/rules.conf"
      register: usbguard_rules

    - name: "USBGUARD | Dynamically compile live connected peripheral authorization grid"
      ansible.builtin.command: "/usr/bin/usbguard generate-policy"
      register: computed_usb_policy
      when: not usbguard_rules.stat.exists or usbguard_rules.stat.size == 0
      failed_when: false
      changed_when: "computed_usb_policy.stdout is defined and computed_usb_policy.stdout | length > 0"

    - name: "USBGUARD | Write safety-validated rule configuration to disk"
      ansible.builtin.copy:
        content: "{{ computed_usb_policy.stdout }}\n"
        dest: "/etc/usbguard/rules.conf"
        owner: "root"
        group: "root"
        mode: "0600"
      when:
        - computed_usb_policy.changed
        - computed_usb_policy.stdout is defined
        - computed_usb_policy.stdout | length > 0
      notify: "Restart USBGuard Service"
      become: true

    - name: "CLAMAV | Enforce custom background database update frequency thresholds"
      ansible.builtin.lineinfile:
        path: "/etc/clamav/freshclam.conf"
        regexp: "^#?Checks\\s+"
        line: "Checks 2"
        state: "present"
      become: true
      notify: "Restart ClamAV Freshclam Service"
      ignore_errors: true

    - name: "Verify that the firewalld management utility is active and initialized"
      ansible.builtin.systemd:
        name: "firewalld"
        state: "started"
        enabled: true
      become: true

    - name: "ENDPOINT SECURITY | Activate core security infrastructure daemons"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: "started"
        enabled: true
      loop:
        - "fail2ban"
        - "usbguard"
        - "sysstat"
      become: true

    - name: "Permanently assign standard virtual tunnel interfaces to trusted zones"
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --add-interface={{ item }}"
      loop:
        - "tun+"
        - "wg+"
        - "proton+"
      become: true
      notify: "Reload Systemd Configuration"
      when: "not ansible_check_mode"

    - name: "STAGE 1 & 2 | Force active hardware interface natively into the block zone permanently"
      ansible.builtin.shell: |
        for intf in $(ls /sys/class/net | grep -E '^(wlan|wl|eth|en)'); do
          firewall-cmd --permanent --zone=block --add-interface="$intf"
        done
      become: true
      changed_when: false
      failed_when: false
      notify: "Reload Systemd Configuration"
      when:
        - "not ansible_check_mode"
        - "is_workstation | bool"

    - name: "HARDENING | Enforce explicit legal compliance warning banner text"
      ansible.builtin.copy:
        content: |
          ***************************************************************************
          *                           NOTICE TO USERS                               *
          *                                                                         *
          * This system is restricted solely to authorized users for authorized      *
          * purposes. All activities on this system are logged and monitored.       *
          * Unauthorized access, use, or modification of this system is strictly    *
          * prohibited and may be subject to criminal and civil penalties.          *
          *                                                                         *
          ***************************************************************************
        dest: "/etc/issue.net"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true

  handlers:
    - name: "Reload Systemd Configuration"
      ansible.builtin.systemd:
        daemon_reload: true

    - name: "Reload Kernel Parameters"
      ansible.builtin.command: "sysctl --system"
      failed_when: false

    - name: "Restart USBGuard Service"
      ansible.builtin.systemd:
        name: "usbguard"
        state: "restarted"

    - name: "Restart ClamAV Freshclam Service"
      ansible.builtin.systemd:
        name: "{{ 'clamav-freshclam' if ansible_facts['os_family'] in ['Debian', 'Archlinux'] else 'freshclam' }}"
        state: "restarted"

