---
- name: "Universal Zero-Trust Linux Hardening Framework (Stage 2 - Fully Integrated Post-Hardening Core)"
  hosts: "localhost"
  connection: "smart"
  become: true  
  gather_facts: true
  gather_subset:
    - "!all"
    - "!min"
    - "hardware"
    - "distribution"

  vars:
    perf_mount_opts: "noatime,space_cache=v2,compress=zstd:1"
    is_workstation: "{{ ansible_facts['chassis_type'] | lower in ['laptop', 'notebook', 'desktop', 'chassis'] if 'chassis_type' in ansible_facts else true }}"
    
    calculated_swap_mb: >-
      {{
        4096 if not (is_workstation | bool) else
        (ansible_facts['memtotal_mb'] | int * 2) if (ansible_facts['memtotal_mb'] | int <= 7168) else
        (ansible_facts['memtotal_mb'] | int + 3072) if (ansible_facts['memtotal_mb'] | int > 7168 and ansible_facts['memtotal_mb'] | int <= 16384) else
        4096
      }}

  tasks:
    # =========================================================================
    # PREFLIGHT INGESTION & ADVANCED RECONNAISSANCE
    # =========================================================================
    - name: "PREFLIGHT | Ingest multi-distribution security baseline mappings file"
      ansible.builtin.include_vars:
        file: "vars_mapping.yml"
        name: "distro_blueprint"

    - name: "PREFLIGHT | Map host platform validation variables based on distro"
      ansible.builtin.set_fact:
        target_env: >-
          {{
            distro_blueprint.arch_vars if ansible_facts['os_family'] == 'Archlinux' else
            distro_blueprint.debian_vars if ansible_facts['os_family'] == 'Debian' else
            distro_blueprint.fedora_vars if ansible_facts['os_family'] == 'RedHat' else
            distro_blueprint.suse_vars
          }}

    - name: "RECON | Track active kernel execution swap maps"
      ansible.builtin.shell: "swapon --show=NAME,TYPE --noheadings"
      register: active_swap_matrix
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "RECON | Discover underlying disk backing device maps for root"
      ansible.builtin.shell: "findmnt -n -o SOURCE /"
      register: root_source_device
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "RECON | Check root filesystem type allocation"
      ansible.builtin.shell: "findmnt -n -o FSTYPE /"
      register: root_fstype
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "RECON | Query live subvolumes from backing Btrfs pool"
      ansible.builtin.command: "btrfs subvolume list /"
      register: live_btrfs_subvols
      changed_when: false
      failed_when: false
      when: "root_fstype.stdout | trim == 'btrfs'"

    - name: "RECON | Query presence of any LUKS encrypted partition blocks on disk"
      ansible.builtin.command: "blkid -t TYPE=crypto_LUKS -o device"
      register: live_luks_devices
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "RECON | Evaluate active storage architecture state criteria"
      ansible.builtin.set_fact:
        is_btrfs: "{{ root_fstype.stdout | trim == 'btrfs' }}"
        root_device: "{{ root_source_device.stdout | trim }}"
        has_secure_vault: >-
          {{
            true if ('subvol=@secure' in live_btrfs_subvols.stdout | default('') or live_luks_devices.stdout_lines | length > 0) else false
          }}

    # =========================================================================
    # ENDPOINT PROTECTION | CORE SECURITY PACKAGES PROVISIONING
    # =========================================================================
    - name: "SECURITY CORE | Deploy localized baseline defensive software profiles"
      ansible.builtin.shell: |
        if [ "{{ ansible_facts['os_family'] }}" = "Archlinux" ]; then
          pacman -Sy --noconfirm {{ target_env.core_packages | join(' ') }}
        elif [ "{{ ansible_facts['os_family'] }}" = "Debian" ]; then
          apt-get update && apt-get install -y {{ target_env.core_packages | join(' ') }}
        elif [ "{{ ansible_facts['os_family'] }}" = "RedHat" ]; then
          dnf install -y {{ target_env.core_packages | join(' ') }}
        elif [ "{{ ansible_facts['os_family'] }}" = "Suse" ]; then
          zypper install -y {{ target_env.core_packages | join(' ') }}
        fi
      become: true
      when:
        - "target_env.core_packages is defined"
        - "not ansible_check_mode"

    - name: "BTRFS | Forge missing core subvolume structure targets natively"
      ansible.builtin.command: "btrfs subvolume create /mnt/{{ item.name }}"
      loop: "{{ target_env.subvolumes | default([]) }}"
      when: 
        - "is_btrfs | bool"
        - "target_env.subvolumes is defined"
        - "item.name not in live_btrfs_subvols.stdout"
        - "item.name != '@' and item.name != '@rootfs' and item.name != 'root'"
        - "item.dest != '/.snapshots'"
        - "not ansible_check_mode"
      failed_when: false

    - name: "BTRFS | Align discovered subvolumes into static fstab array fields"
      ansible.posix.mount:
        path: "{{ item.dest }}"
        src: "{{ root_device }}"
        fstype: "btrfs"
        opts: "rw,{{ perf_mount_opts }},nodev,nosuid,nofail,subvol={{ item.name }}"
        dump: "0"
        passno: "0"
        state: "present"
      loop: "{{ target_env.subvolumes | default([]) }}"
      when: 
        - "is_btrfs | bool"
        - "target_env.subvolumes is defined"
        - "item.name != '@' and item.name != '@rootfs' and item.name != 'root'"
        - "item.dest != '/.snapshots'"
        - "not ansible_check_mode"

    - name: "SNAPPER HARDENING | Enforce Arch and Debian standalone snapshot mappings"
      ansible.posix.mount:
        path: "/.snapshots"
        src: "{{ root_device }}"
        fstype: "btrfs"
        opts: "rw,{{ perf_mount_opts }},nodev,nosuid,noexec,nofail,subvol={{ '@snapshots' if ansible_facts['os_family'] == 'Archlinux' else '@_snapshots' }}"
        dump: "0"
        passno: "0"
        state: "present"
      when: "is_btrfs | bool and ansible_facts['os_family'] in ['Archlinux', 'Debian'] and not ansible_check_mode"

    - name: "SNAPPER HARDENING | Verify openSUSE nested snapshot mount parameters"
      ansible.posix.mount:
        path: "/.snapshots"
        src: "{{ root_device }}"
        fstype: "btrfs"
        opts: "rw,{{ perf_mount_opts }},nodev,nosuid,noexec,nofail,subvol=@/.snapshots"
        dump: "0"
        passno: "0"
        state: "present"
      when: "is_btrfs | bool and ansible_facts['os_family'] == 'Suse' and not ansible_check_mode"

    # =========================================================================
    # RE-ENGINEERED SWAP PROVISIONING | DYNAMIC HYBRID MATRIX ENGINE
    # =========================================================================
    - name: "SWAP PROVISION | Query live system total memory allocation footprints"
      ansible.builtin.set_fact:
        current_active_swap_mb: "{{ ansible_facts['swapfree_mb'] | int + ansible_facts['swaptotal_mb'] | int }}"
        target_formula_swap_mb: "{{ calculated_swap_mb | int }}"

    - name: "SWAP PROVISION | Determine if additional persistent backing cushion is required"
      ansible.builtin.set_fact:
        needs_backing_swapfile: "{{ (current_active_swap_mb | int) < (target_formula_swap_mb | int) }}"

    - name: "SWAP PROVISION | Ensure local subvolume mountpoint path structure exists"
      ansible.builtin.file:
        path: "/swap"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0750"
      when: "needs_backing_swapfile | bool and is_btrfs | bool"

    - name: "SWAP PROVISION | Mount dedicated swap subvolume workspace temporarily"
      ansible.posix.mount:
        path: "/swap"
        src: >-
          {{
            '/dev/mapper/root' if ('/dev/mapper/' in root_device or 'root' in root_device) else root_device
          }}
        fstype: "btrfs"
        opts: "rw,noatime,subvol=@swap"
        state: "mounted"
      when: "needs_backing_swapfile | bool and is_btrfs | bool and not ansible_check_mode"

    - name: "SWAP PROVISION | Verify if a local physical swapfile exists inside volume"
      ansible.builtin.stat:
        path: "/swap/swapfile"
      register: target_swapfile_check
      when: "needs_backing_swapfile | bool"

    # =========================================================================
    # ADVANCED BTRFS NATIVE SWAPFILE PROVISIONING SUB-ARRAY
    # =========================================================================
    - name: "SWAP PROVISION | Clear broken or malformed pre-existing swap allocations"
      ansible.builtin.file:
        path: "/swap/swapfile"
        state: "absent"
      when: "needs_backing_swapfile | bool and not target_swapfile_check.stat.exists"

    - name: "SWAP PROVISION | Touch zero-byte target allocation block anchor"
      ansible.builtin.file:
        path: "/swap/swapfile"
        state: "touch"
        owner: "root"
        group: "root"
        mode: "0600"
      when: "needs_backing_swapfile | bool and not target_swapfile_check.stat.exists"

    - name: "SWAP PROVISION | Strip compression and isolate block from Btrfs CoW rules"
      ansible.builtin.command: "chattr +C /swap/swapfile"
      when: "needs_backing_swapfile | bool and not target_swapfile_check.stat.exists and not ansible_check_mode"

    - name: "SWAP PROVISION | Force a completely contiguous uncompressed disk block allocation"
      ansible.builtin.command: "fallocate -l {{ calculated_swap_mb }}M /swap/swapfile"
      register: fresh_swap_stream_allocated
      when:
        - "needs_backing_swapfile | bool"
        - "not target_swapfile_check.stat.exists"
        - "not ansible_check_mode"

    - name: "SWAP PROVISION | Apply strict security access masks to swapfile parameters"
      ansible.builtin.file:
        path: "/swap/swapfile"
        owner: "root"
        group: "root"
        mode: "0600"
        state: "file"
      when: "needs_backing_swapfile | bool and not ansible_check_mode"

    - name: "SWAP PROVISION | Initialize swap space filesystem headers"
      ansible.builtin.command: "mkswap /swap/swapfile"
      when:
        - "needs_backing_swapfile | bool"
        - "fresh_swap_stream_allocated is changed"
        - "not ansible_check_mode"

    - name: "SWAP PROVISION | Execute hot activation of swap block into memory tables"
      ansible.builtin.command: "swapon -p 10 /swap/swapfile"
      when:
        - "needs_backing_swapfile | bool"
        - "fresh_swap_stream_allocated is changed"
        - "not ansible_check_mode"

    - name: "SWAP PROVISION | Permanently secure swap target tracking parameters to system fstab"
      ansible.posix.mount:
        path: "none"
        src: "/swap/swapfile"
        fstype: "swap"
        opts: "defaults,pri=10,discard,nodev,nosuid,noexec,nofail"
        dump: "0"
        passno: "0"
        state: "present"
      when: "needs_backing_swapfile | bool and not ansible_check_mode"

    - name: "SWAP PROVISION | Force universal hot kernel activation fallback"
      ansible.builtin.command: "swapon -a"
      when: "needs_backing_swapfile | bool and not ansible_check_mode"

    # =========================================================================
    # VAULT ENGINE, ANTI-LOCKOUT USBGUARD, & RESOURCE-BALANCED CLAMAV
    # =========================================================================
    - name: "VAULT ENGINE | Construct automated multi-layer binary wrapper utilities"
      ansible.builtin.copy:
        dest: "/usr/bin/vault"
        content: |
          #!/usr/bin/env bash
          set -e
          VAULT_DEV="/dev/mapper/secure_vault"
          VAULT_MOUNT="/vault"

          if blkid -t TYPE=crypto_LUKS -o device | grep -q "root"; then
              PART_TARGET=$(blkid -t TYPE=crypto_LUKS -o device | grep "root" | head -n 1)
              MOUNT_OPTS="rw,noatime,compress=zstd:1,subvol=@secure"
          else
              PART_TARGET=$(blkid -t TYPE=crypto_LUKS -o device | head -n 1)
              MOUNT_OPTS="rw,noatime,compress=zstd:1"
          fi

          if [ "$EUID" -ne 0 ]; then
              echo "[-] ERROR: This secure data wrapper requires root context elevation. Invoke via sudo." >&2
              exit 1
          fi

          case "$1" in
              open)
                  if mountpoint -q "$VAULT_MOUNT"; then
                      echo "[*] NOTICE: Storage vault space is ALREADY open and mounted."
                      exit 0
                  fi
                  if [ -z "$PART_TARGET" ]; then
                      echo "[-] ERROR: No valid LUKS cryptographic vault target partition detected on this host." >&2
                      exit 1
                  fi
                  cryptsetup open "$PART_TARGET" secure_vault --key-file /etc/secure/vault.key
                  mkdir -p "$VAULT_MOUNT"
                  mount -o $MOUNT_OPTS "$VAULT_DEV" "$VAULT_MOUNT"
                  ;;
              close)
                  if ! mountpoint -q "$VAULT_MOUNT"; then
                      if [ -e "$VAULT_DEV" ]; then cryptsetup close secure_vault; fi
                      exit 0
                  fi
                  sync
                  umount -l "$VAULT_MOUNT"
                  cryptsetup close secure_vault || true
                  ;;
              *)
                  echo "Usage: vault {open|close}" >&2
                  exit 1
                  ;;
          esac
        owner: "root"
        group: "{{ target_env.admin_group | default('wheel') }}"
        mode: "0750"
      when: "has_secure_vault | bool"

    - name: "VAULT ENGINE | Map structural shortcuts and environmental aliases"
      ansible.builtin.copy:
        dest: "/etc/profile.d/vault-shortcuts.sh"
        content: |
          alias vault-open="sudo /usr/bin/vault open"
          alias vault-close="sudo /usr/bin/vault close"
        owner: "root"
        group: "root"
        mode: "0644"
      when: "has_secure_vault | bool"

    - name: "USBGUARD | Ensure configuration parent directories exist"
      ansible.builtin.file:
        path: "/etc/usbguard"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"

    - name: "USBGUARD | Scan live connected peripheral topology on this host"
      ansible.builtin.command: "/usr/bin/usbguard generate-policy"
      register: live_hardware_scan
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "USBGUARD | Dynamically write safety-validated rules matrix to disk"
      ansible.builtin.copy:
        content: |
          # 1. CORE MACHINE TOPOLOGY SCAN (GENERATED DYNAMICALLY)
          {{ live_hardware_scan.stdout | default('# No hardware scan returned') }}

          # 2. UNIVERSAL ANTI-LOCKOUT LIFE JACKET: Allow all human interface devices
          allow with-interface match { 03:*:* }
        dest: "/etc/usbguard/rules.conf"
        owner: "root"
        group: "root"
        mode: "0600"
      when: "not ansible_check_mode"
      notify: "Restart USBGuard Service"
    # =========================================================================
    # RESOURCE-BALANCED CLAMAV ANTIVIRUS INFRASTRUCTURE
    # =========================================================================
    - name: "CLAMAV | Ensure database configuration tracking file is verified"
      ansible.builtin.file:
        path: "/etc/clamav/freshclam.conf"
        state: "touch"
        owner: "root"
        group: "root"
        mode: "0644"

    - name: "CLAMAV | Enforce custom background database update frequency thresholds"
      ansible.builtin.lineinfile:
        path: "/etc/clamav/freshclam.conf"
        regexp: "^#?Checks\\s+"
        line: "Checks 2"
        state: "present"
      when: "not ansible_check_mode"
      notify: "Restart ClamAV Freshclam Service"

    - name: "CLAMAV | Ensure systemd drop-in override directory structures exist"
      ansible.builtin.file:
        path: "/etc/systemd/system/clamav-daemon.service.d"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"
      when: "not ansible_check_mode"

    - name: "CLAMAV | Inject custom systemd low-priority cgroup overrides"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/clamav-daemon.service.d/override.conf"
        content: "[Service]\nNice=19\nCPUQuota=10%\nCPUSchedulingPolicy=idle\nMemoryMax=1.2G\nMemoryHigh=1.0G"
        owner: "root"
        group: "root"
        mode: "0644"
      when: "not ansible_check_mode"
      notify: "Reload Active Systemd Core"

    # =========================================================================
    # FILE INTEGRITY MONITORING INFRASTRUCTURE (AIDE CONFIGURATION)
    # =========================================================================
    - name: "AIDE | Locate distribution-specific configuration paths"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "/etc/aide/aide.conf"
        - "/etc/aide.conf"
      register: aide_config_path_check
      changed_when: false

    - name: "AIDE | Map operational destination configuration path fact"
      ansible.builtin.set_fact:
        active_aide_config: "{{ (aide_config_path_check.results | selectattr('stat.exists', 'equalto', true) | map(attribute='item') | first) | default('/etc/aide.conf') }}"

    - name: "AIDE | Inject custom exclusions for volatile virtual paths and media blocks"
      ansible.builtin.blockinfile:
        path: "{{ active_aide_config }}"
        marker: "# {mark} ANSIBLE MANAGED ISOLATION LAYERS"
        block: |
          !/proc$
          !/sys$
          !/run$
          !/dev$
          !/var/cache$
          !/home/[^/]+/Music$
          !/home/[^/]+/Videos$
          !/home/[^/]+/Downloads$
        create: true
        owner: "root"
        group: "root"
        mode: "0644"

    - name: "AIDE | Audit physical presence of a master integrity baseline"
      ansible.builtin.stat:
        path: "{{ '/var/lib/aide/aide.db.gz' if ansible_facts['os_family'] in ['Debian', 'Archlinux'] else '/var/lib/aide/aide.db' }}"
      register: active_aide_db_file

    - name: "AIDE | Force flush rogue processes and stale file lock tracks"
      ansible.builtin.shell: |
        pkill -9 -f aide || true
        rm -f /var/log/aide/aide.log.lock
        rm -f /var/lib/aide/aide.db.new.gz.lock
        rm -f /var/lib/aide/aide.db.gz.lock
      changed_when: false
      failed_when: false
      when: "not ansible_check_mode"

    - name: "AIDE | Initialize secure baseline system database if missing"
      ansible.builtin.command: "aide --init"
      when: "not active_aide_db_file.stat.exists and not ansible_check_mode"

    - name: "AIDE | Commit baseline database structure to active operational tracking"
      ansible.builtin.copy:
        src: "{{ '/var/lib/aide/aide.db.new.gz' if ansible_facts['os_family'] in ['Debian', 'Archlinux'] else '/var/lib/aide/aide.db.new' }}"
        dest: "{{ '/var/lib/aide/aide.db.gz' if ansible_facts['os_family'] in ['Debian', 'Archlinux'] else '/var/lib/aide/aide.db' }}"
        remote_src: true
        owner: "root"
        group: "root"
        mode: "0600"
      when: "not active_aide_db_file.stat.exists and not ansible_check_mode"

    - name: "AIDE | Drop custom automated integrity scanning service units"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - { name: "aide-check.service", content: "[Unit]\nDescription=Automated Post-Hardening File Integrity Security Scan\nAfter=local-fs.target network.target\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/aide --check\nNice=19\nCPUSchedulingPolicy=idle\nIOSchedulingClass=idle" }
        - { name: "aide-check.timer", content: "[Unit]\nDescription=Trigger Automated System Integrity Scan Daily at 3AM\n\n[Timer]\nOnCalendar=*-*-* 03:00:00\nPersistent=true\n\n[Install]\nWantedBy=timers.target" }
      notify: "Reload Active Systemd Core"

    # =========================================================================
    # ADVANCED ZERO-TRUST IMMUTABLE AUDITING CORE (INTEGRATED ADVANCED UPGRADE)
    # =========================================================================
    - name: "AUDITD | Enforce optimized local data management rotations parameters"
      ansible.builtin.lineinfile:
        path: "/etc/audit/auditd.conf"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: "present"
      loop:
        - { regexp: "^max_log_file\\s+=", line: "max_log_file = 50" }
        - { regexp: "^max_log_file_action\\s+=", line: "max_log_file_action = ROTATE" }
        - { regexp: "^space_left_action\\s+=", line: "space_left_action = SYSLOG" }
        - { regexp: "^admin_space_left_action\\s+=", line: "admin_space_left_action = SUSPEND" }
      when: "not ansible_check_mode"

    - name: "AUDITD | Clean conflicting pre-existing default tracking blueprints"
      ansible.builtin.file:
        path: "/etc/audit/rules.d/audit.rules"
        state: "absent"
      when: "not ansible_check_mode"

    - name: "AUDITD | Deploy un-falsifiable zero-trust kernel logging rules matrix"
      ansible.builtin.copy:
        dest: "/etc/audit/rules.d/audit.rules"
        content: |
          -D
          -b 8192
          -f 2

          # 1. TRACK HIGH-SECURITY CREDENTIAL & PRIVILEGE LEDGER MUTATIONS
          -w /etc/group -p wa -k security_credentials
          -w /etc/passwd -p wa -k security_credentials
          -w /etc/shadow -p wa -k security_credentials
          -w /etc/sudoers -p wa -k security_privileges
          -w /etc/sudoers.d/ -p wa -k security_privileges

          # 2. MONITOR FILE SYSTEM MOUNT & CRYPTOGRAPHIC LEDGER RECONCILIATIONS
          -w /etc/fstab -p wa -k filesystem_ledgers
          -w /etc/crypttab -p wa -k filesystem_ledgers

          # 3. INTERCEPT DYNAMIC PRIVILEGE TRANSLATIONS & ESCALATION ACTIONS
          -a always,exit -F arch=b64 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k privilege_escalation
          -a always,exit -F arch=b32 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k privilege_escalation
          -a always,exit -F arch=b64 -S execve -F auid>=1000 -F auid!=4294967295 -k process_execution
          -a always,exit -F arch=b32 -S execve -F auid>=1000 -F auid!=4294967295 -k process_execution

          # 4. TRACK SYSTEM DEFENSE APPLICATION CONTAINER MODIFICATIONS
          -w /etc/usbguard/rules.conf -p wa -k peripheral_security
          -w /etc/aide.conf -p wa -k integrity_monitoring
          -w /etc/aide/aide.conf -p wa -k integrity_monitoring

          # 5. ABSOLUTE ADVANCED ZERO-TRUST KERNEL HARDENING LOCKRULE (-e 2)
          -e 2
        owner: "root"
        group: "root"
        mode: "0600"
      when: "not ansible_check_mode"
      notify: "Reload Active Systemd Core"

    - name: "HARDENING | Enforce robust distribution-agnostic protection metrics via sysctl"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-memory-hardening.conf"
        content: |
          kernel.dmesg_restrict = 1
          kernel.kptr_restrict = 2
          net.ipv4.ip_forward = 0
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.tcp_syncookies = 1
        owner: "root"
        group: "root"
        mode: "0644"
      notify: "Trigger Active System Kernel Flush"

    - name: "HARDENING | Secure virtual execution interfaces securely inside fstab storage arrays"
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: "{{ item.fstype }}"
        opts: "{{ item.opts }}"
        dump: "0"
        passno: "0"
        state: "present"
      loop:
        - { path: "/tmp", src: "tmpfs", fstype: "tmpfs", opts: "defaults,nosuid,nodev,size=50%" }
        - { path: "/dev/shm", src: "tmpfs", fstype: "tmpfs", opts: "defaults,noexec,nosuid,nodev,size=1G" }

    - name: "SECURITY SERVICES | Activate and enable baseline security infrastructure daemons"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: "started"
        enabled: true
      loop: ["firewalld", "fail2ban", "sysstat", "usbguard", "aide-check.timer", "auditd"]
      failed_when: false

    - name: "FIREWALL RECON | Dynamically discover physical hardware adapter interfaces"
      ansible.builtin.shell: "ls /sys/class/net | grep -E '^(wlan|wl|eth|en)'"
      register: live_hardware_interfaces
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "STAGE 1 KILLSWITCH | Force active physical interfaces into block zone permanently"
      ansible.builtin.command: "firewall-cmd --permanent --zone=block --add-interface={{ item }}"
      loop: "{{ live_hardware_interfaces.stdout_lines | default([]) }}"
      become: true
      when:
        - "live_hardware_interfaces.stdout_lines is defined"
        - "is_workstation | bool"
        - "not ansible_check_mode"

    - name: "STAGE 2 & 3 KILLSWITCH | Permanently assign virtual tunnel interfaces to trusted zones"
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --add-interface={{ item }}"
      loop: ["tun+", "wg+", "proton+"]
      become: true
      when: "not ansible_check_mode"

    - name: "FIREWALLD | Deploy global runtime persistence environment script hooks"
      ansible.builtin.copy:
        dest: "/etc/profile.d/firewall-killswitches.sh"
        content: |
          #!/usr/bin/env bash
          alias portaloff="sudo firewall-cmd --zone=trusted --add-interface=\$(ls /sys/class/net | grep -E '^(wlan|wl|eth|en)' | head -n 1) && sudo firewall-cmd --reload"
          alias portalon="sudo firewall-cmd --zone=block --add-interface=\$(ls /sys/class/net | grep -E '^(wlan|wl|eth|en)' | head -n 1) && sudo firewall-cmd --reload"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Firewalld Configuration"

    # =========================================================================
    # SNAPPER SERVICE & TIMELINE AUTOMATION (6AM, 3PM, MIDNIGHT HARD-SCHEDULE)
    # =========================================================================
    - name: "SNAPPER | Drop custom automated snapshot tracking service units"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - { name: "snapper-posthardening.service", content: "[Unit]\nDescription=Automated Post-Hardening Posture Timeline Snapshot\nAfter=local-fs.target\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/snapper -c root create --type timeline --description \"Automated Security Hardening Checkpoint\"" }
        - { name: "snapper-posthardening.timer", content: "[Unit]\nDescription=Trigger Snapper Timeline Snapshot At Explicit Security Windows\n\n[Timer]\nOnCalendar=*-*-* 00,06,15:00:00\nPersistent=true\n\n[Install]\nWantedBy=timers.target" }
      notify: "Reload Active Systemd Core"

    - name: "SNAPPER | Force explicit timeline schedule timers to enable and activate"
      ansible.builtin.systemd:
        name: "snapper-posthardening.timer"
        state: "started"
        enabled: true
      when: "not ansible_check_mode"

    - name: "SNAPPER | Verify standard distribution timeline schedules are safely managed"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: "started"
        enabled: true
      loop:
        - "snapper-cleanup.timer"
      failed_when: false
      when: "not ansible_check_mode"

  handlers:
    - name: "Trigger Active System Kernel Flush"
      ansible.builtin.command: "sysctl --system"
      failed_when: false

    - name: "Reload Firewalld Configuration"
      ansible.builtin.command: "firewall-cmd --reload"
      failed_when: false
      become: true

    - name: "Reload Active Systemd Core"
      ansible.builtin.systemd:
        daemon_reload: true

    - name: "Restart USBGuard Service"
      ansible.builtin.systemd:
        name: "usbguard"
        state: "restarted"
      failed_when: false

    - name: "Restart ClamAV Freshclam Service"
      ansible.builtin.systemd:
        name: "{{ 'clamav-freshclam' if ansible_facts['os_family'] in ['Debian', 'Archlinux'] else 'freshclam' }}"
        state: "restarted"

