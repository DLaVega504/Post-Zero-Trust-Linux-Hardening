---
- name: "Universal Zero-Trust Linux Hardening Framework (Stage 2 - Production Core)"
  hosts: "hardened_nodes"
  become: true  
  gather_facts: true
  gather_subset:
    - "!all"
    - "!min"
    - "hardware"
    - "distribution"

  vars:
    os_crypt_name: "crypt_root"
    vault_crypt_name: "secure_vault"
    perf_mount_opts: "noatime,space_cache=v2,compress=zstd:1"
    
    is_workstation: "{{ ansible_facts['chassis_type'] | lower in ['laptop', 'notebook', 'desktop', 'chassis'] if 'chassis_type' in ansible_facts else true }}"
    use_earlyoom: "{{ ansible_facts['memtotal_mb'] | int < 6144 if 'memtotal_mb' in ansible_facts else true }}"
    
    # ADVANCED MEMORY PROFILE MANAGEMENT (AUTOMATED HYBRID TIERS)
    calculated_swap_mb: >-
      {{
        (ansible_facts['memtotal_mb'] | int * 2) if (ansible_facts['memtotal_mb'] | int <= 6144) else
        (ansible_facts['memtotal_mb'] | int + 3072) if (ansible_facts['memtotal_mb'] | int >= 6145 and ansible_facts['memtotal_mb'] | int <= 15360) else
        4096
      }}

  tasks:
    - name: "Ingest multi-distribution security baseline mappings file"
      ansible.builtin.include_vars:
        file: "vars_mapping.yml"
        name: "distro_blueprint"

    - name: "Map host platform operational security variables for Arch Linux"
      ansible.builtin.set_fact:
        target_env: "{{ distro_blueprint.arch_vars }}"
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "Map host platform operational security variables for Debian"
      ansible.builtin.set_fact:
        target_env: "{{ distro_blueprint.debian_vars }}"
      when: "ansible_facts['os_family'] == 'Debian'"

    - name: "Map host platform operational security variables for Fedora (RedHat)"
      ansible.builtin.set_fact:
        target_env: "{{ distro_blueprint.fedora_vars }}"
      when: "ansible_facts['os_family'] == 'RedHat'"

    - name: "Map host platform operational security variables for openSUSE (Suse)"
      ansible.builtin.set_fact:
        target_env: "{{ distro_blueprint.suse_vars }}"
      when: "ansible_facts['os_family'] == 'Suse'"

    - name: "Validate that target architecture mapping succeeded"
      ansible.builtin.meta: end_play
      when: "target_env is not defined"
    - name: "PREFLIGHT | Install libpwquality to guarantee PAM stability"
      ansible.builtin.package:
        name: "libpwquality"
        state: "present"
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "PREFLIGHT | Deploy baseline core defensive software profiles"
      ansible.builtin.package:
        name: "{{ target_env.core_packages }}"
        state: "present"
      when: "target_env.core_packages is defined and not ansible_check_mode"

    - name: "Dynamically identify primary physical wireless interface name"
      ansible.builtin.set_fact:
        wifi_interface: "{{ ansible_facts['interfaces'] | select('match', '^wl.*') | first | default('eth0') }}"
      when: is_workstation

    - name: "GPU RECON | Scan local host physical PCI bus for discrete graphics controllers"
      ansible.builtin.shell: "cat /sys/bus/pci/devices/*/vendor"
      register: pci_vendor_dump
      changed_when: false

    - name: "GPU RECON | Map structural hardware asset discovery booleans"
      ansible.builtin.set_fact:
        has_nvidia: "{{ '0x10de' in pci_vendor_dump.stdout }}"
        has_amd: "{{ '0x1002' in pci_vendor_dump.stdout or '0x1022' in pci_vendor_dump.stdout }}"

    - name: "GPU PROVISION | Execute proprietary graphic stack deployments for NVIDIA hardware"
      ansible.builtin.package:
        name: >-
          {{
            ['nvidia', 'nvidia-utils', 'lib32-nvidia-utils'] if ansible_facts['os_family'] == 'Archlinux' else
            ['nvidia-driver', 'nvidia-kernel-dkms', 'nvidia-smi'] if ansible_facts['os_family'] == 'Debian' else
            ['akmod-nvidia', 'xorg-x11-drv-nvidia-cuda'] if ansible_facts['os_family'] == 'RedHat' else
            ['nvidia-gfxG06-kmp-default', 'x11-video-nvidiaG06']
          }}
        state: "present"
      become: true
      when:
        - "has_nvidia | bool"
        - "is_workstation | bool"
        - "not ansible_check_mode"

    - name: "GPU PROVISION | Execute open-source acceleration deployments for AMD/Radeon hardware"
      ansible.builtin.package:
        name: >-
          {{
            ['xf86-video-amdgpu', 'mesa', 'lib32-mesa'] if ansible_facts['os_family'] == 'Archlinux' else
            ['xserver-xorg-video-amdgpu', 'mesa-vulkan-drivers'] if ansible_facts['os_family'] == 'Debian' else
            ['xorg-x11-drv-amdgpu', 'mesa-vdr-drivers'] if ansible_facts['os_family'] == 'RedHat' else
            ['xf86-video-amdgpu', 'Mesa-libVA']
          }}
        state: "present"
      become: true
      when:
        - "has_amd | bool"
        - "is_workstation | bool"
        - "not ansible_check_mode"

    - name: "Ensure parent systemd allocation directory trees exist"
      ansible.builtin.file:
        path: "{{ target_env.zram_conf_path | default('/etc/systemd/zram-generator.conf') | dirname }}"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"
      become: true

    - name: "Deploy priority parameters to systemd-zram swap configuration"
      ansible.builtin.copy:
        dest: "{{ target_env.zram_conf_path | default('/etc/systemd/zram-generator.conf') }}"
        content: |
          [zram0]
          zram-size = ram
          swap-priority = 32767
          compression-algorithm = zstd
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: 
        - "Reload Systemd Configuration"
        - "Force Active ZRAM Initialization"
    - name: "RECON | Dynamically extract active primary Btrfs root device block mapper source"
      ansible.builtin.set_fact:
        root_device_node: "{{ ansible_facts['mounts'] | selectattr('mount', 'equalto', '/') | map(attribute='device') | first }}"

    - name: "HARDENING | Mount Btrfs parent swap subvolume tree safely to unblock file allocation"
      ansible.posix.mount:
        path: "/swap"
        src: "{{ root_device_node }}"
        fstype: "btrfs"
        opts: "rw,{{ perf_mount_opts }},subvol=/@swap"
        dump: "0"
        passno: "0"
        state: "mounted"
      become: true

    - name: "HARDENING | Release kernel swap file lock to prevent text file busy errors"
      ansible.builtin.command: "swapoff /swap/swapfile"
      become: true
      failed_when: false
      changed_when: false
      when: "not ansible_check_mode"

    - name: "HARDENING | Check the size of the existing physical swap file"
      ansible.builtin.stat:
        path: "/swap/swapfile"
      register: swapfile_stat

    - name: "HARDENING | Dynamically forge or resize physical swap file"
      ansible.builtin.command: >
        dd if=/dev/zero of=/swap/swapfile bs=1M count={{ calculated_swap_mb }}
      become: true
      when: >
        not ansible_check_mode and 
        (not swapfile_stat.stat.exists or swapfile_stat.stat.size != (calculated_swap_mb | int * 1024 * 1024))
      register: swapfile_allocated

    - name: "HARDENING | Format and secure physical swap file structures"
      ansible.builtin.file:
        path: "/swap/swapfile"
        owner: "root"
        group: "root"
        mode: "0600"
      become: true

    - name: "HARDENING | Run mkswap on modified swap allocation"
      ansible.builtin.command: "mkswap /swap/swapfile"
      become: true
      when: "swapfile_allocated.changed and not ansible_check_mode"

    - name: "Force internal playbook handlers execution to initialize active memory states"
      ansible.builtin.meta: flush_handlers

    - name: "HARDENING | Commit zero-trust filesystem layouts directly to fstab"
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: "{{ item.fstype }}"
        opts: "{{ item.opts }}"
        dump: "0"
        passno: "0"
        state: "present"
      become: true
      loop:
        - { path: "/", src: "{{ root_device_node }}", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},subvol=/@" }
        - { path: "/home", src: "{{ root_device_node }}", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},nodev,nosuid,subvol=/@home" }
        - { path: "/var/log", src: "{{ root_device_node }}", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},nodev,nosuid,noexec,subvol=/@log" }
        - { path: "/var/cache/pacman/pkg", src: "{{ root_device_node }}", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},nodev,nosuid,noexec,subvol=/@cache" }
        - { path: "/var/lib/docker", src: "{{ root_device_node }}", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},subvol=/@docker" }
        - { path: "/var/lib/libvirt/images", src: "{{ root_device_node }}", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},subvol=/@libvirt" }
        - { path: "/.snapshots", src: "{{ root_device_node }}", fstype: "btrfs", opts: "rw,noatime,space_cache=v2,subvol=@/.snapshots" }
        - { path: "/var/lib/flatpak", src: "{{ root_device_node }}", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},nodev,nosuid,noexec,subvol=/@flatpak" }
        - { path: "/srv", src: "{{ root_device_node }}", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},nodev,nosuid,subvol=/@srv" }
        - { path: "/tmp", src: "tmpfs", fstype: "tmpfs", opts: "defaults,noexec,nosuid,nodev,size=2G" }
        - { path: "/dev/shm", src: "tmpfs", fstype: "tmpfs", opts: "defaults,noexec,nosuid,nodev,size=1G" }
        - { path: "/proc", src: "proc", fstype: "proc", opts: "remount,defaults,nosuid,nodev,noexec,hidepid=2,gid=26" }
        - { path: "none", src: "/swap/swapfile", fstype: "swap", opts: "defaults,pri=10,discard,nodev,nosuid,noexec" }
    - name: "HARDENING | Structure systemd template mapping folder for logind process isolation"
      ansible.builtin.file:
        path: "/etc/systemd/system/systemd-logind.service.d"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"
      become: true

    - name: "HARDENING | Ensure systemd services respect process isolation parameters safely"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/systemd-logind.service.d/override.conf"
        content: |
          [Service]
          ProtectProc=invisible
        owner: "root"
        group: "root"
        mode: "0644"
      become: true

    - name: "MEMORY | Turn on secondary uncompressed physical memory overflow container in kernel"
      ansible.builtin.command: "swapon -a -e"
      become: true
      changed_when: true
      when: "not ansible_check_mode"

    - name: "EARLYOOM | Restrict user-space OOM mitigation thresholds"
      ansible.builtin.copy:
        dest: "/etc/default/earlyoom"
        content: |
          EARLYOOM_ARGS="-m 10 -s 10 --avoid '^(systemd|sshd|tmux|bash)\(' --prefer '^(chrome|firefox|clamd|clamav-daemon|snort)'"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Restart Earlyoom Daemon"
      when: use_earlyoom

    - name: "EARLYOOM | Manage lifecycle states of EarlyOOM daemon"
      ansible.builtin.systemd:
        name: "earlyoom"
        state: "{{ 'started' if use_earlyoom else 'stopped' }}"
        enabled: "{{ true if use_earlyoom else false }}"
      become: true
      ignore_errors: "{{ ansible_check_mode }}"

    - name: "SYSTEMD-OOMD | Manage lifecycle states of modern systemd-oomd component"
      ansible.builtin.systemd:
        name: "systemd-oomd"
        state: "{{ 'started' if not use_earlyoom else 'stopped' }}"
        enabled: "{{ true if not use_earlyoom else false }}"
      become: true
      ignore_errors: "{{ ansible_check_mode }}"

    - name: "HARDENING | Deploy personal kernel hardening sysctl drop-in"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-kernel-hardening.conf"
        content: |
          kernel.dmesg_restrict = 1
          kernel.kptr_restrict = 2
          net.ipv4.ip_forward = 0
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.tcp_syncookies = 1
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Kernel Parameters"

    - name: "HARDENING | Deploy personal memory tuning sysctl drop-in"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-memory-tuning.conf"
        content: |
          vm.swappiness = 150
          vm.page_cluster = 0
          vm.dirty_background_ratio = 5
          vm.dirty_ratio = 10
          vm.vfs_cache_pressure = 500
          vm.compaction_proactiveness = 80
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Kernel Parameters"

    - name: "HARDENING | Deploy personal flatpak namespace sysctl drop-in"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-flatpak-namespaces.conf"
        content: |
          kernel.unprivileged_userns_clone = 1
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Kernel Parameters"

    - name: "ARPWATCH SYSTEMD | Structure systemd template mapping folder configuration for Arpwatch"
      ansible.builtin.file:
        path: "/etc/systemd/system/arpwatch@.service.d"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"
      become: true

    - name: "ARPWATCH SYSTEMD | Bind secure user accounts to dynamic Arpwatch instantiation definitions"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/arpwatch@.service.d/override.conf"
        content: |
          [Service]
          ExecStart=
          ExecStart=/usr/bin/arpwatch -N -f /var/lib/arpwatch/arp.dat -i %I -u {{ target_env.arpwatch_user | default('nobody') }}
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Systemd Configuration"

    - name: "CLAMAV SYSTEMD | Structure custom cgroup resource throttling slice folder for ClamAV"
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ target_env.clamav_service | default('clamav-daemon') }}.service.d"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"
      become: true

    - name: "CLAMAV SYSTEMD | Enforce strict CPU runtime quotas and max memory boundaries on ClamAV"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ target_env.clamav_service | default('clamav-daemon') }}.service.d/override.conf"
        content: |
          [Service]
          Nice=19
          CPUQuota=10%
          CPUSchedulingPolicy=idle
          MemoryMax=1.2G
          MemoryHigh=1.0G
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Systemd Configuration"

    - name: "CLAMAV | Inject fast performance directory exclusion pathways"
      ansible.builtin.lineinfile:
        path: "/etc/clamav/clamd.conf"
        line: "ExcludePath {{ item }}"
        state: "present"
        insertafter: "EOF"
      loop:
        - "^/proc/"
        - "^/sys/"
        - "^/dev/"
        - "^/run/"
        - "^/tmp/"
        - "^/var/cache/pacman/pkg/"
        - "/\\.cache/"
      when: "ansible_facts['os_family'] == 'Archlinux'"
    - name: "Verify that the firewalld management utility is active and initialized"
      ansible.builtin.systemd:
        name: "firewalld"
        state: "started"
        enabled: true
      become: true
      ignore_errors: "{{ ansible_check_mode }}"

    - name: "Permanently assign standard virtual tunnel interfaces to trusted zones"
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --add-interface={{ item }}"
      loop:
        - "tun+"
        - "wg+"
        - "proton+"
      become: true
      notify: "Reload Systemd Configuration"
      when: "not ansible_check_mode"

    - name: "Provision dynamic persistent alias shortcuts for defensive kill-switch toggles"
      ansible.builtin.copy:
        dest: "/etc/profile.d/firewall-killswitches.sh"
        content: |
          # Universal Firewalld Dual-Kill Switch Toggles
          alias portaloff="sudo firewall-cmd --zone=public --change-interface={{ wifi_interface | default('eth0') }}"
          alias portalon="sudo firewall-cmd --zone=block --change-interface={{ wifi_interface | default('eth0') }}"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true

    - name: "SNORT SYSTEMD | Create custom systemd slice directory for Snort"
      ansible.builtin.file:
        path: "/etc/systemd/system/snort.service.d"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"
      become: true

    - name: "SNORT SYSTEMD | Enforce rigid system process isolation drop-ins on Snort"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/snort.service.d/override.conf"
        content: |
          [Service]
          ProtectSystem=full
          ProtectControlGroups=true
          ProtectKernelModules=true
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Systemd Configuration"

    # ====================================================================
    # DUAL FILE INTEGRITY MONITORING (AIDE & TRIPWIRE CONFIGURATION)
    # ====================================================================
    - name: "FIM | Install AIDE and Tripwire across Debian/RedHat nodes"
      ansible.builtin.package:
        name:
          - aide
          - tripwire
        state: "present"
      when: "ansible_facts['os_family'] != 'Archlinux'"

    - name: "FIM | Install AIDE only on Arch Linux"
      ansible.builtin.package:
        name:
          - aide
        state: "present"
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "AIDE | Deploy highly optimized, ultra-fast baseline configuration file"
      ansible.builtin.copy:
        dest: "/etc/aide.conf"
        content: |
          # Custom High-Performance Fast Initialization Rules
          database_in=file:/var/lib/aide/aide.db
          database_out=file:/var/lib/aide/aide.db.new
          gzip_dbout=yes

          # Core Definition: Standard Binary and Library Rules
          FASTCHECK = p+i+u+g+s+m+sha256

          # Hard Exclusions: Drop volatile/huge folders to stop the 2-hour crawl
          !/dev/.*
          !/proc/.*
          !/sys/.*
          !/run/.*
          !/tmp/.*
          !/var/tmp/.*
          !/var/log/.*
          !/var/cache/.*
          
          # Target Inclusions: Only monitor the critical attack surfaces
          /etc FASTCHECK
          /usr/bin FASTCHECK
          /usr/sbin FASTCHECK
          /boot FASTCHECK
        owner: "root"
        group: "root"
        mode: "0600"
    - name: "AIDE | Check for active file tracking database signature"
      ansible.builtin.stat:
        path: "/var/lib/aide/aide.db"
      register: aide_db_file

    - name: "AIDE | Initialize file index signature database (Async)"
      ansible.builtin.command: "{{ 'aideinit' if ansible_facts['os_family'] == 'Debian' else 'aide --init' }}"
      async: 900
      poll: 5
      when: not aide_db_file.stat.exists
      register: aide_init_run

    - name: "AIDE | Stage compiled index structure into production state (Debian/Arch)"
      ansible.builtin.copy:
        src: "/var/lib/aide/aide.db.new"
        dest: "/var/lib/aide/aide.db"
        remote_src: true
        mode: "0600"
      when: 
        - "ansible_facts['os_family'] in ['Debian', 'Archlinux']"
        - "aide_init_run is changed"

    - name: "TRIPWIRE | Check if cryptographic policy file exists"
      ansible.builtin.stat:
        path: "/etc/tripwire/tw.pol"
      register: tripwire_policy
      when: "ansible_facts['os_family'] != 'Archlinux'"

    - name: "TRIPWIRE | Initialize baseline verification snapshots"
      ansible.builtin.command: "tripwire --init --no-passphrase"
      when: 
        - "ansible_facts['os_family'] != 'Archlinux'"
        - "not tripwire_policy.stat.exists"
      failed_when: false
      changed_when: true

    - name: "SYSTEMD UNITS | Drop AIDE execution units into local system files"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - { name: "aide-check.service", content: "[Unit]\nDescription=AIDE System Integrity Check\nAfter=local-fs.target\n\n[Service]\nType=oneshot\nExecStart={{ '/usr/bin/aide.wrapper' if ansible_facts['os_family'] == 'Debian' else '/usr/bin/aide' }} --check\nStandardOutput=journal" }
        - { name: "aide-check.timer", content: "[Unit]\nDescription=Run AIDE Check Daily at 2AM\n\n[Timer]\nOnCalendar=*-*-* 02:00:00\nPersistent=true\n\n[Install]\nWantedBy=timers.target" }
      notify: "Reload Systemd Configuration"

    - name: "SYSTEMD UNITS | Drop Tripwire execution units into local system files (Non-Arch Only)"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - { name: "tripwire-check.service", content: "[Unit]\nDescription=Tripwire System Integrity Check\nAfter=local-fs.target\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/tripwire --check\nStandardOutput=journal" }
        - { name: "tripwire-check.timer", content: "[Unit]\nDescription=Run Tripwire Check Daily at 4AM\n\n[Timer]\nOnCalendar=*-*-* 04:00:00\nPersistent=true\n\n[Install]\nWantedBy=timers.target" }
      when: "ansible_facts['os_family'] != 'Archlinux'"
      notify: "Reload Systemd Configuration"

    - name: "SYSTEMD TIMERS | Force integrity schedulers to activate on boot"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: "started"
        enabled: true
      loop: "{{ ['aide-check.timer'] if ansible_facts['os_family'] == 'Archlinux' else ['aide-check.timer', 'tripwire-check.timer'] }}"

    # ====================================================================
    # AUTOMATED ENDPOINT SECURITY (FAIL2BAN & USBGUARD)
    # ====================================================================
    - name: "ENDPOINT SECURITY | Deploy Fail2ban and USBGuard"
      ansible.builtin.package:
        name:
          - fail2ban
          - usbguard
        state: "present"

    - name: "USBGUARD | Check if baseline hardware policy rules are defined"
      ansible.builtin.stat:
        path: "/etc/usbguard/rules.conf"
      register: usbguard_rules

    - name: "USBGUARD | Compile initial trusted connected peripheral authorization grid"
      ansible.builtin.command: "usbguard generate-policy"
      register: computed_usb_policy
      when: not usbguard_rules.stat.exists

    - name: "USBGUARD | Write rules architecture configuration"
      ansible.builtin.copy:
        content: "{{ computed_usb_policy.stdout }}"
        dest: "/etc/usbguard/rules.conf"
        owner: "root"
        group: "root"
        mode: "0600"
      when: not usbguard_rules.stat.exists

    - name: "ENDPOINT SECURITY | Activate core security infrastructure daemons"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: "started"
        enabled: true
      loop:
        - "fail2ban"
        - "usbguard"
        - "{{ 'clamav-freshclam' if ansible_facts['os_family'] == 'Debian' else 'freshclam' }}"
    # ====================================================================
    # CONTINUE STANDARD STACK OPERATIONS
    # ====================================================================
    - name: "SSH HARDENING | Enforce universal enterprise-grade SSH access rules"
      ansible.builtin.lineinfile:
        path: "/etc/ssh/sshd_config"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: "present"
        validate: "/usr/sbin/sshd -t -f %s"
      become: true
      loop:
        - { regexp: "^#?Port", line: "Port 22" }
        - { regexp: "^#?LogLevel", line: "LogLevel INFO" }
        - { regexp: "^#?PermitRootLogin", line: "PermitRootLogin no" }
        - { regexp: "^#?MaxAuthTries", line: "MaxAuthTries 3" }
        - { regexp: "^#?PermitEmptyPasswords", line: "PermitEmptyPasswords no" }
        - { regexp: "^#?UsePAM", line: "UsePAM yes" }
        - { regexp: "^#?X11Forwarding", line: "X11Forwarding no" }
        - { regexp: "^#?Banner", line: "Banner /etc/issue.net" }
        - { regexp: "^#?PasswordAuthentication", line: "PasswordAuthentication no" }
        - { regexp: "^#?LoginGraceTime", line: "LoginGraceTime 60" }
        - { regexp: "^#?AllowTcpForwarding", line: "AllowTcpForwarding no" }
        - { regexp: "^#?AllowAgentForwarding", line: "AllowAgentForwarding no" }
      notify: "Restart SSH Daemon"

    - name: "SECURITY POLICY | Enforce explicit login.defs authentication thresholds"
      ansible.builtin.lineinfile:
        path: "{{ target_env.login_defs_path | default('/etc/login.defs') }}"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: "present"
      become: true
      loop:
        - { regexp: "^FAIL_DELAY", line: "FAIL_DELAY\t\t3" }
        - { regexp: "^LOG_UNKFAIL_ENAB", line: "LOG_UNKFAIL_ENAB       yes" }
        - { regexp: "^FAILLOG_ENAB", line: "FAILLOG_ENAB        yes" }
        - { regexp: "^ENV_SUPATH", line: "ENV_SUPATH\tPATH=/usr/local/sbin:/usr/local/bin:/usr/bin" }
        - { regexp: "^ENV_PATH", line: "ENV_PATH\tPATH=/usr/local/sbin:/usr/local/bin:/usr/bin" }
        - { regexp: "^TTYGROUP", line: "TTYGROUP\ttty" }
        - { regexp: "^TTYPERM", line: "TTYPERM\t\t0600" }
        - { regexp: "^UMASK", line: "UMASK\t\t027" }
        - { regexp: "^HOME_MODE", line: "HOME_MODE\t0700" }
        - { regexp: "^SU_WHEEL_ONLY", line: "SU_WHEEL_ONLY\tno" }
        - { regexp: "^DEFAULT_HOME", line: "DEFAULT_HOME\tyes" }
        - { regexp: "^USERGROUPS_ENAB", line: "USERGROUPS_ENAB yes" }
        - { regexp: "^NONEXISTENT", line: "NONEXISTENT\t/nonexistent" }
        - { regexp: "^UID_MIN", line: "UID_MIN			 1000" }
        - { regexp: "^UID_MAX", line: "UID_MAX			60000" }
        - { regexp: "^SYS_UID_MIN", line: "SYS_UID_MIN		  500" }
        - { regexp: "^SYS_UID_MAX", line: "SYS_UID_MAX		  999" }
        - { regexp: "^SUB_UID_MIN", line: "SUB_UID_MIN		   100000" }
        - { regexp: "^SUB_UID_MAX", line: "SUB_UID_MAX		600100000" }
        - { regexp: "^SUB_UID_COUNT", line: "SUB_UID_COUNT		    65536" }
        - { regexp: "^GID_MIN", line: "GID_MIN			 1000" }
        - { regexp: "^GID_MAX", line: "GID_MAX			60000" }
        - { regexp: "^SYS_GID_MIN", line: "SYS_GID_MIN		  500" }
        - { regexp: "^SYS_GID_MAX", line: "SYS_GID_MAX		  999" }
        - { regexp: "^SUB_GID_MIN", line: "SUB_GID_MIN		   100000" }
        - { regexp: "^SUB_GID_MAX", line: "SUB_GID_MAX		600100000" }
        - { regexp: "^SUB_GID_COUNT", line: "SUB_GID_COUNT		    65536" }
        - { regexp: "^LOGIN_RETRIES", line: "LOGIN_RETRIES\t3" }
        - { regexp: "^LOGIN_TIMEOUT", line: "LOGIN_TIMEOUT\t\t60" }
        - { regexp: "^PASS_CHANGE_TRIES", line: "PASS_CHANGE_TRIES\t5" }
        - { regexp: "^PASS_ALWAYS_WARN", line: "PASS_ALWAYS_WARN\tyes" }
        - { regexp: "^PASS_MIN_LEN", line: "PASS_MIN_LEN          8" }
        - { regexp: "^CHFN_AUTH", line: "CHFN_AUTH\t\tyes" }
        - { regexp: "^CHFN_RESTRICT", line: "CHFN_RESTRICT\t\trwh" }
        - { regexp: "^ENCRYPT_METHOD", line: "ENCRYPT_METHOD YESCRYPT" }
        - { regexp: "^PASS_MAX_DAYS", line: "PASS_MAX_DAYS   90" }
        - { regexp: "^PASS_MIN_DAYS", line: "PASS_MIN_DAYS   7" }
        - { regexp: "^PASS_WARN_AGE", line: "PASS_WARN_AGE   7" }
        - { regexp: "^SHA_CRYPT_MIN_ROUNDS", line: "SHA_CRYPT_MIN_ROUNDS 50000" }
        - { regexp: "^SHA_CRYPT_MAX_ROUNDS", line: "SHA_CRYPT_MAX_ROUNDS 500000" }

    - name: "PAM HARDENING | Enforce robust local authentication policy on Arch Linux"
      ansible.builtin.copy:
        content: |
          #%PAM-1.0
          auth       required                    pam_faillock.so      preauth silent deny=3 unlock_time=900
          -auth      [success=2 default=ignore]  pam_systemd_home.so
          auth       [success=1 default=bad]     pam_unix.so          try_first_pass nullok
          auth       [default=die]               pam_faillock.so      authfail deny=3 unlock_time=900
          auth       optional                    pam_permit.so
          auth       required                    pam_env.so
          auth       required                    pam_faillock.so      authsucc
          -account   [success=1 default=ignore]  pam_systemd_home.so
          account    required                    pam_unix.so
          account    optional                    pam_permit.so
          account    required                    pam_time.so
          -password  [success=1 default=ignore]  pam_systemd_home.so  
          password   required                    pam_pwquality.so     retry=3 minlen=14 dcredit=-1 ucredit=-1 lcredit=-1 ocredit=-1 enforce_for_root
          password   required                    pam_unix.so          try_first_pass nullok sha512 rounds=500000 shadow remember=5
          password   optional                    pam_permit.so
          -session   optional                    pam_systemd_home.so
          session    required                    pam_limits.so
          session    required                    pam_unix.so
          session    optional                    pam_permit.so
        dest: "/etc/pam.d/system-auth"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "COMPLIANCE BANNER | Deploy standardized authorization warning banners"
      ansible.builtin.copy:
        dest: "{{ item }}"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      loop:
        - "/etc/issue"
        - "/etc/issue.net"

    - name: "Write core user identification tracking metrics to auditd"
      ansible.builtin.copy:
        dest: "{{ target_env.audit_rules_path | default('/etc/audit/audit.rules') }}"
        content: |
          -w /etc/passwd -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /usr/sbin/insmod -p x -k modules
          -w /usr/sbin/rmmod -p x -k modules
        owner: "root"
        group: "root"
        mode: "0600"
      become: true
      notify: "Regenerate Auditd Rules"

    - name: "Extract running system sysctl configurations"
      ansible.builtin.command: "sysctl kernel.dmesg_restrict kernel.kptr_restrict net.ipv4.tcp_syncookies"
      register: kernel_audit_status
      become: true
      changed_when: false

    - name: "Query current memory page tier tracking layout properties"
      ansible.builtin.command: "swapon --show=NAME,TYPE,SIZE,PRIO"
      register: swap_priority_status
      become: true
      changed_when: false

    - name: "Fetch execution metadata loops from core zero-trust services"
      ansible.builtin.systemd:
        name: "{{ item }}"
      loop:
        - "earlyoom"
        - "{{ target_env.clamav_service | default('clamav-daemon') }}"
        - "firewalld"
      register: service_matrix_status
      become: true

    - name: "Compile compliance posture reporting dashboard log"
      ansible.builtin.copy:
        content: |
          # Universal Hardening Framework Verification Report
          Host: {{ ansible_facts['hostname'] | default('localhost') }}
          ## 1. Active Kernel Hardening Settings
          {{ kernel_audit_status.stdout | default('Skipped') }}
          ## 2. Hybrid Memory Layout
          {{ swap_priority_status.stdout | default('Skipped') }}
        dest: "/root/hardening-verification-report.md"
        owner: "root"
        group: "root"
        mode: "0600"
      become: true

  handlers:
    - name: "Reload Kernel Parameters"
      ansible.builtin.command: "sysctl --system"
      become: true
      changed_when: true
      when: "not ansible_check_mode"

    - name: "Reload Systemd Configuration"
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      when: "not ansible_check_mode"

    - name: "Force Active ZRAM Initialization"
      ansible.builtin.systemd:
        name: "systemd-zram-setup@zram0"
        state: "started"
      become: true
      when: "not ansible_check_mode"

    - name: "Restart Earlyoom Daemon"
      ansible.builtin.service:
        name: "earlyoom"
        state: "restarted"
      become: true
      when: "not ansible_check_mode"

    - name: "Regenerate Auditd Rules"
      ansible.builtin.command: "{{ 'auditctl -R /etc/audit/rules.d/audit.rules' if ansible_facts['os_family'] == 'Archlinux' else 'augenrules --load' }}"
      become: true
      failed_when: false
      changed_when: true
      when: "not ansible_check_mode"

    - name: "Restart SSH Daemon"
      ansible.builtin.service:
        name: "{{ 'sshd' if ansible_facts['os_family'] == 'Archlinux' or ansible_facts['os_family'] == 'RedHat' else 'ssh' }}"
        state: "restarted"
      become: true
      when: "not ansible_check_mode"

