---
- name: "Universal Zero-Trust Linux Hardening Framework (Stage 2 - Production Core)"
  hosts: "hardened_nodes"
  become: true  
  gather_facts: true
  gather_subset:
    - "!all"
    - "!min"
    - "hardware"
    - "distribution"

  vars:
    os_crypt_name: "cryptroot"
    vault_crypt_name: "secure_vault"
    perf_mount_opts: "noatime,space_cache=v2,compress=zstd:1"
    
    is_workstation: "{{ ansible_facts['chassis_type'] | lower in ['laptop', 'notebook', 'desktop', 'chassis'] if 'chassis_type' in ansible_facts else true }}"
    
    # SYSTEM SWAP LOGIC SPECIFICATIONS:
    # 1. RAM <= 7GB (7168MB)  --> Swap = RAM * 2 (Hybrid Active)
    # 2. RAM 8GB to 16GB     --> Swap = RAM + 3GB (Hybrid Active)
    # 3. RAM > 16GB (16384MB) --> Swap = 4GB (Standard Storage Swap Only)
    calculated_swap_mb: >-
      {{
        (ansible_facts['memtotal_mb'] | int * 2) if (ansible_facts['memtotal_mb'] | int <= 7168) else
        (ansible_facts['memtotal_mb'] | int + 3072) if (ansible_facts['memtotal_mb'] | int > 7168 and ansible_facts['memtotal_mb'] | int <= 16384) else
        4096
      }}

    # Conditions to dynamically handle high-ram scaling policies
    use_hybrid_zram: "{{ ansible_facts['memtotal_mb'] | int <= 16384 }}"
    use_earlyoom: "{{ ansible_facts['memtotal_mb'] | int < 6144 if 'memtotal_mb' in ansible_facts else true }}"

  tasks:
    - name: "Ingest multi-distribution security baseline mappings file"
      ansible.builtin.include_vars:
        file: "vars_mapping.yml"
        name: "distro_blueprint"
    - name: "PREFLIGHT | Install libpwquality to guarantee PAM stability"
      ansible.builtin.package:
        name: "libpwquality"
        state: "present"
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "PREFLIGHT | Deploy baseline core defensive software profiles"
      ansible.builtin.package:
        name: "{{ target_env.core_packages }}"
        state: "present"
      when: "target_env.core_packages is defined and not ansible_check_mode"

    - name: "GPU RECON | Scan local host physical PCI bus for discrete graphics controllers"
      ansible.builtin.shell: "cat /sys/bus/pci/devices/*/vendor"
      register: pci_vendor_dump
      changed_when: false

    - name: "GPU RECON | Map structural hardware asset discovery booleans"
      ansible.builtin.set_fact:
        has_nvidia: "{{ '0x10de' in pci_vendor_dump.stdout }}"
        has_amd: "{{ '0x1002' in pci_vendor_dump.stdout or '0x1022' in pci_vendor_dump.stdout }}"
    - name: "GPU PROVISION | Execute proprietary graphic stack deployments for NVIDIA hardware"
      ansible.builtin.package:
        name: >-
          {{
            ['nvidia', 'nvidia-utils', 'lib32-nvidia-utils'] if ansible_facts['os_family'] == 'Archlinux' else
            ['nvidia-driver', 'nvidia-kernel-dkms', 'nvidia-smi'] if ansible_facts['os_family'] == 'Debian' else
            ['akmod-nvidia', 'xorg-x11-drv-nvidia-cuda'] if ansible_facts['os_family'] == 'RedHat' else
            ['nvidia-gfxG06-kmp-default', 'x11-video-nvidiaG06']
          }}
        state: "present"
      become: true
      when:
        - "has_nvidia | bool"
        - "is_workstation | bool"
        - "not ansible_check_mode"

    - name: "GPU PROVISION | Execute open-source acceleration deployments for AMD/Radeon hardware"
      ansible.builtin.package:
        name: >-
          {{
            ['xf86-video-amdgpu', 'mesa', 'lib32-mesa'] if ansible_facts['os_family'] == 'Archlinux' else
            ['xserver-xorg-video-amdgpu', 'mesa-vulkan-drivers'] if ansible_facts['os_family'] == 'Debian' else
            ['xorg-x11-drv-amdgpu', 'mesa-vdr-drivers'] if ansible_facts['os_family'] == 'RedHat' else
            ['xf86-video-amdgpu', 'Mesa-libVA']
          }}
        state: "present"
      become: true
      when:
        - "has_amd | bool"
        - "is_workstation | bool"
        - "not ansible_check_mode"
    - name: "Ensure parent systemd allocation directory trees exist"
      ansible.builtin.file:
        path: "{{ target_env.zram_conf_path | default('/etc/systemd/zram-generator.conf') | dirname }}"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"
      become: true
      when: use_hybrid_zram | bool

    - name: "Deploy priority parameters to systemd-zram swap configuration"
      ansible.builtin.copy:
        dest: "{{ target_env.zram_conf_path | default('/etc/systemd/zram-generator.conf') }}"
        content: |
          [zram0]
          zram-size = ram
          swap-priority = 32767
          compression-algorithm = zstd
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      when: use_hybrid_zram | bool
      notify: 
        - "Reload Systemd Configuration"
        - "Force Active ZRAM Initialization"

    - name: "MEMORY | Disable and mask ZRAM generator on high-RAM systems"
      ansible.builtin.systemd:
        name: "systemd-zram-setup@zram0"
        state: "stopped"
        enabled: false
        masked: true
      become: true
      when: not use_hybrid_zram | bool
      failed_when: false
    - name: "HARDENING | Mount Btrfs parent swap subvolume tree safely to unblock file allocation"
      ansible.posix.mount:
        path: "/swap"
        src: "/dev/mapper/cryptroot"
        fstype: "btrfs"
        opts: "rw,{{ perf_mount_opts }},subvol=/@swap"
        dump: "0"
        passno: "0"
        state: "mounted"
      become: true

    - name: "HARDENING | Release kernel swap file lock to prevent text file busy errors"
      ansible.builtin.command: "swapoff /swap/swapfile"
      become: true
      failed_when: false
      changed_when: false
      when: "not ansible_check_mode"

    - name: "HARDENING | Check the size of the existing physical swap file"
      ansible.builtin.stat:
        path: "/swap/swapfile"
      register: swapfile_stat

    - name: "HARDENING | Dynamically forge or resize physical swap file"
      ansible.builtin.command: >
        dd if=/dev/zero of=/swap/swapfile bs=1M count={{ calculated_swap_mb }}
      become: true
      when: >
        not ansible_check_mode and 
        (not swapfile_stat.stat.exists or swapfile_stat.stat.size != (calculated_swap_mb | int * 1024 * 1024))
      register: swapfile_allocated

    - name: "HARDENING | Format and secure physical swap file structures"
      ansible.builtin.file:
        path: "/swap/swapfile"
        owner: "root"
        group: "root"
        mode: "0600"
      become: true

    - name: "HARDENING | Run mkswap on modified swap allocation"
      ansible.builtin.command: "mkswap /swap/swapfile"
      become: true
      when: "swapfile_allocated.changed and not ansible_check_mode"

    - name: "Force internal playbook handlers execution to initialize active memory states"
      ansible.builtin.meta: flush_handlers
    - name: "HARDENING | Commit zero-trust filesystem layouts directly to fstab"
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "{{ item.src }}"
        fstype: "{{ item.fstype }}"
        opts: "{{ item.opts }}"
        dump: "0"
        passno: "0"
        state: "present"
      become: true
      loop:
        - { path: "/", src: "/dev/mapper/cryptroot", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},subvol=/@" }
        - { path: "/home", src: "/dev/mapper/cryptroot", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},nodev,nosuid,subvol=/@home" }
        - { path: "/var/log", src: "/dev/mapper/cryptroot", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},nodev,nosuid,noexec,subvol=/@log" }
        - { path: "/var/cache/pacman/pkg", src: "/dev/mapper/cryptroot", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},nodev,nosuid,noexec,subvol=/@cache" }
        - { path: "/var/lib/docker", src: "/dev/mapper/cryptroot", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},subvol=/@docker" }
        - { path: "/var/lib/libvirt/images", src: "/dev/mapper/cryptroot", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},nofail,x-systemd.device-timeout=3s,subvol=/@libvirt" }
        - { path: "/.snapshots", src: "/dev/mapper/cryptroot", fstype: "btrfs", opts: "rw,noatime,space_cache=v2,subvol=@/.snapshots" }
        - { path: "/var/lib/flatpak", src: "/dev/mapper/cryptroot", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},nodev,nosuid,noexec,subvol=/@flatpak" }
        - { path: "/srv", src: "/dev/mapper/cryptroot", fstype: "btrfs", opts: "rw,{{ perf_mount_opts }},nodev,nosuid,subvol=/@srv" }
        - { path: "/tmp", src: "tmpfs", fstype: "tmpfs", opts: "defaults,noexec,nosuid,nodev,size=50%" }
        - { path: "/dev/shm", src: "tmpfs", fstype: "tmpfs", opts: "defaults,noexec,nosuid,nodev,size=1G" }
        - { path: "/proc", src: "proc", fstype: "proc", opts: "remount,defaults,nosuid,nodev,noexec,hidepid=2,gid=26" }
        - { path: "none", src: "/swap/swapfile", fstype: "swap", opts: "defaults,pri=10,discard,nodev,nosuid,noexec" }
    - name: "HARDENING | Structure systemd template mapping folder for logind process isolation"
      ansible.builtin.file:
        path: "/etc/systemd/system/systemd-logind.service.d"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"
      become: true

    - name: "HARDENING | Ensure systemd services respect process isolation parameters safely"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/systemd-logind.service.d/override.conf"
        content: |
          [Service]
          ProtectProc=invisible
        owner: "root"
        group: "root"
        mode: "0644"
      become: true

    - name: "MEMORY | Turn on secondary uncompressed physical memory overflow container in kernel"
      ansible.builtin.command: "swapon -a -e"
      become: true
      changed_when: true
      when: "not ansible_check_mode"

    - name: "EARLYOOM | Restrict user-space OOM mitigation thresholds"
      ansible.builtin.copy:
        dest: "/etc/default/earlyoom"
        content: |
          EARLYOOM_ARGS="-m 10 -s 10 --avoid ^(systemd|sshd|tmux|bash)$ --prefer ^(chrome|firefox|clamd|clamav-daemon|snort)$"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Restart Earlyoom Daemon"
      when: "use_earlyoom and is_workstation | bool"

    - name: "EARLYOOM | Manage lifecycle states of EarlyOOM daemon"
      ansible.builtin.systemd:
        name: "earlyoom"
        state: "{{ 'started' if use_earlyoom else 'stopped' }}"
        enabled: "{{ true if use_earlyoom else false }}"
      become: true
      when: "is_workstation | bool"
      ignore_errors: "{{ ansible_check_mode }}"

    - name: "SYSTEMD-OOMD | Manage lifecycle states of modern systemd-oomd component"
      ansible.builtin.systemd:
        name: "systemd-oomd"
        state: "{{ 'started' if not use_earlyoom else 'stopped' }}"
        enabled: "{{ true if not use_earlyoom else false }}"
      become: true
      ignore_errors: "{{ ansible_check_mode }}"

    - name: "HARDENING | Deploy personal kernel hardening sysctl drop-in"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-kernel-hardening.conf"
        content: |
          kernel.dmesg_restrict = 1
          kernel.kptr_restrict = 2
          net.ipv4.ip_forward = 0
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv4.tcp_syncookies = 1
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Kernel Parameters"

    - name: "HARDENING | Deploy personal memory tuning sysctl drop-in"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-memory-tuning.conf"
        content: |
          # Automatically optimized via hardware-tier matrix rules
          {% if ansible_facts['memtotal_mb'] | int <= 7168 %}
          # Tier 1: 7GB or less (Aggressive ZRAM Offloading Profile)
          vm.swappiness = 150
          vm.page_cluster = 0
          {% elif ansible_facts['memtotal_mb'] | int <= 16384 %}
          # Tier 2: 8GB to 16GB (Balanced Desktop Hybrid Profile)
          vm.swappiness = 100
          vm.page_cluster = 0
          {% else %}
          # Tier 3: Greater than 16GB (Standard Storage Swap Only Profile)
          vm.swappiness = 10
          vm.page_cluster = 3
          {% endif %}
          vm.dirty_background_ratio = 5
          vm.dirty_ratio = 10
          vm.vfs_cache_pressure = 500
          vm.compaction_proactiveness = 80
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Kernel Parameters"

    - name: "HARDENING | Deploy personal flatpak namespace sysctl drop-in"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-flatpak-namespaces.conf"
        content: |
          kernel.unprivileged_userns_clone = 1
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Kernel Parameters"
    # ====================================================================
    # FILE INTEGRITY MONITORING (AIDE & TRIPWIRE MULTI-DISTRO SPLIT)
    # ====================================================================
    - name: "FIM | Install AIDE and Tripwire across Debian/RedHat/Suse nodes"
      ansible.builtin.package:
        name:
          - aide
          - tripwire
        state: "present"
      when: "ansible_facts['os_family'] != 'Archlinux'"

    - name: "FIM | Install AIDE natively on Arch Linux"
      ansible.builtin.package:
        name:
          - aide
        state: "present"
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "AIDE | Deploy highly optimized, ultra-fast baseline configuration file"
      ansible.builtin.copy:
        dest: "/etc/aide.conf"
        content: |
          # Custom High-Performance Fast Initialization Rules
          database_in=file:{{ target_env.aide_db_path | default('/var/lib/aide/aide.db.gz') }}
          database_out=file:{{ target_env.aide_db_new_path | default('/var/lib/aide/aide.db.new.gz') }}
          gzip_dbout=yes

          FASTCHECK = p+i+u+g+s+m+sha256

          !/dev/.*
          !/proc/.*
          !/sys/.*
          !/run/.*
          !/tmp/.*
          !/var/tmp/.*
          !/var/log/.*
          !/var/cache/.*
          
          /etc FASTCHECK
          /usr/bin FASTCHECK
          /usr/sbin FASTCHECK
          /boot FASTCHECK
        owner: "root"
        group: "root"
        mode: "0600"
      become: true

    - name: "AIDE | Check for active file tracking database signature"
      ansible.builtin.stat:
        path: "{{ target_env.aide_db_path | default('/var/lib/aide/aide.db.gz') }}"
      register: aide_db_file

    - name: "AIDE | Initialize file index signature database (Async)"
      ansible.builtin.command: "{{ 'aideinit' if ansible_facts['os_family'] == 'Debian' else '/usr/bin/aide --init' }}"
      async: 1800
      poll: 10
      when: not aide_db_file.stat.exists
      register: aide_init_run

    - name: "AIDE | Stage compiled index structure into production state (Debian/Arch)"
      ansible.builtin.copy:
        src: "{{ target_env.aide_db_new_path | default('/var/lib/aide/aide.db.new.gz') }}"
        dest: "{{ target_env.aide_db_path | default('/var/lib/aide/aide.db.gz') }}"
        remote_src: true
        mode: "0600"
      when: 
        - "ansible_facts['os_family'] in ['Debian', 'Archlinux']"
        - "aide_init_run is changed"
      become: true

    - name: "DEBIAN FIX | Verify if target audit rules drop-in directory exists"
      ansible.builtin.stat:
        path: "/etc/audit/rules.d"
      register: audit_dir_check

    - name: "DEBIAN FIX | Create missing ancestor directory structural path prior to audit definitions"
      ansible.builtin.file:
        path: "/etc/audit/rules.d"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0750"
      become: true
      when: not audit_dir_check.stat.exists

    - name: "DEBIAN FIX | Ensure structural config folder exists for Tripwire validation profiles"
      ansible.builtin.file:
        path: "/etc/tripwire"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"
      become: true
      when: "ansible_facts['os_family'] != 'Archlinux'"

    - name: "TRIPWIRE | Check if cryptographic policy file exists (Non-Arch Only)"
      ansible.builtin.stat:
        path: "/etc/tripwire/tw.pol"
      register: tripwire_policy
      when: "ansible_facts['os_family'] != 'Archlinux'"

    - name: "TRIPWIRE | Initialize baseline verification snapshots (Non-Arch Only)"
      ansible.builtin.command: "tripwire --init --no-passphrase"
      when: 
        - "ansible_facts['os_family'] != 'Archlinux'"
        - "not tripwire_policy.stat.exists"
      failed_when: false
      changed_when: true
    - name: "SYSTEMD UNITS | Drop AIDE execution units into local system files"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - { name: "aide-check.service", content: "[Unit]\nDescription=AIDE System Integrity Check\nAfter=local-fs.target\n\n[Service]\nType=oneshot\nExecStart={{ '/usr/bin/aide.wrapper' if ansible_facts['os_family'] == 'Debian' else '/usr/bin/aide' }} --check\nStandardOutput=journal" }
        - { name: "aide-check.timer", content: "[Unit]\nDescription=Run AIDE Check Daily at 2AM\n\n[Timer]\nOnCalendar=*-*-* 02:00:00\nPersistent=true\n\n[Install]\nWantedBy=timers.target" }
      notify: "Reload Systemd Configuration"
      become: true

    - name: "SYSTEMD UNITS | Drop Tripwire execution units into local system files (Non-Arch Only)"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - { name: "tripwire-check.service", content: "[Unit]\nDescription=Tripwire System Integrity Check\nAfter=local-fs.target\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/tripwire --check\nStandardOutput=journal" }
        - { name: "tripwire-check.timer", content: "[Unit]\nDescription=Run Tripwire Check Daily at 4AM\n\n[Timer]\nOnCalendar=*-*-* 04:00:00\nPersistent=true\n\n[Install]\nWantedBy=timers.target" }
      when: "ansible_facts['os_family'] != 'Archlinux'"
      notify: "Reload Systemd Configuration"
      become: true

    - name: "SYSTEMD TIMERS | Force integrity schedulers to activate on boot"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: "started"
        enabled: true
      loop: "{{ ['aide-check.timer'] if ansible_facts['os_family'] == 'Archlinux' else ['aide-check.timer', 'tripwire-check.timer'] }}"
      become: true

    # ====================================================================
    # AUTOMATED ENDPOINT SECURITY (FAIL2BAN & USBGUARD)
    # ====================================================================
    - name: "ENDPOINT SECURITY | Deploy Fail2ban and USBGuard"
      ansible.builtin.package:
        name:
          - fail2ban
          - usbguard
        state: "present"

    - name: "USBGUARD | Check if baseline hardware policy rules are defined"
      ansible.builtin.stat:
        path: "/etc/usbguard/rules.conf"
      register: usbguard_rules

    - name: "USBGUARD | Dynamically compile live connected peripheral authorization grid"
      ansible.builtin.command: "/usr/bin/usbguard generate-policy"
      register: computed_usb_policy
      when: not usbguard_rules.stat.exists or usbguard_rules.stat.size == 0
      failed_when: false
      changed_when: "computed_usb_policy.stdout is defined and computed_usb_policy.stdout | length > 0"

    - name: "USBGUARD | Write safety-validated rule configuration to disk"
      ansible.builtin.copy:
        content: "{{ computed_usb_policy.stdout }}\n"
        dest: "/etc/usbguard/rules.conf"
        owner: "root"
        group: "root"
        mode: "0600"
      when: 
        - computed_usb_policy.changed
        - computed_usb_policy.stdout is defined
        - computed_usb_policy.stdout | length > 0
      notify: "Restart USBGuard Service"
      become: true

    - name: "CLAMAV | Enforce custom background database update frequency thresholds"
      ansible.builtin.lineinfile:
        path: "/etc/clamav/freshclam.conf"
        regexp: "^#?Checks\\s+"
        line: "Checks 2"
        state: "present"
      become: true
      notify: "Restart ClamAV Freshclam Service"

    - name: "Verify that the firewalld management utility is active and initialized"
      ansible.builtin.systemd:
        name: "firewalld"
        state: "started"
        enabled: true
      become: true

    - name: "ENDPOINT SECURITY | Activate core security infrastructure daemons"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: "started"
        enabled: true
      loop:
        - "fail2ban"
        - "usbguard"
        - "{{ 'clamav-freshclam' if ansible_facts['os_family'] in ['Debian', 'Archlinux'] else 'freshclam' }}"
      become: true
    # ====================================================================
    # DUAL-KILL SWITCH WORKFLOW (STAGES 1, 2, & 3)
    # ====================================================================
    - name: "Permanently assign standard virtual tunnel interfaces to trusted zones"
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --add-interface={{ item }}"
      loop:
        - "tun+"
        - "wg+"
        - "proton+"
      become: true
      notify: "Reload Systemd Configuration"
      when: "not ansible_check_mode"
    
    - name: "STAGE 1 | Identify primary wireless or ethernet interface name across any distribution"
      ansible.builtin.set_fact:
        wifi_interface: "{{ ansible_facts['interfaces'] | select('match', '^(wlan|wl).*') | first | default(ansible_facts['default_ipv4']['interface'] | default('eth0')) }}"
      when: is_workstation

    - name: "STAGE 2 | Force physical network interface natively into the block zone"
      ansible.builtin.command: "firewall-cmd --permanent --zone=block --add-interface={{ wifi_interface }}"
      become: true
      changed_when: false
      when: 
        - "not ansible_check_mode"
        - "wifi_interface is defined"

    - name: "STAGE 3 | Deploy global terminal aliases for manual toggle overrides"
      ansible.builtin.copy:
        dest: "/etc/profile.d/firewall-killswitches.sh"
        content: |
          # Cross-Distribution Firewalld Stage 3 Kill-Switch Toggles
          # Dynamically bound to network interface: {{ wifi_interface }}
          
          alias portaloff="sudo firewall-cmd --zone=public --change-interface={{ wifi_interface }} && echo '⚠️ Protection OFF: Captive Portal mode enabled. Log in, then run portalon.'"
          alias portalon="sudo firewall-cmd --zone=block --change-interface={{ wifi_interface }} && echo '🔒 Protection ON: Interface locked to block zone. Secure VPN traffic allowed.'"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
  handlers:
    - name: "Reload Kernel Parameters"
      ansible.builtin.command: "sysctl --system"
      become: true
      when: "not ansible_check_mode"

    - name: "Reload Systemd Configuration"
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      when: "not ansible_check_mode"

    - name: "Force Active ZRAM Initialization"
      ansible.builtin.systemd:
        name: "systemd-zram-setup@zram0"
        state: "started"
      become: true
      when: "not ansible_check_mode"

    - name: "Restart Earlyoom Daemon"
      ansible.builtin.service:
        name: "earlyoom"
        state: "restarted"
      become: true
      when: "not ansible_check_mode"

    - name: "Restart USBGuard Service"
      ansible.builtin.service:
        name: "usbguard"
        state: "restarted"
      become: true
      when: "not ansible_check_mode"

    - name: "Restart ClamAV Freshclam Service"
      ansible.builtin.service:
        name: "{{ 'clamav-freshclam' if ansible_facts['os_family'] in ['Debian', 'Archlinux'] else 'freshclam' }}"
        state: "restarted"
      become: true
      when: "not ansible_check_mode"

    - name: "Regenerate Auditd Rules"
      ansible.builtin.command: "{{ 'auditctl -R /etc/audit/rules.d/audit.rules' if ansible_facts['os_family'] == 'Archlinux' else 'augenrules --load' }}"
      become: true
      failed_when: false
      when: "not ansible_check_mode"

    - name: "Restart SSH Daemon"
      ansible.builtin.service:
        name: "{{ 'sshd' if ansible_facts['os_family'] in ['Archlinux', 'RedHat'] else 'ssh' }}"
        state: "restarted"
      become: true
      when: "not ansible_check_mode"

