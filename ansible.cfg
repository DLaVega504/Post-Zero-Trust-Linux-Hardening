[defaults]
inventory = ./hosts.ini
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
timeout = 60
force_handlers = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60m -o ConnectionAttempts=100

[privilege_escalation]
become = True
become_ask_pass = True
become_flags = -H -S

