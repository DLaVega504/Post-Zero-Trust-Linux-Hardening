[defaults]
inventory = ./hosts.ini
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
timeout = 300
force_handlers = True

[privilege_escalation]
become = True
become_ask_pass = False
become_method = sudo
become_flags = -H -S

[ssh_connection]
# Forces Ansible to attach a valid terminal wrapper over local loopback processes
use_tty = True

