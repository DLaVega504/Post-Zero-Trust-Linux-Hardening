---
- name: "Universal Zero-Trust Hardening Verification Framework (Cross-Distro)"
  hosts: "hardened_nodes"
  become: true
  gather_facts: true

  tasks:
    - name: "Ingest multi-distribution security baseline mappings file"
      ansible.builtin.include_vars:
        file: "vars_mapping.yml"
        name: "distro_blueprint"

    - name: "Map host platform validation variables for Arch Linux"
      ansible.builtin.set_fact:
        target_env: "{{ distro_blueprint.arch_vars }}"
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "Map host platform validation variables for Debian"
      ansible.builtin.set_fact:
        target_env: "{{ distro_blueprint.debian_vars }}"
      when: "ansible_facts['os_family'] == 'Debian'"

    - name: "Map host platform validation variables for Fedora (RedHat)"
      ansible.builtin.set_fact:
        target_env: "{{ distro_blueprint.fedora_vars }}"
      when: "ansible_facts['os_family'] == 'RedHat'"

    - name: "Map host platform validation variables for openSUSE (Suse)"
      ansible.builtin.set_fact:
        target_env: "{{ distro_blueprint.suse_vars }}"
      when: "ansible_facts['os_family'] == 'Suse'"
    - name: "1. KERNEL | Verify presence of personal kernel hardening profile"
      ansible.builtin.command: "cat /etc/sysctl.d/99-kernel-hardening.conf"
      register: sysctl_hardening_file
      changed_when: false

    - name: "1. KERNEL | Assert kernel hardening parameters are strictly written"
      ansible.builtin.assert:
        that:
          - "'kernel.dmesg_restrict = 1' in sysctl_hardening_file.stdout"
          - "'kernel.kptr_restrict = 2' in sysctl_hardening_file.stdout"
          - "'net.ipv4.ip_forward = 0' in sysctl_hardening_file.stdout"
          - "'net.ipv4.tcp_syncookies = 1' in sysctl_hardening_file.stdout"
        fail_msg: "❌ CRITICAL: Custom kernel-hardening parameters are missing or altered on disk!"
        success_msg: "✅ PASS: Custom kernel-hardening profile verified successfully on storage."

    - name: "1. KERNEL | Verify presence of personal memory tuning profile"
      ansible.builtin.command: "cat /etc/sysctl.d/99-memory-tuning.conf"
      register: sysctl_memory_file
      changed_when: false

    - name: "1. KERNEL | Assert multi-tier memory configurations are active"
      ansible.builtin.assert:
        that:
          - "'vm.vfs_cache_pressure = 500' in sysctl_memory_file.stdout"
          - "'vm.dirty_ratio = 10' in sysctl_memory_file.stdout"
        fail_msg: "❌ CRITICAL: Custom memory-tuning parameters are missing or altered on disk!"
        success_msg: "✅ PASS: Custom memory-tuning profile verified successfully on storage."

    - name: "1. KERNEL | Verify presence of personal flatpak namespaces profile"
      ansible.builtin.command: "cat /etc/sysctl.d/99-flatpak-namespaces.conf"
      register: sysctl_flatpak_file
      changed_when: false

    - name: "1. KERNEL | Assert flatpak namespace cloning is enabled"
      ansible.builtin.assert:
        that:
          - "'kernel.unprivileged_userns_clone = 1' in sysctl_flatpak_file.stdout"
        fail_msg: "❌ CRITICAL: Flatpak unprivileged namespace configuration is missing from disk!"
        success_msg: "✅ PASS: Flatpak namespace cloning rules safely committed."
    - name: "1. MEMORY | Verify presence of systemd-zram configuration profile"
      ansible.builtin.command: "cat {{ target_env.zram_conf_path | default('/etc/systemd/zram-generator.conf') }}"
      register: zram_file_live
      changed_when: false
      when: "ansible_facts['memtotal_mb'] | int <= 16384"

    - name: "1. MEMORY | Assert ZRAM priority configurations are written to disk"
      ansible.builtin.assert:
        that:
          - "'swap-priority = 32767' in zram_file_live.stdout"
        fail_msg: "❌ CRITICAL: ZRAM configuration template does not contain maximum priority!"
        success_msg: "✅ PASS: ZRAM priority parameters verified on disk configuration."
      when: "ansible_facts['memtotal_mb'] | int <= 16384"

    - name: "1. MEMORY | Query active swap endpoints and priorities from kernel"
      ansible.builtin.command: "swapon --show=NAME,TYPE,PRIO"
      register: swapon_live
      changed_when: false

    - name: "2. STORAGE | Verify strict partition mapping compliance in fstab"
      ansible.builtin.command: "cat /etc/fstab"
      register: fstab_live
      changed_when: false

    - name: "2. STORAGE | Assert zero-trust system mounts and mount options are present"
      ansible.builtin.assert:
        that:
          - "'hidepid=2' in fstab_live.stdout"
          - "'/var/log' in fstab_live.stdout"
          - "'subvol=@/.snapshots' in fstab_live.stdout"
          - "'/var/lib/flatpak' in fstab_live.stdout"
          - "'/srv' in fstab_live.stdout"
          - "'none' in fstab_live.stdout"
        fail_msg: "❌ CRITICAL: /proc hidepid shielding or core partition isolation layouts are missing from fstab!"
        success_msg: "✅ PASS: Explicit Mount security options are present on runtime filesystems."
    - name: "3. AUTH | Audit login parameters configuration limits"
      ansible.builtin.command: "grep -E '^(FAIL_DELAY|UMASK|PASS_MAX_DAYS)' {{ target_env.login_defs_path | default('/etc/login.defs') }}"
      register: logindefs_live
      changed_when: false

    - name: "3. AUTH | Assert strict system account policy boundaries are deployed"
      ansible.builtin.assert:
        that:
          - "'UMASK\t\t027' in logindefs_live.stdout or 'UMASK 027' in logindefs_live.stdout"
          - "'PASS_MAX_DAYS\t90' in logindefs_live.stdout or 'PASS_MAX_DAYS   90' in logindefs_live.stdout"
        fail_msg: "❌ CRITICAL: Default account login definitions violate security posture baselines!"
        success_msg: "✅ PASS: login.defs enforces secure default system masks and expiration timers."

    - name: "3. PAM | Verify brute-force defense rules (Only for Arch Linux target scopes)"
      ansible.builtin.command: "cat /etc/pam.d/system-auth"
      register: pam_live
      changed_when: false
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "3. PAM | Assert pam_faillock locking layers are active"
      ansible.builtin.assert:
        that:
          - "'pam_faillock.so' in pam_live.stdout"
          - "'deny=3' in pam_live.stdout"
        fail_msg: "❌ CRITICAL: PAM subsystem does not actively intercept authentication failures!"
        success_msg: "✅ PASS: pam_faillock is handling brute-force connection counters."
      when: "ansible_facts['os_family'] == 'Archlinux'"
    - name: "4. SERVICES | Query operational status of core defense daemons"
      ansible.builtin.systemd:
        name: "{{ item }}"
      loop: "{{ ['firewalld', 'fail2ban', 'usbguard', 'aide-check.timer'] if ansible_facts['os_family'] == 'Archlinux' else ['firewalld', 'fail2ban', 'usbguard', 'aide-check.timer', 'tripwire-check.timer'] }}"
      register: service_check
      ignore_errors: true

    - name: "4. SERVICES | Assert defense daemons are active"
      ansible.builtin.assert:
        that:
          - "item.status.ActiveState == 'active' or ansible_check_mode"
        fail_msg: "❌ CRITICAL: Defensive service {{ item.item }} is NOT running or failed to respond!"
        success_msg: "✅ PASS: Service {{ item.item }} is fully functional."
      loop: "{{ service_check.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.status is defined

    - name: "4. INTERFACES | Verify persistent Stage 3 manual portal shortcut presence"
      ansible.builtin.command: "cat /etc/profile.d/firewall-killswitches.sh"
      register: alias_profile_live
      changed_when: false

    - name: "4. INTERFACES | Assert captive portal mitigation script is compiled"
      ansible.builtin.assert:
        that:
          - "'alias portaloff' in alias_profile_live.stdout"
          - "'alias portalon' in alias_profile_live.stdout"
        fail_msg: "❌ CRITICAL: Firewalld dual-kill switch alias scripts are missing from profile storage paths!"
        success_msg: "✅ PASS: Portal off/on toggle automation hooks verified successfully."

