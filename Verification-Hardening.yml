---
- name: "Universal Zero-Trust Hardening Validation Suite"
  hosts: "hardened_nodes"
  become: true
  gather_facts: true

  tasks:
    - name: "Ingest multi-distribution security baseline mappings file"
      ansible.builtin.include_vars:
        file: "vars_mapping.yml"
        name: "distro_blueprint"

    - name: "Map validation environment properties"
      ansible.builtin.set_fact:
        target_env: >-
          {{
            distro_blueprint.arch_vars if ansible_facts['os_family'] == 'Archlinux' else
            distro_blueprint.debian_vars if ansible_facts['os_family'] == 'Debian' else
            distro_blueprint.fedora_vars if ansible_facts['os_family'] == 'RedHat' else
            distro_blueprint.suse_vars if ansible_facts['os_family'] == 'Suse' else none
          }}

    - name: "1. KERNEL | Fetch active hardening sysctl parameters"
      ansible.builtin.command: "sysctl kernel.dmesg_restrict kernel.kptr_restrict net.ipv4.ip_forward"
      register: sysctl_live
      changed_when: false

    - name: "1. KERNEL | Assert sysctl restrictions are actively enforced"
      ansible.builtin.assert:
        that:
          - "'kernel.dmesg_restrict = 1' in sysctl_live.stdout"
          - "'kernel.kptr_restrict = 2' in sysctl_live.stdout"
          - "'net.ipv4.ip_forward = 0' in sysctl_live.stdout"
        fail_msg: "❌ CRITICAL: Kernel network hardening parameters are missing or altered!"
        success_msg: "✅ PASS: Kernel sysctl parameters are strictly locked down."

    - name: "2. SERVICES | Query operational status of core defense daemons"
      ansible.builtin.systemd:
        name: "{{ item }}"
      loop:
        - "earlyoom"
        - "firewalld"
      register: service_check

    - name: "2. SERVICES | Assert defense daemons are active and enabled"
      ansible.builtin.assert:
        that:
          - "item.status.ActiveState == 'active'"
          - "item.status.UnitFileState == 'enabled'"
        fail_msg: "❌ CRITICAL: Defensive service {{ item.item }} is NOT running or enabled!"
        success_msg: "✅ PASS: Service {{ item.item }} is fully functional."
      loop: "{{ service_check.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: "3. FIREWALL | Verify virtual tunnel interface persistent zone mapping"
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --list-interfaces"
      register: firewall_tunnels
      changed_when: false

    - name: "3. FIREWALL | Assert VPN tunnels are bound to trusted zone"
      ansible.builtin.assert:
        that:
          - "'tun+' in firewall_tunnels.stdout"
          - "'wg+' in firewall_tunnels.stdout"
        fail_msg: "❌ CRITICAL: Virtual leak-protection tunnels are unmapped!"
        success_msg: "✅ PASS: Virtual tunnel interfaces securely bound to trusted firewall zones."

    - name: "4. CLAMAV | Check systemd cgroup resource sandbox constraints"
      ansible.builtin.command: "cat /etc/systemd/system/{{ target_env.clamav_service | default('clamav-daemon') }}.service.d/override.conf"
      register: clamav_cgroups
      changed_when: false

    - name: "4. CLAMAV | Assert strict CPU and Memory boundaries are set"
      ansible.builtin.assert:
        that:
          - "'CPUQuota=10%' in clamav_cgroups.stdout"
          - "'MemoryMax=1.2G' in clamav_cgroups.stdout"
          - "'MemoryHigh=1.0G' in clamav_cgroups.stdout"
        fail_msg: "❌ CRITICAL: ClamAV resource throttling cgroups are missing or improperly bound!"
        success_msg: "✅ PASS: ClamAV strictly contained to 10% CPU, 1.2G Max, and 1G High RAM ceilings."

    - name: "5. AUDITING | Verify disk presence of custom file tracking signatures"
      ansible.builtin.stat:
        path: "{{ '/etc/audit/rules.d/audit.rules' if ansible_facts['os_family'] == 'Archlinux' else target_env.audit_rules_path | default('/etc/audit/audit.rules') }}"
      register: audit_rules_file

    - name: "5. AUDITING | Assert audit configuration rules exist on storage"
      ansible.builtin.assert:
        that:
          - "audit_rules_file.stat.exists"
        fail_msg: "❌ CRITICAL: Hardened audit rules file is missing from disk!"
        success_msg: "✅ PASS: Hardened audit rules safely committed to storage configuration."

