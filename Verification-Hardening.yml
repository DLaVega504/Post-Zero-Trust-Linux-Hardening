---
- name: "Universal Zero-Trust Hardening Verification Framework (Stage 2 - Auditing Core)"
  hosts: "localhost"
  connection: "smart"
  become: true
  gather_facts: true

  tasks:
    # =========================================================================
    # PREFLIGHT BLUEPRINT INGESTION & STORAGE AUDITING
    # =========================================================================
    - name: "AUDIT PREFLIGHT | Ingest multi-distribution security baseline mappings file"
      ansible.builtin.include_vars:
        file: "vars_mapping.yml"
        name: "distro_blueprint"

    - name: "AUDIT PREFLIGHT | Map host platform validation variables based on distro"
      ansible.builtin.set_fact:
        target_env: >-
          {{
            distro_blueprint.arch_vars if ansible_facts['os_family'] == 'Archlinux' else
            distro_blueprint.debian_vars if ansible_facts['os_family'] == 'Debian' else
            distro_blueprint.fedora_vars if ansible_facts['os_family'] == 'RedHat' else
            distro_blueprint.suse_vars
          }}
        is_workstation: "{{ ansible_facts['chassis_type'] | lower in ['laptop', 'notebook', 'desktop', 'chassis'] if 'chassis_type' in ansible_facts else true }}"

    - name: "AUDIT STORAGE | Check active kernel memory swap tables"
      ansible.builtin.shell: "swapon --show=NAME,TYPE --noheadings"
      register: live_swap_state
      changed_when: false

    - name: "AUDIT STORAGE | Assert physical swap allocations are actively processing"
      ansible.builtin.assert:
        that:
          - "live_swap_state.stdout_lines | length > 0"
        fail_msg: "❌ CRITICAL FAILURE: The running system has no active swap space initialized in kernel memory!"
        success_msg: "✅ PASS: Active swap allocation detected and parsing successfully."
      when: "not ansible_check_mode"
    - name: "AUDIT STORAGE | Check persistent partition tracking mappings"
      ansible.builtin.command: "cat /etc/fstab"
      register: fstab_live
      changed_when: false

    - name: "AUDIT STORAGE | Assert zero-trust system mount options are present"
      ansible.builtin.assert:
        that:
          - "'/swap' in fstab_live.stdout or 'swapfile' in fstab_live.stdout"
          - "'/tmp' in fstab_live.stdout and 'nosuid' in fstab_live.stdout"
          - "'/dev/shm' in fstab_live.stdout and 'noexec' in fstab_live.stdout"
        fail_msg: "❌ CRITICAL FAILURE: Core partition isolation layouts or memory swap paths are missing from fstab!"
        success_msg: "✅ PASS: Secure mount boundaries verified inside static fstab arrays."
    # =========================================================================
    # KERNEL HARDENING PARAMETERS & CORE SERVICES AUDITING
    # =========================================================================
    - name: "AUDIT KERNEL | Verify presence of security tuning drop-ins"
      ansible.builtin.command: "cat /etc/sysctl.d/99-memory-hardening.conf"
      register: sysctl_hardening_file
      changed_when: false

    - name: "AUDIT KERNEL | Assert zero-trust kernel variables are strictly applied"
      ansible.builtin.assert:
        that:
          - "'kernel.dmesg_restrict = 1' in sysctl_hardening_file.stdout"
          - "'kernel.kptr_restrict = 2' in sysctl_hardening_file.stdout"
          - "'net.ipv4.tcp_syncookies = 1' in sysctl_hardening_file.stdout"
        fail_msg: "❌ CRITICAL FAILURE: Custom kernel-hardening parameters are missing or altered on storage!"
        success_msg: "✅ PASS: Custom security sysctl profile rules verified on disk."

    - name: "AUDIT SERVICES | Query operational status of host security daemons"
      ansible.builtin.systemd:
        name: "{{ item }}"
      loop: ["firewalld", "fail2ban", "usbguard", "aide-check.timer"]
      register: security_service_check
      ignore_errors: true

    - name: "AUDIT SERVICES | Assert baseline host security shields are functional"
      ansible.builtin.assert:
        that:
          - "item.status.ActiveState == 'active' or ansible_check_mode"
        fail_msg: "❌ CRITICAL FAILURE: Security tracking daemon [ {{ item.item }} ] is not running or failed!"
        success_msg: "✅ PASS: Host protection daemon [ {{ item.item }} ] is verified active and running."
      loop: "{{ security_service_check.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: "item.status is defined"
    # =========================================================================
    # ROLE-BASED DUAL KILLSWITCH PERIMETER AUDITING
    # =========================================================================
    - name: "AUDIT FIREWALL | Discover running network interfaces from kernel space"
      ansible.builtin.shell: "ls /sys/class/net | grep -E '^(wlan|wl|eth|en)'"
      register: audit_hardware_interfaces
      changed_when: false
      failed_when: false

    - name: "AUDIT FIREWALL | Check active adapter zone properties inside firewalld"
      ansible.builtin.command: "firewall-cmd --zone=block --list-interfaces"
      register: audit_block_zone
      changed_when: false
      failed_when: false

    - name: "AUDIT FIREWALL | Check permitted virtual tunnel zone properties inside firewalld"
      ansible.builtin.command: "firewall-cmd --zone=trusted --list-interfaces"
      register: audit_trusted_zone
      changed_when: false
      failed_when: false

    - name: "AUDIT FIREWALL | Assert dynamic dual killswitch rules match the hardware deployment role"
      ansible.builtin.assert:
        that:
          - >
            (not is_workstation | bool) or
            (is_workstation | bool and (audit_block_zone.stdout is search(item)))
        fail_msg: "❌ CRITICAL KILLSWITCH FAILURE: Workstation adapter [ {{ item }} ] leaked out of the firewalld block zone!"
        success_msg: "✅ PASS: Perimeter lockdown verified. Adapter [ {{ item }} ] trapped securely inside the block zone."
      loop: "{{ audit_hardware_interfaces.stdout_lines | default([]) }}"
      when: "is_workstation | bool"

    - name: "AUDIT FIREWALL | Assert virtual tunnel exceptions are active"
      ansible.builtin.assert:
        that:
          - "'tun+' in audit_trusted_zone.stdout"
          - "'wg+' in audit_trusted_zone.stdout"
          - "'proton+' in audit_trusted_zone.stdout"
        fail_msg: "❌ CRITICAL KILLSWITCH FAILURE: Virtual VPN bypass tunnel interface configurations are missing from the trusted zone!"
        success_msg: "✅ PASS: Dual Killswitch architecture rules confirmed. Virtual tunnel exceptions are verified open."

    - name: "AUDIT INTERFACES | Verify persistent manual portal toggle shortcut presence"
      ansible.builtin.command: "cat /etc/profile.d/firewall-killswitches.sh"
      register: portal_script_live
      changed_when: false

    - name: "AUDIT INTERFACES | Assert captive portal mitigation functions are compiled"
      ansible.builtin.assert:
        that:
          - "'alias portaloff' in portal_script_live.stdout"
          - "'alias portalon' in portal_script_live.stdout"
        fail_msg: "❌ CRITICAL FAILURE: Firewalld dual killswitch wrapper scripts are missing from profile storage boundaries!"
        success_msg: "✅ PASS: Captive portal off/on toggle alias hooks verified successfully."
    # =========================================================================
    # AUDIT SNAPPER TIMELINES
    # =========================================================================
    - name: "AUDIT SNAPPER | Verify presence of your custom 3-tier timeline scheduler"
      ansible.builtin.command: "systemctl status snapper-posthardening.timer"
      register: audit_snapper_timer
      changed_when: false

    - name: "AUDIT SNAPPER | Assert timeline calendar execution strings are actively parsing"
      ansible.builtin.assert:
        that:
          - "'00,06,15:00:00' in audit_snapper_timer.stdout"
        fail_msg: "❌ CRITICAL FAILURE: The custom Snapper 6AM/3PM/Midnight timeline timer has been altered or deactivated!"
        success_msg: "✅ PASS: Custom 3-tier snapshot scheduling matrix verified running."
      when: "not ansible_check_mode" 
