---
arch_vars:
  admin_group: "wheel"
  core_packages: ["libpwquality", "firewalld", "fail2ban", "usbguard", "clamav", "sysstat", "lynis", "snapper", "snap-pac", "git", "make", "aide", "rsync"]
  zram_conf_path: "/etc/systemd/zram-generator.conf"
  login_defs_path: "/etc/login.defs"
  subvolumes:
    - { name: "@", dest: "/" }
    - { name: "@home", dest: "/home" }
    - { name: "@swap", dest: "/swap" }
    - { name: "@snapshots", dest: "/.snapshots" }
    - { name: "@log", dest: "/var/log" }
    - { name: "@cache", dest: "/var/cache/pacman/pkg" }
    - { name: "@docker", dest: "/var/lib/docker" }
    - { name: "@flatpak", dest: "/var/lib/flatpak" }
    - { name: "@srv", dest: "/srv" }

debian_vars:
  admin_group: "sudo"
  core_packages: ["libpwquality-tools", "firewalld", "fail2ban", "usbguard", "clamav-daemon", "clamav-freshclam", "sysstat", "lynis", "snapper", "git", "make", "rsync", "aide", "tripwire"]
  zram_conf_path: "/etc/default/zram-init"
  login_defs_path: "/etc/login.defs"
  subvolumes:
    - { name: "@rootfs", dest: "/" }
    - { name: "@home", dest: "/home" }
    - { name: "@swap", dest: "/swap" }
    - { name: "@snapshots", dest: "/.snapshots" }
    - { name: "@log", dest: "/var/log" }
    - { name: "@cache", dest: "/var/cache/apt/archives" }
    - { name: "@docker", dest: "/var/lib/docker" }
    - { name: "@srv", dest: "/srv" }

fedora_vars:
  admin_group: "wheel"
  core_packages: ["libpwquality", "firewalld", "fail2ban", "usbguard", "clamav", "clamav-update", "sysstat", "lynis", "snapper", "git", "make", "rsync", "aide", "tripwire"]
  zram_conf_path: "/etc/systemd/zram-generator.conf"
  login_defs_path: "/etc/login.defs"
  subvolumes:
    - { name: "root", dest: "/" }
    - { name: "home", dest: "/home" }
    - { name: "swap", dest: "/swap" }
    - { name: "snapshots", dest: "/.snapshots" }
    - { name: "log", dest: "/var/log" }
    - { name: "cache", dest: "/var/cache/dnf" }
    - { name: "containers", dest: "/var/lib/containers" }

suse_vars:
  admin_group: "wheel"
  core_packages: ["libpwquality", "firewalld", "fail2ban", "usbguard", "clamav", "sysstat", "lynis", "snapper", "snapper-plugins", "git", "make", "kernel-default", "grub2-snapper-plugin", "aide", "tripwire", "rsync"]
  zram_conf_path: "/etc/systemd/zram-generator.conf"
  login_defs_path: "/etc/login.defs"
  subvolumes:
    - { name: "@", dest: "/" }
    - { name: "@snapshots", dest: "/.snapshots" }
    - { name: "@home", dest: "/home" }
    - { name: "@srv", dest: "/srv" }
    - { name: "@var_cache", dest: "/var/cache" }
    - { name: "@var_log", dest: "/var/log" }
    - { name: "@swap", dest: "/swap" }
    - { name: "@docker", dest: "/var/lib/docker" }

