# 🗄️ ARCH LINUX PLATFORM PROFILE CONFIGURATION Presets
arch_vars:
  admin_group: "wheel"
  zram_conf_path: "/etc/systemd/zram-generator.conf"
  login_defs_path: "/etc/login.defs"
  core_packages:
    - "libpwquality"
    - "firewalld"
    - "fail2ban"
    - "usbguard"
    - "clamav"
    - "sysstat"
    - "lynis"
    - "snapper"
    - "snap-pac"
    - "git"
    - "make"
    - "aide"
    - "rsync"
    - "audit"  # 🧠 CRITICAL RESOLUTION: Enforces user-space utils presence for auditd daemon setup
    - "snort"  # 🧠 HYBRID OPTION B: Installs standard package mapping to Snort 3 Lua engine natively
  aur_packages:
    - "tripwire-git"  # 🧠 CRITICAL RESOLUTION: Isolated strictly to Paru AUR compilation track
  subvolumes:
    - { name: "@", dest: "/" }
    - { name: "@home", dest: "/home" }
    - { name: "@swap", dest: "/swap" }
    - { name: "@snapshots", dest: "/.snapshots" }
    - { name: "@log", dest: "/var/log" }
    - { name: "@cache", dest: "/var/cache/pacman/pkg" }
    - { name: "@docker", dest: "/var/lib/docker" }
    - { name: "@flatpak", dest: "/var/lib/flatpak" }
    - { name: "@srv", dest: "/srv" }

# 🗄️ DEBIAN STABLE PLATFORM PROFILE CONFIGURATION Presets
debian_vars:
  admin_group: "sudo"
  zram_conf_path: "/etc/default/zram-init"
  login_defs_path: "/etc/login.defs"
  core_packages:
    - "libpwquality-tools"
    - "firewalld"
    - "fail2ban"
    - "usbguard"
    - "clamav-daemon"
    - "clamav-freshclam"
    - "sysstat"
    - "lynis"
    - "snapper"
    - "git"
    - "make"
    - "rsync"
    - "aide"
    - "tripwire"
    - "auditd" # 🧠 CRITICAL RESOLUTION: Debian maps user-space utilities directly under daemon binary string name
    - "snort"  # 🧠 HYBRID OPTION B: Dynamic fallback forces native ingestion of stable Snort 2.9 text engine
  subvolumes:
    - { name: "@rootfs", dest: "/" }
    - { name: "@home", dest: "/home" }
    - { name: "@swap", dest: "/swap" }
    - { name: "@snapshots", dest: "/.snapshots" }
    - { name: "@log", dest: "/var/log" }
    - { name: "@cache", dest: "/var/cache/apt/archives" }
    - { name: "@docker", dest: "/var/lib/docker" }
    - { name: "@srv", dest: "/srv" }

# 🗄️ FEDORA WORKSTATION PLATFORM PROFILE CONFIGURATION Presets
fedora_vars:
