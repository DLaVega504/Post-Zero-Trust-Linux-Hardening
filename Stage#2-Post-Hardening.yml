          PrivateTmp=true
          NoNewPrivileges=true
      register: arpwatch_config_state
      notify: "Reload Active Systemd Core"
      become: true

# =============================================================================
# BLOCK 42: HARDWARE-AWARE USBGUARD FIREWALLD PROFILE LAYOUTS
# DESCRIPTION: Scans hardware tree, compiles user whitelists based on admin
#              group memberships, and deploys hardened daemon configs.
# =============================================================================
    - name: "USBGUARD | PRE-FLIGHT | Ensure secure backend logging target paths exist"
      ansible.builtin.file:
        path: "/var/log/usbguard"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: "USBGUARD | CONFIGURATION | Scan hardware tree and initialize whitelist rules"
      ansible.builtin.shell: |
        set -euo pipefail
        if [ ! -s /etc/usbguard/rules.conf ]; then
            mkdir -p /etc/usbguard
            usbguard generate-policy > /etc/usbguard/rules.conf
            chmod 0600 /etc/usbguard/rules.conf
        fi
      args:
        executable: /bin/bash
      register: usbguard_policy_generation
      changed_when: usbguard_policy_generation.rc == 0

    - name: "USBGUARD | CONFIGURATION | Enforce hardware-intelligent production configuration blueprints"
      ansible.builtin.shell: |
        set -euo pipefail
        
        # Hard-isolate clean string variables and strip structural trailing newline spaces
        ADMIN_GRP="{{ detected_admin_group | default('wheel') | trim }}"
        HUMAN_OP="{{ primary_human_operator | default('vega') | trim }}"
        
        GRP_USERS=$(getent group "$ADMIN_GRP" | cut -d: -f4 | tr ',' ' ' || echo "")
        RAW_USERS=$(echo "root ${HUMAN_OP} ${GRP_USERS}" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)
        COMBINED_USERS=$(echo "${RAW_USERS}" | tr ' ' ',')

        cat << EOF > /etc/usbguard/usbguard-daemon.conf
        ImplicitPolicyTarget=block
        PresentDevicePolicy=keep
        PresentControllerPolicy=keep
        InsertedDevicePolicy=block
        RestoreControllerDeviceState=false
        AuditBackend=FileAudit
        AuditFilePath=/var/log/usbguard/usbguard-audit.log
        IPCAllowedGroups=${ADMIN_GRP}
        IPCAllowedUsers=${COMBINED_USERS}
        RuleFile=/etc/usbguard/rules.conf
        EOF

        chmod 0600 /etc/usbguard/usbguard-daemon.conf
        chown root:root /etc/usbguard/usbguard-daemon.conf
      args:
        executable: /bin/bash
      register: usbguard_config_state
      changed_when: true

    - name: "USBGUARD | STAGE 3 | Enforce Strict System Posture Layer Re-Locks"
      ansible.builtin.systemd:
        name: usbguard.service
        state: restarted
        enabled: true
      when: "not ansible_check_mode"

# =============================================================================
# BLOCK 43: FIREWALLD STATIC PERIMETER CONTAINMENT CONTROL
# DESCRIPTION: Configures the base perimeter zones, locks down trusted loopbacks,
#              and isolates active network cards inside drop containers.
# =============================================================================
    - name: "FIREWALLD | ENFORCE INTERFACE CONTAINMENT | Set baseline architecture zones cleanly"
      ansible.builtin.shell: |
        firewall-cmd --permanent --set-default-zone=public
        firewall-cmd --permanent --zone=trusted --remove-interface=lo 2>/dev/null || true
        firewall-cmd --permanent --zone=trusted --add-source=127.0.0.1/8
        firewall-cmd --permanent --zone=trusted --add-source=::1/128
        firewall-cmd --reload
      args:
        executable: /bin/bash
      register: firewall_conf_fix
      failed_when: false
      when:
        - "not ansible_check_mode"
        - "firewalld_native | bool"


# =============================================================================
# BLOCK 44: SNORT INTRUSION DETECTION ENGINE LAYOUTS
# DESCRIPTION: Investigates the active file layout to identify version variants
#              and deploys a structured, passive mode Lua configuration map.
# =============================================================================
    - name: "SCAN | SNORT | Probing system filesystem layout to determine running version"
      ansible.builtin.stat:
        path: "/etc/snort/snort.lua"
      register: snort_version_probe

    - name: "CONFIGURATION | SNORT 3 | Deploy modern structured Lua posture config"
      ansible.builtin.copy:
        dest: "/etc/snort/snort.lua"
        owner: root
        group: root
        mode: '0644'
        content: |
          interfaces = { name = "{{ primary_network_interface }}" }
          HOME_NET = "{{ dynamic_home_net }}"
          EXTERNAL_NET = "!$HOME_NET"
          daq = { module = "pcap", mode = "passive" }
          stream = { }
          ips = { mode = "tap" }
      register: snort_conf_fix
      when:
        - "snort_version_probe.stat.exists | bool"
        - "not ansible_check_mode"
      become: true


# =============================================================================
# BLOCK 45: SNORT POSTURE RE-ALIGNMENT CONTROLS (ARCH FIX COMPLETED)
# DESCRIPTION: Automates systemic restart routines over active intrusion detection
#              daemons dynamically triggered if configuration file layers changed.
# =============================================================================
    - name: "SECURITY SERVICES | SNORT | STAGE 3 | Ensure distribution unit is synchronized"
      ansible.builtin.systemd:
        name: >-
          {%- if ansible_facts['os_family'] == 'Archlinux' -%}
            snort3.service
          {%- elif ansible_facts['os_family'] == 'Debian' -%}
            snort-init.service
          {%- else -%}
            {{ distro_matrix[ansible_facts['os_family']]['snort_service_name'] | default('snort.service') }}
          {%- endif -%}
        state: "{{ 'restarted' if snort_conf_fix.changed else 'started' }}"
        enabled: true
      when:
        - "not ansible_check_mode"
        - "snort_version_probe.stat.exists | bool"
      
      
# =============================================================================
# BLOCK 46: CLAMAV DAEMON RESOURCE SANDBOXING & OVERRIDES
# DESCRIPTION: Deploys drop-in directories for your systemd configuration tree
#              and injects hardware-proportional cgroup resource constraints.
# =============================================================================
    - name: "CLAMAV | CONFIGURATION | Establish systemd drop-in override containment path"
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ 'clamav-daemon' if ansible_facts['os_family'] == 'Debian' else 'clamd' }}.service.d"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: "not ansible_check_mode"

    - name: "CLAMAV | CONFIGURATION | Inject hardware-proportional resource management parameters"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ 'clamav-daemon' if ansible_facts['os_family'] == 'Debian' else 'clamd' }}.service.d/override.conf"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          Nice=19
          CPUSchedulingPolicy=idle
          CPUQuota={{ calculated_quota | trim }}%
          MemoryHigh={{ calculated_mem_high | trim }}
          MemoryMax={{ calculated_mem_max | trim }}
          TimeoutStartSec=300
      vars:
        calculated_quota: >
