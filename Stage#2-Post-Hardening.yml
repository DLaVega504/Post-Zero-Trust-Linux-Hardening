# DESCRIPTION: Enforces high-iteration cryptographic password stretching via
#              SHA512 hashing parameters and sets strict default system umasks.
# =============================================================================
    - name: "PAM | HARDENING | Inject strict password stretching algorithm limits into system auth"
      ansible.builtin.lineinfile:
        path: "/etc/login.defs"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: "^#?ENCRYPT_METHOD", line: "ENCRYPT_METHOD SHA512" }
        - { regexp: "^#?SHA_CRYPT_MIN_ROUNDS", line: "SHA_CRYPT_MIN_ROUNDS 65536" }
        - { regexp: "^#?SHA_CRYPT_MAX_ROUNDS", line: "SHA_CRYPT_MAX_ROUNDS 65536" }
        - { regexp: "^#?UMASK\\s+", line: "UMASK           027" }
        - { regexp: "^#?FAILLOG_ENAB\\s+", line: "FAILLOG_ENAB yes" }
        - { regexp: "^#?LOG_UNKFAIL_ENAB\\s+", line: "LOG_UNKFAIL_ENAB yes" }
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 74: PAM PASSWORD AGING LIFECYCLE MANAGEMENT
# DESCRIPTION: Implements aging rules for existing login accounts to restrict
#              long-lived credentials on administrative human paths.
# =============================================================================
    - name: "PAM | HARDENING | Enforce universal baseline account password aging defaults"
      ansible.builtin.lineinfile:
        path: "/etc/login.defs"
        regexp: "^#?{{ item.key }}\\s+"
        line: "{{ item.key }} {{ item.value }}"
        state: present
      loop:
        - { key: 'PASS_MAX_DAYS', value: '90' }
        - { key: 'PASS_MIN_DAYS', value: '7' }
        - { key: 'PASS_WARN_AGE', value: '7' }
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Temporarily lower minimum password age to allow immediate hash upgrades"
      ansible.builtin.command: "chage -m 0 {{ item }}"
      loop: ["root", "{{ primary_human_operator | default('vega') }}"]
      changed_when: false
      failed_when: false
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Apply baseline password aging rules retroactively to existing active profiles"
      ansible.builtin.command: "chage -M 90 -m 7 -W 7 {{ item }}"
      loop: ["root", "{{ primary_human_operator | default('vega') }}"]
      changed_when: false
      failed_when: false
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 75: CROSS-DISTRIBUTION LOCKOUT PROFILE MAPPINGS
# DESCRIPTION: Normalizes faillock account lock parameters dynamically over
#              multi-platform hosts using native authselect and pam-config tools.
# =============================================================================
    - name: "PAM | HARDENING | Standardize cross-distribution faillock lockout policy parameters"
      ansible.builtin.copy:
        dest: /etc/security/faillock.conf
        content: |
          deny = 3
          unlock_time = 900
          fail_interval = 900
          audit
        mode: '0644'
        owner: root
        group: root
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Execute authselect feature profiles for RedHat and Fedora"
      ansible.builtin.command: authselect enable-feature with-faillock
      register: auth_rh_res
      changed_when: "'feature is already enabled' not in auth_rh_res.stderr"
      failed_when: false
      when:
        - "ansible_facts['os_family'] == 'RedHat'"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 76: DEBIAN SPECIFIC PAM MANAGEMENT HOOKS
# DESCRIPTION: Provisions authentication configuration frameworks on Debian and
#              triggers system package enforcement mechanisms automatically.
# =============================================================================
    - name: "PAM | HARDENING | Provision Debian specific profile automation blocks"
      ansible.builtin.copy:
        dest: /usr/share/pam-configs/faillock_hardening
        content: |
          Name: Enforce faillock via Automation
          Default: yes
          Priority: 0
          Auth-Type: Primary
          Auth:
          	[default=die] pam_faillock.so authfail
          	sufficient pam_faillock.so authsucc
        mode: '0644'
      when:
        - "ansible_facts['os_family'] == 'Debian'"
        - "not ansible_check_mode"

    - name: "PAM | HARDENING | Trigger native pam-auth-update mechanisms on Debian platforms"
      ansible.builtin.command: pam-auth-update --package --force
      changed_when: true
      when:
        - "ansible_facts['os_family'] == 'Debian'"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 77: OPENSUSE NATIVE AUTHENTICATION ENFORCEMENTS
# DESCRIPTION: Dynamically invokes system pam-config tooling arrays
#              to append security attributes natively on active openSUSE systems.
# =============================================================================
    - name: "PAM | HARDENING | Implement native pam-config parameters dynamically on openSUSE"
      ansible.builtin.command: "pam-config --add --faillock"
      register: pam_suse_res
      changed_when: true
      failed_when: false
      when:
        - "ansible_facts['os_family'] == 'Suse'"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 78: AUDITD PARENT DIRECTORY PROVISIONING
# DESCRIPTION: Ensures that absolute path matrices exist across target nodes
#              and standardizes logging file and rotation metadata parameters.
# =============================================================================
    - name: "AUDITD | ENFORCE PARENT PATHS | Ensure rule directories exist for Debian architectures"
      ansible.builtin.file:
        path: "/etc/audit/rules.d"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"

    - name: "AUDITD | Enforce optimized local data management rotations parameters"
      ansible.builtin.lineinfile:
        path: "/etc/audit/auditd.conf"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: "present"
      loop:
        - { regexp: "^max_log_file\\s+=", line: "max_log_file = 50" }
        - { regexp: "^max_log_file_action\\s+=", line: "max_log_file_action = ROTATE" }
        - { regexp: "^space_left_action\\s+=", line: "space_left_action = SYSLOG" }
        - { regexp: "^admin_space_left_action\\s+=", line: "admin_space_left_action = SUSPEND" }
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 79: KERNEL EXECUTIONS MONITORS & AUDITD POLICY IMMUTABILITY
# DESCRIPTION: Sanitizes preexisting default blueprints and establishes an
#              immutable, un-falsifiable active logging configuration block.
# =============================================================================
    - name: "AUDITD | Clean conflicting pre-existing default tracking blueprints"
      ansible.builtin.file:
        path: "/etc/audit/rules.d/audit.rules"
        state: "absent"
      when: "not ansible_check_mode"

    - name: "AUDITD | Deploy un-falsifiable zero-trust kernel logging rules matrix"
      ansible.builtin.copy:
        dest: "/etc/audit/rules.d/audit.rules"
        content: |
          -D
          -b 8192
          -f 2
          -w /etc/group -p wa -k security_credentials
          -w /etc/passwd -p wa -k security_credentials
          -w /etc/shadow -p wa -k security_credentials
          -w /etc/sudoers -p wa -k security_privileges
          -w /etc/sudoers.d/ -p wa -k security_privileges
          -w /etc/fstab -p wa -k filesystem_ledgers
          -w /etc/crypttab -p wa -k filesystem_ledgers
          -a always,exit -F arch=b64 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k privilege_escalation
          -a always,exit -F arch=b32 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k privilege_escalation
          -a always,exit -F arch=b64 -S execve -F auid>=1000 -F auid!=4294967295 -k process_execution
          -a always,exit -F arch=b32 -S execve -F auid>=1000 -F auid!=4294967295 -k process_execution
          -w /etc/usbguard/rules.conf -p wa -k peripheral_security
          -w /etc/aide.conf -p wa -k integrity_monitoring
          -w /etc/aide/aide.conf -p wa -k integrity_monitoring
          -e 2
        owner: "root"
        group: "root"
        mode: "0600"
      register: auditd_rules_state
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 80: SYSTEM SERVICE FAIL2BAN PERIMETER SHIELDING
# DESCRIPTION: Provisions multi-platform packages and configures defensive SSH
#              jails tailored directly to hardware profile constraints.
# =============================================================================
    - name: "PERIMETER HARDENING | FAIL2BAN | Dynamic Multi-Distro Provisioning Loop"
      ansible.builtin.package:
        name: "{{ distro_matrix[ansible_facts['os_family']]['fail2ban_pkg'] | default('fail2ban') }}"
        state: present
      when:
        - "fail2ban_installed | default(true) | bool"
        - "not ansible_check_mode"

    - name: "PERIMETER HARDENING | FAIL2BAN | Generate adaptive hardware-proportionate jail configurations"
      ansible.builtin.copy:
        dest: "/etc/fail2ban/jail.local"
        owner: root
        group: root
        mode: '0644'
        content: |
          # =================================================================
          # AUTOMATED ZERO-TRUST HARDWARE-AWARE NETWORK JAIL DEFENSE PRESETS
          # CUSTOM SYSTEM ARCHITECTURE GENERATED DYNAMICALLY
          # =================================================================
          [DEFAULT]
          ignoreip = 127.0.0.1/8 ::1
          bantime  = 3600
          maxretry = 3

          {% if is_mechanical_drive | default(false) | bool or (system_ram_gb | default(4) | int) <= 4 %}
          # MECHANICAL HDD / LOW-RAM TUNING PROFILE MATRIX (TIER 1 & 2 CLAMPS)
          backend     = systemd
          findtime    = 600
          dbpurgeage  = 86400
          {% else %}
          # FLASH CELL SSD / ENTERPRISE MEMORY PERFORMANCE MATRIX (TIER 3 & 4 SPECS)
          backend     = auto
          findtime    = 3600
          dbpurgeage  = 604800
          {% endif %}

          banaction   = firewallcmd-new
          banaction_allports = firewallcmd-new

          [sshd]
          enabled  = true
          port     = ssh
          logpath  = %(sshd_log)s
          interface = {{ primary_network_interface | default('wls1') | trim }}
      register: fail2ban_jail_configuration_state
      when:
        - "fail2ban_installed | default(true) | bool"
        - "not ansible_check_mode"

# =============================================================================
# BLOCK 81: FAIL2BAN STORAGE RETENTION BOUNDARIES
# DESCRIPTION: Injects adaptive database thresholds and triggers service state
#              synchronization routines across target nodes.
# =============================================================================
    - name: "PERIMETER HARDENING | FAIL2BAN | Ensure database parent path exists"
      ansible.builtin.file:
        path: "/var/lib/fail2ban"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when:
        - "fail2ban_installed | default(true) | bool"
        - "not ansible_check_mode"

    - name: "PERIMETER HARDENING | FAIL2BAN | Inject adaptive database purging thresholds"
      ansible.builtin.copy:
        dest: "/etc/fail2ban/fail2ban.local"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Definition]
          {% if is_mechanical_drive | default(false) | bool or (system_ram_gb | default(4) | int) <= 4 %}
          # HDD OPTIMIZED: Compact logging parameters to minimize platter seeks
          loglevel = INFO
          dbpurgeage = 86400
          {% else %}
          # SSD ENGINE: Deep audit logging window standard
          loglevel = INFO
          dbpurgeage = 604800
          {% endif %}
      register: fail2ban_core_configuration_state
      when:
        - "fail2ban_installed | default(true) | bool"
        - "not ansible_check_mode"

    - name: "PERIMETER HARDENING | FAIL2BAN | Synchronize multi-platform running state"
      ansible.builtin.systemd:
        name: "fail2ban.service"
        state: "{{ 'restarted' if (fail2ban_jail_configuration_state.changed or fail2ban_core_configuration_state.changed) else 'started' }}"
        enabled: true
        masked: false
      when:
        - "fail2ban_installed | default(true) | bool"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 82: ZONE ROUTING AND TUNNEL PERIMETER OVERRIDES
# DESCRIPTION: Maps virtual interfaces inside firewalld trusted anchors and
#              deploys robust network environment killswitch profiles.
# =============================================================================
    - name: "FIREWALLD | Deploy global runtime persistence environment script hooks"
      ansible.builtin.copy:
        dest: "/etc/profile.d/firewall-killswitches.sh"
        owner: "root"
        group: "root"
        mode: "0644"
        content: |
          #!/usr/bin/env bash
          # Captive portal profiles management via NetworkManager profiles
          portaloff() {
              touch /run/portal_bypass_active
              for conn in $(nmcli -g NAME,DEVICE connection show | grep "{{ primary_network_interface | default('wls1') | trim }}" | cut -d: -f1); do
                  sudo nmcli connection modify "$conn" connection.zone public
                  sudo nmcli connection up "$conn"
              done
              echo "[+] Dual killswitch lowered. Interface moved to public zone for authentication."
          }

          portalon() {
              rm -f /run/portal_bypass_active
              for conn in $(nmcli -g NAME,DEVICE connection show | grep "{{ primary_network_interface | default('wls1') | trim }}" | cut -d: -f1); do
                  sudo nmcli connection modify "$conn" connection.zone drop
                  sudo nmcli connection up "$conn"
              done
              echo "[✓] Dual killswitch locked. Interface isolated inside drop zone."
          }
      become: true

    - name: "CONFIGURATION | SYSTEM ALIASES | Inject automatic shell sourcing triggers into user space"
      ansible.builtin.blockinfile:
        path: "{{ item }}"
        marker: "# {mark} AUTOMATED ZERO-TRUST PERIMETER UTILITY HOOKS"
        create: yes
        owner: "{{ 'root' if item == '/root/.bashrc' else (primary_human_operator | default('vega') | trim) }}"
        mode: '0644'
        block: |
          # Automatically source perimeter killswitch overrides if present on filesystem
          if [ -f /etc/profile.d/firewall-killswitches.sh ]; then
              . /etc/profile.d/firewall-killswitches.sh
          fi
      loop:
        - "/root/.bashrc"
        - "/home/{{ primary_human_operator | default('vega') | trim }}/.bashrc"
      failed_when: false
      when: "not ansible_check_mode"
