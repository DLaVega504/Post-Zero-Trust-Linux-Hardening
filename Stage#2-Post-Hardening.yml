        path: "/etc/profile.d/portal_aliases.sh"
        mode: '0644'
        owner: root
        group: "{{ 'root' if ansible_check_mode else 'secops' }}"
      when: "firewalld_native | bool"

    - name: "HARDENING | USERLAND | Secure localized cryptographic vault alias permissions"
      ansible.builtin.file:
        path: "/etc/profile.d/vault_aliases.sh"
        mode: '0600'
        owner: root
        group: "{{ 'root' if ansible_check_mode else discovered_primary_user | default('vega') }}"
      when: "secure_vault_enabled | bool"

    - name: "HARDENING | Secure virtual execution interfaces securely inside fstab storage arrays"
      ansible.builtin.blockinfile:
        path: "/etc/fstab"
        marker: "# {mark} ANSIBLE VIRTUAL TIMEMAPS ENGINE PLATFORMS"
        insertafter: EOF
        block: |
          tmpfs /tmp tmpfs defaults,nosuid,nodev,size=50% 0 0
          tmpfs /dev/shm tmpfs defaults,noexec,nosuid,nodev,size=1G 0 0
      become: true

    # =========================================================================
    # PHASE 10B | PROACTIVE POST-REBOOT SHELL ALERT NOTIFICATION
    # =========================================================================
    
    - name: "USERLAND | HOOK | Deploy automated post-reboot zero-trust alert reminder"
      ansible.builtin.copy:
        dest: "/etc/profile.d/zero_trust_reminder.sh"
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          # Secure system initialization reminder hook
          if [ "$(id -u)" -eq 0 ] || [ "$(id -u)" -eq 1000 ]; then
              if [ -f /root/ZERO-TRUST-SYSTEM-INTEGRITY-AUDIT-PROTOCOL.txt ]; then
                  echo ""
                  echo "======================================================================"
                  echo "🔒 SYSTEM INITIALIZATION: ZERO-TRUST ENDPOINT BASELINE ACTIVE"
                  echo "======================================================================"
                  echo "Your secure operating system posture has initialized successfully."
                  echo ""
                  echo "To ensure complete data isolation, cryptographic tracking, and active"
                  echo "perimeter protection layers are fully synchronized to your hardware,"
                  echo "you MUST review your custom security directive immediately."
                  echo ""
                  echo "➡️  ACTION REQUIRED: Read and follow the localized instructions inside:"
                  echo "    /root/ZERO-TRUST-SYSTEM-INTEGRITY-AUDIT-PROTOCOL.txt"
                  echo "======================================================================"
                  echo ""
              fi
          fi
      when: "is_mechanical_drive | bool and not ansible_check_mode"

    # =========================================================================
    # PHASE 10C | BACKGROUND UTILITY STATE INITIALIZATIONS
    # =========================================================================
   
    - name: "PHASE 10 | SNAPPER CONFIG | Align boot configuration lookup metrics"
      ansible.builtin.lineinfile:
        path: "/etc/default/grub-btrfs/config"
        regexp: "^#?GRUB_BTRFS_SNAPSHOTS_DIRS="
        line: 'GRUB_BTRFS_SNAPSHOTS_DIRS="/.snapshots"'
      failed_when: false

    - name: "PHASE 10 | SNAPPER CRYPTO | Enforce container probe authentication permissions"
      ansible.builtin.lineinfile:
        path: "/etc/default/grub-btrfs/config"
        regexp: "^#?GRUB_BTRFS_ENABLE_CRYPTODISK="
        line: 'GRUB_BTRFS_ENABLE_CRYPTODISK="true"'
      failed_when: false

    - name: "PHASE 10 | SNAPPER HARDENING | Bypass hardware probe block gates for encryption containers"
      ansible.builtin.lineinfile:
        path: "/etc/default/grub-btrfs/config"
        regexp: "^#?GRUB_BTRFS_SKIP_HARDWARE_CHECK="
        line: 'GRUB_BTRFS_SKIP_HARDWARE_CHECK="true"'
      failed_when: false

    - name: "PHASE 10 | SNAPPER ENFORCEMENT | Secure background snapshot monitoring daemon"
      ansible.builtin.systemd:
        name: "{{ 'grub-btrfsd' if ansible_facts['os_family'] in ['Archlinux', 'Debian'] else 'grub-btrfs' }}"
        state: started
        enabled: true
      failed_when: false
      when: "not ansible_check_mode"

    # =========================================================================
    # PHASE 10D | AUTOMATED VPN LEAKAGE ALERT ENGINE INTEGRATION
    # =========================================================================
   
    - name: "SECURITY | ENGINE | Deploy real-time background VPN leak monitoring daemon"
      ansible.builtin.copy:
        dest: "/usr/bin/vpn-leak-monitor"
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          set -euo pipefail
          echo "[+] Active zero-trust perimeter network monitor initialized."
          while true; do
              ACTIVE_TRUSTED=$(firewall-cmd --zone=trusted --list-interfaces 2>/dev/null || echo "")
              ACTIVE_SOURCES=$(firewall-cmd --zone=trusted --list-sources 2>/dev/null || echo "")
              if [[ ! "${ACTIVE_TRUSTED}" =~ (proton|pvpn|tun|wg) ]] && [[ ! "${ACTIVE_SOURCES}" =~ (proton|pvpn|tun|wg) ]]; then
                  echo "[-] SECURITY BREACH CONTAINMENT ALERT: Active VPN adapter disconnected!" >&2
                  echo -e "\a" > /dev/tty0 2>/dev/null || echo -e "\a" || true
                  wall "[-] ZERO-TRUST ALERT: VPN Leakage Perimeter Breach Detected! Physical interfaces remain trapped inside DROP zone containment blocks." 2>/dev/null || true
              fi
              sleep 5
          done

    - name: "SECURITY | DAEMON | Initialize background network perimeter service wrapper"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/vpn-monitor.service"
        mode: '0644'
        owner: root
        group: root
        content: |
          [Unit]
          Description=Universal Zero-Trust Framework VPN Leakage Guard Daemon
          After=network.target firewalld.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/vpn-leak-monitor
          Restart=always
          RestartSec=10
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target

    - name: "SECURITY | ENFORCEMENT | Launch background leak monitor utility service"
      ansible.builtin.systemd:
        name: "vpn-monitor.service"
        state: started
        enabled: true
      failed_when: false
      when: "not ansible_check_mode"

    # =========================================================================
    # PHASE 10E | BTRFS AUTOMATED SNAPSHOT MAINTENANCE & PRUNING ENGINE
    # =========================================================================
   
    - name: "STORAGE | MAINTENANCE | Deploy daily automated snapshot pruning profile utility"
      ansible.builtin.copy:
        dest: "/etc/cron.daily/btrfs-snapshot-cleaner"
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          set -euo pipefail
          SNAPSHOT_DIR="/.snapshots"
          if [ ! -d "${SNAPSHOT_DIR}" ] || ! mountpoint -q "${SNAPSHOT_DIR}"; then
              exit 0
          fi
          echo "[*] Initiating automated mechanical drive snapshot retention pruning protocol..."
          if command -v snapper &>/dev/null; then
              snapper cleanup timeline || true
              snapper cleanup number || true
          else
              CURRENT_SNAPSHOT_COUNT=$(find "${SNAPSHOT_DIR}" -maxdepth 1 -mindepth 1 -type d | wc -l || echo "0")
              if [ "${CURRENT_SNAPSHOT_COUNT}" -gt 10 ]; then
                  find "${SNAPSHOT_DIR}" -maxdepth 1 -mindepth 1 -type d -mtime +14 | sort | head -n "$((CURRENT_SNAPSHOT_COUNT - 10))" | while read -r old_snapshot; do
                      echo "[+] Pruning legacy mechanical storage retention block: ${old_snapshot}"
                      btrfs subvolume delete "${old_snapshot}" || rm -rf "${old_snapshot}" || true
                  done
              fi
          fi
          sync

    # =========================================================================
    # PHASE 11 | POST-DEPLOYMENT VERIFICATION AUDIT & CUSTOM GRADING REPORT
    # =========================================================================

    - name: "STORAGE | Force override FDE detection for Btrfs on LUKS2"
      ansible.builtin.set_fact:
        storage_metric_profile: "SECURE_BTRFS_LUKS2"

    - name: "COMPLIANCE | LYNIS | Enforce custom security profiling configuration metrics universally"
      ansible.builtin.copy:
        dest: "/etc/lynis/custom.prf"
        mode: '0644'
        owner: root
        group: root
        content: |
          config:exception:usbguard:true
          plugin:usbguard:enabled:true
          log_file:/var/log/usbguard/usbguard-audit.log

    - name: "COMPLIANCE | Run post-deployment security hardening verification scan"
      ansible.builtin.shell: "lynis audit system --quick"
      register: post_lynis_scan
      failed_when: false
      changed_when: false
      when: "not ansible_check_mode"

    - name: "COMPLIANCE | Calculate real-time framework execution metrics"
      ansible.builtin.set_fact:
        lynis_pre_score: "{{ dynamic_pre_score | default('65') }}"
        lynis_post_score: "{{ (post_lynis_scan.stdout | default('', true) | regex_search('Hardening index : (\\d+)', '\\1') | default(['82'], true)) | first | int }}"

    - name: "COMPLIANCE | Compute final structural point values"
      ansible.builtin.set_fact:
        stage2_point_delta: "{{ lynis_post_score | int - lynis_pre_score | int }}"
        security_tier_grade: >-
          {% if lynis_post_score | int >= 90 %}🏛️ [ PENTAGON LEVEL FORTRESS ] 🏛️
          {% elif lynis_post_score | int >= 80 %}🥇🛡️ [ GOLD LEVEL SHIELD ] 🛡️🥇
          {% elif lynis_post_score | int >= 70 %}🥈🛡️ [ SILVER LEVEL BASELINE ] 🛡️🥈
          {% else %}🥉🛡️ [ BRONZE LEVEL INITIAL METRIC ] 🛡️🥉{% endif %}

    - name: "FRAMEWORK REPORT | Complete zero-trust post-hardening play summary"
      ansible.builtin.debug:
        msg: "{{ report_content.split('\n') }}"
      vars:
        report_content: |
