        - "ansible_facts['os_family'] == 'Debian'"
        - "not ansible_check_mode"

    - name: "PAM | HARDENING | Trigger native pam-auth-update mechanisms on Debian platforms"
      ansible.builtin.command: pam-auth-update --package --force
      changed_when: true
      when:
        - "ansible_facts['os_family'] == 'Debian'"
        - "not ansible_check_mode"

# =============================================================================
# BLOCK 77: OPENSUSE NATIVE AUTHENTICATION ENFORCEMENTS
# DESCRIPTION: Dynamically invokes system pam-config tooling arrays
#              to append security attributes natively on active openSUSE systems.
# =============================================================================
    - name: "PAM | HARDENING | Implement native pam-config parameters dynamically on openSUSE"
      ansible.builtin.command: "pam-config --add --faillock"
      register: pam_suse_res
      changed_when: true
      failed_when: false
      when:
        - "ansible_facts['os_family'] == 'Suse'"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 78: AUDITD PARENT DIRECTORY PROVISIONING
# DESCRIPTION: Ensures that absolute path matrices exist across target nodes
#              and standardizes logging file and rotation metadata parameters.
# =============================================================================
    - name: "AUDITD | ENFORCE PARENT PATHS | Ensure rule directories exist for Debian architectures"
      ansible.builtin.file:
        path: "/etc/audit/rules.d"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"

    - name: "AUDITD | Enforce optimized local data management rotations parameters"
      ansible.builtin.lineinfile:
        path: "/etc/audit/auditd.conf"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: "present"
      loop:
        - { regexp: "^max_log_file\\s+=", line: "max_log_file = 50" }
        - { regexp: "^max_log_file_action\\s+=", line: "max_log_file_action = ROTATE" }
        - { regexp: "^space_left_action\\s+=", line: "space_left_action = SYSLOG" }
        - { regexp: "^admin_space_left_action\\s+=", line: "admin_space_left_action = SUSPEND" }
      when: "not ansible_check_mode"

# =============================================================================
# BLOCK 79: KERNEL EXECUTIONS MONITORS & AUDITD POLICY PURGES
# DESCRIPTION: Sanitizes preexisting fallback auditing parameters on disk
#              and deploys an immutable, multi-layered tracking schema.
# =============================================================================
    - name: "AUDITD | Clean conflicting pre-existing default tracking blueprints"
      ansible.builtin.file:
        path: "/etc/audit/rules.d/audit.rules"
        state: "absent"
      when: "not ansible_check_mode"

    - name: "AUDITD | Deploy un-falsifiable zero-trust kernel logging rules matrix"
      ansible.builtin.copy:
        dest: "/etc/audit/rules.d/audit.rules"
        content: |
          -D
          -b 8192
          -f 2
          -w /etc/group -p wa -k security_credentials
          -w /etc/passwd -p wa -k security_credentials
          -w /etc/shadow -p wa -k security_credentials
          -w /etc/sudoers -p wa -k security_privileges
          -w /etc/sudoers.d/ -p wa -k security_privileges
          -w /etc/fstab -p wa -k filesystem_ledgers
          -w /etc/crypttab -p wa -k filesystem_ledgers
          -a always,exit -F arch=b64 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k privilege_escalation
          -a always,exit -F arch=b32 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k privilege_escalation
          -a always,exit -F arch=b64 -S execve -F auid>=1000 -F auid!=4294967295 -k process_execution
          -a always,exit -F arch=b32 -S execve -F auid>=1000 -F auid!=4294967295 -k process_execution
          -w /etc/usbguard/rules.conf -p wa -k peripheral_security
          -w /etc/aide.conf -p wa -k integrity_monitoring
          -w /etc/aide/aide.conf -p wa -k integrity_monitoring
          -e 2
        owner: "root"
        group: "root"
        mode: "0600"
      register: auditd_rules_state
      when: "not ansible_check_mode"

# =============================================================================
# BLOCK 80: SYSTEM SERVICE FAIL2BAN PERIMETER SHIELDING (PART 1)
# DESCRIPTION: Provisions multi-platform packages and configures defensive SSH
#              jails tailored directly to hardware profile constraints.
# =============================================================================
    - name: "PERIMETER HARDENING | FAIL2BAN | Dynamic Multi-Distro Provisioning Loop"
      ansible.builtin.package:
        name: "{{ distro_matrix[ansible_facts['os_family']]['fail2ban_pkg'] | default('fail2ban') }}"
        state: present
      when:
        - "fail2ban_installed | bool"
        - "not ansible_check_mode"

    - name: "PERIMETER HARDENING | FAIL2BAN | Generate adaptive hardware-proportionate jail configurations"
      ansible.builtin.copy:
        dest: "/etc/fail2ban/jail.local"
        owner: root
        group: root
        mode: '0644'
        content: |
          # =================================================================
          # AUTOMATED ZERO-TRUST HARDWARE-AWARE NETWORK JAIL DEFENSE PRESETS
          # CUSTOM SYSTEM ARCHITECTURE GENERATED DYNAMICALLY
          # =================================================================
          [DEFAULT]
          ignoreip = 127.0.0.1/8 ::1
          bantime  = 3600
          maxretry = 3

          {% if is_mechanical_drive | bool or (system_ram_gb | int) <= 4 %}
          # MECHANICAL HDD / LOW-RAM TUNING PROFILE MATRIX (TIER 1 & 2 CLAMPS)
          backend     = systemd
          findtime    = 600
          dbpurgeage  = 86400
          {% else %}
          # FLASH CELL SSD / ENTERPRISE MEMORY PERFORMANCE MATRIX (TIER 3 & 4 SPECS)
          backend     = auto
          findtime    = 3600
          dbpurgeage  = 604800
          {% endif %}

          banaction   = firewallcmd-new
          banaction_allports = firewallcmd-new

          [sshd]
          enabled  = true
          port     = ssh
          logpath  = %(sshd_log)s
          interface = {{ primary_network_interface | default('wls1') | trim }}
      register: fail2ban_jail_configuration_state
      when:
        - "fail2ban_installed | bool"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 81: SYSTEM SERVICE FAIL2BAN PERIMETER SHIELDING (PART 2)
# DESCRIPTION: Establishes database retention windows and maps runtime persistence.
# =============================================================================
    - name: "PERIMETER HARDENING | FAIL2BAN | Ensure database parent path exists"
      ansible.builtin.file:
        path: "/var/lib/fail2ban"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when:
        - "fail2ban_installed | bool"
        - "not ansible_check_mode"

    - name: "PERIMETER HARDENING | FAIL2BAN | Inject adaptive database purging thresholds"
      ansible.builtin.copy:
        dest: "/etc/fail2ban/fail2ban.local"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Definition]
          {% if is_mechanical_drive | bool or (system_ram_gb | int) <= 4 %}
          # HDD OPTIMIZED: Compact logging parameters to minimize platter seeks
          loglevel = INFO
          dbpurgeage = 86400
          {% else %}
          # SSD ENGINE: Deep audit logging window standard
          loglevel = INFO
          dbpurgeage = 604800
          {% endif %}
      register: fail2ban_core_configuration_state
      when:
        - "fail2ban_installed | bool"
        - "not ansible_check_mode"

    - name: "PERIMETER HARDENING | FAIL2BAN | Synchronize multi-platform running state"
      ansible.builtin.systemd:
        name: "fail2ban.service"
        state: "{{ 'restarted' if (fail2ban_jail_configuration_state.changed or fail2ban_core_configuration_state.changed) else 'started' }}"
        enabled: true
        masked: false
      when:
        - "fail2ban_installed | bool"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 82: ZONE ROUTING AND TUNNEL PERIMETER OVERRIDES
# DESCRIPTION: Maps virtual interfaces inside firewalld trusted anchors and
#              deploys robust network environment killswitch profiles.
# =============================================================================
    - name: "FIREWALLD | Deploy global runtime persistence environment script hooks"
      ansible.builtin.copy:
        dest: "/etc/profile.d/firewall-killswitches.sh"
        owner: "root"
        group: "root"
        mode: "0644"
        content: |
          #!/usr/bin/env bash
          # Captive portal profiles management via NetworkManager profiles
          portaloff() {
              touch /run/portal_bypass_active
              for conn in $(nmcli -g NAME,DEVICE connection show | grep "{{ primary_network_interface | default('wls1') | trim }}" | cut -d: -f1); do
                  sudo nmcli connection modify "$conn" connection.zone public
                  sudo nmcli connection up "$conn"
              done
              echo "[+] Dual killswitch lowered. Interface moved to public zone for authentication."
          }

          portalon() {
              rm -f /run/portal_bypass_active
              for conn in $(nmcli -g NAME,DEVICE connection show | grep "{{ primary_network_interface | default('wls1') | trim }}" | cut -d: -f1); do
                  sudo nmcli connection modify "$conn" connection.zone drop
                  sudo nmcli connection up "$conn"
              done
              echo "[✓] Dual killswitch locked. Interface isolated inside drop zone."
          }
      become: true
# =============================================================================
# BLOCK 83: SNAPPER RECOVERY POSTURE TIMELINES
# DESCRIPTION: Drops custom automated snapshot tracking service units
#              and locks structural checkpoint timetables on local block levels.
# =============================================================================
    - name: "SNAPPER | Drop custom automated snapshot tracking service units"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - { name: "snapper-posthardening.service", content: "[Unit]\nDescription=Automated Post-Hardening Posture Timeline Snapshot\nAfter=local-fs.target\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/snapper -c root create --type timeline --description \"Automated Security Hardening Checkpoint\"" }
        - { name: "snapper-posthardening.timer", content: "[Unit]\nDescription=Trigger Snapper Timeline Snapshot At Explicit Security Windows\n\n[Timer]\nOnCalendar=*-*-* 00,06,12,18:00:00\nPersistent=true\n\n[Install]\nWantedBy=timers.target" }
      notify: "Reload Active Systemd Core"
# =============================================================================
# BLOCK 85: SECURITY LIFECYCLE RECOVERY & RESET PARAMETERS
# DESCRIPTION: Headlessly flushes failure records across local monitor daemons,
#              and cleans lock stacks on fail2ban storage interfaces.
# =============================================================================
    - name: "SECURITY SERVICES | RECOVERY | Flush systemd service failure caches"
      ansible.builtin.shell: |
        systemctl reset-failed usbguard.service || true
        systemctl reset-failed snort@{{ primary_network_interface | default('wls1') | trim }}.service || true
        systemctl reset-failed clamd.service || true
        systemctl reset-failed earlyoom.service || true
      args:
        executable: /bin/bash
      failed_when: false
      become: true
      when: "not ansible_check_mode"

    - name: "SECURITY SERVICES | FAIL2BAN | Flush stale tracking sockets to prevent timeout hangs"
      ansible.builtin.shell: |
        set -o pipefail
        systemctl stop fail2ban || true
        killall -9 fail2ban-server || true
        rm -f /var/run/fail2ban/fail2ban.sock
      args:
        executable: /bin/bash
      failed_when: false
      changed_when: false
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 86: DAEMON SYSTEMD RESET CONTROL STRATUMS
# DESCRIPTION: Clears transient unit lock profiles headlessly and registers core system re-scans.
# =============================================================================
    - name: "SECURITY SERVICES | SYSTEMD | Force clear persistent service failure blocks headlessly"
      ansible.builtin.command: "systemctl reset-failed usbguard.service"
      failed_when: false
      changed_when: false
      become: true
      when: "not ansible_check_mode"

    - name: "SECURITY SERVICES | SYSTEMD | Force systemd unit inventory re-scan on disk"
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 87: PERSISTENT DEFENSE UTILITIES LIFECYCLE CONTROLS (DYNAMIC CORES)
# DESCRIPTION: Evaluates host hardware structures to enable core system daemons
#              while safely routing short-lived oneshot tasks through timer loops.
# =============================================================================
    - name: "SECURITY SERVICES | BOOT | Universally manage baseline defense utilities state"
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        masked: false
        state: >-
          {%- if is_mechanical_drive | bool and (item == 'aide-check.timer' or item == 'tripwire-check.timer') -%}
            stopped
          {%- else -%}
            started
          {%- endif -%}
      loop: >-
        {%- set hw_interface = primary_network_interface | default('wls1') | trim -%}
        {%- set base_services = [
          'firewalld.service',
          'fail2ban.service',
          'usbguard.service',
          'auditd.service',
          'earlyoom.service',
          'vpn-leak-protection.service',
          'aide-check.timer',
          'tripwire-check.timer'
        ] -%}
        {%- if ansible_facts['os_family'] == 'Archlinux' -%}
          {{ base_services + [
              'sysstat.timer',
              'arpwatch@' ~ hw_interface ~ '.service',
              'snort@' ~ hw_interface ~ '.service'
             ] }}
        {%- elif ansible_facts['os_family'] == 'Debian' -%}
          {{ base_services + ['sysstat.service', 'arpwatch@' ~ hw_interface ~ '.service', 'snort-init.service'] }}
        {%- else -%}
          {{ base_services + ['sysstat.service', 'arpwatch.service', distro_matrix[ansible_facts['os_family']]['snort_service_name'] | default('snort.service')] }}
        {%- endif -%}
      failed_when: false
      ignore_errors: true
      become: true
      when: "not ansible_check_mode"

# =============================================================================
