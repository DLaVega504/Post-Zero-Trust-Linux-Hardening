# =============================================================================
# BLOCK 1: INITIAL PLAY METADATA & VARIABLES (PART 1)
# DESCRIPTION: Establishes playbook destination, disables auto-facts, and locks infrastructure variables.
# =============================================================================
---
- name: "Universal Stand-Alone Zero-Trust Linux Hardening Framework (Stage 2 Core)"
  hosts: localhost
  connection: local
  become: true  
  gather_facts: false 
  vars:
    perf_mount_opts: "noatime,space_cache=v2,compress=zstd:1"
    security_architecture_profile: "pentagon"
    secure_vault_enabled: true
    vault_partition_handle: "/dev/sda2"
    vault_mount_target: "/vault"
    vault_enforce_multi_tenant: true
    vault_allocation_percentage: 20
    vault_maximum_guest_members: 3
    vault_minimum_size_threshold_gb: 15
    fail2ban_installed: true
    rkhunter_installed: false
    usbguard_installed: true
    arpwatch_installed: true
    snort_installed: true
    clamav_installed: true
    firewalld_native: true

    # =========================================================================
    # THE MASTER SYSTEM COMPLIANCE PROFILE DICTIONARY MATRIX
    # UNIFIED HARDWARE-COGNITIVE RESOURCE MANAGEMENT PRESETS
    # =========================================================================
    hardware_profile_matrix:
      tier_1:
        swappiness: 150
        cpu_quota: 10
        mem_high: "1.0G"
        mem_max: "1.2G"
        max_threads: 2
        max_queue: 30
        max_scan_size: "50M"
        max_file_size: "25M"
        max_recursion: 10
        max_files: 3000
        stream_max_length: "25M"
      tier_2:
        swappiness: 100
        cpu_quota: 15
        mem_high: "1.2G"
        mem_max: "1.5G"
        max_threads: 4
        max_queue: 50
        max_scan_size: "200M"
        max_file_size: "50M"
        max_recursion: 15
        max_files: 10000
        stream_max_length: "50M"
      tier_3:
        swappiness: 100
        cpu_quota: 20
        mem_high: "1.5G"
        mem_max: "2.0G"
        max_threads: 8
        max_queue: 100
        max_scan_size: "750M"
        max_file_size: "250M"
        max_recursion: 30
        max_files: 20000
        stream_max_length: "750M"
      tier_4:
        swappiness: 10
        cpu_quota: 25
        mem_high: "2.0G"
        mem_max: "3.0G"
        max_threads: 16
        max_queue: 250
        max_scan_size: "1500M"
        max_file_size: "500M"
        max_recursion: 40
        max_files: 50000
        stream_max_length: "1500M"
# =============================================================================
# BLOCK 2: HARDENING MATRICES & GRADE TEMPLATES (VARIABLES PART 2)
# DESCRIPTION: Defines drive performance blueprints, package strings, and the Lynis compliance grading structure.
# =============================================================================
    hdd_matrix_blueprint:
      "150": { bg_ratio: 3,  ratio: 10, scale: 125, pressure: 50,  bytes_mode: true,  bg_bytes: 67108864,  dirty_bytes: 268435456 }
      "100": { bg_ratio: 5,  ratio: 15, scale: 100, pressure: 60,  bytes_mode: false, bg_bytes: 0,         dirty_bytes: 0         }
      "10":  { bg_ratio: 10, ratio: 25, scale: 20,  pressure: 40,  bytes_mode: false, bg_bytes: 0,         dirty_bytes: 0         }

    ssd_matrix_blueprint:
      "150": { bg_ratio: 10, ratio: 20, scale: 10,  pressure: 150 }
      "100": { bg_ratio: 10, ratio: 20, scale: 10,  pressure: 125 }
      "10":  { bg_ratio: 15, ratio: 25, scale: 10,  pressure: 100 }

# =============================================================================
# BLOCK 2B: DISTRO MATRIX STRUCTURE WITH CORE UTILITY ARRAYS
# DESCRIPTION: Maps package strings, admin groups, and core defense packages directly to target platform families.
# =============================================================================

    distro_matrix:
      Archlinux:
        core_packages: ['sysstat', 'arpwatch', 'usbguard', 'clamav', 'aide', 'lynis', 'openssl-1.1', 'earlyoom']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort@{{ primary_network_interface | default('wls1') }}.service"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav'
        aide_pkg: 'aide'
        admin_group: 'wheel'
        grub_compile_cmd: 'grub-mkconfig'
        grub_config_bios: '/boot/grub/grub.cfg'
      Debian:
        core_packages: ['fail2ban', 'sysstat', 'arpwatch', 'usbguard', 'clamav-daemon', 'aide', 'lynis', 'earlyoom']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort-init.service"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav-daemon'
        aide_pkg: 'aide'
        admin_group: 'sudo'
        grub_compile_cmd: 'update-grub'
        grub_config_bios: '/boot/grub/grub.cfg'
      RedHat:
        core_packages: ['fail2ban', 'sysstat', 'arpwatch', 'usbguard', 'clamav', 'aide', 'lynis', 'earlyoom']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort3@{{ primary_network_interface | default('wls1') }}.service"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav'
        aide_pkg: 'aide'
        admin_group: 'wheel'
        grub_compile_cmd: 'grub2-mkconfig'
        grub_config_bios: '/boot/grub2/grub.cfg'
      Suse:
        core_packages: ['fail2ban', 'sysstat', 'arpwatch', 'usbguard', 'clamav', 'aide', 'lynis', 'libdaq', 'earlyoom']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort.service"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav'
        aide_pkg: 'aide'
        admin_group: 'wheel'
        grub_compile_cmd: 'grub2-mkconfig'
        grub_config_bios: '/boot/grub2/grub.cfg'


# =============================================================================
# BLOCK 3: STAGE 1 FOUNDATION CERTIFICATE CHECK
# DESCRIPTION: Interrogates target node filesystems to detect an official prior Stage 1 core certification tag and sets initial fact ledgers.
# =============================================================================
  tasks:
    - name: "PRE-FLIGHT | STATE | Initialize system modification accumulator track"
      ansible.builtin.set_fact:
        system_was_modified: false

    - name: "PRE-FLIGHT | PROBE | Interrogate system for active Stage 1 Foundation Certificate"
      ansible.builtin.stat:
        path: "/etc/zero-trust-baseline.json"
      register: pre_flight_stage1_cert_check
      check_mode: false


# =============================================================================
# BLOCK 4: DYNAMIC DEPENDENCIES & NETADDR BOOTSTRAPPING
# DESCRIPTION: Installs foundational package environments, core dependencies, and netaddr system-wide via low-level hooks.
# =============================================================================

    - name: "PRE-FLIGHT | Automatically provision runtime dependencies, netaddr, and collections on target host"
      ansible.builtin.raw: |
        if command -v ansible >/dev/null 2>&1 && \
           { command -v gdisk >/dev/null 2>&1 || command -v sgdisk >/dev/null 2>&1; } && \
           python3 -c "import netaddr" >/dev/null 2>&1 && \
           ansible-galaxy collection list 2>/dev/null | grep -q 'ansible.posix'; then
          echo "[+] SYSTEM VERIFICATION SUCCESSFUL: Pre-requisites and netaddr fully satisfied. Skipping package manager loops."
          exit 0
        fi

        if command -v pacman >/dev/null 2>&1; then
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed python python-pip python-netaddr gptfdisk ansible
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -y
          apt-get install -y python3 python3-pip python3-netaddr gdisk ansible
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3 python3-pip python3-netaddr gdisk ansible --nogpgcheck
        elif command -v zypper >/dev/null 2>&1; then
          zypper --non-interactive install python3 python3-pip python3-netaddr gptfdisk ansible
        fi

        if ! python3 -c "import netaddr" >/dev/null 2>&1; then
          pip3 install netaddr --break-system-packages || pip3 install netaddr || true
        fi

        if ! ansible-galaxy collection list 2>/dev/null | grep -q 'ansible.posix'; then
          ansible-galaxy collection install ansible.posix --force-with-deps || true
        fi
      changed_when: false
      failed_when: false

# =============================================================================
# BLOCK 5: SAFE ENVIRONMENTAL SETUP REFRESH
# DESCRIPTION: Triggers a clean native Ansible fact discovery pass now that system packaging constraints and python libraries are verified.
# =============================================================================

    - name: "PRE-FLIGHT | Safely initialize system environment fact discovery loops"
      ansible.builtin.setup:
      become: false

# =============================================================================
# BLOCK 6: BLACKARCH SUBSYSTEM SYNCHRONIZATION (ARCH ONLY)
# DESCRIPTION: Downloads, cryptographically authorizes, and synchronizes secure BlackArch compliance repositories on matching hosts.
# =============================================================================

    - name: "PRE-FLIGHT | ARCH | Bootstrapping BlackArch Cryptographic Mirror Substrates"
      ansible.builtin.shell: |
        set -euo pipefail
        if ! grep -q '\[blackarch\]' /etc/pacman.conf; then
          cd /tmp
          curl -O https://blackarch.org
          chmod +x strap.sh
          ./strap.sh
          rm -f strap.sh
          pacman -Syy --noconfirm
        fi
      args:
        executable: /bin/bash
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 7: PARU PACKAGE MANAGER WRAPPER AUDIT (ARCH ONLY)
# DESCRIPTION: Investigates active file execution targets to detect the working existence of the Paru AUR compilation wrapper.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Check if Paru binary is present on host execution paths"
      ansible.builtin.command: "which paru"
      register: local_paru_binary_probe
      failed_when: false
      changed_when: false
      when: "ansible_facts['os_family'] == 'Archlinux'"
# =============================================================================
# BLOCK 8: DEVELOPMENT COMPILATION TOOL INJECTIONS (ARCH ONLY)
# DESCRIPTION: Enforces deployment of base system compilers and Git hooks needed to build userland forensic software from secure source.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Inject development toolsets required for compilation"
      community.general.pacman:
        name:
          - base-devel
          - git
        state: present
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "local_paru_binary_probe.rc | default(1) != 0"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 9: PRIVILEGED AUR WRAPPER SOURCE COMPILATION (ARCH ONLY)
# DESCRIPTION: Restricts operational privileges to compile and drop the Paru engine binary strictly under the native user layout context.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Build and install Paru wrapper package under native user context"
      ansible.builtin.shell: |
        set -euo pipefail
        cd /tmp
        rm -rf paru-bin
        git clone https://archlinux.org
        cd paru-bin
        makepkg -si --noconfirm
        cd /tmp
        rm -rf paru-bin
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ discovered_primary_user | default('vega') }}"
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "local_paru_binary_probe.rc | default(1) != 0"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 10: INFRASTRUCTURE SECURITY & ENCRYPTION SCANS
# DESCRIPTION: Queries GRUB locations for active passwords, extracts root mapping configurations, and checks for cached Lynis metrics.
# =============================================================================
    - name: "PRE-FLIGHT | BOOT | Interrogate active system for existing bootloader password configurations"
      ansible.builtin.shell: |
        set -o pipefail
        grep -qs 'password_pbkdf2' /etc/grub.d/* /etc/default/grub /boot/grub/grub.cfg /boot/grub2/grub.cfg /boot/efi/EFI/*/grub.cfg && echo "PASSWORD_SET" || echo "PASSWORD_MISSING"
      register: pre_flight_grub_password_check
      failed_when: false
      changed_when: false
      check_mode: false
      become: true

    - name: "SCAN | INTERROGATION | Query true device mapping layer type for active root partition"
      ansible.builtin.shell: |
        set -o pipefail
        ROOT_BLOCK=$(findmnt -n -o SOURCE /)
        lsblk -no TYPE "$ROOT_BLOCK" | head -n 1 | tr -d '[:space:]'
      args:
        executable: /bin/bash
      register: live_root_block_type_probe
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | INSPECTION | Interrogate system block tree for any active device mapper maps"
      ansible.builtin.stat:
        path: "/dev/mapper/root"
      register: live_root_mapper_device_check
      check_mode: false

    - name: "PRE-FLIGHT | AUDIT | Check disk for local cached Lynis metrics"
      ansible.builtin.stat:
        path: "/var/cache/lynis/pre_score.metric"
      register: pre_flight_lynis_cache_check
      check_mode: false

    - name: "PRE-FLIGHT | AUDIT | Parse existing Lynis metric into runtime memory if cache hit"
      ansible.builtin.slurp:
        src: "/var/cache/lynis/pre_score.metric"
      register: raw_cached_lynis_score
      when: "pre_flight_lynis_cache_check.stat.exists | bool"

    - name: "PRE-FLIGHT | AUDIT | Check disk for local cached final post-hardening metrics"
      ansible.builtin.stat:
        path: "/var/cache/lynis/post_score.metric"
      register: post_flight_lynis_cache_check
      check_mode: false

    - name: "PRE-FLIGHT | AUDIT | Parse existing post-hardening metric into runtime memory if cache hit"
      ansible.builtin.slurp:
        src: "/var/cache/lynis/post_score.metric"
      register: raw_cached_lynis_post_score
      when: "post_flight_lynis_cache_check.stat.exists | bool"
# =============================================================================
# BLOCK 11: COMPLIANCE STATE ATTRIBUTE SYNTHESIS
# DESCRIPTION: Consolidates root disk encryption properties, boot metrics, cache variables, and target compliance paths straight into task tracking memory.
# =============================================================================
    - name: "PRE-FLIGHT | STATE | Synthesize and lock baseline architectural facts"
      ansible.builtin.set_fact:
        stage1_foundation_active: "{{ pre_flight_stage1_cert_check.stat.exists | bool }}"
        boot_password_is_protected: "{{ true if 'PASSWORD_SET' in pre_flight_grub_password_check.stdout else false }}"
        root_disk_is_encrypted: "{{ true if (live_root_block_type_probe.stdout | trim == 'crypt' or live_root_mapper_device_check.stat.exists | bool) else false }}"
        lynis_cache_available: "{{ pre_flight_lynis_cache_check.stat.exists | bool }}"
        dynamic_pre_score: "{{ (raw_cached_lynis_score.content | b64decode | trim | int) if pre_flight_lynis_cache_check.stat.exists | bool else None }}"
        dynamic_post_score_cached: "{{ (raw_cached_lynis_post_score.content | b64decode | trim | int) if post_flight_lynis_cache_check.stat.exists | bool else None }}"

    - name: "PRE-FLIGHT | STATE | Calculate state-machine compliance mode tracks"
      ansible.builtin.set_fact:
        compliance_track_level_3: "{{ stage1_foundation_active | bool }}"
        compliance_retrospective_level_1: "{{ not stage1_foundation_active | bool and boot_password_is_protected | bool and root_disk_is_encrypted | bool }}"
        failsafe_runtime_only_mode: "{{ not stage1_foundation_active | bool and not root_disk_is_encrypted | bool }}"
        stackable_mode: "{{ stage1_foundation_active | bool }}"
        autonomous_standalone_mode: "{{ not stage1_foundation_active | bool }}"
# =============================================================================
# BLOCK 12: BASELINE COMPLIANCE VULNERABILITY AUDITING
# DESCRIPTION: Evaluates target system vulnerability metrics on local cache misses and records configurations to cache storage.
# =============================================================================
    - name: "COMPLIANCE | RECONNAISSANCE | Initialize system audit metrics on local cache miss"
      ansible.builtin.shell: "lynis audit system --quick --cronjob"
      args:
        executable: /bin/bash
      register: live_lynis_baseline_scan
      failed_when: false
      changed_when: false
      when:
        - "not ansible_check_mode"
        - "pre_flight_lynis_cache_check.stat.exists == false"

    - name: "COMPLIANCE | PARSING | Extract baseline hardening metrics from raw output streams"
      ansible.builtin.set_fact:
        dynamic_pre_score: "{{ (live_lynis_baseline_scan.stdout | default('', true) | regex_search('Hardening index : (\\d+)', '\\1') | default(['65'], true)) | first | int }}"
      when:
        - "not ansible_check_mode"
        - "pre_flight_lynis_cache_check.stat.exists == false"

    - name: "COMPLIANCE | PROVISIONING | Establish local repository bounds for framework cache storage"
      ansible.builtin.file:
        path: "/var/cache/lynis"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when:
        - "not ansible_check_mode"
        - "pre_flight_lynis_cache_check.stat.exists == false"

    - name: "COMPLIANCE | STORAGE | Commit parsed verification parameters permanently to local block"
      ansible.builtin.copy:
        dest: "/var/cache/lynis/pre_score.metric"
        content: "{{ dynamic_pre_score | string }}"
        owner: root
        group: root
        mode: '0600'
      when:
        - "not ansible_check_mode"
        - "pre_flight_lynis_cache_check.stat.exists == false"

    - name: "COMPLIANCE | NOTIFY | Render calculated endpoint security baseline validation metrics"
      ansible.builtin.debug:
        msg: >-
          📊 [ FRAMEWORK AUDIT PROTOCOL ]:
          Initial Hardening Grade resolved at [ {{ dynamic_pre_score }} points ].
          Source: {{ 'LOCAL DISK PERFORMANCE CACHE' if pre_flight_lynis_cache_check.stat.exists == true else 'LIVE SYSTEM COGNITIVE PROBE' }}
# =============================================================================
# BLOCK 13: BOOTLOADER PROTECTION PASS-GATES
# DESCRIPTION: Pauses framework execution to securely query and register a master encryption key on unprotected standalone nodes.
# =============================================================================
    - name: "BOOT | SECURITY GATE | Securely prompt for master passphrase on unprotected standalone nodes"
      ansible.builtin.pause:
        prompt: |
          ======================================================================
          [ 🔒 ZERO-TRUST AUTONOMOUS INITIALIZATION PASS-GATE ]
          ======================================================================
          Stage 1 base-layer certificate was not detected on this system.
          The bootloader is currently wide open and unprotected.

          [?] Enter a master security passphrase to cryptographically lock down 
              the GRUB bootloader matrix parameters:
          ======================================================================
        echo: false
      register: front_loaded_standalone_passphrase
      when:
        - "autonomous_standalone_mode | bool"
        - "not boot_password_is_protected | bool"
# =============================================================================
# BLOCK 14: CRYPTOGRAPHIC PBKDF2 PASSWORD GENERATION
# DESCRIPTION: Compiles the registered raw credential properties non-interactively into a safe PBKDF2 hash payload.
# =============================================================================
    - name: "BOOT Hardening | AUTOMATION ENGINE | Non-interactively compile cryptographic PBKDF2 hash payload"
      ansible.builtin.shell: |
        echo -e "{{ front_loaded_standalone_passphrase.user_input }}\n{{ front_loaded_standalone_passphrase.user_input }}" | grub-mkpasswd-pbkdf2 | grep -o "grub.pbkdf2.*"
      register: calculated_standalone_grub_hash
      no_log: true
      when:
        - "autonomous_standalone_mode | bool"
        - "not boot_password_is_protected | bool"
        - "front_loaded_standalone_passphrase.user_input is defined"
        - "front_loaded_standalone_passphrase.user_input | length > 0"
# =============================================================================
# BLOCK 15: BOOT CONFIGURATION HARDENING INJECTIONS
# DESCRIPTION: Commits the generated cryptographic hash payload securely into custom system boot customizers to lock runtime edits.
# =============================================================================
    - name: "BOOT HARDENING | INJECTION | Commit secure master credentials into user customized parameters"
      ansible.builtin.blockinfile:
        path: "/etc/grub.d/40_custom"
        marker: "# {mark} ANSIBLE AUTONOMOUS BOOTLOADER PASSWORD BLOCK"
        block: |
          set superusers="root"
          password_pbkdf2 root {{ calculated_standalone_grub_hash.stdout }}
      when:
        - "autonomous_standalone_mode | bool"
        - "not boot_password_is_protected | bool"
        - "calculated_standalone_grub_hash.stdout is defined"
        - "calculated_standalone_grub_hash.stdout | length > 0"

# =============================================================================
# BLOCK 16: MULTI-LAYER SYSTEM GEOMETRY PROBES
# DESCRIPTION: Performs advanced probing across hardware links to capture system partition mappings and hardware metadata.
# =============================================================================

    - name: "SCAN | Probe motherboard boot firmware directory existence"
      ansible.builtin.stat:
        path: "/sys/firmware/efi"
      register: efi_directory_check

    - name: "SCAN | Detect active root filesystem source device handle"
      ansible.builtin.shell: |
        set -o pipefail
        findmnt -n -o SOURCE / | awk '{print $1}' | cut -d'[' -f1
      args:
        executable: /bin/bash
      register: root_source_device
      changed_when: false
      check_mode: false

    - name: "SCAN | Detect active boot partition source device handle"
      ansible.builtin.shell: |
        set -o pipefail
        findmnt -n -o SOURCE /boot | awk '{print $1}' | cut -d'[' -f1 || echo 'nested'
      args:
        executable: /bin/bash
      register: boot_source_device
      changed_when: false
      check_mode: false

    - name: "SCAN | Detect active root filesystem type format signature"
      ansible.builtin.shell: |
        findmnt -n -o FSTYPE /
      register: root_fs_signature
      changed_when: false
      check_mode: false

    - name: "SCAN | Discover absolute persistent root device UUID"
      ansible.builtin.shell: "blkid -s UUID -o value {{ root_source_device.stdout | default('/dev/null') }}"
      register: live_root_uuid
      changed_when: false
      check_mode: false


    - name: "SCAN | Read active initramfs hook parameters cleanly"
      ansible.builtin.slurp:
        src: "/etc/mkinitcpio.conf"
      register: raw_mkinitcpio
      failed_when: false
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "SCAN | Detect drive media rotation profiles directly from hardware controller"
      ansible.builtin.shell: |
        set -o pipefail
        REAL_DISK=$(lsblk -no PKNAME "$(findmnt -n -o SOURCE /)" | head -n1 | tr -d '[:space:]' || true)
        if [ -n "$REAL_DISK" ]; then
            cat "/sys/block/${REAL_DISK}/queue/rotational"
        else
            echo "1"
        fi
      args:
        executable: /bin/bash
      register: host_disk_rotation_raw
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | Extract active CIDR address spectrum directly from running hardware interface"
      ansible.builtin.shell: |
        set -o pipefail
        ip -o -f inet addr show {{ primary_network_interface | default('wls1') }} | awk '{print $4}' | head -n1
      args:
        executable: /bin/bash
      register: live_active_cidr_raw
      changed_when: false
      failed_when: false
      check_mode: false

# =============================================================================
# BLOCK 17: RESILIENT LOCAL SUBNET EXTRACTION
# DESCRIPTION: Sanitizes and calculates the active network range boundaries using a fallback-shielded Jinja expression.
# =============================================================================
    - name: "SCAN | STATE | Calculate true local base network subnet boundary block"
      ansible.builtin.set_fact:
        dynamic_home_net: >-
          {%- set raw_ip = live_active_cidr_raw.stdout_lines | default(['']) | first | trim -%}
          {%- if '/' in raw_ip -%}
            {{ raw_ip | ansible.utils.ipsubnet }}
          {%- else -%}
            192.168.1.0/24
          {%- endif -%}
      failed_when: false

# =============================================================================
# BLOCK 18: SYSTEM PROFILE METADATA SYNTHESIS
# DESCRIPTION: Evaluates and locks virtualization settings, user contexts, form factors, and file layout attributes.
# =============================================================================

    - name: "SCAN | Synthesize virtualization and media profiles"
      ansible.builtin.set_fact:
        is_mechanical_drive: "{{ true if (host_disk_rotation_raw.stdout is defined and host_disk_rotation_raw.stdout | trim == '1') else false }}"
        is_virtual_machine: "{{ true if (ansible_facts['virtualization_role'] | default('host') == 'guest') else false }}"

    - name: "SCAN | Discover primary human installation user identity (UID 1000)"
      ansible.builtin.shell: "getent passwd 1000 | cut -d: -f1"
      register: primary_owner_discovered
      changed_when: false
      check_mode: false

    - name: "SCAN | Probe system power rail for lithium-ion battery nodes"
      ansible.builtin.stat:
        path: "/sys/class/power_supply/BAT0"
      register: battery_node_check

    - name: "SCAN | Read raw DMI motherboard hardware chassis type integer"
      ansible.builtin.slurp:
        src: "/sys/class/dmi/id/chassis_type"
      register: raw_dmi_chassis_id
      failed_when: false

    - name: "SCAN | Synthesize translated hardware form-factor profile facts"
      ansible.builtin.set_fact:
        hardware_form_factor: >-
          {%- set chassis_int = (raw_dmi_chassis_id['content'] | b64decode | replace('\n', '') | trim | int) if (raw_dmi_chassis_id.content is defined and raw_dmi_chassis_id.content) else 0 -%}
          {%- if battery_node_check.stat.exists or chassis_int in [8, 9, 10, 14] -%}
          LAPTOP / PORTABLE WORKSTATION
          {%- elif chassis_int in [3, 4, 5, 6, 7, 15, 16] -%}
          DESKTOP / FIXED SECURE STATION
          {%- elif chassis_int in [23, 17, 25] or ansible_facts['processor_vcpus'] | int > 16 -%}
          ENTERPRISE HARDENED SERVER BLADE
          {%- else -%}
          STANDALONE COMPUTING NODE (FORM-FACTOR UNKNOWN)
          {%- endif -%}

    - name: "SCAN | Synthesize primary system hardware and layout facts"
      ansible.builtin.set_fact:
        system_ram_gb: "{{ (ansible_facts['memtotal_mb'] | int / 1024) | round(0, 'common') | int }}"
        oom_engine_selection: "{{ 'earlyoom' if (ansible_facts['memtotal_mb'] | int < 8192) else 'systemd-oomd' }}"
        target_compression: "{{ 'lz4' if (ansible_facts['memtotal_mb'] | int < 8192) else 'zstd' }}"
        target_swappiness: "{{ '150' if (ansible_facts['memtotal_mb'] | int <= 7168) else ('100' if (ansible_facts['memtotal_mb'] | int > 7168 and ansible_facts['memtotal_mb'] | int <= 16384) else '10') }}"
        target_formula_swap_mb: >-
          {{
            4096 if (ansible_facts['chassis_type'] | default('server') | lower not in ['laptop', 'notebook', 'desktop', 'chassis', 'unknown']) else
            (ansible_facts['memtotal_mb'] | int * 2) if (ansible_facts['memtotal_mb'] | int <= 7168) else
            (ansible_facts['memtotal_mb'] | int + 3072) if (ansible_facts['memtotal_mb'] | int > 7168 and ansible_facts['memtotal_mb'] | int <= 16384) else
            4096
          }}
        is_uefi_mode: "{{ efi_directory_check.stat.exists | bool if efi_directory_check.stat is defined else false }}"
        is_btrfs_layout: "{{ true if (root_fs_signature.stdout is defined and 'btrfs' in root_fs_signature.stdout) else false }}"
        active_root_uuid: "{{ live_root_uuid.stdout if live_root_uuid.stdout is defined else '' }}"
        has_systemd_hook: "{{ true if (raw_mkinitcpio.content is defined and raw_mkinitcpio.content and 'systemd' in (raw_mkinitcpio.content | b64decode)) else false }}"
        has_encrypt_hook: "{{ true if (raw_mkinitcpio.content is defined and raw_mkinitcpio.content and 'encrypt' in (raw_mkinitcpio.content | b64decode)) else false }}"
        discovered_primary_user: "{{ primary_owner_discovered.stdout | trim if primary_owner_discovered.stdout is defined else 'vega' }}"
        primary_network_interface: "{{ active_network_interfaces.stdout.split(',') | first | default('wls1') }}"
        expected_swap_subvol: "@swap"
        expected_log_subvol: "@log"
        expected_cache_subvol: "@cache"
        expected_docker_subvol: "@docker"
        expected_flatpak_subvol: "@flatpak"
        expected_srv_subvol: "@srv"
        expected_snapshots_subvol: "@snapshots"
        expected_container_subvol: "@container"

    - name: "SCAN | Evaluate dependent topo structural safety definitions"
      ansible.builtin.set_fact:
        is_fortress_case: "{{ 'nested' in boot_source_device.stdout | default('') or (boot_source_device.stdout | default('')) == (root_source_device.stdout | default('')) }}"

    - name: "SMART EVALUATOR | Determine if layout matches defined standards or triggers bypass fallback"
      ansible.builtin.set_fact:
        boot_configuration_bypass: "{{ not (is_fortress_case | bool or (ansible_facts['os_family'] == 'Archlinux' and not has_systemd_hook | bool) or ansible_facts['os_family'] == 'Debian' or ansible_facts['os_family'] == 'RedHat' or ansible_facts['os_family'] == 'Suse') }}"

    - name: "SCAN | DYNAMIC | Intelligently extract active network interface matching chassis form factor"
      ansible.builtin.shell: |
        set -o pipefail
        FORM_FACTOR="{{ hardware_form_factor | trim }}"
        IS_VM="{{ is_virtual_machine | bool }}"
        IFACES=$(ip -br link show | awk '$3 ~ /UP/ && $1 !~ /lo|virbr|docker|proton|pvpn/ {print $1}')
        if [ "$IS_VM" = "true" ]; then
            echo "$IFACES" | grep -E '^(eth|en|vnet)' | head -n1 || echo "$IFACES" | head -n1
        elif [[ "$FORM_FACTOR" =~ "LAPTOP" ]]; then
            echo "$IFACES" | grep -E '^(wlan|wl)' | head -n1 || echo "$IFACES" | grep -E '^(en|eth)' | head -n1 || echo "$IFACES" | head -n1
        else
            echo "$IFACES" | grep -E '^(en|eth)' | head -n1 || echo "$IFACES" | head -n1
        fi
      args:
        executable: /bin/bash
      register: optimized_hardware_interface_probe
      changed_when: false
      check_mode: false

    - name: "SCAN | STATE | Lock dynamic hardware-intelligent network variables for tools"
      ansible.builtin.set_fact:
        primary_network_interface: "{{ optimized_hardware_interface_probe.stdout | trim | default('wls1') }}"


# =============================================================================
# BLOCK 19: PHYSICAL NON-BTRFS SWAP TARGET PROBES
# DESCRIPTION: Investigates active low-level storage maps to locate and identify discrete physical swap partition components.
# =============================================================================

    - name: "SWAP HARDENING | RECONNAISSANCE | Discover physical non-btrfs raw swap partition segments"
      ansible.builtin.shell: |
        set -o pipefail
        swapon --show=NAME,TYPE | awk '$2 == "partition" {print $1}' | head -n1
      args:
        executable: /bin/bash
      register: target_physical_swap_handle
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SWAP HARDENING | STATE | Compile mutually exclusive partition tracking variables"
      ansible.builtin.set_fact:
        has_swap_partition: "{{ true if (target_physical_swap_handle.stdout is defined and target_physical_swap_handle.stdout | length > 0) else false }}"
# =============================================================================
# BLOCK 20: CRYPT-MAPPED PARTITION CONFIGURATION (SSD ONLY)
# DESCRIPTION: Erases unmanaged partition parameters and locks solid state devices inside random-keyed AES-XTS layers.
# =============================================================================
    - name: "SWAP HARDENING | EXCLUSION | Cleanly purge unmanaged legacy entries from static storage maps"
      ansible.builtin.lineinfile:
        path: "/etc/fstab"
        regexp: '^.*swap.*$'
        state: absent
      when:
        - "has_swap_partition | bool"
        - "not failsafe_runtime_only_mode | bool"

    - name: "SWAP HARDENING | SSD | Commit volatile volume configurations to system encryption matrices"
      ansible.builtin.lineinfile:
        path: "/etc/crypttab"
        line: "swap_ssd {{ target_physical_swap_handle.stdout }} /dev/urandom swap,cipher=aes-xts-plain64,size=256,hash=sha256,discard"
        state: present
      when:
        - "has_swap_partition | bool"
        - "not is_mechanical_drive | bool"
        - "not failsafe_runtime_only_mode | bool"
        - "not ansible_check_mode"

    - name: "SWAP HARDENING | SSD | Append crypt-mapped execution endpoints to fstab matrices"
      ansible.builtin.lineinfile:
        path: "/etc/fstab"
        line: "/dev/mapper/swap_ssd none swap defaults,pri=10 0 0"
        state: present
      when:
        - "has_swap_partition | bool"
        - "not is_mechanical_drive | bool"
        - "not failsafe_runtime_only_mode | bool"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 21: PERSISTENT BTRFS LEDGER MOUNTING
# DESCRIPTION: Enforces fstab mounting properties across all core secure system subvolumes if a native Btrfs structure is verified.
# =============================================================================
    - name: "STORAGE | LEDGER | Commit standardized subvolumes to physical fstab parameters"
      ansible.posix.mount:
        path: "{{ item.mountpoint }}"
        src: "UUID={{ active_root_uuid }}"
        fstype: "btrfs"
        opts: "rw,{{ perf_mount_opts }},nodev,nosuid,nofail,subvol=/{{ item.expected_subvol }}"
        state: mounted
      loop:
        - { mountpoint: '/swap', expected_subvol: "{{ expected_swap_subvol }}" }
        - { mountpoint: '/var/log', expected_subvol: "{{ expected_log_subvol }}" }
        - { mountpoint: '/var/cache/pacman/pkg', expected_subvol: "{{ expected_cache_subvol }}" }
        - { mountpoint: '/var/lib/docker', expected_subvol: "{{ expected_docker_subvol }}" }
        - { mountpoint: '/var/lib/flatpak', expected_subvol: "{{ expected_flatpak_subvol }}" }
        - { mountpoint: '/srv', expected_subvol: "{{ expected_srv_subvol }}" }
        - { mountpoint: '/.snapshots', expected_subvol: "{{ expected_snapshots_subvol }}" }
        - { mountpoint: '/var/lib/containers', expected_subvol: "{{ expected_container_subvol }}" }
      when: 
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not has_swap_partition | bool"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 22: VOLATILE ALLOCATION SWAPFILE APPRAISALS
# DESCRIPTION: Evaluates file footprints against baseline formula boundaries, shielding skipped checks with default filters.
# =============================================================================
    - name: "STORAGE | SWAPFILE | Check physical presence of existing swapfile allocation"
      ansible.builtin.stat:
        path: "/swap/swapfile"
      register: target_swapfile_check
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not has_swap_partition | bool"

    - name: "STORAGE | SWAPFILE | Evaluate existing swapfile size specifications against active formula"
      ansible.builtin.set_fact:
        swapfile_size_mismatch: >-
          {{
            true if (not target_swapfile_check.stat.exists | default(false) or
            ((target_swapfile_check.stat.size / 1024 / 1024) | int - target_formula_swap_mb | int) | abs > 50) else false
          }}
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not has_swap_partition | bool"

    - name: "SWAP CONFIG | TELEMETRY | Report compliance status when existing file matches formula constraints"
      ansible.builtin.debug:
        msg: |
          ======================================================================
          📊 [ STORAGE SUBSYSTEM COMPLIANCE TELEMETRY LEDGER ]
          ======================================================================
            ↳ ACTIVE BOUNDARY STATUS     : PASS (TARGET MEETS COMPLIANCE)
            ↳ IDENTIFIED FILE PATH       : /swap/swapfile
            ↳ ALLOCATED FOOTPRINT SIZES  : {{ (target_swapfile_check.stat.size / 1024 / 1024) | round(0) | int if target_swapfile_check.stat.exists | default(false) else 0 }} MB
            ↳ METRIC FORMULA TARGET      : {{ target_formula_swap_mb }} MB
          ======================================================================
            NOTICE: Symmetrical memory storage bounds verified. Bypassing heavy
            fallocate and block formatting loops to safeguard drive sector wear.
          ======================================================================
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not has_swap_partition | bool"
        - "target_swapfile_check.stat.exists | default(false)"
        - "not swapfile_size_mismatch | default(false) | bool"
# =============================================================================
# BLOCK 23: SHIELDED FALLBACK SWAPFILE PROVISIONING
# DESCRIPTION: Allocates fallback storage blocks using traditional or Btrfs rules, applying the default(false) check fix.
# =============================================================================
    - name: "STORAGE | SWAPFILE | Build secure Btrfs fallback block if no physical swap partition exists"
      ansible.builtin.shell: |
        set -euo pipefail
        swapoff /swap/swapfile || true
        touch /swap/swapfile
        chattr +C /swap/swapfile
        truncate -s 0 /swap/swapfile
        dd if=/dev/zero of=/swap/swapfile bs=1M count={{ target_formula_swap_mb | int }} status=none
        chmod 0600 /swap/swapfile
        mkswap /swap/swapfile
        swapon -p 10 /swap/swapfile
      args:
        executable: /bin/bash
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not ansible_check_mode"
        - "swapfile_size_mismatch | default(false) | bool"
        - "not has_swap_partition | bool"

    - name: "SWAP CONFIG | ALLOCATION | Traditional swapfile allocation block if target platform is non-btrfs filesystem"
      ansible.builtin.shell: |
        set -euo pipefail
        if [ ! -f /swap/swapfile ]; then
            mkdir -p /swap
            dd if=/dev/zero of=/swap/swapfile bs=1M count={{ target_formula_swap_mb | int }} status=none
            chmod 0600 /swap/swapfile
            mkswap /swap/swapfile
            swapon -p 10 /swap/swapfile
        fi
      args:
        executable: /bin/bash
      when:
        - "is_btrfs_layout is defined and not is_btrfs_layout | bool"
        - "not has_swap_partition | bool"
        - "not ansible_check_mode"

    - name: "SWAP CONFIG | NOTIFY | Render automated swap infrastructure hardening status"
      ansible.builtin.debug:
        msg: "⚙️  SWAP INFRASTRUCTURE CONFIGURATION COMPLETE: Active validation track target set to [ {{ target_formula_swap_mb }} MB swapfile fallback ]"
      when: "not has_swap_partition | bool"
# =============================================================================
# BLOCK 24: VOLATILE RAM ACCELERATION TUNING
# DESCRIPTION: Deploys prioritized memory layouts via ZRAM configurations, configures OOM frameworks, and cleans legacy profiles.
# =============================================================================
    - name: "ZRAM PROVISION | Deploy chosen compression algorithm setup matching scanned hardware profile"
      ansible.builtin.copy:
        dest: "/etc/systemd/zram-generator.conf"
        content: |
          # =========================================================================
          # 🎛️ HARDENED POST-INSTALL USERLAND MEMORY ACCELERATION PRESETS (PRIORITY 100)
          # =========================================================================
          [zram0]
          zram-size = min(ram / 2, 2048)
          compression-algorithm = {{ target_compression }}
          swap-priority = 100
        mode: '0644'
      notify: "Reload Active Systemd Core"
      when: "not ansible_check_mode and system_ram_gb | int < 16"

    - name: "OOM SERVICES | Handle live alignment transitions for active memory daemons"
      ansible.builtin.systemd:
        name: "systemd-oomd"
        state: "{{ 'started' if oom_engine_selection == 'systemd-oomd' else 'stopped' }}"
        enabled: "{{ true if oom_engine_selection == 'systemd-oomd' else false }}"
      failed_when: false
      when: "not ansible_check_mode"

    - name: "SYSCTL | SANITIZATION | Purge legacy conflicting standalone swappiness map parameters"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/etc/sysctl.d/99-swappiness.conf"
        - "/etc/sysctl.d/50-memory-tuning.conf"
# =============================================================================
# BLOCK 25: HARDWARE-AWARE SYSCTL TUNING INJECTIONS
# DESCRIPTION: Drops hardware-aware kernel performance controls customized to mechanical, hypervisor, or solid state storage configurations.
# =============================================================================
    - name: "HARDENING | MEMORY MAPS | Compile optimized dynamic sysctl hardware profile"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-memory-tunning.conf"
        content: |
          # =================================================================
          # AUTOMATED ZERO-TRUST HARDWARE-AWARE MEMORY PERFORMANCE METRICS LEDGER
          # CUSTOM SYSTEM ARCHITECTURE BUILT BY MEDARDO VEGA
          # =================================================================
          vm.swappiness = {{ hardware_profile_matrix['tier_1']['swappiness'] if system_ram_gb | int <= 4 else (hardware_profile_matrix['tier_2']['swappiness'] if system_ram_gb | int <= 8 else (hardware_profile_matrix['tier_3']['swappiness'] if system_ram_gb | int <= 15 else hardware_profile_matrix['tier_4']['swappiness'])) }}
          vm.pagecluster = 0
          vm.compaction_proactiveness = 80

          {% if is_mechanical_drive | bool %}
          # HARDCODED PLATTEN DRIVES PROTECTIVE PARAMETERS
          vm.dirty_background_bytes = 67108864
          vm.dirty_bytes = 268435456
          vm.watermark_scale_factor = 125
          vm.vfs_cache_pressure = 50
          {% elif is_virtual_machine | bool %}
          # HYPERVISOR AGGRESSIVE GUEST DOUBLE-CACHING BYPASS FLUSH
          vm.dirty_background_ratio = 5
          vm.dirty_ratio = 10
          vm.vfs_cache_pressure = 500
          {% else %}
          # FLASH CELLS SOLID STATE DISK RATIOS HIGH THROUGHPUT
          vm.dirty_background_ratio = 10
          vm.dirty_ratio = 20
          vm.watermark_scale_factor = 10
          vm.vfs_cache_pressure = 100
          {% endif %}
        mode: '0644'
        owner: root
        group: root
      register: sysctl_conf_fix
      become: true
      notify: "Trigger Active System Kernel Flush"

    - name: "TRACKER | Accumulate state adjustments from kernel subsystems"
      ansible.builtin.set_fact:
        system_was_modified: true
      when:
        - "not ansible_check_mode"
        - "sysctl_conf_fix.changed | default(false)"
# =============================================================================
# BLOCK 26: TRANSIENT INTERFACE MOUNTING & VAULT UTILITY LAYOUTS
# DESCRIPTION: Restricts mount options on virtual execution interfaces and builds quota-enforcing cryptographic vault utilities.
# =============================================================================
    - name: "STORAGE | HARDENING | Secure virtual execution interfaces universally inside fstab arrays"
      ansible.builtin.blockinfile:
        path: "/etc/fstab"
        marker: "# {mark} ANSIBLE VIRTUAL TIMEMAPS ENGINE PLATFORMS"
        insertafter: EOF
        block: |
          tmpfs /tmp tmpfs defaults,noexec,nosuid,nodev,size=50% 0 0
          tmpfs /dev/shm tmpfs defaults,noexec,nosuid,nodev,size=1G 0 0
      become: true

    - name: "CONFIGURATION | NETWORKING | Enforce clean un-falsifiable host resolution table"
      ansible.builtin.copy:
        dest: "/etc/hosts"
        owner: root
        group: root
        mode: '0644'
        content: |
          # Secure Static Table Lookup for Hostnames (Automated Framework Baseline)
          127.0.0.1    localhost localhost.localdomain
          ::1          localhost localhost.localdomain
          
          # Dedicated Local Loopback Node Mapping for Compliance Parsers
          127.0.1.1    {{ ansible_facts['hostname'] }}
          ::1          {{ ansible_facts['hostname'] }}
      become: true

    - name: "CONFIGURATION | SYSTEM BANNERS | Generate dynamic cross-distribution login disclaimers"
      ansible.builtin.copy:
        dest: "{{ item }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          ===============================================================================
          [ 🔒 WARNING: {{ ansible_facts['distribution'] | upper }} SECURE INFRASTRUCTURE NODE ]
          ===============================================================================
          
            🚨 AUTHORIZATION WARNING NOTICE:
            This computer system is restricted strictly to authorized users only. 
            Unauthorized access, connection attempts, or modifications are prohibited.
            
            🛡️  REAL-TIME SECURITY PROVISIONING:
            All interactions, network sessions, and host transactions on this node 
            are subject to continuous live kernel monitoring, session auditing, and 
            forensic payload logging under host administrative authorities.

            ⚠️  LEGAL LIABILITY DISCLAIMER:
            Anyone choosing to access this system explicitly consents to continuous 
            auditing. UNAUTHORIZED USERS WILL BE APPREHENDED and prosecuted to the 
            fullest extent of the law. Disconnect immediately if you are unauthorized.

          ===============================================================================
      loop:
        - "/etc/issue"
        - "/etc/issue.net"
      become: true

    - name: "VAULT ENGINE | Interrogate raw physical block storage boundary footprint sizes"
      ansible.builtin.shell: |
        set -o pipefail
        lsblk -bno SIZE "{{ vault_partition_handle }}" | head -n1 | tr -d '[:space:]' || echo "0"
      args:
        executable: /bin/bash
      register: raw_vault_block_bytes
      changed_when: false
      failed_when: false
      when:
        - "secure_vault_enabled | bool"
        - "not failsafe_runtime_only_mode | bool"
        - "not ansible_check_mode"

    - name: "VAULT ENGINE | Synthesize dynamic proportional mathematical storage profiles"
      ansible.builtin.set_fact:
        vault_total_capacity_gb: "{{ ((raw_vault_block_bytes.stdout | default('0') | int) / 1024 / 1024 / 1024) | round(0) | int }}"
      when:
        - "secure_vault_enabled | bool"
        - "not failsafe_runtime_only_mode | bool"

    - name: "VAULT ENGINE | Construct automated multi-layer quota-enforcing wrapper utilities"
      ansible.builtin.copy:
        dest: "/usr/bin/vault"
        content: |
          #!/bin/bash
          set -euo pipefail
          VAULT_DEV="{{ vault_partition_handle }}"
          MNT_TARGET="{{ vault_mount_target }}"
          MIN_LIMIT={{ vault_minimum_size_threshold_gb | int }}
          PCT_FACTOR={{ vault_allocation_percentage | int }}
          MAX_MEMBERS={{ vault_maximum_guest_members | int }}
          V_SIZE={{ vault_total_capacity_gb | default(0) | int }}
          FAILSAFE_ACTIVE={{ 'true' if failsafe_runtime_only_mode | bool else 'false' }}

          if [ "$(id -u)" -ne 1000 ] && [ "$(id -u)" -ne 0 ]; then
             echo "[-] ACCESS DENIED: Core cryptographic storage controls are restricted." >&2
             exit 1
          fi

          if [ "${1:-}" == "open" ]; then
             if [ "$FAILSAFE_ACTIVE" = "true" ]; then
                sudo mkdir -p "${MNT_TARGET}"
                sudo chmod 0750 "${MNT_TARGET}"
                echo "[!] Failsafe Open: Directory initialized directly over unencrypted storage."
             else
                sudo cryptsetup open "${VAULT_DEV}" vault_storage
                sudo mkdir -p "${MNT_TARGET}"
                sudo mount -o noatime,compress=zstd:1,space_cache=v2 "${MNT_TARGET}" || sudo mount /dev/mapper/vault_storage "${MNT_TARGET}"
                echo "[+] Vault successfully opened."
             fi
             sudo chown 1000:1000 "${MNT_TARGET}"
             if sudo btrfs filesystem df "${MNT_TARGET}" &>/dev/null; then
                sudo btrfs quota enable "${MNT_TARGET}" 2>/dev/null || true
             fi
          elif [ "${1:-}" == "close" ]; then
             sudo umount -f "${MNT_TARGET}" || true
             if [ "$FAILSAFE_ACTIVE" = "false" ]; then
                sudo cryptsetup close vault_storage
             fi
             echo "[+] Vault completely locked and secured."
          elif [ "${1:-}" == "add-user" ]; then
             GUEST_USER="${2:-}"
             if [ -z "${GUEST_USER}" ]; then exit 1; fi
             if [ "$FAILSAFE_ACTIVE" = "false" ] && [ "${V_SIZE}" -le "${MIN_LIMIT}" ]; then exit 1; fi

             CURRENT_MEMBER_COUNT=$(find "${MNT_TARGET}/home" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | wc -l || echo "0")
             if [ "${CURRENT_MEMBER_COUNT}" -ge "${MAX_MEMBERS}" ]; then exit 1; fi

             if [ "$FAILSAFE_ACTIVE" = "false" ] && sudo btrfs filesystem df "${MNT_TARGET}" &>/dev/null; then
                USER_SPACE_GB=$(( V_SIZE * PCT_FACTOR / 100 ))
                USER_SPACE_BYTES=$(( USER_SPACE_GB * 1024 * 1024 * 1024 ))
                if [ ! -d "${MNT_TARGET}/@home_${GUEST_USER}" ]; then
                   sudo btrfs subvolume create "${MNT_TARGET}/@home_${GUEST_USER}"
                   sudo mkdir -p "${MNT_TARGET}/home/${GUEST_USER}"
                   sudo mount -o subvol="@home_${GUEST_USER}" /dev/mapper/vault_storage "${MNT_TARGET}/home/${GUEST_USER}"
                fi
                sudo btrfs qgroup limit "${USER_SPACE_BYTES}" "${MNT_TARGET}/@home_${GUEST_USER}"
             else
                sudo mkdir -p "${MNT_TARGET}/home/${GUEST_USER}"
             fi
             sudo chown -R "${GUEST_USER}:${GUEST_USER}" "${MNT_TARGET}/home/${GUEST_USER}"
             sudo chmod 0700 "${MNT_TARGET}/home/${GUEST_USER}"
          fi
        mode: '0750'
        owner: root
        group: "{{ distro_matrix[ansible_facts['os_family']]['admin_group'] if ansible_facts['os_family'] in distro_matrix else 'wheel' }}"
      when: "secure_vault_enabled | bool"

    - name: "VAULT ENGINE | ALIASES | Enforce uniform permissions over shared profile script hooks"
      ansible.builtin.file:
        path: "/etc/profile.d/vault_aliases.sh"
        owner: root
        group: root
        mode: '0644'
        state: file
      failed_when: false


# =============================================================================
# BLOCK 27: LINK-LAYER NETWORK GUARD INJECTIONS
# DESCRIPTION: Generates drop-in execution paths for network audit utilities to apply strict systemd sandboxing properties over monitoring units.
# =============================================================================
    - name: "COMPLIANCE | ARPWATCH | Suppress legacy binary chdir warnings universally"
      ansible.builtin.file:
        path: "/usr/arpwatch"
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true
      
    - name: "COMPLIANCE | ARPWATCH | Establish configuration drop-in containment directory universally"
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ 'arpwatch@' ~ primary_network_interface if ansible_facts['os_family'] in ['Archlinux', 'Debian'] else 'arpwatch' }}.service.d"
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: "COMPLIANCE | ARPWATCH | Inject sandbox restrictions via universal systemd override matrix"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ 'arpwatch@' ~ primary_network_interface if ansible_facts['os_family'] in ['Archlinux', 'Debian'] else 'arpwatch' }}.service.d/override.conf"
        mode: '0644'
        owner: root
        group: root
        content: |
          [Unit]
          After=network-online.target
          Wants=network-online.target

          [Service]
          ProtectSystem=strict
          ProtectHome=true
          ReadWritePaths=/var/lib/arpwatch /var/lib/arpwatch/arpwatch.dat
          PrivateTmp=true
          ProtectControlGroups=true
          ProtectKernelModules=true
          ProtectKernelTunables=true
          RestrictRealtime=true
          CapabilityBoundingSet=CAP_NET_RAW
          NoNewPrivileges=true
      notify: "Reload Active Systemd Core"
      become: true
# =============================================================================
# BLOCK 28: FIREWALD DYNAMIC PERIMETER CONTROLS
# DESCRIPTION: Automates network containment configurations, dropping external connection proxies, and isolating physical ports into drop cages.
# =============================================================================

    - name: "FIREWALLD | ENFORCE INTERFACE CONTAINMENT | Set baseline architecture zones cleanly"
      ansible.builtin.shell: |
        firewall-cmd --permanent --set-default-zone=public
        firewall-cmd --permanent --zone=trusted --remove-interface=lo 2>/dev/null || true
        firewall-cmd --permanent --zone=trusted --add-source=127.0.0.1/8
        firewall-cmd --permanent --zone=trusted --add-source=::1/128

        for interface_regex in "tun+" "wg+" "proton+" "pvpn+"; do
           {% raw %}
           firewall-cmd --permanent --zone=trusted --add-interface="${interface_regex}" 2>/dev/null || true
           {% endraw %}
        done

        for physical_card in $(echo "{{ active_network_interfaces.stdout | default('wls1') }}" | tr ',' ' '); do
           if [[ "${physical_card}" =~ ^(proton|pvpn|tun|wg) ]]; then
              echo "[*] Skipping VPN tunnel containment bypass for: ${physical_card}"
              firewall-cmd --permanent --zone=drop --remove-interface="${physical_card}" 2>/dev/null || true
           else
              echo "[+] Securing raw hardware interface inside drop container: ${physical_card}"
              firewall-cmd --permanent --zone=drop --add-interface="${physical_card}"
           fi
        done

        firewall-cmd --permanent --zone=public --remove-service=ssh 2>/dev/null || true
        firewall-cmd --permanent --zone=public --remove-service=dhcpv6-client 2>/dev/null || true

        firewall-cmd --reload
      args:
        executable: /bin/bash
      register: firewall_conf_fix
      failed_when: false
      when:
        - "not ansible_check_mode"
        - "firewalld_native | bool"

    - name: "TRACKER | Accumulate state adjustments from firewall"
      ansible.builtin.set_fact:
        system_was_modified: true
      when:
        - "not ansible_check_mode"
        - "firewall_conf_fix.changed | default(false)"

# =============================================================================
# BLOCK 29: ENTERPRISE PERIPHERAL LOCKDOWNS & USER PRIVILEGE GATES
# DESCRIPTION: Satisfies system packaging, generates clean hardware whitelists,
#              and deploys an optimized, error-free zero-trust configuration matrix.
# =============================================================================

    - name: "SECURITY SERVICES | RECOVERY | Flush systemd service failure caches"
      ansible.builtin.command: "systemctl reset-failed usbguard.service clamd.service snort.service 2>/dev/null"
      failed_when: false
      changed_when: false
      become: true
      when: "not ansible_check_mode"

    - name: "PROVISIONING | SECURE SUITE | Enforce presence of all framework host defense utilities"
      ansible.builtin.package:
        name: "{{ distro_matrix[ansible_facts['os_family']]['core_packages'] }}"
        state: present
      when: "not ansible_check_mode"

    - name: "PROVISION | UNIVERSAL | Install Tripwire forensic engine from native repositories"
      ansible.builtin.package:
        name: "tripwire"
        state: present
      when:
        - "ansible_facts['os_family'] != 'Archlinux'"
        - "not ansible_check_mode"

    - name: "CONFIGURATION | TRIPWIRE | Comment out non-existent binary paths in policy text"
      ansible.builtin.lineinfile:
        path: "/etc/tripwire/twpol.txt"
        regexp: '^([^#]*{{ item }})'
        line: '# {{ item }} -> $(IgnoreNone) ;'
        state: present
      loop:
        - "/usr/sbin/fixrmtab"
        - "/usr/sbin/pwconv"
        - "/usr/sbin/grpconv"
        - "/proc/mdstat"
      when: "not ansible_check_mode"
      become: true
     
# =============================================================================
# BLOCK 29 (REVISED): ZERO-HARDCODING MULTI-DISTRO DYNAMIC SHIELD POSTURE
# DESCRIPTION: Dynamically formats user IPC constraints using clean space delimiters
#              across all target distributions, and deploys a class-based,
#              hardware-agnostic filter that permits post-deployment hot-plugging
#              of safe peripherals (mice, keyboards, hubs) on any system installation.
# =============================================================================

    - name: "SECURITY SERVICES | RECOVERY | Reset systemd execution lock metrics"
      ansible.builtin.command: "systemctl reset-failed usbguard.service"
      failed_when: false
      changed_when: false
      become: true
      when: "not ansible_check_mode"

    - name: "PROVISIONING | ARCH | Forcefully purge legacy libdaq v2 conflicts to clear Snort 3 paths"
      community.general.pacman:
        name: "libdaq"
        state: absent
        force: true
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"
      become: true

    - name: "USBGUARD | PRIVILEGE | Scrape target node group database paths natively"
      ansible.builtin.shell: |
        set -o pipefail
        getent group {{ distro_matrix[ansible_facts['os_family']]['admin_group'] | default('wheel') }} | cut -d: -f4 | tr ',' ' '
      args:
        executable: /bin/bash
      register: live_os_group_administrators
      changed_when: false

    - name: "USBGUARD | PRIVILEGE | Compile dynamic error-free user string with zero token duplication"
      ansible.builtin.set_fact:
        sanitized_ipc_users: >-
          {%- set list_accumulator = ['root', ansible_env.SUDO_USER | default(ansible_user_id)] -%}
          {%- if live_os_group_administrators.stdout | trim | length > 0 -%}
            {%- set list_accumulator = list_accumulator + (live_os_group_administrators.stdout.split()) -%}
          {%- endif -%}
          {{ list_accumulator | unique | join(' ') }}


    - name: "USBGUARD | POLICY | Generate live production hardware policy blueprint"
      ansible.builtin.shell: "usbguard generate-policy > /etc/usbguard/rules.conf"
      become: true

    - name: "USBGUARD | POLICY | Ensure correct permissions on generated rules matrix"
      ansible.builtin.file:
        path: /etc/usbguard/rules.conf
        owner: root
        group: root
        mode: '0600'
      become: true

    - name: "CONFIGURATION | PERIPHERAL | Deploy absolute, pristine production configuration matrix"
      ansible.builtin.copy:
        dest: "/etc/usbguard/usbguard-daemon.conf"
        content: |
          ImplicitPolicyTarget=block
          PresentControllerPolicy=keep
          InsertedDevicePolicy=block
          RestoreControllerDeviceState=false
          AuditBackend=FileAudit
          AuditFilePath=/var/log/usbguard/usbguard-audit.log
          IPCAllowedGroups={{ distro_matrix[ansible_facts['os_family']]['admin_group'] | default('wheel') }} secops
          IPCAllowedUsers={{ sanitized_ipc_users | trim }}
          RuleFile=/etc/usbguard/rules.conf
          PresentDevicePolicy=keep
        mode: '0600'
        owner: root
        group: root
      become: true
      register: enterprise_config_lock

    - name: "USBGUARD | FINAL POSTURE LOCK | Restart service to enforce strict dynamic boundaries"
      ansible.builtin.systemd:
        name: usbguard.service
        masked: false
        state: restarted
      become: true
      when:
        - "not ansible_check_mode"
        - "enterprise_config_lock.changed"

    - name: "CONFIGURATION | TRIPWIRE | Purge non-existent legacy binaries from cleartext policy template"
      ansible.builtin.replace:
        path: "/etc/tripwire/twpol.txt"
        regexp: '^(\s*{{ item }}\s+->)'
        replace: '# \1'
      loop:
        - "/usr/sbin/fixrmtab"
        - "/usr/sbin/pwconv"
        - "/usr/sbin/grpconv"
      failed_when: false
      when:
        - "not ansible_check_mode"
      become: true

    - name: "CONFIGURATION | TRIPWIRE | Sanitize non-existent virtual hardware paths to prevent filesystem check drops"
      ansible.builtin.replace:
        path: "/etc/tripwire/twpol.txt"
        regexp: '^(\s*[^#]*\/proc\/mdstat.*)$'
        replace: '# \1'
      failed_when: false
      when:
        - "not ansible_check_mode"
      become: true

    - name: "CONFIGURATION | TRIPWIRE | Align binary database permissions for local monitoring daemons"
      ansible.builtin.file:
        path: "/etc/tripwire/tw.cfg"
        owner: root
        group: root
        mode: '0644'
      when: "not ansible_check_mode"
      become: true

      
# =============================================================================
# BLOCK 30A: SNORT DETECTIONS GEOMETRY & ENGINE CONFIGURATION
# DESCRIPTION: Automates physical rule placement mapping and injects cross-distro Lua frameworks.
# =============================================================================

    - name: "SCAN | SNORT | Probing system filesystem layout to determine running version"
      ansible.builtin.stat:
        path: "/etc/snort/snort.lua"
      register: snort_version_probe

    - name: "CONFIGURATION | SNORT 2.9 / 3 | Enforce absolute physical path compliance for relative rule directories"
      ansible.builtin.file:
        path: "/etc/rules"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: "not ansible_check_mode"
      become: true

    - name: "CONFIGURATION | SNORT 2.9 / 3 | Enforce local and app rules baseline file creation"
      ansible.builtin.file:
        path: "/etc/rules/{{ item }}"
        state: touch
        owner: root
        group: root
        mode: '0644'
        modification_time: preserve
        access_time: preserve
      loop:
        - "local.rules"
        - "app-detect.rules"
        - "white_list.rules"
        - "black_list.rules"
      when: "not ansible_check_mode"
      become: true

    - name: "CONFIGURATION | SNORT 2.9 | Deactivate non-existent dynamic rules directory paths"
      ansible.builtin.lineinfile:
        path: "/etc/snort/snort.conf"
        regexp: "^(dynamicdetection\\s+directory\\s+/usr/lib/snort_dynamicrules)"
        line: "# dynamicdetection directory /usr/lib/snort_dynamicrules"
        state: present
      when:
        - "not snort_version_probe.stat.exists | bool"
        - "not ansible_check_mode"
      become: true

    - name: "CONFIGURATION | SNORT 2.9 | Purge uninstalled vendor rulesets and configs from plain-text tracks"
      ansible.builtin.replace:
        path: "/etc/snort/snort.conf"
        regexp: '^(include\s+\$RULE_PATH\/(?!local\.rules|app-detect\.rules)[a-zA-Z0-9_\-\.]+\.(rules|conf))'
        replace: '# \1'
      when:
        - "not snort_version_probe.stat.exists | bool"
        - "not ansible_check_mode"
      become: true

    - name: "CONFIGURATION | SNORT 2.9 | Deploy classic plain-text engine rules matrix"
      ansible.builtin.lineinfile:
        path: "/etc/snort/snort.conf"
        regexp: "^var\\s+HOME_NET"
        line: "var HOME_NET {{ dynamic_home_net | default('192.168.1.0/24') }}"
        state: present
      when:
        - "not snort_version_probe.stat.exists | bool"
        - "not ansible_check_mode"

    - name: "CONFIGURATION | SNORT 3 | Deploy modern structured Lua posture config"
      ansible.builtin.copy:
        dest: "/etc/snort/snort.lua"
        owner: root
        group: root
        mode: '0644'
        content: |
          interfaces = {
              name = "{{ primary_network_interface | default('wls1') if primary_network_interface | default('') | trim | length > 0 else 'wls1' }}"
          }
          HOME_NET = "{{ dynamic_home_net | default('192.168.1.0/24') }}"
          EXTERNAL_NET = "!$HOME_NET"
          daq = {
              module = "pcap",
              mode = "passive"
          }
          stream = { }
          ips = {
              mode = "tap",
              rules = [[ include /etc/rules/local.rules ]]
          }
      register: snort_conf_fix
      when: 
        - "snort_version_probe.stat.exists | bool"
        - "not ansible_check_mode"
      become: true

    - name: "TRACKER | Accumulate state adjustments from network subsystems"
      ansible.builtin.set_fact:
        system_was_modified: true
      when:
        - "not ansible_check_mode"
        - "snort_conf_fix.changed | default(false)"

# =============================================================================
# BLOCK 30B: CLAMAV SUBSYSTEM CONFIGURATION & RESOURCE SANDBOXING
# DESCRIPTION: Deploys dynamic CPU/memory sandboxing parameters and tunes database checks.
# =============================================================================

    - name: "CLAMAV | CONFIGURATION | Establish systemd drop-in override containment path"
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ 'clamav-daemon' if ansible_facts['os_family'] == 'Debian' else 'clamd' }}.service.d"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: "not ansible_check_mode"

    - name: "CLAMAV | CONFIGURATION | Inject hardware-proportional resource management parameters"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ 'clamav-daemon' if ansible_facts['os_family'] == 'Debian' else 'clamd' }}.service.d/override.conf"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          Nice=19
          CPUSchedulingPolicy=idle
          CPUQuota={{ calculated_quota | trim }}%
          MemoryHigh={{ calculated_mem_high | trim }}
          MemoryMax={{ calculated_mem_max | trim }}
          TimeoutStartSec=300
      vars:
        calculated_quota: >
          {%- if system_ram_gb | int <= 4 -%} 10
          {%- elif system_ram_gb | int > 4 and system_ram_gb | int < 8 -%} 15
          {%- elif system_ram_gb | int >= 8 and system_ram_gb | int <= 16 -%} 20
          {%- else -%} 25
          {%- endif -%}
        calculated_mem_high: >
          {%- if system_ram_gb | int <= 4 -%} 1.0G
          {%- elif system_ram_gb | int > 4 and system_ram_gb | int < 8 -%} 1.2G
          {%- elif system_ram_gb | int >= 8 and system_ram_gb | int <= 16 -%} 1.5G
          {%- else -%} 2.0G
          {%- endif -%}
        calculated_mem_max: >
          {%- if system_ram_gb | int <= 4 -%} 1.2G
          {%- elif system_ram_gb | int > 4 and system_ram_gb | int < 8 -%} 1.5G
          {%- elif system_ram_gb | int >= 8 and system_ram_gb | int <= 16 -%} 2.0G
          {%- else -%} 3.0G
          {%- endif -%}
      when: "not ansible_check_mode"
      notify: "Reload Active Systemd Core"

    - name: "CLAMAV | CONFIGURATION | Set database update frequency threshold"
      ansible.builtin.lineinfile:
        path: "/etc/clamav/freshclam.conf"
        regexp: "^#?Checks\\s+"
        line: "Checks 2"
        state: present
      when: "not ansible_check_mode"
      notify: "Reload Active Systemd Core"


# =============================================================================
# BLOCK 30C: FORENSIC FILE INTEGRITY SCHEMAS & ATTRIBUTES (PART 1)
# DESCRIPTION: Stages baseline tracking schemas for AIDE filesystems, deploys daily timers, and creates recovery notifications.
# =============================================================================

    - name: "AIDE | CONFIGURATION | Populate baseline configuration landscape across platform variants"
      ansible.builtin.copy:
        dest: "{{ '/etc/aide/aide.conf' if ansible_facts['os_family'] in ['Debian', 'RedHat'] else '/etc/aide.conf' }}"
        content: |
          # Robust Standard File Integrity Baseline Template Map
          database_in=file:/var/lib/aide/aide.db.gz
          database_out=file:/var/lib/aide/aide.db.new.gz
          gzip_dbout=yes
          report_url=stdout

          # High-Value Forensics Rules Blueprint (Dynamically Sanitized)
          {% if ansible_facts['os_family'] == 'Archlinux' %}
          FIPSR = p+i+n+u+g+s+m+c+acl+xattrs+sha256
          ALLX  = p+i+n+u+g+s+m+c+sha256
          {% else %}
          FIPSR = p+i+n+u+g+s+m+c+acl+selinux+xattrs+sha256
          ALLX  = p+i+n+u+g+s+m+c+sha256
          {% endif %}

          /etc/.* FIPSR
          /usr/bin/.* ALLX
          /usr/sbin/.* ALLX
        owner: root
        group: root
        mode: '0600'
      register: aide_schema_fix
      when: "not ansible_check_mode"

    - name: "TRACKER | Accumulate state adjustments from file integrity layers"
      ansible.builtin.set_fact:
        system_was_modified: true
      when:
        - "not ansible_check_mode"
        - "aide_schema_fix.changed | default(false)"

    - name: "AIDE | SCHEDULER | Deploy daily oneshot service check files"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/aide-check.service"
        content: |
          [Unit]
          Description=Automated Post-Hardening File Integrity Security Scan
          After=local-fs.target network.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/aide --check
          SuccessExitStatus=0 1 2 3 4 5 6 7
          Nice=19
          CPUSchedulingPolicy=idle
          IOSchedulingClass=idle
          OOMScoreAdjust=1000
          MemoryHigh=750M
          MemoryMax=900M
        owner: root
        group: root
        mode: '0644'
      notify: "Reload Active Systemd Core"

    - name: "AIDE | AUDIT | Execute live post-hardening baseline verification pass"
      ansible.builtin.command: "/usr/bin/aide --check"
      register: live_aide_test_sweep
      # Tell Ansible to process codes 0 through 7 as successful verification sweeps
      failed_when: "live_aide_test_sweep.rc not in"
      changed_when: "live_aide_test_sweep.rc != 0"
      when:
        - "not is_mechanical_drive | bool"
        - "not ansible_check_mode"

    - name: "AIDE | SCHEDULER | Drop 3:00 AM dynamic cron-free timer schedules"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/aide-check.timer"
        content: |
          [Unit]
          Description=Trigger Automated System Integrity Scan Daily at 3AM

          [Timer]
          OnCalendar=*-*-* 03:00:00
          Persistent=true

          [Install]
          WantedBy=timers.target
        owner: root
        group: root
        mode: '0644'
      notify: "Reload Active Systemd Core"

    - name: "AIDE | AUTOMATION | Deploy post-transaction pacman database hook"
      ansible.builtin.copy:
        dest: "/etc/pacman.d/hooks/99-aide-update.hook"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Trigger]
          Operation = Install
          Operation = Upgrade
          Operation = Remove
          Type = Package
          Target = *

          [Action]
          Description = Synchronizing cryptographic filesystem baseline matrix post-transaction...
          When = PostTransaction
          Depends = aide
          Exec = /bin/bash -c 'if [ "$(cat /sys/block/$(lsblk -no PKNAME "$(findmnt -n -o SOURCE /)" | head -n1 | tr -d "[:space:]")/queue/rotational 2>/dev/null)" = "1" ]; then echo "[!] Platter drive profile active. Bypassing automatic AIDE database rotation."; exit 0; fi; /usr/bin/aide --update && mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db || true'
      when: 
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"

    - name: "TRIPWIRE | SCHEDULER | Deploy daily 1:00 AM forensic timer tracking files"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - { name: "tripwire-check.service", content: "[Unit]\nDescription=Automated Tripwire Binary Forensic Check\nConditionPathExists=/etc/tripwire/tw.cfg\nConditionPathExists=/var/lib/tripwire/{{ ansible_facts['hostname'] | default('SecEngr') }}.twd\n\n[Service]\nType=oneshot\nExecStart=/usr/sbin/tripwire --check --silent\nSuccessExitStatus=0 7" }
        - { name: "tripwire-check.timer", content: "[Unit]\nDescription=Trigger Tripwire Verification Sweep Daily at 1AM\n\n[Timer]\nOnCalendar=*-*-* 01:00:00\nPersistent=true\n\n[Install]\nWantedBy=timers.target" }
      notify: "Reload Active Systemd Core"

# =============================================================================
# BLOCK 30D: FORENSIC FILE INTEGRITY SCHEMAS & ATTRIBUTES (PART 2)
# DESCRIPTION: Automates multi-distribution system state audits and captures clean database baselines cleanly.
# =============================================================================

    - name: "INTRUSION DETECTION | MULTI-DISTRO SCAN | Initialize pristine file integrity tracking database conditional baseline"
      ansible.builtin.shell: |
        set -euo pipefail
        if [ "{{ is_mechanical_drive | bool }}" = "true" ]; then
            echo "[!] Platter drive profile active. Bypassing heavy automatic initialization loops to protect disk wear."
            exit 0
        fi

        OS_FAMILY="{{ ansible_facts['os_family'] }}"
        DB_DIR="/var/lib/aide"

        if [ "${OS_FAMILY}" = "Archlinux" ] || [ "${OS_FAMILY}" = "Suse" ]; then
            TARGET_DB="${DB_DIR}/aide.db"
        elif [ "${OS_FAMILY}" = "Debian" ] || [ "${OS_FAMILY}" = "RedHat" ]; then
            TARGET_DB="${DB_DIR}/aide.db.gz"
        else
            TARGET_DB="${DB_DIR}/aide.db"
        fi

        if [ -f "${TARGET_DB}" ]; then
            echo "[+] Pristine cryptographic filesystem signature baseline verified at: ${TARGET_DB}. Skipping initialization loop."
            exit 0
        fi

        echo "[!] Critical database track missing. Bootstrapping low-impact initialization scan via native platform paths..."
        mkdir -p "${DB_DIR}"

        if [ "${OS_FAMILY}" = "Debian" ]; then
            aideinit -y || true
            if [ -f "${DB_DIR}/aide.db.new" ] && [ ! -f "${TARGET_DB}" ]; then
                cp "${DB_DIR}/aide.db.new" "${TARGET_DB}"
            fi
        elif [ "${OS_FAMILY}" = "Archlinux" ]; then
            aide --init -y || true
            if [ -f "${DB_DIR}/aide.db.new" ]; then
                cp "${DB_DIR}/aide.db.new" "${TARGET_DB}"
            fi
        elif [ "${OS_FAMILY}" = "RedHat" ]; then
            aide --init -y || true
            if [ -f "${DB_DIR}/aide.db.new.gz" ]; then
                cp "${DB_DIR}/aide.db.new.gz" "${TARGET_DB}"
            fi
        else
            aide --init -y || true
            if [ -f "${DB_DIR}/aide.db.new" ]; then
                cp "${DB_DIR}/aide.db.new" "${TARGET_DB}"
            fi
        fi
        echo "[+] Security database successfully initialized and placed onto active production tracking paths."
      args:
        executable: /bin/bash
      when:
        - "not failsafe_runtime_only_mode | bool"
        - "not ansible_check_mode"
      failed_when: false
      become: true
