          WantedBy=timers.target
        owner: root
        group: root
        mode: '0644'
      notify: "Reload Active Systemd Core"

    - name: "AIDE | AUTOMATION | Deploy post-transaction pacman database hook"
      ansible.builtin.copy:
        dest: "/etc/pacman.d/hooks/99-aide-update.hook"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Trigger]
          Operation = Install
          Operation = Upgrade
          Operation = Remove
          Type = Package
          Target = *

          [Action]
          Description = Synchronizing filesystem baseline matrix...
          When = PostTransaction
          Depends = aide
          Exec = /bin/bash -c 'if [ "\$(cat /sys/block/\$(lsblk -no PKNAME "\$(findmnt -n -o SOURCE /)" | head -n1 | tr -d "[:space:]")/queue/rotational 2>/dev/null)" = "1" ]; then echo "[!] Platter drive profile active. Bypassing AIDE loop."; exit 0; fi; /usr/bin/aide --update && mv /var/lib/aide/aide.db.new /var/lib/aide/aide.db || true'
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"

    - name: "INTEGRITY AUTOMATION | DEBIAN | Deploy transaction apt invocation filters"
      ansible.builtin.copy:
        dest: "/etc/apt/apt.conf.d/99aide-update"
        owner: root
        group: root
        mode: '0644'
        content: |
          DPkg::Post-Invoke { "if [ -x /usr/bin/aide ]; then echo '[+] Updating AIDE database...'; aide --update && mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz || true; fi"; };
      when: "ansible_facts['os_family'] == 'Debian' and not ansible_check_mode"

    - name: "INTEGRITY AUTOMATION | REDHAT | Deploy custom dnf transaction wrappers"
      ansible.builtin.copy:
        dest: "/etc/dnf/plugins/aide_update.py"
        owner: root
        group: root
        mode: '0644'
        content: |
          import os
          from dnfpluginscore import DnfPlugin
          class AideUpdatePlugin(DnfPlugin):
              name = 'aide_update'
              def __init__(self, base, cli):
                  super(AideUpdatePlugin, self).__init__(base, cli)
              def transaction(self):
                  os.system("aide --update && mv -f /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz >/dev/null 2>&1 || true")
      when: "ansible_facts['os_family'] == 'RedHat' and not ansible_check_mode"

    - name: "INTEGRITY AUTOMATION | SUSE | Deploy dynamic post-transaction zypper hooks"
