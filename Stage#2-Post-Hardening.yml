      ansible.builtin.copy:
        dest: "/usr/bin/vpn-leak-monitor"
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/usr/bin/env bash
          set -euo pipefail
          echo "[+] Active zero-trust perimeter network monitor initialized."
          while true; do
              if [ "$(firewall-cmd --state 2>/dev/null || echo 'down')" != "running" ]; then
                  sleep 2
                  continue
              fi

              ACTIVE_INTERFACES=$(ip -br link show | awk '$3 ~ /UP/ {print $1}')
              TUNNEL_FOUND=false
              if [[ "${ACTIVE_INTERFACES}" =~ (proton|pvpn|tun|wg) ]]; then
                  TUNNEL_FOUND=true
              fi

              if [ -f /run/portal_bypass_active ]; then
                  if [ "${TUNNEL_FOUND}" = "true" ]; then
                      wall "[✓] ZERO-TRUST ENGAGED: VPN Tunnel Established. Subsystem Armor Fully Restored Automatically." 2>/dev/null || true
                      rm -f /run/portal_bypass_active
                      sudo firewall-cmd --permanent --zone=drop --remove-rich-rule='rule family="ipv4" service name="http" accept' 2>/dev/null || true
                      sudo firewall-cmd --permanent --zone=drop --remove-rich-rule='rule family="ipv4" service name="https" accept' 2>/dev/null || true
                      sudo firewall-cmd --reload >/dev/null 2>&1 || true
                  else
                      wall "[⚠️] ZERO-TRUST WARNING: Captive Portal Bypass Active! System armor is temporarily lowered for network authentication." 2>/dev/null || true
                      sleep 5
                      continue
                  fi
              fi

              ACTIVE_TRUSTED=$(firewall-cmd --zone=trusted --list-interfaces 2>/dev/null || echo "")
              ACTIVE_SOURCES=$(firewall-cmd --zone=trusted --list-sources 2>/dev/null || echo "")

              if [ "${TUNNEL_FOUND}" = "false" ] && [[ ! "${ACTIVE_TRUSTED}" =~ (proton|pvpn|tun|wg) ]] && [[ ! "${ACTIVE_SOURCES}" =~ (proton|pvpn|tun|wg) ]]; then
                  sleep 2
                  RECHECK_INTERFACES=$(ip -br link show | awk '$3 ~ /UP/ {print $1}')
                  if [[ ! "${RECHECK_INTERFACES}" =~ (proton|pvpn|tun|wg) ]]; then
                      wall "[-] ZERO-TRUST ALERT: VPN Leakage Perimeter Breach Detected! Physical interfaces remain trapped inside DROP zone containment blocks." 2>/dev/null || true
                  fi
              fi
              sleep 5
          done

