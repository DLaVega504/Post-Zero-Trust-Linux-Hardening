# =============================================================================
# BLOCK 87: PERSISTENT DEFENSE UTILITIES LIFECYCLE CONTROLS
# DESCRIPTION: Headlessly registers, enables, and activates all system defense
#              subsystems and data monitoring engines across distributions.
# =============================================================================
    - name: "SECURITY SERVICES | BOOT | Universally manage baseline defense utilities state"
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        masked: false
        state: started
      loop: >-
        {%- set hw_interface = primary_network_interface | default('wls1') | trim -%}
        {%- set base_services = [
          'firewalld.service',
          'fail2ban.service',
          'usbguard.service',
          'auditd.service',
          'earlyoom.service',
          'vpn-leak-protection.service',
          'aide-check.timer',
          'tripwire-check.timer'
        ] -%}
        {%- if ansible_facts['os_family'] == 'Archlinux' -%}
          {{ base_services + [
              'sysstat.service',
              'sysstat.timer',
              'arpwatch@' ~ hw_interface ~ '.service',
              'snort@' ~ hw_interface ~ '.service'
             ] }}
        {%- elif ansible_facts['os_family'] == 'Debian' -%}
          {{ base_services + ['sysstat.service', 'arpwatch@' ~ hw_interface ~ '.service', 'snort-init.service'] }}
        {%- else -%}
          {{ base_services + ['sysstat.service', 'arpwatch.service', distro_matrix[ansible_facts['os_family']]['snort_service_name'] | default('snort.service')] }}
        {%- endif -%}
      failed_when: false
      ignore_errors: true
      become: true
      when: "not ansible_check_mode"
          
# =============================================================================
# BLOCK 89: COMPLIANCE METRICS CALCULATION ENGINE (FIXED STRING LOGIC)
# DESCRIPTION: Triggers a post-hardening sweep, reads the index cleanly out
#              of filesystems, and computes historical and current scores.
# =============================================================================
    - name: "COMPLIANCE | CACHE | Initialize fallback post-score tracker fact to prevent execution drop"
      ansible.builtin.set_fact:
        dynamic_post_score_cached: "{{ raw_cached_lynis_post_score.content | b64decode | trim if (raw_cached_lynis_post_score.content is defined and raw_cached_lynis_post_score.content) else none }}"

    - name: "COMPLIANCE | Run post-deployment security hardening verification scan"
      ansible.builtin.shell: "lynis audit system --profile /etc/lynis/custom.prf --quick"
      args:
        executable: /bin/bash
      register: post_lynis_scan
      failed_when: false
      changed_when: false
      when:
        - "not ansible_check_mode"
        - "dynamic_post_score_cached is none or system_was_modified | default(false) | bool"

    - name: "COMPLIANCE | Slurp the persistent post-scan report database directly from disk"
      ansible.builtin.slurp:
        src: "/var/log/lynis-report.dat"
      register: raw_post_lynis_report_dat
      failed_when: false
      when:
        - "not ansible_check_mode"
        - "dynamic_post_score_cached is none or system_was_modified | default(false) | bool"

    - name: "COMPLIANCE | Calculate real-time framework execution metrics"
      ansible.builtin.set_fact:
        lynis_pre_score_final: "{{ dynamic_pre_score | default(65) | int }}"
        lynis_post_score_final: >-
          {%- if raw_post_lynis_report_dat is defined and raw_post_lynis_report_dat.content is defined -%}
            {%- set report_lines = (raw_post_lynis_report_dat.content | b64decode).split('\n') -%}
            {%- set ns = namespace(found_score=none) -%}
            {%- for line in report_lines -%}
              {%- if line.startswith('hardening_index=') -%}
                {%- set ns.found_score = (line.split('='))[1] | trim | int -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.found_score if ns.found_score is not none else (dynamic_post_score_cached if (dynamic_post_score_cached is not none and dynamic_post_score_cached != 'None') else (dynamic_pre_score | default(65) | int)) }}
          {%- else -%}
            {{ dynamic_post_score_cached if (dynamic_post_score_cached is not none and dynamic_post_score_cached != 'None') else (dynamic_pre_score | default(65) | int) }}
          {%- endif -%}

    - name: "COMPLIANCE | CACHE | Enforce presence of local Lynis metric storage directory"
      ansible.builtin.file:
        path: "/var/cache/lynis"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: "not ansible_check_mode"

    - name: "COMPLIANCE | Save newly calculated final post-hardening metric to persistent disk cache"
      ansible.builtin.copy:
        dest: "/var/cache/lynis/post_score.metric"
        content: "{{ lynis_post_score_final | string }}"
        owner: root
        group: root
        mode: '0600'
      when:
        - "not ansible_check_mode"
        - "raw_post_lynis_report_dat is defined and raw_post_lynis_report_dat.content is defined"

    - name: "COMPLIANCE | Calculate performance delta values"
      ansible.builtin.set_fact:
        stage2_point_delta: "{{ (lynis_post_score_final | int) - (lynis_pre_score_final | int) }}"

