# =============================================================================
# BLOCK 74: FRAMEWORK DESIGNATION LEDGER COMPILATION
# DESCRIPTION: Generates the structural compliance JSON data matrix for local
#              audit consumption and Stage 3 tracking integrations.
# =============================================================================
    - name: "FRAMEWORK DESIGNATION | LEDGER | Generate dynamic compliance specification sheet for Stage 3 deployment"
      ansible.builtin.copy:
        dest: "/etc/zero-trust-ledger.json"
        owner: root
        group: root
        mode: '0600'
        content: |
          {
            "framework_provenance": {
              "stage2_deployment_timestamp": "{{ ansible_facts['date_time']['isoformat_extended'] | default('2026-09-25T00:00:00') }}",
              "target_os_family": "{{ ansible_facts['os_family'] }}",
              "target_distribution": "{{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}",
              "system_hostname": "{{ ansible_facts['hostname'] }}"
            },
            "hardware_cognitive_topology": {
              "storage_media_type": "{{ 'MECHANICAL_HDD_PLATTER' if is_mechanical_drive | bool else 'FLASH_CELL_SSD' }}",
              "system_ram_allocated_gb": {{ system_ram_gb | int }},
              "chassis_form_factor": "{{ hardware_form_factor | trim }}",
              "primary_active_hardware_interface": "{{ primary_network_interface | default('wls1') }}"
            },
            "disk_geometry_and_layout": {
              "boot_firmware_type": "{{ 'UEFI_SECURE_MODE' if is_uefi_mode | bool else 'LEGACY_BIOS_ARCHITECTURE' }}",
              "root_filesystem_signature": "{{ 'BTRFS_SUBVOLUME_MATRIX' if is_btrfs_layout | bool else 'TRADITIONAL_BLOCK_FILESYSTEM' }}",
              "persistent_root_uuid": "{{ active_root_uuid }}",
              "is_fortress_nested_case": {{ true if security_architecture_profile == 'fortress' else false }}
            },
            "applied_security_hardening_improvements": {
              "at_rest_storage_encryption": {{ root_disk_is_encrypted | bool }},
              "bootloader_password_protected": {{ boot_password_is_protected | bool }},
              "secure_vault_subvolume_active": {{ secure_vault_enabled | bool if (is_btrfs_layout | bool and not failsafe_runtime_only_mode | bool) else false }},
              "allocated_swap_footprint_mb": {{ target_formula_swap_mb | int }},
              "applied_memory_swappiness_tuning": {{ target_swappiness | int }},
              "userland_oom_defense_engine": "{{ oom_engine_selection }}"
            },
            "stage3_deployment_directives": {
              "established_compliance_tier": "{{ security_tier_grade | regex_replace('^[^A-Za-z0-9]*', '') | regex_replace('[^A-Za-z0-9 ]*$', '') | trim }}",
              "framework_operational_topology": "{{ 'STACKABLE_MODULAR_INTEGRATION' if stackable_mode | bool else 'AUTONOMOUS_STANDALONE_COMPLIANCE' }}"
            }
          }
      when: "not ansible_check_mode"
      become: true
# =============================================================================
# BLOCK 75: POST-HARDENING DEPLOYMENT ASYNCHRONOUS HANDLERS
# DESCRIPTION: Mounts low-overhead asynchronous execution queues to trigger
#              systemd unit reloads and kernel state refreshes when called.
# =============================================================================
  handlers:
    - name: "Reload Active Systemd Core"
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    - name: "Trigger Active System Kernel Flush"
      ansible.builtin.shell: "sysctl --system"
      args:
        executable: /bin/bash
      become: true

    - name: "Reload Firewalld Configuration"
      ansible.builtin.shell: "firewall-cmd --reload"
      args:
        executable: /bin/bash
      become: true

    - name: "Compile System Boot Configuration Matrix"
      ansible.builtin.shell: "{{ distro_matrix[ansible_facts['os_family']]['grub_compile_cmd'] | default('grub-mkconfig') }} -o {{ distro_matrix[ansible_facts['os_family']]['grub_config_bios'] | default('/boot/grub/grub.cfg') }}"
      args:
        executable: /bin/bash
      become: true
      
