# =============================================================================
# BLOCK 41: EVOLVED ADAPTIVE VAULT EXECUTION UTILITY (PART 1)
# DESCRIPTION: Configures dynamic path structures inside environmental runtimes
#              to enforce authorization control checks for secure vault tools.
# =============================================================================
    - name: "VAULT ENGINE | DIRECTORY | Ensure secure core vault path environment exists"
      ansible.builtin.file:
        path: "/run/vault"
        state: directory
        owner: root
        group: "{{ detected_admin_group | default('wheel') }}"
        mode: '0750'
      become: true

# =============================================================================
# BLOCK 42: EVOLVED ADAPTIVE VAULT EXECUTION UTILITY (PART 2)
# DESCRIPTION: Constructs the dynamic multi-vault quota-enforcing wrapper utility
#              to manage open/close workflows and access boundaries.
# =============================================================================
    - name: "VAULT ENGINE | CORE | Construct automated multi-layer quota-enforcing wrapper utilities"
      ansible.builtin.copy:
        dest: "/usr/bin/vault"
        content: |
          #!/bin/bash
          set -euo pipefail

          MIN_LIMIT={{ vault_minimum_size_threshold_gb | default(15) | int }}
          FAILSAFE_ACTIVE={{ 'true' if failsafe_runtime_only_mode | default(false) | bool else 'false' }}
          HUMAN_OPERATOR="{{ primary_human_operator | default('vega') }}"
          ADMIN_GRP="{{ detected_admin_group | default('wheel') }}"
          TOPOLOGY_MAP="/etc/vault-topology.conf"

          if [ "$(id -u)" -ne 1000 ] && [ "$(id -u)" -ne 0 ] && ! groups | grep -q -E "(${ADMIN_GRP}|root)"; then
             echo "[-] ACCESS DENIED: Core cryptographic storage controls are restricted." >&2
             exit 1
          fi

          if [ "$#" -lt 2 ] || [[ ! "$1" =~ ^(open|close)$ ]]; then
             echo "[-] USAGE: vault [open|close] [vault_name]" >&2
             exit 1
          fi

          ACTION="$1"
          TARGET_NAME="$2"
          VAULT_DEV=""
          V_SIZE=0

          if [ -f "${TOPOLOGY_MAP}" ]; then
             while IFS=: read -r vname vpath vsize || [ -n "$vname" ]; do
                [[ -z "$vname" || "$vname" =~ ^# ]] && continue
                if [ "${vname}" = "${TARGET_NAME}" ]; then
                   VAULT_DEV="${vpath}"
                   V_SIZE="${vsize}"
                   break
                fi
             done < "${TOPOLOGY_MAP}"
          fi

          if [ -z "${VAULT_DEV}" ]; then
             echo "[-] CONFIGURATION ERROR: Vault moniker '${TARGET_NAME}' is unmapped in topology ledger." >&2
             exit 1
          fi

          MNT_TARGET="/run/vault/${TARGET_NAME}"
          MAPPER_NAME="vault_storage_${TARGET_NAME}"

          if [ "${ACTION}" == "open" ]; then
             if [ "${FAILSAFE_ACTIVE}" = "true" ]; then
                sudo mkdir -p "${MNT_TARGET}"
                sudo chmod 0750 "${MNT_TARGET}"
                echo "[!] Failsafe Open: Directory initialized directly over unencrypted storage."
             else
                if [ ! -f "/etc/vault_${TARGET_NAME}.key" ]; then
                    sudo dd if=/dev/urandom of="/etc/vault_${TARGET_NAME}.key" bs=1 count=256 status=none
                    sudo chmod 0600 "/etc/vault_${TARGET_NAME}.key"
                    sudo cryptsetup luksAddKey "${VAULT_DEV}" "/etc/vault_${TARGET_NAME}.key"
                fi
                sudo cryptsetup open "${VAULT_DEV}" "${MAPPER_NAME}" --key-file "/etc/vault_${TARGET_NAME}.key"
                sudo mkdir -p "${MNT_TARGET}"
                sudo mount -o noatime,compress=zstd:1,space_cache=v2 "/dev/mapper/${MAPPER_NAME}" "${MNT_TARGET}" || sudo mount "/dev/mapper/${MAPPER_NAME}" "${MNT_TARGET}"
                echo "[+] Vault storage volume '${TARGET_NAME}' successfully opened."
             fi

             sudo chown "${HUMAN_OPERATOR}:${ADMIN_GRP}" "${MNT_TARGET}"
             if [ "${V_SIZE}" -lt "${MIN_LIMIT}" ]; then
                sudo chmod 1700 "${MNT_TARGET}"
                echo "[*] Capacity constraint < 15GB active. Multi-tenant profiles restricted for '${TARGET_NAME}'."
             else
                sudo groupadd -f vault 2>/dev/null || true
                sudo chown "root:vault" "${MNT_TARGET}"
                sudo chmod 1770 "${MNT_TARGET}"
                echo "[*] Multi-tenant storage enabled. Sticky boundaries applied to group 'vault'."
             fi

          elif [ "${ACTION}" == "close" ]; then
             sudo umount -f "${MNT_TARGET}" || true
             if [ "${FAILSAFE_ACTIVE}" = "false" ]; then
                sudo cryptsetup close "${MAPPER_NAME}" || true
             fi
             sudo rmdir "${MNT_TARGET}" 2>/dev/null || true
             echo "[+] Vault volume '${TARGET_NAME}' completely locked and secured."
          fi
        mode: '0750'
        owner: root
        group: "{{ detected_admin_group | default('wheel') }}"
      when: "secure_vault_enabled | bool"
# =============================================================================
# BLOCK 43: EVOLVED ADAPTIVE VAULT EXECUTION UTILITY (PART 3)
