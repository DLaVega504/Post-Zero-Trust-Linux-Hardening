# =============================================================================
# BLOCK 89: COMPLIANCE METRICS CALCULATION ENGINE
# DESCRIPTION: Triggers a post-hardening sweep on cache misses/modifications,
#              saves results, and cleanly isolates live dynamic audit indices.
# =============================================================================
    - name: "COMPLIANCE | Run post-deployment security hardening verification scan"
      ansible.builtin.shell: "lynis audit system --profile /etc/lynis/custom.prf --quick"
      args:
        executable: /bin/bash
      register: post_lynis_scan
      failed_when: false
      changed_when: false
      when:
        - "not ansible_check_mode"
        - "dynamic_post_score_cached is none or system_was_modified | bool"

    - name: "COMPLIANCE | Slurp the persistent post-scan report database directly from disk"
      ansible.builtin.slurp:
        src: "/var/log/lynis-report.dat"
      register: raw_post_lynis_report_dat
      failed_when: false
      when:
        - "not ansible_check_mode"
        - "dynamic_post_score_cached is none or system_was_modified | bool"

    - name: "COMPLIANCE | Calculate real-time framework execution metrics"
      ansible.builtin.set_fact:
        lynis_pre_score_final: "{{ dynamic_pre_score | int }}"
        lynis_post_score_final: >-
          {%- if raw_post_lynis_report_dat is defined and raw_post_lynis_report_dat.content is defined -%}
            {%- set report_lines = (raw_post_lynis_report_dat.content | b64decode).split('\n') -%}
            {%- set ns = namespace(found_score=none) -%}
            {%- for line in report_lines -%}
              {%- if line.startswith('hardening_index=') -%}
                {%- set ns.found_score = (line.split('=')[1]) | trim | int -%}
              {%- endif -%}
            {%- endfor -%}
            {{ ns.found_score if ns.found_score is not none else (dynamic_post_score_cached if (dynamic_post_score_cached is not none and dynamic_post_score_cached != 'None') else (dynamic_pre_score | int)) }}
          {%- else -%}
            {{ dynamic_post_score_cached if (dynamic_post_score_cached is not none and dynamic_post_score_cached != 'None') else (dynamic_pre_score | int) }}
          {%- endif -%}

    - name: "COMPLIANCE | Save newly calculated final post-hardening metric to persistent disk cache"
      ansible.builtin.copy:
        dest: "/var/cache/lynis/post_score.metric"
        content: "{{ lynis_post_score_final | string }}"
        owner: root
        group: root
        mode: '0600'
      when:
        - "not ansible_check_mode"
        - "raw_post_lynis_report_dat is defined and raw_post_lynis_report_dat.content is defined"

    - name: "COMPLIANCE | Calculate performance delta values"
      ansible.builtin.set_fact:
        stage2_point_delta: "{{ (lynis_post_score_final | int) - (lynis_pre_score_final | int) }}"

    - name: "COMPLIANCE | Compute professional 4-tier attestation designations"
      ansible.builtin.set_fact:
        security_tier_grade: >-
          {% if compliance_track_level_3 | bool %}
          🥇 [ LEVEL 3: FULL-STACK ZERO-TRUST CERTIFIED ]
          {% elif compliance_retrospective_level_1 | bool %}
          🥉 [ LEVEL 1: RETROSPECTIVE BASELINE ATTESTATION ]
          {% elif failsafe_runtime_only_mode | bool %}
          ⚠️  [ LEVEL 0: CERTIFICATE OF OPERATIONAL HARDENING & ISOLATION ]
          {% else %}
          🥈 [ LEVEL 2: STANDALONE HARDENING COMPLIANT ]
          {% endif %}

