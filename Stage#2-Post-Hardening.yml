# =============================================================================
# BLOCK 85: SECURITY LIFECYCLE RECOVERY & RESET PARAMETERS
# DESCRIPTION: Headlessly flushes failure records across local monitor daemons,
#              and cleans lock stacks on fail2ban storage interfaces.
# =============================================================================
    - name: "SECURITY SERVICES | RECOVERY | Flush systemd service failure caches"
      ansible.builtin.shell: |
        systemctl reset-failed usbguard.service || true
        systemctl reset-failed snort@{{ primary_network_interface | default('wls1') | trim }}.service || true
        systemctl reset-failed earlyoom.service || true
      args:
        executable: /bin/bash
      failed_when: false
      become: true
      when: "not ansible_check_mode"

    - name: "SECURITY SERVICES | FAIL2BAN | Flush stale tracking sockets to prevent timeout hangs"
      ansible.builtin.shell: |
        set -o pipefail
        systemctl stop fail2ban || true
        killall -9 fail2ban-server || true
        rm -f /var/run/fail2ban/fail2ban.sock
      args:
        executable: /bin/bash
      failed_when: false
      changed_when: false
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 86: DAEMON SYSTEMD RESET CONTROL STRATUMS
