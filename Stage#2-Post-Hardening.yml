# =============================================================================
# BLOCK 66: INTRUSION DETECTION | TRIPWIRE CRITICAL POLICY BLUEPRINTS
# DESCRIPTION: Deploys standardized cleartext policy blocks targeting core
#              credential tables and executable containment anchors.
# =============================================================================
    - name: "INTRUSION DETECTION | TRIPWIRE | Deploy standardized security policy template text"
      ansible.builtin.copy:
        dest: "/etc/tripwire/twpol.txt"
        content: |
          # Standard Post-Hardening Core Policy Blueprint
          @@section FS
          SEC_CRITICAL    = +pinugsmdbcmshatd ;

          # Critical Security Credentials Table Locks
          /etc/passwd   -> $(SEC_CRITICAL) ;
          /etc/group    -> $(SEC_CRITICAL) ;
          /etc/shadow   -> $(SEC_CRITICAL) ;
          /etc/sudoers  -> $(SEC_CRITICAL) ;

          # Executable Binary Containment Anchors
          /usr/bin      -> $(SEC_CRITICAL) ;
          /usr/sbin     -> $(SEC_CRITICAL) ;
        owner: root
        group: root
        mode: '0600'
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 67: MULTI-DISTRIBUTION FILE INTEGRITY SIGNATURE INITIALIZATION
# DESCRIPTION: Automates pristine baseline compilation sequences for
#              AIDE frameworks across platform storage cells on cache misses.
# =============================================================================
    - name: "INTRUSION DETECTION | MULTI-DISTRO SCAN | Initialize pristine file integrity tracking database"
      ansible.builtin.shell: |
        set -euo pipefail
        if [ "{{ is_mechanical_drive | bool }}" = "true" ]; then
            echo "[!] Platter drive profile active. Bypassing automatic initialization loops."
            exit 0
        fi

        OS_FAMILY="{{ ansible_facts['os_family'] }}"
        DB_DIR="/var/lib/aide"

        if [ "${OS_FAMILY}" = "Archlinux" ] || [ "${OS_FAMILY}" = "Suse" ]; then
            TARGET_DB="${DB_DIR}/aide.db"
        elif [ "${OS_FAMILY}" = "Debian" ] || [ "${OS_FAMILY}" = "RedHat" ]; then
            TARGET_DB="${DB_DIR}/aide.db.gz"
        else
            TARGET_DB="${DB_DIR}/aide.db"
        fi

        if [ -f "${TARGET_DB}" ]; then
            echo "[+] Pristine cryptographic signature baseline verified. Skipping loop."
            exit 0
        fi

        mkdir -p "${DB_DIR}"

        if [ "${OS_FAMILY}" = "Debian" ]; then
            aideinit -y || true
            if [ -f "${DB_DIR}/aide.db.new" ] && [ ! -f "${TARGET_DB}" ]; then
                cp "${DB_DIR}/aide.db.new" "${TARGET_DB}"
            fi
        elif [ "${OS_FAMILY}" = "Archlinux" ]; then
            aide --init -y || true
            if [ -f "${DB_DIR}/aide.db.new" ]; then
                cp "${DB_DIR}/aide.db.new" "${TARGET_DB}"
            fi
        elif [ "${OS_FAMILY}" = "RedHat" ]; then
            aide --init -y || true
            if [ -f "${DB_DIR}/aide.db.new.gz" ]; then
                cp "${DB_DIR}/aide.db.new.gz" "${TARGET_DB}"
            fi
        else
            aide --init -y || true
            if [ -f "${DB_DIR}/aide.db.new" ]; then
                cp "${DB_DIR}/aide.db.new" "${TARGET_DB}"
            fi
        fi
      args:
        executable: /bin/bash
      when:
        - "not failsafe_runtime_only_mode | bool"
        - "not ansible_check_mode"
      failed_when: false
      become: true
