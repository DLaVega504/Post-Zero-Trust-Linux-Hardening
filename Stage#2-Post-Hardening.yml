        firewall-cmd --permanent --set-default-zone=public
        firewall-cmd --permanent --zone=trusted --remove-interface=lo 2>/dev/null || true
        firewall-cmd --permanent --zone=trusted --add-source=127.0.0.1/8
        firewall-cmd --permanent --zone=trusted --add-source=::1/128

        for interface_regex in "tun+" "wg+" "proton+" "pvpn+"; do
