  handlers:
    - name: "Trigger Active System Kernel Flush"
      ansible.builtin.command: "sysctl --system"

    - name: "Reload Active Systemd Core"
      ansible.builtin.systemd:
        daemon_reload: true

    - name: "Reload Firewalld Configuration"
      ansible.builtin.command: "firewall-cmd --reload"

    - name: "Reload Active System Services Profiles"
      ansible.builtin.systemd:
        name: auditd
        state: restarted
      failed_when: false

