# =============================================================================
# BLOCK 46: DYNAMIC LOGON PER-USER ENV ALIAS MATRIX (FINAL SYNCHRONIZED)
# DESCRIPTION: Sets interactive shortcut mapping templates inside environment variables
#              to automatically configure user profile session aliases cleanly.
# =============================================================================
    - name: "VAULT ENGINE | ALIASES | Enforce dynamic terminal environment hooks"
      ansible.builtin.copy:
        dest: "/etc/profile.d/vault_aliases.sh"
        content: |
          # =================================================================
          # AUTOMATED ZERO-TRUST DYNAMIC MULTI-DISTRO VAULT ALIAS GENERATOR
          # =================================================================
          # Verifies user identities securely before mapping execution aliases
          if [ "$(id -un)" = "{{ primary_human_operator | default('vega') }}" ] || [ "$(id -u)" -eq 0 ] || groups | grep -q -E '({{ detected_admin_group | default('wheel') }}|wheel|sudo|root)'; then
              if [ -f /etc/vault-topology.conf ]; then
                  while IFS=: read -r vault_name device_path size_gb || [ -n "$vault_name" ]; do
                      # Safe exclusion for comment blocks or empty lines inside the config mapping ledger
                      [[ -z "$vault_name" || "$vault_name" =~ ^# ]] && continue
                      
                      # Clean string mapping initialization to protect shell token boundaries
                      CLEAN_MONIKER=$(echo "${vault_name}" | tr -d '[:space:]')
                      
                      # Map un-falsifiable terminal shortcut operations cleanly into the system variables matrix
                      alias "${CLEAN_MONIKER}-open"="sudo /usr/bin/vault open ${CLEAN_MONIKER}"
                      alias "${CLEAN_MONIKER}-close"="sudo /usr/bin/vault close ${CLEAN_MONIKER}"
                  done < /etc/vault-topology.conf
              fi
          fi
        owner: root
        group: root
        mode: '0644'
      when: "secure_vault_enabled | bool"

# =============================================================================
