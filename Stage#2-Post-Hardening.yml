           firewall-cmd --permanent --zone=trusted --add-interface="${interface_regex}" 2>/dev/null || true
           {% endraw %}
        done

        for physical_card in $(echo "{{ active_network_interfaces.stdout | default('wls1') }}" | tr ',' ' '); do
           if [[ "${physical_card}" =~ ^(proton|pvpn|tun|wg) ]]; then
              echo "[*] Skipping VPN tunnel containment bypass for: ${physical_card}"
              firewall-cmd --permanent --zone=drop --remove-interface="${physical_card}" 2>/dev/null || true
