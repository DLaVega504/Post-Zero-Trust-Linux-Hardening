# =============================================================================
# BLOCK 48: LINK-LAYER ARPWATCH OVERRIDE SANDBOXING (PART 1)
# DESCRIPTION: Ensures master environment paths are configuration safe and touches
#              active host tracking files across targeted card identifiers.
# =============================================================================
    - name: "COMPLIANCE | ARPWATCH | CONFIGURATION | Ensure master configuration path exists"
      ansible.builtin.file:
        path: "/etc/arpwatch"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: "ansible_facts['os_family'] == 'Archlinux' and not ansible_check_mode"
      become: true

    - name: "COMPLIANCE | ARPWATCH | CONFIGURATION | Enforce missing system working directory"
      ansible.builtin.file:
        path: "/usr/arpwatch"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: "ansible_facts['os_family'] == 'Archlinux' and not ansible_check_mode"
      become: true

