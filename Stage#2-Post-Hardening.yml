        enabled: true
      failed_when: false
      when: "not ansible_check_mode"

# =============================================================================
# PHASE 8: IMMUTABLE AUDITING, CREDENTIAL ENCRYPTION & KERNEL SYSTEM CALL TREES
# DESCRIPTION: Enforces high-entropy cryptographic password stretching factors,
# purges default auditing blueprints, and locks down an absolute, un-falsifiable
# kernel system call tracking engine capped with the immutable lock (-e 2).
# =============================================================================
    - name: "PAM | HARDENING | Inject strict password stretching algorithm limits into system auth"
      ansible.builtin.lineinfile:
        path: "/etc/login.defs"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: "^#?ENCRYPT_METHOD", line: "ENCRYPT_METHOD SHA512" }
        - { regexp: "^#?SHA_CRYPT_MIN_ROUNDS", line: "SHA_CRYPT_MIN_ROUNDS 65536" }
        - { regexp: "^#?SHA_CRYPT_MAX_ROUNDS", line: "SHA_CRYPT_MAX_ROUNDS 65536" }
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Force rounds parameter match inside system authentication configurations"
      ansible.builtin.lineinfile:
        path: "/etc/pam.d/system-auth"
        regexp: "^password\\s+required\\s+pam_unix.so"
        line: "password required pam_unix.so sha512 shadow rounds=65536 try_first_pass use_authtok"
        state: present
      failed_when: false
      when: "not ansible_check_mode"

     - name: "AUDITD | ENFORCE PARENT PATHS | Ensure rule directories exist for Debian architectures"
      ansible.builtin.file:
        path: "/etc/audit/rules.d"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"

    - name: "AUDITD | Enforce optimized local data management rotations parameters"
      ansible.builtin.lineinfile:
        path: "/etc/audit/auditd.conf"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: "present"
      loop:
        - { regexp: "^max_log_file\\s+=", line: "max_log_file = 50" }
        - { regexp: "^max_log_file_action\\s+=", line: "max_log_file_action = ROTATE" }
        - { regexp: "^space_left_action\\s+=", line: "space_left_action = SYSLOG" }
        - { regexp: "^admin_space_left_action\\s+=", line: "admin_space_left_action = SUSPEND" }
      when: "not ansible_check_mode"

    - name: "AUDITD | Clean conflicting pre-existing default tracking blueprints"
      ansible.builtin.file:
        path: "/etc/audit/rules.d/audit.rules"
        state: "absent"
      when: "not ansible_check_mode"

    - name: "AUDITD | Deploy un-falsifiable zero-trust kernel logging rules matrix"
      ansible.builtin.copy:
        dest: "/etc/audit/rules.d/audit.rules"
        content: |
          -D
          -b 8192
          -f 2
          -w /etc/group -p wa -k security_credentials
          -w /etc/passwd -p wa -k security_credentials
          -w /etc/shadow -p wa -k security_credentials
          -w /etc/sudoers -p wa -k security_privileges
          -w /etc/sudoers.d/ -p wa -k security_privileges
          -w /etc/fstab -p wa -k filesystem_ledgers
          -w /etc/crypttab -p wa -k filesystem_ledgers
          -a always,exit -F arch=b64 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k privilege_escalation
          -a always,exit -F arch=b32 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k privilege_escalation
          -a always,exit -F arch=b64 -S execve -F auid>=1000 -F auid!=4294967295 -k process_execution
          -a always,exit -F arch=b32 -S execve -F auid>=1000 -F auid!=4294967295 -k process_execution
          -w /etc/usbguard/rules.conf -p wa -k peripheral_security
          -w /etc/aide.conf -p wa -k integrity_monitoring
          -w /etc/aide/aide.conf -p wa -k integrity_monitoring
          -e 2
        owner: "root"
        group: "root"
        mode: "0600"
      when: "not ansible_check_mode"

