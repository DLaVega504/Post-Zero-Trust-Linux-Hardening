            ↳ DETECTED DRIVE MEDIA post-opt: [ {{ 'MECHANICAL_HDD_PLATTER' if is_mechanical_drive | bool else 'FLASH_CELL_SSD' }} ]
            ↳ CALCULATED CORE SWAP BOUNDARY: [ {{ target_formula_swap_mb | int }} MB file fallback ]
