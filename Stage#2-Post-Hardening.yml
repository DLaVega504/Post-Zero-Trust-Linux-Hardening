# =============================================================================
# BLOCK 30F: REAL-TIME NETWORK MONITORING DAEMONS
# DESCRIPTION: Deploys background network perimeter monitoring tools and initializes custom systemd services.
# =============================================================================

    - name: "SECURITY | ENGINE | Deploy real-time background VPN leak monitoring daemon"
      ansible.builtin.copy:
        dest: "/usr/bin/vpn-leak-monitor"
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          set -euo pipefail
          echo "[+] Active zero-trust perimeter network monitor initialized."
          while true; do
              ACTIVE_TRUSTED=$(firewall-cmd --zone=trusted --list-interfaces 2>/dev/null || echo "")
              ACTIVE_SOURCES=$(firewall-cmd --zone=trusted --list-sources 2>/dev/null || echo "")
              
              # First verification check: Is the VPN missing?
              if [[ ! "${ACTIVE_TRUSTED}" =~ (proton|pvpn|tun|wg) ]] && [[ ! "${ACTIVE_SOURCES}" =~ (proton|pvpn|tun|wg) ]]; then
                  
                  # ⏳ The 2-Second Debounce Window: Wait for routine firewall reloads to settle
                  sleep 2
                  
                  # Second verification check: Re-probe the live hardware links
                  RECHECK_TRUSTED=$(firewall-cmd --zone=trusted --list-interfaces 2>/dev/null || echo "")
                  RECHECK_SOURCES=$(firewall-cmd --zone=trusted --list-sources 2>/dev/null || echo "")
                  
                  # Confirm if it's a genuine leak breach or just a transient configuration flush
                  if [[ ! "${RECHECK_TRUSTED}" =~ (proton|pvpn|tun|wg) ]] && [[ ! "${RECHECK_SOURCES}" =~ (proton|pvpn|tun|wg) ]]; then
                      wall "[-] ZERO-TRUST ALERT: VPN Leakage Perimeter Breach Detected! Physical interfaces remain trapped inside DROP zone containment blocks." 2>/dev/null || true
                  fi
              fi
              sleep 5
          done

    - name: "SECURITY | DAEMON | Initialize background network perimeter service wrapper"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/vpn-leak-protection.service"
        mode: '0644'
        owner: root
        group: root
        content: |
          [Unit]
          Description=Universal Zero-Trust Framework VPN Leakage Guard Daemon
          After=network.target firewalld.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/vpn-leak-monitor
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
      become: true

    - name: "SECURITY | ENFORCEMENT | Launch background leak monitor utility service"
      ansible.builtin.systemd:
        name: "vpn-leak-protection.service"
        state: started
        enabled: true
      failed_when: false
      when: "not ansible_check_mode"
      become: true

# =============================================================================
# BLOCK 30G: SYSTEM PAM AUTHENTICATION & KERNEL AUDIT MATRIX
# DESCRIPTION: Enforces system-wide PAM stretching algorithms, account lockout rules, and un-falsifiable kernel loggers.
# =============================================================================

    - name: "PAM | HARDENING | Inject strict password stretching algorithm limits into system auth"
      ansible.builtin.lineinfile:
        path: "/etc/login.defs"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: "^#?ENCRYPT_METHOD", line: "ENCRYPT_METHOD SHA512" }
        - { regexp: "^#?SHA_CRYPT_MIN_ROUNDS", line: "SHA_CRYPT_MIN_ROUNDS 65536" }
        - { regexp: "^#?SHA_CRYPT_MAX_ROUNDS", line: "SHA_CRYPT_MAX_ROUNDS 65536" }
        - { regexp: "^#?UMASK\\s+", line: "UMASK           027" }
        - { regexp: "^#?FAILLOG_ENAB\\s+", line: "FAILLOG_ENAB yes" }
        - { regexp: "^#?LOG_UNKFAIL_ENAB\\s+", line: "LOG_UNKFAIL_ENAB yes" }
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Enforce universal baseline account password aging defaults"
      ansible.builtin.lineinfile:
        path: "/etc/login.defs"
        regexp: "^#?{{ item.key }}\\s+"
        line: "{{ item.key }} {{ item.value }}"
        state: present
      loop:
        - { key: 'PASS_MAX_DAYS', value: '90' }
        - { key: 'PASS_MIN_DAYS', value: '7' }
        - { key: 'PASS_WARN_AGE', value: '7' }
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Apply baseline password aging rules retroactively to existing active profiles"
      ansible.builtin.command: "chage -M 90 -m 7 -W 7 {{ item }}"
      loop: ["root", "{{ discovered_primary_user | default('vega') }}"]
      changed_when: false
      failed_when: false
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Standardize cross-distribution faillock lockout policy parameters"
      ansible.builtin.copy:
        dest: /etc/security/faillock.conf
        content: |
          # Automated Baseline Verification - Hardening Blueprint
          deny = 3
          unlock_time = 900
          fail_interval = 900
          audit
        mode: '0644'
        owner: root
        group: root
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Execute authselect feature profiles for RedHat and Fedora"
      ansible.builtin.command: authselect enable-feature with-faillock
      register: auth_rh_res
      changed_when: "'feature is already enabled' not in auth_rh_res.stderr"
      failed_when: false
      when:
        - "ansible_facts['os_family'] == 'RedHat'"
        - "not ansible_check_mode"

    - name: "PAM | HARDENING | Provision Debian specific profile automation blocks"
      ansible.builtin.copy:
        dest: /usr/share/pam-configs/faillock_hardening
        content: |
          Name: Enforce faillock via Automation
          Default: yes
          Priority: 0
          Auth-Type: Primary
          Auth:
          	[default=die] pam_faillock.so authfail
          	sufficient pam_faillock.so authsucc
        mode: '0644'
      when:
        - "ansible_facts['os_family'] == 'Debian'"
        - "not ansible_check_mode"

    - name: "PAM | HARDENING | Trigger native pam-auth-update mechanisms on Debian platforms"
      ansible.builtin.command: pam-auth-update --package --force
      changed_when: true
      when:
        - "ansible_facts['os_family'] == 'Debian'"
        - "not ansible_check_mode"

    - name: "PAM | HARDENING | Implement native pam-config parameters dynamically on openSUSE"
      ansible.builtin.command: pam-config --add --faillock
      register: pam_suse_res
      changed_when: true
      failed_when: false
      when:
        - "ansible_facts['os_family'] == 'Suse'"
        - "not ansible_check_mode"

    - name: "AUDITD | ENFORCE PARENT PATHS | Ensure rule directories exist for Debian architectures"
      ansible.builtin.file:
        path: "/etc/audit/rules.d"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"

    - name: "AUDITD | Enforce optimized local data management rotations parameters"
      ansible.builtin.lineinfile:
        path: "/etc/audit/auditd.conf"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: "present"
      loop:
        - { regexp: "^max_log_file\\s+=", line: "max_log_file = 50" }
        - { regexp: "^max_log_file_action\\s+=", line: "max_log_file_action = ROTATE" }
        - { regexp: "^space_left_action\\s+=", line: "space_left_action = SYSLOG" }
        - { regexp: "^admin_space_left_action\\s+=", line: "admin_space_left_action = SUSPEND" }
      when: "not ansible_check_mode"

    - name: "AUDITD | Clean conflicting pre-existing default tracking blueprints"
      ansible.builtin.file:
        path: "/etc/audit/rules.d/audit.rules"
        state: "absent"
      when: "not ansible_check_mode"

    - name: "AUDITD | Deploy un-falsifiable zero-trust kernel logging rules matrix"
      ansible.builtin.copy:
        dest: "/etc/audit/rules.d/audit.rules"
        content: |
          -D
          -b 8192
          -f 2
          -w /etc/group -p wa -k security_credentials
          -w /etc/passwd -p wa -k security_credentials
          -w /etc/shadow -p wa -k security_credentials
          -w /etc/sudoers -p wa -k security_privileges
          -w /etc/sudoers.d/ -p wa -k security_privileges
          -w /etc/fstab -p wa -k filesystem_ledgers
          -w /etc/crypttab -p wa -k filesystem_ledgers
          -a always,exit -F arch=b64 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k privilege_escalation
          -a always,exit -F arch=b32 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k privilege_escalation
          -a always,exit -F arch=b64 -S execve -F auid>=1000 -F auid!=4294967295 -k process_execution
          -a always,exit -F arch=b32 -S execve -F auid>=1000 -F auid!=4294967295 -k process_execution
          -w /etc/usbguard/rules.conf -p wa -k peripheral_security
          -w /etc/aide.conf -p wa -k integrity_monitoring
          -w /etc/aide/aide.conf -p wa -k integrity_monitoring
          -e 2
        owner: "root"
        group: "root"
        mode: "0600"
      when: "not ansible_check_mode"

