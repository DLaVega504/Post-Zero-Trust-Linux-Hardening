      loop:
        - { regexp: "^#?ENCRYPT_METHOD", line: "ENCRYPT_METHOD SHA512" }
        - { regexp: "^#?SHA_CRYPT_MIN_ROUNDS", line: "SHA_CRYPT_MIN_ROUNDS 65536" }
        - { regexp: "^#?SHA_CRYPT_MAX_ROUNDS", line: "SHA_CRYPT_MAX_ROUNDS 65536" }
        - { regexp: "^#?UMASK\\s+", line: "UMASK           027" }
        - { regexp: "^#?FAILLOG_ENAB\\s+", line: "FAILLOG_ENAB yes" }
        - { regexp: "^#?LOG_UNKFAIL_ENAB\\s+", line: "LOG_UNKFAIL_ENAB yes" }
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 59: PAM PASSWORD AGING LIFECYCLE MANAGEMENT
# DESCRIPTION: Implements aging rules for existing login accounts to restrict
#              long-lived credentials on administrative human paths.
# =============================================================================
    - name: "PAM | HARDENING | Enforce universal baseline account password aging defaults"
      ansible.builtin.lineinfile:
        path: "/etc/login.defs"
        regexp: "^#?{{ item.key }}\\s+"
        line: "{{ item.key }} {{ item.value }}"
        state: present
      loop:
        - { key: 'PASS_MAX_DAYS', value: '90' }
        - { key: 'PASS_MIN_DAYS', value: '7' }
        - { key: 'PASS_WARN_AGE', value: '7' }
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Temporarily lower minimum password age to allow immediate hash upgrades"
      ansible.builtin.command: "chage -m 0 {{ item }}"
      loop: ["root", "{{ primary_human_operator }}"]
      changed_when: false
      failed_when: false
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Apply baseline password aging rules retroactively to existing active profiles"
      ansible.builtin.command: "chage -M 90 -m 7 -W 7 {{ item }}"
      loop: ["root", "{{ primary_human_operator }}"]
      changed_when: false
      failed_when: false
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 60: CROSS-DISTRIBUTION LOCKOUT PROFILE MAPPINGS
# DESCRIPTION: Normalizes faillock account lock parameters dynamically over
#              multi-platform hosts using native authselect and pam-config tools.
# =============================================================================
    - name: "PAM | HARDENING | Standardize cross-distribution faillock lockout policy parameters"
      ansible.builtin.copy:
        dest: /etc/security/faillock.conf
        content: |
          deny = 3
          unlock_time = 900
          fail_interval = 900
          audit
        mode: '0644'
        owner: root
        group: root
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Execute authselect feature profiles for RedHat and Fedora"
      ansible.builtin.command: authselect enable-feature with-faillock
      register: auth_rh_res
      changed_when: "'feature is already enabled' not in auth_rh_res.stderr"
      failed_when: false
      when:
        - "ansible_facts['os_family'] == 'RedHat'"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 61: DEBIAN SPECIFIC PAM MANAGEMENT HOOKS
# DESCRIPTION: Provisions authentication configuration frameworks on Debian and
#              triggers system package enforcement mechanisms automatically.
# =============================================================================
    - name: "PAM | HARDENING | Provision Debian specific profile automation blocks"
      ansible.builtin.copy:
        dest: /usr/share/pam-configs/faillock_hardening
        content: |
          Name: Enforce faillock via Automation
          Default: yes
          Priority: 0
          Auth-Type: Primary
          Auth:
          	[default=die] pam_faillock.so authfail
          	sufficient pam_faillock.so authsucc
        mode: '0644'
      when:
        - "ansible_facts['os_family'] == 'Debian'"
        - "not ansible_check_mode"

    - name: "PAM | HARDENING | Trigger native pam-auth-update mechanisms on Debian platforms"
      ansible.builtin.command: pam-auth-update --package --force
      changed_when: true
      when:
        - "ansible_facts['os_family'] == 'Debian'"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 62: OPENSUSE NATIVE AUTHENTICATION ENFORCEMENTS
# DESCRIPTION: Dynamically invokes system pam-config tooling arrays
#              to append security attributes natively on active openSUSE systems.
# =============================================================================
    - name: "PAM | HARDENING | Implement native pam-config parameters dynamically on openSUSE"
      ansible.builtin.command: pam-config --add --faillock
      register: pam_suse_res
      changed_when: true
      failed_when: false
      when:
        - "ansible_facts['os_family'] == 'Suse'"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 63: AUDITD PARENT DIRECTORY PROVISIONING
# DESCRIPTION: Ensures that absolute path matrices exist across target nodes
#              and standardizes logging file and rotation metadata parameters.
# =============================================================================
    - name: "AUDITD | ENFORCE PARENT PATHS | Ensure rule directories exist for Debian architectures"
      ansible.builtin.file:
        path: "/etc/audit/rules.d"
        state: "directory"
        owner: "root"
        group: "root"
        mode: "0755"

    - name: "AUDITD | Enforce optimized local data management rotations parameters"
      ansible.builtin.lineinfile:
        path: "/etc/audit/auditd.conf"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: "present"
      loop:
        - { regexp: "^max_log_file\\s+=", line: "max_log_file = 50" }
        - { regexp: "^max_log_file_action\\s+=", line: "max_log_file_action = ROTATE" }
        - { regexp: "^space_left_action\\s+=", line: "space_left_action = SYSLOG" }
        - { regexp: "^admin_space_left_action\\s+=", line: "admin_space_left_action = SUSPEND" }
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 64: KERNEL EXECUTIONS MONITORS & AUDITD POLICY PURGES
# DESCRIPTION: Sanitizes preexisting fallback auditing parameters on disk
#              and deploys an immutable, multi-layered tracking schema.
# =============================================================================
    - name: "AUDITD | Clean conflicting pre-existing default tracking blueprints"
      ansible.builtin.file:
        path: "/etc/audit/rules.d/audit.rules"
        state: "absent"
      when: "not ansible_check_mode"

    - name: "AUDITD | Deploy un-falsifiable zero-trust kernel logging rules matrix"
      ansible.builtin.copy:
        dest: "/etc/audit/rules.d/audit.rules"
        content: |
          -D
          -b 8192
          -f 2
          -w /etc/group -p wa -k security_credentials
          -w /etc/passwd -p wa -k security_credentials
          -w /etc/shadow -p wa -k security_credentials
          -w /etc/sudoers -p wa -k security_privileges
          -w /etc/sudoers.d/ -p wa -k security_privileges
          -w /etc/fstab -p wa -k filesystem_ledgers
          -w /etc/crypttab -p wa -k filesystem_ledgers
          -a always,exit -F arch=b64 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k privilege_escalation
          -a always,exit -F arch=b32 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k privilege_escalation
          -a always,exit -F arch=b64 -S execve -F auid>=1000 -F auid!=4294967295 -k process_execution
          -a always,exit -F arch=b32 -S execve -F auid>=1000 -F auid!=4294967295 -k process_execution
          -w /etc/usbguard/rules.conf -p wa -k peripheral_security
          -w /etc/aide.conf -p wa -k integrity_monitoring
          -w /etc/aide/aide.conf -p wa -k integrity_monitoring
          -e 2
        owner: "root"
        group: "root"
        mode: "0600"
      register: auditd_rules_state
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 65: AUDITD SERVICE LIFE-CYCLE STAGE 3 LOCKS
# DESCRIPTION: Automates systemic realignment controls over core process trackers,
#              forcing kernel flushes if rule configurations were altered.
# =============================================================================
    - name: "COMPLIANCE | ARPWATCH | STAGE 3 | Dynamic Posture Service Activation Loop"
      ansible.builtin.systemd:
        name: >-
          {%- if ansible_facts['os_family'] in ['Archlinux', 'Debian'] -%}
            {%- set interface = primary_network_interface | default('', true) | trim -%}
            {%- if interface != '' -%}
              arpwatch@{{ interface }}.service
            {%- else -%}
              arpwatch@{{ ansible_facts['default_ipv4']['interface'] | default('wls1') }}.service
            {%- endif -%}
          {%- else -%}
            arpwatch.service
          {%- endif -%}
        state: "{{ 'restarted' if (arpwatch_config_state.changed | default(false)) else 'started' }}"
        enabled: true
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 66: ZONE ROUTING AND TUNNEL PERIMETER OVERRIDES
# DESCRIPTION: Map virtual interfaces directly inside firewalld trusted anchors,
#              deploying persistent captive portal cleanup bash profile hooks.
# =============================================================================
    - name: "STAGE 2 & 3 KILLSWITCH | Permanently assign virtual tunnel interfaces to trusted zones"
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --add-interface={{ item }}"
      loop: ["tun+", "wg+", "proton+", "pvpn+"]
      when: "not ansible_check_mode"

    - name: "FIREWALLD | Deploy global runtime persistence environment script hooks"
      ansible.builtin.copy:
        dest: "/etc/profile.d/firewall-killswitches.sh"
        content: |
          #!/usr/bin/env bash
          alias portaloff="sudo firewall-cmd --zone=trusted --add-interface=\$(ls /sys/class/net | grep -E '^(wlan|wl|eth|en)' | head -n 1) && sudo firewall-cmd --reload"
          alias portalon="sudo firewall-cmd --zone=drop --add-interface=\$(ls /sys/class/net | grep -E '^(wlan|wl|eth|en)' | head -n 1) && sudo firewall-cmd --reload"
        owner: "root"
        group: "root"
        mode: "0644"
      become: true
      notify: "Reload Firewalld Configuration"
# =============================================================================
# BLOCK 67: SNAPPER RECOVERY POSTURE TIMELINES
# DESCRIPTION: Drops custom automated snapshot tracking service units
#              and locks structural checkpoint timetables on local block levels.
# =============================================================================
    - name: "SNAPPER | Drop custom automated snapshot tracking service units"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        owner: "root"
        group: "root"
        mode: "0644"
      loop:
        - { name: "snapper-posthardening.service", content: "[Unit]\nDescription=Automated Post-Hardening Posture Timeline Snapshot\nAfter=local-fs.target\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/snapper -c root create --type timeline --description \"Automated Security Hardening Checkpoint\"" }
        - { name: "snapper-posthardening.timer", content: "[Unit]\nDescription=Trigger Snapper Timeline Snapshot At Explicit Security Windows\n\n[Timer]\nOnCalendar=*-*-* 00,06,12,18:00:00\nPersistent=true\n\n[Install]\nWantedBy=timers.target" }
      notify: "Reload Active Systemd Core"

    - name: "SNAPPER | Force explicit timeline schedule timers to enable and activate"
      ansible.builtin.systemd:
        name: "snapper-posthardening.timer"
        state: "started"
        enabled: true
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 68: SECURITY LIFECYCLE RECOVERY & RESET PARAMETERS
# DESCRIPTION: Headlessly flushes failure records across local monitor daemons,
#              and cleans lock stacks on fail2ban storage interfaces.
# =============================================================================
    - name: "SECURITY SERVICES | RECOVERY | Flush systemd service failure caches"
      ansible.builtin.command: "systemctl reset-failed usbguard.service clamd.service snort.service 2>/dev/null"
      failed_when: false
      changed_when: false
      become: true
      when: "not ansible_check_mode"

    - name: "SECURITY SERVICES | FAIL2BAN | Flush stale tracking sockets to prevent timeout hangs"
      ansible.builtin.shell: |
        set -o pipefail
        systemctl stop fail2ban || true
        killall -9 fail2ban-server || true
        rm -f /var/run/fail2ban/fail2ban.sock
      args:
        executable: /bin/bash
      failed_when: false
      changed_when: false
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 69: DAEMON INVENTORY RE-SCAN AND UNMASK HOOKS
# DESCRIPTION: Forces the systemd control engines to completely unmask target
#              IDS detections strings to prevent initialization rejections.
# =============================================================================
    - name: "SECURITY SERVICES | SNORT | Ensure target distribution unit is completely unmasked"
      ansible.builtin.systemd:
        name: >-
          {%- if ansible_facts['os_family'] == 'Archlinux' -%}
            snort@{{ primary_network_interface }}.service
          {%- elif ansible_facts['os_family'] == 'Debian' -%}
            snort-init.service
          {%- else -%}
            {{ distro_matrix[ansible_facts['os_family']]['snort_service_name'] | default('snort.service') }}
          {%- endif -%}
        masked: false
      become: true
      when: "not ansible_check_mode"

    - name: "SECURITY SERVICES | SYSTEMD | Force clear persistent service failure blocks headlessly"
      ansible.builtin.command: "systemctl reset-failed usbguard.service"
      failed_when: false
      changed_when: false
      become: true
      when: "not ansible_check_mode"

    - name: "SECURITY SERVICES | SYSTEMD | Force systemd unit inventory re-scan on disk"
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      when: "not ansible_check_mode"

# =============================================================================
# BLOCK 70: PERSISTENT DEFENSE UTILITIES LIFECYCLE CONTROLS (DYNAMIC CORES)
# DESCRIPTION: Loops through and maps system-wide baseline defense daemons and
#              forensic timers to start and enable permanently on host boot.
# =============================================================================
    - name: "SECURITY SERVICES | BOOT | Universally manage baseline defense utilities state"
      ansible.builtin.systemd:
        name: >-
          {%- set fallback_interface = ansible_facts['default_ipv4']['interface'] | default('wlan0') -%}
          {%- set active_interface = primary_network_interface | default(fallback_interface) | trim -%}
          {%- if item == 'arpwatch' -%}
            arpwatch@{{ active_interface }}.service
          {%- elif item == 'snort' -%}
            {%- if ansible_facts['os_family'] == 'Archlinux' -%}
              snort3.service
            {%- elif ansible_facts['os_family'] == 'Debian' -%}
              snort-init.service
            {%- else -%}
              {{ distro_matrix[ansible_facts['os_family']]['snort_service_name'] | default('snort.service') }}
            {%- endif -%}
          {%- elif item == 'clamav' -%}
            {{ 'clamav-daemon' if ansible_facts['os_family'] == 'Debian' else 'clamd' }}
          {%- else -%}
            {{ item }}
          {%- endif -%}
        enabled: true
        state: started
      loop: ["firewalld", "fail2ban", "usbguard", "auditd", "arpwatch", "snort", "clamav", "aide-check.timer", "tripwire-check.timer"]
      failed_when: false
      become: true
      when: "not ansible_check_mode"

# =============================================================================
# BLOCK 71: LYNIS SECURITY AUDIT CUSTOM COMPLIANCE PROFILES
# DESCRIPTION: Deploys custom performance skip filters to local disk areas
#              to accommodate explicit hardening boundaries natively.
# =============================================================================
    - name: "COMPLIANCE | LYNIS | Enforce custom security profiling configuration metrics universally"
      ansible.builtin.copy:
        dest: "/etc/lynis/custom.prf"
        mode: '0644'
        owner: root
        group: root
        content: |
          skip-test=AUTH-9208

    - name: "COMPLIANCE | NOTIFY | Render calculated final verification scan warnings"
      ansible.builtin.debug:
        msg:
          - "===================================================================================="
          - "⏳ [ FRAMEWORK AUDIT PROTOCOL: POST-DEPLOYMENT SHIELD ASSESSMENT ]"
          - "===================================================================================="
          - "  ↳ DETECTED CHANGE-TRACK METRICS SYSTEM MODIFIED STATE: [ {{ system_was_modified | upper }} ]"
          - "===================================================================================="
      when: "not ansible_check_mode"

# =============================================================================
# BLOCK 72: COMPLIANCE METRICS CALCULATION ENGINE
# DESCRIPTION: Triggers a post-hardening sweep on cache misses/modifications,
#              saves results, and synthesizes 4-tier designations.
# =============================================================================
    - name: "COMPLIANCE | Run post-deployment security hardening verification scan"
      ansible.builtin.shell: "lynis audit system --profile /etc/lynis/custom.prf --quick"
      args:
        executable: /bin/bash
      register: post_lynis_scan
      failed_when: false
      changed_when: false
      when:
        - "not ansible_check_mode"
        - "system_was_modified | bool or not post_flight_lynis_cache_check.stat.exists | bool"

    - name: "COMPLIANCE | Calculate real-time framework execution metrics"
      ansible.builtin.set_fact:
        lynis_pre_score_final: "{{ dynamic_pre_score | int }}"
        lynis_post_score_final: >-
          {%- if system_was_modified | bool or not post_flight_lynis_cache_check.stat.exists | bool -%}
            {%- set live_stdout = post_lynis_scan.stdout | default('', true) -%}
            {%- set matched_score = live_stdout | regex_search('Hardening index\\s*:\\s*(\\d+)') -%}
            {{ (matched_score | regex_replace('[^0-9]', '') | int) if matched_score else (dynamic_post_score_cached | default(82) | int) }}
          {%- else -%}
            {{ dynamic_post_score_cached | default(dynamic_pre_score) | int }}
          {%- endif -%}

    - name: "COMPLIANCE | STORAGE | Commit parsed post-verification parameters permanently to local block"
      ansible.builtin.copy:
        dest: "/var/cache/lynis/post_score.metric"
        content: "{{ lynis_post_score_final | string }}"
        owner: root
        group: root
        mode: '0600'
      when:
        - "not ansible_check_mode"
        - "system_was_modified | bool or not post_flight_lynis_cache_check.stat.exists | bool"

    - name: "COMPLIANCE | Calculate performance delta values"
      ansible.builtin.set_fact:
        stage2_point_delta: "{{ (lynis_post_score_final | int) - (lynis_pre_score_final | int) }}"

    - name: "COMPLIANCE | Compute professional 4-tier attestation designations"
      ansible.builtin.set_fact:
        security_tier_grade: >-
          {% if compliance_track_level_3 | bool %}
          🥇 [ LEVEL 3: FULL-STACK ZERO-TRUST CERTIFIED ]
          {% elif compliance_retrospective_level_1 | bool %}
          🥉 [ LEVEL 1: RETROSPECTIVE BASELINE ATTESTATION ]
          {% elif failsafe_runtime_only_mode | bool %}
          ⚠️  [ LEVEL 0: CERTIFICATE OF OPERATIONAL HARDENING & ISOLATION ]
          {% else %}
          🥈 [ LEVEL 2: STANDALONE HARDENING COMPLIANT ]
          {% endif %}

# =============================================================================
# BLOCK 73: FINAL SYSTEM HARDENING POSTURE ATTESTATION REPORT
# DESCRIPTION: Compiles historical and real-time execution statistics into a
#              highly scannable, detailed terminal output ledger.
# =============================================================================
    - name: "FRAMEWORK REPORT | Complete zero-trust post-hardening play summary"
      ansible.builtin.debug:
        msg: "{{ report_content.split('\n') }}"
      vars:
        report_content: |
          =======================================================================================
          🏆 STAGE 2 ZERO-TRUST SYSTEM POST-HARDENING REPORT LEDGER
          =======================================================================================
          🛡️ SYSTEM PROVENANCE SECURITY ATTESTATION RECORD:
            ↳ FINAL HARDENING GRADE DESIGNATION: {{ security_tier_grade }}
