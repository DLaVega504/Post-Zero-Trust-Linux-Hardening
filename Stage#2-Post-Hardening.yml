# =============================================================================
# BLOCK 70: REAL-TIME NETWORK MONITORING DAEMONS (VPN LEAK DETECTS)
# DESCRIPTION: Deploys a customized, background shell tracking script designed
#              to capture interface states and broadcast drop containment alerts.
# =============================================================================
    - name: "SECURITY | ENGINE | Deploy real-time background VPN leak monitoring daemon"
      ansible.builtin.copy:
        dest: "/usr/bin/vpn-leak-monitor"
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bash/bin
          #!/usr/bin/env bash
          set -euo pipefail
          echo "[+] Active zero-trust perimeter network monitor initialized."
          while true; do
              if [ "$(firewall-cmd --state 2>/dev/null || echo 'down')" != "running" ]; then
                  sleep 2
                  continue
              fi

              ACTIVE_INTERFACES=$(ip -br link show | awk '$3 ~ /UP/ {print $1}')
              TUNNEL_FOUND=false
              if [[ "${ACTIVE_INTERFACES}" =~ (proton|pvpn|tun|wg) ]]; then
                  TUNNEL_FOUND=true
              fi

              if [ -f /run/portal_bypass_active ]; then
                  if [ "${TUNNEL_FOUND}" = "true" ]; then
                      wall "[✓] ZERO-TRUST ENGAGED: VPN Tunnel Established. Subsystem Armor Fully Restored Automatically." 2>/dev/null || true
                      rm -f /run/portal_bypass_active
                      sudo firewall-cmd --permanent --zone=drop --remove-rich-rule='rule family="ipv4" service name="http" accept' 2>/dev/null || true
                      sudo firewall-cmd --permanent --zone=drop --remove-rich-rule='rule family="ipv4" service name="https" accept' 2>/dev/null || true
                      sudo firewall-cmd --reload >/dev/null 2>&1 || true
                  else
                      wall "[⚠️] ZERO-TRUST WARNING: Captive Portal Bypass Active! System armor is temporarily lowered for network authentication." 2>/dev/null || true
                      sleep 5
                      continue
                  fi
              fi

              ACTIVE_TRUSTED=$(firewall-cmd --zone=trusted --list-interfaces 2>/dev/null || echo "")
              ACTIVE_SOURCES=$(firewall-cmd --zone=trusted --list-sources 2>/dev/null || echo "")

              if [ "${TUNNEL_FOUND}" = "false" ] && [[ ! "${ACTIVE_TRUSTED}" =~ (proton|pvpn|tun|wg) ]] && [[ ! "${ACTIVE_SOURCES}" =~ (proton|pvpn|tun|wg) ]]; then
                  sleep 2
                  RECHECK_INTERFACES=$(ip -br link show | awk '$3 ~ /UP/ {print $1}')
                  if [[ ! "${RECHECK_INTERFACES}" =~ (proton|pvpn|tun|wg) ]]; then
                      wall "[-] ZERO-TRUST ALERT: VPN Leakage Perimeter Breach Detected! Physical interfaces remain trapped inside DROP zone containment blocks." 2>/dev/null || true
                  fi
              fi
              sleep 5
          done
# =============================================================================
# BLOCK 71: BACKGROUND VPN MONITORING SERVICE UTILITIES
# DESCRIPTION: Drops unified systemd configuration definitions into system storage
#              to enable absolute persistence controls over leak protection.
# =============================================================================
    - name: "SECURITY | DAEMON | Initialize background network perimeter service wrapper"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/vpn-leak-protection.service"
        mode: '0644'
        owner: root
        group: root
        content: |
          [Unit]
          Description=Universal Zero-Trust Framework VPN Leakage Guard Daemon
          After=network.target firewalld.service
          StartLimitIntervalSec=500
          StartLimitBurst=5

          [Service]
          Type=simple
          ExecStart=/usr/bin/vpn-leak-monitor
          Restart=always
          RestartSec=3
          StandardOutput=journal+console
          StandardError=journal+console
          TTYPath=/dev/tty0

          [Install]
          WantedBy=multi-user.target
      become: true
# =============================================================================
# BLOCK 72: PERIMETER SERVICE STATE MANAGEMENT
# DESCRIPTION: Registers, enables, and brings up the vpn-leak-protection service
#              to lock real-time network transaction sweeps immediately on disk.
# =============================================================================
    - name: "SECURITY | ENFORCEMENT | Launch background leak monitor utility service"
      ansible.builtin.systemd:
        name: "vpn-leak-protection.service"
        state: started
        enabled: true
      failed_when: false
      when: "not ansible_check_mode"
      become: true

# =============================================================================
# BLOCK 73: SYSTEM PAM AUTHENTICATION CONTROLS (PART 1)
# DESCRIPTION: Enforces high-iteration cryptographic password stretching via
#              SHA512 hashing parameters and sets strict default system umasks.
# =============================================================================
    - name: "PAM | HARDENING | Inject strict password stretching algorithm limits into system auth"
      ansible.builtin.lineinfile:
        path: "/etc/login.defs"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        state: present
      loop:
        - { regexp: "^#?ENCRYPT_METHOD", line: "ENCRYPT_METHOD SHA512" }
        - { regexp: "^#?SHA_CRYPT_MIN_ROUNDS", line: "SHA_CRYPT_MIN_ROUNDS 65536" }
        - { regexp: "^#?SHA_CRYPT_MAX_ROUNDS", line: "SHA_CRYPT_MAX_ROUNDS 65536" }
        - { regexp: "^#?UMASK\\s+", line: "UMASK           027" }
        - { regexp: "^#?FAILLOG_ENAB\\s+", line: "FAILLOG_ENAB yes" }
        - { regexp: "^#?LOG_UNKFAIL_ENAB\\s+", line: "LOG_UNKFAIL_ENAB yes" }
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 74: PAM PASSWORD AGING LIFECYCLE MANAGEMENT
# DESCRIPTION: Implements aging rules for existing login accounts to restrict
#              long-lived credentials on administrative human paths.
# =============================================================================
    - name: "PAM | HARDENING | Enforce universal baseline account password aging defaults"
      ansible.builtin.lineinfile:
        path: "/etc/login.defs"
        regexp: "^#?{{ item.key }}\\s+"
        line: "{{ item.key }} {{ item.value }}"
        state: present
      loop:
        - { key: 'PASS_MAX_DAYS', value: '90' }
        - { key: 'PASS_MIN_DAYS', value: '7' }
        - { key: 'PASS_WARN_AGE', value: '7' }
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Temporarily lower minimum password age to allow immediate hash upgrades"
      ansible.builtin.command: "chage -m 0 {{ item }}"
      loop: ["root", "{{ primary_human_operator }}"]
      changed_when: false
      failed_when: false
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Apply baseline password aging rules retroactively to existing active profiles"
      ansible.builtin.command: "chage -M 90 -m 7 -W 7 {{ item }}"
      loop: ["root", "{{ primary_human_operator }}"]
      changed_when: false
      failed_when: false
      when: "not ansible_check_mode"

# =============================================================================
# BLOCK 75: CROSS-DISTRIBUTION LOCKOUT PROFILE MAPPINGS
# DESCRIPTION: Normalizes faillock account lock parameters dynamically over
#              multi-platform hosts using native authselect and pam-config tools.
# =============================================================================
    - name: "PAM | HARDENING | Standardize cross-distribution faillock lockout policy parameters"
      ansible.builtin.copy:
        dest: /etc/security/faillock.conf
        content: |
          deny = 3
          unlock_time = 900
          fail_interval = 900
          audit
        mode: '0644'
        owner: root
        group: root
      when: "not ansible_check_mode"

    - name: "PAM | HARDENING | Execute authselect feature profiles for RedHat and Fedora"
      ansible.builtin.command: authselect enable-feature with-faillock
      register: auth_rh_res
      changed_when: "'feature is already enabled' not in auth_rh_res.stderr"
      failed_when: false
      when:
        - "ansible_facts['os_family'] == 'RedHat'"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 76: DEBIAN SPECIFIC PAM MANAGEMENT HOOKS
# DESCRIPTION: Provisions authentication configuration frameworks on Debian and
#              triggers system package enforcement mechanisms automatically.
# =============================================================================
    - name: "PAM | HARDENING | Provision Debian specific profile automation blocks"
      ansible.builtin.copy:
        dest: /usr/share/pam-configs/faillock_hardening
        content: |
          Name: Enforce faillock via Automation
          Default: yes
          Priority: 0
          Auth-Type: Primary
          Auth:
          	[default=die] pam_faillock.so authfail
          	sufficient pam_faillock.so authsucc
        mode: '0644'
