            fullest extent of the law. Disconnect immediately if you are unauthorized.

          ===============================================================================
      loop:
        - "/etc/issue"
        - "/etc/issue.net"
      become: true
# =============================================================================
# BLOCK 39: SECURE CRYPTOGRAPHIC DATA VAULT ENVIRONMENT LAYOUT
# DESCRIPTION: Extracts physical device capacities and builds multi-layer
#              quota-enforcing wrapper utilities restricted to admin privileges.
# =============================================================================
    - name: "VAULT ENGINE | Interrogate raw physical block storage boundary footprint sizes"
      ansible.builtin.shell: |
        set -o pipefail
        lsblk -bno SIZE "{{ vault_partition_handle }}" | head -n1 | tr -d '[:space:]' || echo "0"
      args:
        executable: /bin/bash
      register: raw_vault_block_bytes
      changed_when: false
      failed_when: false
      when:
        - "secure_vault_enabled | bool"
        - "not failsafe_runtime_only_mode | bool"
        - "not ansible_check_mode"

    - name: "VAULT ENGINE | Synthesize dynamic proportional mathematical storage profiles"
      ansible.builtin.set_fact:
        vault_total_capacity_gb: "{{ ((raw_vault_block_bytes.stdout | default('0') | int) / 1024 / 1024 / 1024) | round(0) | int }}"
      when:
        - "secure_vault_enabled | bool"
        - "not failsafe_runtime_only_mode | bool"

    - name: "VAULT ENGINE | Construct automated multi-layer quota-enforcing wrapper utilities"
      ansible.builtin.copy:
        dest: "/usr/bin/vault"
        content: |
          #!/bin/bash
          set -euo pipefail
          VAULT_DEV="{{ vault_partition_handle }}"
          MNT_TARGET="{{ vault_mount_target }}"
          MIN_LIMIT={{ vault_minimum_size_threshold_gb | int }}
          PCT_FACTOR={{ vault_allocation_percentage | int }}
          MAX_MEMBERS={{ vault_maximum_guest_members | int }}
          V_SIZE={{ vault_total_capacity_gb | default(0) | int }}
          FAILSAFE_ACTIVE={{ 'true' if failsafe_runtime_only_mode | bool else 'false' }}
          HUMAN_OPERATOR="{{ primary_human_operator }}"
          ADMIN_GRP="{{ detected_admin_group }}"

          if [ "$(id -u)" -ne 1000 ] && [ "$(id -u)" -ne 0 ]; then
             echo "[-] ACCESS DENIED: Core cryptographic storage controls are restricted." >&2
             exit 1
          fi

          if [ "${1:-}" == "open" ]; then
             if [ "$FAILSAFE_ACTIVE" = "true" ]; then
                sudo mkdir -p "${MNT_TARGET}"
                sudo chmod 0750 "${MNT_TARGET}"
                echo "[!] Failsafe Open: Directory initialized directly over unencrypted storage."
             else
                if [ ! -f "/etc/vault.key" ]; then
                    sudo dd if=/dev/urandom of=/etc/vault.key bs=1 count=256 status=none
                    sudo chmod 0600 /etc/vault.key
                    sudo cryptsetup luksAddKey "${VAULT_DEV}" /etc/vault.key
                fi
                sudo cryptsetup open "${VAULT_DEV}" vault_storage --key-file /etc/vault.key
                sudo mkdir -p "${MNT_TARGET}"
                sudo mount -o noatime,compress=zstd:1,space_cache=v2 "${MNT_TARGET}" || sudo mount /dev/mapper/vault_storage "${MNT_TARGET}"
                echo "[+] Vault successfully opened."
             fi
             
             sudo chown "${HUMAN_OPERATOR}:${ADMIN_GRP}" "${MNT_TARGET}"
             if [ "$V_SIZE" -lt "$MIN_LIMIT" ]; then
                sudo chmod 1700 "${MNT_TARGET}"
                echo "[*] Capacity constraint < 15GB active. Multi-tenant guest profiles restricted."
             else
                sudo groupadd -f vault
                sudo chown "root:vault" "${MNT_TARGET}"
                sudo chmod 1770 "${MNT_TARGET}"
             fi
          elif [ "${1:-}" == "close" ]; then
             sudo umount -f "${MNT_TARGET}" || true
             if [ "$FAILSAFE_ACTIVE" = "false" ]; then
                sudo cryptsetup close vault_storage
             fi
             echo "[+] Vault completely locked and secured."
          fi
        mode: '0750'
        owner: root
        group: "{{ detected_admin_group }}"
      when: "secure_vault_enabled | bool"

    - name: "VAULT ENGINE | ALIASES | Enforce uniform permissions over shared profile script hooks"
      ansible.builtin.file:
        path: "/etc/profile.d/vault_aliases.sh"
        owner: root
        group: root
        mode: '0644'
        state: touch
      failed_when: false
# =============================================================================
# BLOCK 40: LINK-LAYER ARPWATCH OVERRIDE SANDBOXING
# DESCRIPTION: Establishes a strict systemd override sandboxing matrix for
#              arpwatch monitoring instances to enforce runtime containment.
# =============================================================================
    - name: "COMPLIANCE | ARPWATCH | CONFIGURATION | Suppress legacy binary chdir warnings"
      ansible.builtin.file:
        path: "/usr/arpwatch"
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: "COMPLIANCE | ARPWATCH | CONFIGURATION | Establish drop-in containment paths"
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ 'arpwatch@' ~ primary_network_interface if ansible_facts['os_family'] in ['Archlinux', 'Debian'] else 'arpwatch' }}.service.d"
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: "COMPLIANCE | ARPWATCH | CONFIGURATION | Inject sandbox containment properties"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ 'arpwatch@' ~ primary_network_interface if ansible_facts['os_family'] in ['Archlinux', 'Debian'] else 'arpwatch' }}.service.d/override.conf"
        mode: '0644'
        owner: root
        group: root
        content: |
          [Unit]
          After=network-online.target
          Wants=network-online.target

          [Service]
          ProtectSystem=strict
          ProtectHome=true
