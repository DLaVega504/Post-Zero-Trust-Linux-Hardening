# =============================================================================
# BLOCK 1: INITIAL PLAY METADATA & CONTROL LAYER VARIABLES
# DESCRIPTION: Establishes playbook destination, enforcement properties,
#              privilege parameters, and custom hardware target values.
# =============================================================================
---
- name: "Universal Zero-Trust Linux Hardening Framework"
  hosts: localhost
  connection: local
  become: true  
  gather_facts: true 
  vars:
    perf_mount_opts: "noatime,space_cache=v2,compress=zstd:1"
    security_architecture_profile: "pentagon"
    secure_vault_enabled: true
    vault_allocation_percentage: 20
    vault_maximum_guest_members: 3
    vault_minimum_size_threshold_gb: 15
    fail2ban_installed: true
    rkhunter_installed: false
    usbguard_installed: true
    arpwatch_installed: true
    snort_installed: true
    clamav_installed: true
    firewalld_native: true
    primary_human_operator: "vega"
    detected_admin_group: "wheel"
    dynamic_pre_score: 65
    is_uefi_mode: true
    boot_password_is_protected: false
    active_distro_subvolumes:
      - { name: "var_audit", dest: "/var/log/audit" }

# =============================================================================
# BLOCK 2: SYSTEM HARDWARE ASSESSMENT MATRIX
# DESCRIPTION: Sets hardware resource limits, thread thresholds,
#              and memory scaling properties based on infrastructure performance.
# =============================================================================
    hardware_profile_matrix:
      tier_1:
        swappiness: 150
        cpu_quota: 10
        mem_high: "1.0G"
        mem_max: "1.2G"
        max_threads: 2
      tier_2:
        swappiness: 100
        cpu_quota: 15
        mem_high: "1.2G"
        mem_max: "1.5G"
        max_threads: 4
      tier_3:
        swappiness: 100
        cpu_quota: 20
        mem_high: "1.5G"
        mem_max: "2.0G"
        max_threads: 8
      tier_4:
        swappiness: 10
        cpu_quota: 25
        mem_high: "2.0G"
        mem_max: "3.0G"
        max_threads: 16
# =============================================================================
# BLOCK 3: DISK PERFORMANCE BLUEPRINTS
# DESCRIPTION: Maps dynamic memory dirty ratios and drive scale pressures
#              for both solid state and spinning platter local block assets.
# =============================================================================
    hdd_matrix_blueprint:
      "150": { bg_ratio: 3,  ratio: 10, scale: 125 }
      "100": { bg_ratio: 5,  ratio: 15, scale: 100 }
      "10":  { bg_ratio: 10, ratio: 25, scale: 20  }

    ssd_matrix_blueprint:
      "150": { bg_ratio: 10, ratio: 20, scale: 10 }
      "100": { bg_ratio: 10, ratio: 20, scale: 10 }
      "10":  { bg_ratio: 15, ratio: 25, scale: 10 }
# =============================================================================
# BLOCK 4 & 5: MULTI-DISTRIBUTION PLATFORM ARCHITECTURE MATRIX
# DESCRIPTION: Maps package strings, admin groups, systemd units, DAQ directories,
#              and dynamic preprocessor paths across all target environments.
# =============================================================================
    distro_matrix:
      Archlinux:
        core_packages: ['sysstat', 'arpwatch', 'usbguard', 'clamav', 'aide', 'lynis', 'openssl-1.1', 'earlyoom', 'snort', 'podman']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort@{{ primary_network_interface | default('wls1') }}.service"
        snort_daq_dir: "/usr/lib/daq"
        snort_dynamic_preproc: "/usr/lib/snort_dynamicpreprocessor"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav'
        aide_pkg: 'aide'
        admin_group: 'wheel'
        grub_compile_cmd: 'grub-mkconfig'
        grub_config_bios: '/boot/grub/grub.cfg'
      Debian:
        core_packages: ['fail2ban', 'sysstat', 'arpwatch', 'usbguard', 'clamav-daemon', 'aide', 'lynis', 'earlyoom', 'podman', 'snort']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort-init.service"
        snort_daq_dir: "/usr/lib/daq"
        snort_dynamic_preproc: "/usr/lib/snort_dynamicpreprocessor"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav-daemon'
        aide_pkg: 'aide'
        admin_group: 'sudo'
        grub_compile_cmd: 'update-grub'
        grub_config_bios: '/boot/grub/grub.cfg'
      RedHat:
        core_packages: ['fail2ban', 'sysstat', 'arpwatch', 'usbguard', 'clamav', 'aide', 'lynis', 'earlyoom', 'podman']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort3@{{ primary_network_interface | default('wls1') }}.service"
        snort_daq_dir: "/usr/lib64/daq"
        snort_dynamic_preproc: "/usr/lib64/snort_dynamicpreprocessor"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav'
        aide_pkg: 'aide'
        admin_group: 'wheel'
        grub_compile_cmd: 'grub2-mkconfig'
        grub_config_bios: '/boot/grub2/grub.cfg'
      Suse:
        core_packages: ['fail2ban', 'sysstat', 'arpwatch', 'usbguard', 'clamav', 'aide', 'lynis', 'libdaq', 'earlyoom', 'podman']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort.service"
        snort_daq_dir: "/usr/lib64/daq"
        snort_dynamic_preproc: "/usr/lib64/snort_dynamicpreprocessor"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav'
        aide_pkg: 'aide'
        admin_group: 'wheel'
        grub_compile_cmd: 'grub2-mkconfig'
        grub_config_bios: '/boot/grub2/grub.cfg'
# =============================================================================
# BLOCK 6: INITIAL TASKS TREE & PRE-FLIGHT SYSTEM HOOKS
# DESCRIPTION: Launches the tasks pipeline, initializes tracking states, and
#              probes for an existing Stage 1 certification fingerprint file.
# =============================================================================
  tasks:
    - name: "PRE-FLIGHT | STATE | Initialize system modification accumulator track"
      ansible.builtin.set_fact:
        system_was_modified: false

    - name: "PRE-FLIGHT | PROBE | Interrogate system for active Stage 1 Foundation Certificate"
      ansible.builtin.stat:
        path: "/etc/zero-trust-baseline.json"
      register: pre_flight_stage1_cert_check
      check_mode: false

    - name: "PRE-FLIGHT | NOTIFY | Render visual compliance track foundation confirmation"
      ansible.builtin.debug:
        msg: "{{ banner_content.split('\n') }}"
      vars:
        banner_content: |
          ======================================================================
          {% if pre_flight_stage1_cert_check.stat.exists | bool %}
             [ ✓ ] STAGE 1 FOUNDATION CERTIFICATE VERIFIED: INTEGRATION ARMED.
          {% else %}
                     [ ✓ ] AUTONOMOUS COMPLIANCE MODE DEPLOYED.
          {% endif %}
          ======================================================================
# =============================================================================
# BLOCK 7: DYNAMIC DEPENDENCIES & NETADDR BOOTSTRAPPING
# DESCRIPTION: Automates verification and installation of base execution tools,
#              python dependencies, and system modules across all package platforms.
# =============================================================================
    - name: "PRE-FLIGHT | Provision runtime environments and collections"
      ansible.builtin.raw: |
        if command -v ansible >/dev/null 2>&1 && \
           { command -v gdisk >/dev/null 2>&1 || command -v sgdisk >/dev/null 2>&1; } && \
           python3 -c "import netaddr" >/dev/null 2>&1 && \
           ansible-galaxy collection list 2>/dev/null | grep -q 'ansible.posix'; then
          echo "[+] SYSTEM VERIFICATION SUCCESSFUL: Pre-requisites satisfied."
          exit 0
        fi
        if command -v pacman >/dev/null 2>&1; then
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed python python-pip python-netaddr gptfdisk ansible
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -y
          apt-get install -y python3 python3-pip python3-netaddr gdisk ansible
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3 python3-pip python3-netaddr gdisk ansible --nogpgcheck
        elif command -v zypper >/dev/null 2>&1; then
          zypper --non-interactive install python3 python3-pip python3-netaddr gptfdisk ansible
        fi
        if ! python3 -c "import netaddr" >/dev/null 2>&1; then
          pip3 install netaddr --break-system-packages || pip3 install netaddr || true
        fi
        if ! ansible-galaxy collection list 2>/dev/null | grep -q 'ansible.posix'; then
          ansible-galaxy collection install ansible.posix --force-with-deps || true
        fi
      changed_when: false
      failed_when: false
# =============================================================================
# BLOCK 8: SAFE ENVIRONMENTAL SETUP REFRESH
# DESCRIPTION: Runs a clean fact discovery loop under safe permissions now that
#              foundational python-netaddr dependencies are system-wide.
# =============================================================================
    - name: "PRE-FLIGHT | Safely initialize system environment fact discovery loops"
      ansible.builtin.setup:
      become: false

    - name: "PRE-FLIGHT | PROVISIONING | Universally install core security package arrays across platforms"
      ansible.builtin.package:
        name: "{{ distro_matrix[ansible_facts['os_family']]['core_packages'] }}"
        state: present
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 9: BLACKARCH REPOSITORY SUBSTRATE SYNCHRONIZATION
# DESCRIPTION: Downloads, validates, and initializes secure BlackArch security
#              mirrors explicitly on detected Arch Linux platforms.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Bootstrapping BlackArch Cryptographic Mirror Substrates"
      ansible.builtin.shell: |
        set -euo pipefail
        if ! grep -q '\[blackarch\]' /etc/pacman.conf; then
          cd /tmp
          curl -O https://blackarch.org
          chmod +x strap.sh
          ./strap.sh
          rm -f strap.sh
          pacman -Syy --noconfirm
        fi
      args:
        executable: /bin/bash
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 10: PARU AUR WRAPPER BINARY DETECTIONS
# DESCRIPTION: Probes execution targets to isolate if the Paru compilation
#              wrapper tool is currently active on local system search paths.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Check if Paru binary is present on host execution paths"
      ansible.builtin.command: "which paru"
      register: local_paru_binary_probe
      failed_when: false
      changed_when: false
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "PRE-FLIGHT | ARCH | Verify if Tripwire binary is actively installed on system paths"
      ansible.builtin.stat:
        path: "/usr/bin/tripwire"
      register: local_tripwire_binary_probe
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "PRE-FLIGHT | ARCH | Set structural skip state fact for local package compilation matrices"
      ansible.builtin.set_fact:
        skip_tripwire_installation: "{{ true if (local_tripwire_binary_probe.stat is defined and local_tripwire_binary_probe.stat.exists | bool) else false }}"
      when: "ansible_facts['os_family'] == 'Archlinux'"
# =============================================================================
# BLOCK 11: UNPRIVILEGED AUR WRAPPER TRIPWIRE INSTALLATION
# DESCRIPTION: Leverages the discovered local Paru binary wrapper path to
#              natively pull down and deploy the AUR Tripwire package cleanly.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Ensure compiler dependencies are natively active"
      community.general.pacman:
        name: "openssl-1.1"
        state: present
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not skip_tripwire_installation | bool"
        - "not ansible_check_mode"

    - name: "PRE-FLIGHT | ARCH | Clone Tripwire repository via Paru wrapper"
      ansible.builtin.command: "paru -G tripwire-git"
      args:
        chdir: "/tmp"
        creates: "/tmp/tripwire-git/PKGBUILD"
      become: true
      become_user: "{{ primary_human_operator | default('vega') }}"
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not skip_tripwire_installation | bool"
        - "not ansible_check_mode"

    - name: "PRE-FLIGHT | ARCH | Compile Tripwire git package via native makepkg flags"
      ansible.builtin.command: "makepkg --noconfirm --needed"
      args:
        chdir: "/tmp/tripwire-git"
        creates: "/tmp/tripwire-git/*.pkg.tar.zst"
      become: true
      become_user: "{{ primary_human_operator | default('vega') }}"
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not skip_tripwire_installation | bool"
        - "not ansible_check_mode"

    - name: "PRE-FLIGHT | ARCH | Natively commit compiled AUR package to system files"
      ansible.builtin.shell: "pacman -U --noconfirm --needed /tmp/tripwire-git/tripwire-git-*.pkg.tar.zst"
      register: pacman_aur_install_result
      changed_when: "'up to date' not in pacman_aur_install_result.stdout"
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not skip_tripwire_installation | bool"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 12: PRIVILEGED ARCH LINUX COMPILATION INJECTIONS
# DESCRIPTION: Installs the required upstream compiler dependencies and source
#              code tools needed to build forensic and management layers.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Inject development toolsets required for compilation"
      community.general.pacman:
        name:
          - base-devel
          - git
        state: present
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "local_paru_binary_probe.rc | default(1) != 0"
        - "not skip_tripwire_installation | bool"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 15A: DISK GEOMETRY & ROOT CONFIGURATION INSPECTION
# DESCRIPTION: Probes underlying block devices, active device-mapper links,
#              and mount targets to resolve root storage type attributes.
# =============================================================================
    - name: "SCAN | INTERROGATION | Query true device mapping layer type for active root partition"
      ansible.builtin.shell: |
        set -o pipefail
        ROOT_DEV=$(findmnt -n -o SOURCE / | cut -d'[' -f1)
        if lsblk -no TYPE "$ROOT_DEV" | grep -q "crypt"; then
            echo "crypt"
        elif [[ "$ROOT_DEV" == /dev/mapper/* ]]; then
            MAPPER_NAME=$(basename "$ROOT_DEV")
            if lsblk -no TYPE "/dev/mapper/$MAPPER_NAME" | grep -q "crypt" || blkid -p -o value -s TYPE "$ROOT_DEV" 2>/dev/null | grep -q "crypto"; then
                echo "crypt"
            else
                SLAVE_PATH=$(ls -d /sys/class/block/"${MAPPER_NAME}"/slaves/* 2>/dev/null | head -n1 || echo "")
                if [ -n "${SLAVE_PATH}" ]; then
                    SLAVE_DEV=$(basename "${SLAVE_PATH}")
                    if blkid -p -o value -s TYPE "/dev/$SLAVE_DEV" 2>/dev/null | grep -q "crypto_LUKS"; then
                        echo "crypt"
                        exit 0
                    fi
                fi
                echo "standard"
            fi
        else
            echo "standard"
        fi
      args:
        executable: /bin/bash
      register: live_root_block_type_probe
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | INSPECTION | Interrogate system block tree for any active device mapper maps"
      ansible.builtin.stat:
        path: "/dev/mapper/root"
      register: live_root_mapper_device_check
      check_mode: false

    - name: "SCAN | Probe motherboard boot firmware directory existence"
      ansible.builtin.stat:
        path: "/sys/firmware/efi"
      register: efi_directory_check

    - name: "SCAN | INTERROGATION | Query physical drive layout for nested boot topology mapping"
      ansible.builtin.shell: |
        set -o pipefail
        ROOT_BLOCK=$(findmnt -n -o SOURCE / | cut -d'[' -f1)
        BOOT_BLOCK=$(findmnt -n -o SOURCE /boot | cut -d'[' -f1 || echo "none")
        if [ "$ROOT_BLOCK" = "$BOOT_BLOCK" ] || [ "$BOOT_BLOCK" = "none" ]; then
            echo "nested"
        else
            echo "separate"
        fi
      args:
        executable: /bin/bash
      register: boot_source_device
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | INTERROGATION | Resolve dynamic filesystem configuration signatures"
      ansible.builtin.shell: "findmnt -n -o FSTYPE /"
      register: root_fs_signature
      changed_when: false
      check_mode: false
# =============================================================================
# BLOCK 15B: ARCHITECTURAL DEPLOYMENT RECONNAISSANCE PRINTS
# DESCRIPTION: Evaluates gathered firmware parameters and registers hardware
#              facts to dynamically compute and print 3-tier profiles.
# =============================================================================
    - name: "RECONNAISSANCE | STATE | Calculate adaptive 3-tier architecture setup classification profile"
      ansible.builtin.set_fact:
        computed_architecture_profile: >-
          {%- if boot_source_device.stdout is defined and boot_source_device.stdout | trim == 'nested' -%}
            pentagon
          {%- elif pre_flight_stage1_cert_check is defined and pre_flight_stage1_cert_check.stat.exists | bool -%}
            protected_boot
          {%- else -%}
            traditional
          {%- endif -%}

    - name: "SCAN REPORT | TELEMETRY | Render bootloader storage environmental metrics"
      ansible.builtin.debug:
        msg: "{{ banner_msg.split('\n') }}"
      vars:
        banner_msg: |
          =======================================================================================
          🔬 ZERO-TRUST HARDWARE ARCHITECTURE RECONNAISSANCE SCAN COMPLETE
          =======================================================================================
          {% if computed_architecture_profile == 'pentagon' %}
           [ ✓ ] Pentagon Setup Discovered
               ↳ [ ✓ ] Nested /boot partition detected
               ↳ [ ⚙️ ] Skipping bootloader password hardening (Storage Envelope Secure)
          {% elif computed_architecture_profile == 'protected_boot' %}
           [ ✓ ] Protected Boot Detected
               ↳ [ ✓ ] Existing Stage 2 baseline certificate verified on disk
               ↳ [ ⚙️ ] Skipping bootloader verification tasks (System Integrity Intact)
          {% else %}
           [ ✓ ] Traditional Setup Detected
               ↳ [ ⚠️ ] Unprotected /boot discovered outside FDE coverage
               ↳ [ 🔒 ] Stage 2: Initiating mandatory bootloader password parameter hardening
          {% endif %}
          =======================================================================================
# =============================================================================
# BLOCK 16: SECURITY AUDIT SCORES HISTORY METRIC PARSING
# DESCRIPTION: Audits block filesystems to identify pre-existing, cached
#              historical baseline metrics for Lynis assessment sequences.
# =============================================================================
    - name: "PRE-FLIGHT | AUDIT | Check disk for local cached Lynis metrics"
      ansible.builtin.stat:
        path: "/var/cache/lynis/pre_score.metric"
      register: pre_flight_lynis_cache_check
      check_mode: false

    - name: "PRE-FLIGHT | AUDIT | Parse existing Lynis metric into runtime memory if cache hit"
      ansible.builtin.slurp:
        src: "/var/cache/lynis/pre_score.metric"
      register: raw_cached_lynis_score
      when: "pre_flight_lynis_cache_check.stat.exists | bool"

    - name: "PRE-FLIGHT | AUDIT | Check disk for local cached final post-hardening metrics"
      ansible.builtin.stat:
        path: "/var/cache/lynis/post_score.metric"
      register: post_flight_lynis_cache_check
      check_mode: false

    - name: "PRE-FLIGHT | AUDIT | Parse existing post-hardening metric into runtime memory if cache hit"
      ansible.builtin.slurp:
        src: "/var/cache/lynis/post_score.metric"
      register: raw_cached_lynis_post_score
      when: "post_flight_lynis_cache_check.stat.exists | bool"
# =============================================================================
# BLOCK 17: COMPLIANCE STATE ATTRIBUTE SYNTHESIS
# DESCRIPTION: Consolidates discovered encryption hooks, boot metadata, cache
#              records, and certificate facts into static runtime memories.
# =============================================================================
    - name: "PRE-FLIGHT | STATE | Synthesize and lock baseline architectural facts"
      ansible.builtin.set_fact:
        stage1_foundation_active: "{{ pre_flight_stage1_cert_check.stat.exists | bool if pre_flight_stage1_cert_check.stat is defined else false }}"
        root_disk_is_encrypted: "{{ true if (live_root_block_type_probe.stdout | trim == 'crypt' or live_root_mapper_device_check.stat.exists | bool) else false }}"
        lynis_cache_available: "{{ pre_flight_lynis_cache_check.stat.exists | bool }}"
        active_root_uuid: "{{ live_root_uuid.stdout | default('') | trim }}"

    - name: "SCAN | STATE | Lock filesystem configuration properties"
      ansible.builtin.set_fact:
        is_btrfs_layout: "{{ true if (root_fs_signature.stdout is defined and 'btrfs' in root_fs_signature.stdout) else false }}"
# =============================================================================
# BLOCK 18A: BTRFS TOPOLOGY COMPLIANCE AUDIT ENGINE
# DESCRIPTION: Mounts top-level parent pool ID 5 universally to execute
#              distribution-aware layout verification and state corrections.
# =============================================================================

    - name: "STORAGE | AUDIT | Mount raw parent pool ID 5 for structure validation"
      ansible.builtin.shell: |
        mkdir -p /tmp/btrfs_stage2_verification
        ROOT_DEV=$(findmnt -n -o SOURCE / | cut -d'[' -f1)
        mount -o subvolid=5 "${ROOT_DEV}" /tmp/btrfs_stage2_verification
      changed_when: false
      when:
        - "is_btrfs_layout | bool"
        - "not ansible_check_mode"

    - name: "STORAGE | RECONCILIATION | Declaratively force subvolume layout synchronization"
      ansible.builtin.shell: |
        set -euo pipefail
        POOL="/tmp/btrfs_stage2_verification"
        TARGET_NAME="{{ item.name }}"
        OS_FAMILY="{{ ansible_facts['os_family'] }}"

        if [ -d "$POOL/$TARGET_NAME" ] && ! btrfs subvolume show "$POOL/$TARGET_NAME" >/dev/null 2>&1; then
            mv "$POOL/$TARGET_NAME" "$POOL/${TARGET_NAME}_legacy_backup"
        fi

        if [ ! -d "$POOL/$TARGET_NAME" ]; then
            mkdir -p "$(dirname "$POOL/$TARGET_NAME")"
            btrfs subvolume create "$POOL/$TARGET_NAME"
            if [ -d "$POOL/${TARGET_NAME}_legacy_backup" ]; then
                cp -a "$POOL/${TARGET_NAME}_legacy_backup/." "$POOL/$TARGET_NAME/" || true
                rm -rf "$POOL/${TARGET_NAME}_legacy_backup"
            fi
        fi
      args:
        executable: /bin/bash
      loop: "{{ active_distro_subvolumes }}"
      register: topo_sync_status
      changed_when: topo_sync_status.rc == 0
      when:
        - "root_fs_signature.stdout is defined and 'btrfs' in root_fs_signature.stdout"
        - "not ansible_check_mode"
        - "item.dest != '/'"
        - "item.dest != '/home'"

# =============================================================================
# BLOCK 18B: BTRFS TARGET MOUNT POINT DIRECTORY PRE-CREATION
# DESCRIPTION: Drops the required physical directory anchors directly into the
#              running filesystem path before launching mount configurations.
# =============================================================================

    - name: "STORAGE | AUDIT | Clean system verification mounts"
      ansible.builtin.shell: "umount /tmp/btrfs_stage2_verification && rmdir /tmp/btrfs_stage2_verification"
      changed_when: false
      failed_when: false
      when:
        - "is_btrfs_layout | bool"
        - "not ansible_check_mode"

    - name: "STORAGE | PRE-FLIGHT | Enforce presence of folder target anchors"
      ansible.builtin.file:
        path: "{{ item.dest }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: "{{ active_distro_subvolumes }}"
      when:
        - "root_fs_signature.stdout is defined and 'btrfs' in root_fs_signature.stdout"
        - "not ansible_check_mode"
        - "item.dest != '/'"

# =============================================================================
# BLOCK 19A: UNIVERSAL UNMOUNTED STORAGE DISCOVERY MATRIX (FINAL FIXED)
# DESCRIPTION: Resolves virtual aliases natively and isolates unmounted target
#              partitions using user-friendly alphanumeric 'vault#' prefixes.
# =============================================================================
    - name: "SCAN | DYNAMIC | Multi-Distro Block Controller and Partition Signature Isolation"
      ansible.builtin.shell: |
        set -euo pipefail
        
        # Isolate the real underlying major and minor device hex tokens of the active root mount
        ROOT_HEX_DEV=$(stat -c "0x%t 0x%T" /)
        MAJOR_HEX=$(echo "${ROOT_HEX_DEV}" | awk '{print $1}')
        MINOR_HEX=$(echo "${ROOT_HEX_DEV}" | awk '{print $2}')
        
        # Convert hex indices to standard decimal numbers used by the block subsystem layer
        MAJOR_DEC=$((MAJOR_HEX))
        MINOR_DEC=$((MINOR_HEX))
        
        MASTER_DISK=""

        # Trace the absolute backing hardware device using native kernel sysfs directory tracks
        if [ -f "/sys/dev/block/${MAJOR_DEC}:${MINOR_DEC}/../dev" ]; then
            MASTER_DISK=$(basename "$(readlink -f "/sys/dev/block/${MAJOR_DEC}:${MINOR_DEC}/..")")
        elif [ -f "/sys/dev/block/${MAJOR_DEC}:${MINOR_DEC}/dev" ]; then
            MASTER_DISK=$(basename "$(readlink -f "/sys/dev/block/${MAJOR_DEC}:${MINOR_DEC}")")
        fi

        # Deep loop validation if the root environment runs inside a LUKS device-mapper container
        if [[ "${MASTER_DISK}" == dm-* ]] || [ -d "/sys/block/${MASTER_DISK}/slaves" ]; then
            SLAVE_CHECK=$(ls -d /sys/block/${MASTER_DISK}/slaves/* 2>/dev/null | head -n1 || echo "")
            if [ -n "${SLAVE_CHECK}" ]; then
                SLAVE_BASE=$(basename "${SLAVE_CHECK}")
                if [ -f "/sys/block/${SLAVE_BASE}/../dev" ]; then
                    MASTER_DISK=$(basename "$(readlink -f "/sys/block/${SLAVE_BASE}/..")")
                else
                    MASTER_DISK=$(lsblk -dno PKNAME "/dev/${SLAVE_BASE}" | tr -d '[:space:]' || echo "${SLAVE_BASE}")
                fi
            fi
        fi

        # Strip remaining numeric partition markers safely to ensure we match raw hardware names
        MASTER_DISK=$(echo "${MASTER_DISK}" | sed -E 's/p?[0-9]+$//g' | tr -d '[:space:]')

        # Fallback tracking checkpoint: target first non-virtual block disk if mapping stalls
        if [ -z "${MASTER_DISK}" ] || [ "${MASTER_DISK}" = "root" ] || [ "${MASTER_DISK}" = "dev" ]; then
            MASTER_DISK=$(lsblk -dno NAME | grep -E -v '^(loop|zram|dm-)' | head -n1 | tr -d '[:space:]' || echo "sda")
        fi

        # Output raw storage parameters using structured JSON data blocks in absolute bytes
        lsblk -J -b -o NAME,FSTYPE,SIZE,MOUNTPOINT,TYPE "/dev/${MASTER_DISK}"
      args:
        executable: /bin/bash
      register: storage_json_raw
      changed_when: false
      check_mode: false

    - name: "SCAN | DYNAMIC | Process structured JSON blocks into systemic runtime facts"
      ansible.builtin.set_fact:
        final_vault_configs: >-
          {%- set configured_list = namespace(data=[]) -%}
          {%- if storage_json_raw.stdout is defined and storage_json_raw.stdout | trim != '' -%}
            {%- set raw_dict = storage_json_raw.stdout | from_json -%}
            
            {%- set flat_parts = [] -%}
            {%- for device in raw_dict.blockdevices | default([]) -%}
              {%- if device.type == 'part' -%}
                {%- set _ = flat_parts.append(device) -%}
              {%- endif -%}
              {%- for child in device.children | default([]) -%}
                {%- if child.type == 'part' -%}
                  {%- set _ = flat_parts.append(child) -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            
            {%- for part in flat_parts -%}
              {%- set p_name = part.name | default('') -%}
              {%- set p_fstype = part.fstype | default('') -%}
              {%- set p_mount = part.mountpoint | default('') -%}
              {%- set p_bytes = part.size | default(0) | int -%}
              
              {%- if p_name != '' and (p_mount is none or p_mount == "" or p_mount == "null" or p_mount == "NONE") -%}
                
                {# CRITICAL HARDWARE SAFETY FILTER: Explicitly skips sda2 to protect your main operating system #}
                {%- if 'sda2' not in p_name -%}
                  {%- set size_gb = (p_bytes / 1024 / 1024 / 1024) | round(0, 'common') | int -%}
                  
                  {%- if size_gb >= (vault_minimum_size_threshold_gb | default(15) | int) -%}
                    {%- set vault_index = configured_list.data | length + 1 -%}
                    {%- set dynamic_moniker = 'vault' ~ vault_index -%}
                    {%- set full_path = p_name if p_name.startswith('/') else '/dev/' ~ p_name -%}
                    {%- set _ = configured_list.data.append({
                          'path': full_path,
                          'name': dynamic_moniker,
                          'size_gb': size_gb,
                          'signature': 'EMPTY'
                        }) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {{ configured_list.data }}
      when: "secure_vault_enabled | bool"

# =============================================================================
# BLOCK 20A: AUTONOMOUS LUKS2 ASSESSMENT RUNTIME INTERFACE (BANK ICON ENFORCED)
# DESCRIPTION: Splices synchronized lock and bank vault secure icons directly 
#              into the sequential list terminal output blocks.
# =============================================================================
    - name: "VAULT ENGINE | LEDGER | Render multi-tier block volume assessment reports"
      ansible.builtin.debug:
        msg: "{{ report_output.split('\n') }}"
      vars:
        report_output: |
          =======================================================================================
          🔒 [ SECURITY BLOCK MONITOR ]: DYNAMIC HARDWARE ASSESSMENT LABELS
          =======================================================================================
          {% if final_vault_configs is defined and final_vault_configs | length > 0 %}
          {% for vault in final_vault_configs %}
          🔒🏦 [ {{ vault.name | upper }} ENVELOPE INITIALIZED AND ARMED ]
            ↳ TARGET PATH  : [ {{ vault.path }} ]
            ↳ STORAGE SCALE: [ {{ vault.size_gb }} GB POOL SPACE DETECTED ]
          
          ✨ [🔥] VAULT PROTOCOL ACTIVATED: ARMED FOR SYSTEM INJECTION!
          {% endfor %}
          {% else %}
          ⚠️ [ WARNING ]: No unallocated clean space partitions detected on local block devices.
          {% endif %}
          =======================================================================================

# =============================================================================
# BLOCK 20B: MASTER FRAMEWORK TOPOLOGY COMPLIANCE ANCHOR
# DESCRIPTION: Commits dynamically mapped data fields directly to persistent systems.
# =============================================================================
    - name: "VAULT ENGINE | LEDGER | Commit verified system storage map parameters to disk"
      ansible.builtin.copy:
        dest: "/etc/vault-topology.conf"
        content: |
          # Automated Storage Architecture Mapping Table
          {% if final_vault_configs | length > 0 %}
          {% for vault in final_vault_configs %}
          {{ vault.name }}:{{ vault.path }}:{{ vault.size_gb }}
          {% endfor %}
          {% endif %}
        owner: root
        group: root
        mode: '0600'
      when:
        - "secure_vault_enabled | bool"
        - "final_vault_configs | length > 0"
        - "not ansible_check_mode"

# =============================================================================
# BLOCK 21: SNAP CONSTRAINTS & SNORT ENVIRONMENT PRE-INITIALIZATION (RESTORED)
# DESCRIPTION: Forces the presence of missing logging targets and configuration
#              boundaries to prevent fatal core engine execution drops.
# =============================================================================
    - name: "CONFIGURATION | SNORT 3 | Ensure log path ecosystems exist on drive"
      ansible.builtin.file:
        path: "/var/log/snort"
        state: directory
        owner: root
        group: root
        mode: '0750'
      become: true


# =============================================================================
# BLOCK 22: SYSTEMD SERVICE INVENTORY INITIATION MATRICES
# DESCRIPTION: Unmasks and maps persistent orchestration templates cleanly into
#              the service runtime layers to enable native container frameworks.
# =============================================================================
    - name: "SECURITY SERVICES | INVENTORY | Force unmask runtime tracking parameters"
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: false
      loop:
        - machinectl.socket
        - systemd-portabled.service
      become: true
      when: "not ansible_check_mode"

    - name: "SECURITY SERVICES | INVENTORY | Ensure template configuration states match baseline"
      ansible.builtin.systemd:
        name: "systemd-nspawn@.service"
        masked: false
      become: true
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 23: HARDWARE CONTROLLER & NETWORK ENVIRONMENT DEPLOYMENTS
# DESCRIPTION: Resolves persistent UUIDs, storage media rotation metrics,
#              and home local area network boundaries.
# =============================================================================

    - name: "SCAN | Discover absolute persistent root device UUID"
      ansible.builtin.shell: "findmnt -n -o UUID /"
      args:
        executable: /bin/bash
      register: live_root_uuid
      changed_when: false
      check_mode: false

    - name: "SCAN | Detect drive media rotation profiles directly from hardware controller"
      ansible.builtin.shell: |
        set -euo pipefail
        ROOT_RAW=$(findmnt -n -o SOURCE / | cut -d'[' -f1)
        if [[ "${ROOT_RAW}" == /dev/mapper/* ]]; then
            MAPPER_NAME=$(basename "${ROOT_RAW}")
            if [ -f "/sys/class/block/${MAPPER_NAME}/slaves/"* ]; then
                REAL_DISK=$(basename "$(ls -d /sys/class/block/${MAPPER_NAME}/slaves/* | head -n1)")
            else
                REAL_DISK=""
            fi
        else
            REAL_DISK=$(lsblk -dno PKNAME "${ROOT_RAW}" | tr -d '[:space:]' || echo "")
        fi
        if [ -n "${REAL_DISK}" ] && [ -f "/sys/block/${REAL_DISK}/queue/rotational" ]; then
            cat "/sys/block/${REAL_DISK}/queue/rotational"
        else
            echo "1"
        fi
      args:
        executable: /bin/bash
      register: host_disk_rotation_raw
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | Extract active CIDR address spectrum directly from running hardware interface"
      ansible.builtin.shell: |
        set -o pipefail
        ip -o -f inet addr show | awk '$2 !~ /lo|virbr|docker/ {print $4}' | head -n1
      args:
        executable: /bin/bash
      register: live_active_cidr_raw
      changed_when: false
      failed_when: false
      check_mode: false
# =============================================================================
# BLOCK 24: HARDWARE LAYER ENVIRONMENT BOUNDARY SYNTHESIS
# DESCRIPTION: Sanitizes the active network range boundaries using fallback
#              protection rules, and evaluates core chassis role parameters.
# =============================================================================
    - name: "SCAN | Synthesize virtualization and media profiles"
      ansible.builtin.set_fact:
        is_mechanical_drive: "{{ true if (host_disk_rotation_raw.stdout is defined and host_disk_rotation_raw.stdout | trim == '1') else false }}"
        is_virtual_machine: "{{ true if (ansible_facts['virtualization_role'] | default('host') == 'guest') else false }}"

    - name: "SCAN | Probe system power rail for lithium-ion battery nodes"
      ansible.builtin.stat:
        path: "/sys/class/power_supply/BAT0"
      register: battery_node_check

    - name: "SCAN | Read raw DMI motherboard hardware chassis type integer"
      ansible.builtin.slurp:
        src: "/sys/class/dmi/id/chassis_type"
      register: raw_dmi_chassis_id
      failed_when: false
# =============================================================================
# BLOCK 25: HARDWARE CORE FORM-FACTOR SPECS COMPUTATION
# DESCRIPTION: Computes and translates raw DMI chassis configurations into
#              unambiguous, structural platform target form factors.
# =============================================================================
    - name: "SCAN | Synthesize translated hardware form-factor profile facts"
      ansible.builtin.set_fact:
        hardware_form_factor: >-
          {%- set chassis_int = (raw_dmi_chassis_id['content'] | b64decode | replace('\n', '') | trim | int) if (raw_dmi_chassis_id.content is defined and raw_dmi_chassis_id.content) else 0 -%}
          {%- if battery_node_check.stat.exists or chassis_int in [8, 9, 10, 14] -%}
          LAPTOP / PORTABLE WORKSTATION
          {%- elif chassis_int in [3, 4, 5, 6, 7, 15, 16] -%}
          DESKTOP / FIXED SECURE STATION
          {%- elif chassis_int in [23, 17, 25] or (ansible_facts['processor_vcpus'] | default(2) | int) > 16 -%}
          ENTERPRISE HARDENED SERVER BLADE
          {%- else -%}
          STANDALONE COMPUTING NODE (FORM-FACTOR UNKNOWN)
          {%- endif -%}

    - name: "SCAN | Discover primary human installation user identity (UID 1000)"
      ansible.builtin.shell: "getent passwd 1000 | cut -d: -f1"
      register: primary_owner_discovered
      changed_when: false
      check_mode: false
# =============================================================================
# BLOCK 26: DYNAMIC COGNITIVE SPECIFICATION FACT SYNTHESIS
# DESCRIPTION: Calculates dynamic swappiness values, compression algorithms,
#              oom engines, and partitions subvolume paths into active facts.
# =============================================================================
    - name: "SCAN | DYNAMIC | Intelligently extract active network interface matching chassis form factor"
      ansible.builtin.shell: |
        set -o pipefail
        FORM_FACTOR="{{ hardware_form_factor | trim }}"
        IS_VM="{{ is_virtual_machine | bool }}"
        IFACES=$(ip -br link show | awk '$3 ~ /UP/ && $1 !~ /lo|virbr|docker|proton|pvpn/ {print $1}')
        if [ "$IS_VM" = "true" ]; then
            echo "$IFACES" | grep -E '^(eth|en|vnet)' | head -n1 || echo "$IFACES" | head -n1
        elif [[ "$FORM_FACTOR" =~ "LAPTOP" ]]; then
            echo "$IFACES" | grep -E '^(wlan|wl)' | head -n1 || echo "$IFACES" | grep -E '^(en|eth)' | head -n1 || echo "$IFACES" | head -n1
        else
            echo "$IFACES" | grep -E '^(en|eth)' | head -n1 || echo "$IFACES" | head -n1
        fi
      args:
        executable: /bin/bash
      register: optimized_hardware_interface_probe
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | STATE | Lock dynamic hardware-intelligent network variables for tools"
      ansible.builtin.set_fact:
        primary_network_interface: "{{ optimized_hardware_interface_probe.stdout | trim | default('wls1', true) }}"
        system_ram_gb: "{{ ((ansible_facts['memtotal_mb'] | default(4096) | int) / 1024) | round(0, 'common') | int }}"
        oom_engine_selection: "{{ 'earlyoom' if ((ansible_facts['memtotal_mb'] | default(4096) | int) < 8192) else 'systemd-oomd' }}"
        target_compression: "{{ 'lz4' if ((ansible_facts['memtotal_mb'] | default(4096) | int) < 8192) else 'zstd' }}"
        dynamic_home_net: "{{ live_active_cidr_raw.stdout | default('192.168.1.0/24') | trim if (live_active_cidr_raw.stdout is defined and live_active_cidr_raw.stdout | trim | length > 0) else '192.168.1.0/24' }}"
        target_swappiness: >-
          {%- if (ansible_facts['memtotal_mb'] | default(4096) | int) > 16384 -%} 10
          {%- elif (ansible_facts['memtotal_mb'] | default(4096) | int) <= 7168 -%} 150
          {%- else -%} 100
          {%- endif -%}
        target_formula_swap_mb: >-
          {%- if (ansible_facts['memtotal_mb'] | default(4096) | int) <= 7168 -%}
            {{ (ansible_facts['memtotal_mb'] | default(4096) | int) * 2 }}
          {%- elif (ansible_facts['memtotal_mb'] | default(4096) | int) > 16384 -%}
            4096
          {%- else -%}
            {{ (ansible_facts['memtotal_mb'] | default(4096) | int) + 3072 }}
          {%- endif -%}
# =============================================================================
# BLOCK 27: SWAP HARDENING PARTITION RECONNAISSANCE & FORMULA SCANS
# DESCRIPTION: Investigates active memory maps, strictly filters out virtual
#              ZRAM handles, and enforces dynamic fallback allocations.
# =============================================================================
    - name: "SWAP HARDENING | RECONNAISSANCE | Discover physical non-zram raw swap partition segments"
      ansible.builtin.shell: |
        set -o pipefail
        swapon --show=NAME,TYPE | grep -v 'zram' | awk '$2 == "partition" {print $1}' | head -n1 || echo ""
      args:
        executable: /bin/bash
      register: target_physical_swap_handle
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SWAP HARDENING | STATE | Compile mutually exclusive partition tracking variables"
      ansible.builtin.set_fact:
        has_swap_partition: "{{ true if (target_physical_swap_handle.stdout is defined and target_physical_swap_handle.stdout | trim | length > 0) else false }}"

    - name: "SWAP HARDENING | SANITIZATION | Purge legacy proto-swap lines from crypttab completely"
      ansible.builtin.lineinfile:
        path: "/etc/crypttab"
        regexp: '^.*swap_(ssd|vault).*$'
        state: absent
      when: "not ansible_check_mode"

    - name: "SWAP HARDENING | SANITIZATION | Purge legacy proto-swap entries from permanent fstab blocks"
      ansible.builtin.lineinfile:
        path: "/etc/fstab"
        regexp: '^.*/dev/mapper/swap_(ssd|vault).*$'
        state: absent
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 28: SCAN REPORT | TELEMETRY | HARDWARE CONFIGURATION OVERVIEW
# DESCRIPTION: Compiles all scanned host topography traits, partition layouts,
#              network adapters, and memory metrics into an informational ledger.
# =============================================================================
    - name: "SCAN REPORT | TELEMETRY | Render detected hardware configuration overview metrics"
      ansible.builtin.debug:
        msg: "{{ blueprint_summary.split('\n') }}"
      vars:
        blueprint_summary: |
          =======================================================================================
          🔬 ZERO-TRUST HARDWARE ARCHITECTURE RECONNAISSANCE SCAN COMPLETE
          =======================================================================================
          📋 HOST PLATFORM PROVENANCE PROFILE:
            ↳ DETECTED OPERATING SYSTEM  : [ {{ ansible_facts['distribution'] | default(ansible_facts['os_family']) | upper }} ]
            ↳ TARGET SYSTEM DISTRIBUTION : [ {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} ]
          =======================================================================================
          🎛️ COGNITIVE HARDWARE SPECIFICATION MATRIX:
            ↳ HARDWARE FORM-FACTOR CORE  : [ {{ hardware_form_factor | default('STANDALONE COMPUTING NODE') | trim }} ]
            ↳ DETECTED DRIVE MEDIA CLASS : [ {{ 'MECHANICAL_HDD_PLATTER' if is_mechanical_drive | bool else 'FLASH_CELL_SSD' }} ]
            ↳ TOTAL ALLOCATED NODE RAM   : [ {{ system_ram_gb | int }} GB total capacity ]
            ↳ INTERFACES DETECTED TO USE : [ {{ primary_network_interface | default('wls1') }} ]
            ↳ HOMENET RANGE CIDR BLOCK   : [ {{ dynamic_home_net | default('192.168.1.0/24') }} ]
          =======================================================================================
          🧠 VIRTUAL & PHYSICAL RECONNAISSANCE MEMORY MATRIX:
            ↳ SYSTEM HARWARE SWAP STATUS : [ {% if has_swap_partition | bool %}ACTIVE RAW PARTITION (DEVICE: {{ target_physical_swap_handle.stdout | trim }}){% else %}ACTIVE FALLBACK SYSTEM SWAP STRATUM{% endif %} ]
            ↳ RESOLVED SWAP CAPACITY SIZE: [ {{ target_formula_swap_mb | int }} MB ALLOCATED MATRIX ]
          =======================================================================================
# =============================================================================
# BLOCK 29: CRYPT-MAPPED VOLATILE SOLID STATE SWAP ARCHITECTURE
# DESCRIPTION: Enforces transient random-keyed encryption over physical block
#              swap layouts tailored directly to HDD, VM, or SSD profiles.
# =============================================================================
    - name: "SWAP HARDENING | Deploy hardware-aware transient encryption layout to crypttab"
      ansible.builtin.lineinfile:
        path: "/etc/crypttab"
        line: >-
          {%- if is_virtual_machine | bool -%}
            swap_vault {{ target_physical_swap_handle.stdout | trim }} /dev/urandom swap,cipher=aes-xts-plain64,size=256,hash=sha256
          {%- elif is_mechanical_drive | bool -%}
            swap_vault {{ target_physical_swap_handle.stdout | trim }} /dev/urandom swap,cipher=aes-xts-plain64,size=256,hash=sha256
          {%- else -%}
            swap_vault {{ target_physical_swap_handle.stdout | trim }} /dev/urandom swap,cipher=aes-xts-plain64,size=256,hash=sha256,discard
          {%- endif -%}
        state: present
      when:
        - "has_swap_partition | bool"
        - "not ansible_check_mode"

    - name: "SWAP HARDENING | Append crypt-mapped execution endpoints to fstab matrices"
      ansible.builtin.lineinfile:
        path: "/etc/fstab"
        line: "/dev/mapper/swap_vault none swap defaults,pri=10 0 0"
        state: present
      when:
        - "has_swap_partition | bool"
        - "not ansible_check_mode"

# =============================================================================
# BLOCK 30: SANITIZED EXPLICIT STORAGE SUBVOLUME LAYOUT LEDGERS
# DESCRIPTION: Enforces fstab configurations using state: present to safely write
#              subvolume profiles and purges legacy vault leak data.
# =============================================================================

    - name: "STORAGE | LEDGER | Clean legacy unmanaged vault leakage records from fstab"
      ansible.posix.mount:
        path: "{{ item }}"
        state: absent
      loop: ["/vault", "none"]

    - name: "STORAGE | LEDGER | Purge legacy transient virtual allocations text to force correct boot sorting order"
      ansible.builtin.lineinfile:
        path: "/etc/fstab"
        regexp: '^tmpfs\s+(/tmp|/dev/shm)\s+tmpfs.*$'
        state: absent
      become: true
      when: "not ansible_check_mode"

    - name: "STORAGE | LEDGER | Commit standardized subvolumes to physical fstab parameters"
      ansible.posix.mount:
        path: "{{ item.dest }}"
        src: "UUID={{ live_root_uuid.stdout | trim }}"
        fstype: "btrfs"
        opts: "rw,relatime,compress=zstd:3,space_cache=v2,nodev,nosuid,nofail,subvol=/@{{ item.name }}"
        state: present
      loop: "{{ active_distro_subvolumes | default([]) }}"
      when:
        - "root_fs_signature.stdout is defined and 'btrfs' in root_fs_signature.stdout"
        - "not ansible_check_mode"
        - "item.dest != '/'"
        - "item.dest != '/home'"
        - "not (item.dest == '/swap' and has_swap_partition | bool)"

# =============================================================================
# BLOCK 31: COMPREHENSIVE FALLBACK SWAPSPACE ASSESSMENT MATRIX
# DESCRIPTION: Evaluates physical folder locations, probes current filesystem
#              file footprints, and dynamically sets the compliance metrics.
# =============================================================================
    - name: "STORAGE | MOUNT | Safely execute universal storage engine synchronization"
      ansible.builtin.shell: "mount -a"
      changed_when: false
      failed_when: false

    - name: "STORAGE | SWAPFILE | Check physical presence of existing swapfile allocation"
      ansible.builtin.stat:
        path: "/swap/swapfile"
      register: target_swapfile_check
      when: "not has_swap_partition | bool"

    - name: "STORAGE | SWAPFILE | Interrogate disk for active swapfile footprint size"
      ansible.builtin.shell: "du -m /swap/swapfile | awk '{print $1}'"
      register: live_swapfile_size_mb_probe
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - "not has_swap_partition | bool"
        - "target_swapfile_check.stat is defined and target_swapfile_check.stat.exists | bool"

    - name: "STORAGE | SWAPFILE | Evaluate baseline compliance matrix size boundaries"
      ansible.builtin.set_fact:
        swapfile_size_mismatch: >-
          {%- if not has_swap_partition | bool and target_swapfile_check.stat is defined and target_swapfile_check.stat.exists | bool -%}
            {{ true if (live_swapfile_size_mb_probe.stdout is defined and live_swapfile_size_mb_probe.stdout | trim | int != target_formula_swap_mb | int) else false }}
          {%- else -%}
            false
          {%- endif -%}
      when: "not has_swap_partition | bool"

    - name: "STORAGE | TELEMETRY | Render active swapfile size non-compliance alert"
      ansible.builtin.debug:
        msg:
          - "======================================================================================="
          - "⚠️  [ WARNING ] ACTIVE SWAPFILE SIZE DOES NOT MATCH OUR FRAMEWORK STANDARDS"
          - "======================================================================================="
          - "   ↳ Current Disk Footprint : {{ live_swapfile_size_mb_probe.stdout | default('0') | trim }} MB"
          - "   ↳ Target Blueprint Size  : {{ target_formula_swap_mb | int }} MB"
          - "======================================================================================="
          - " [ ✓ ] ENFORCING REALIGNMENT: RE-ALLOCATING NEW SWAPFILE LAYER NOW..."
          - "======================================================================================="
      when:
        - "not has_swap_partition | bool"
        - "swapfile_size_mismatch | default(false) | bool"
# =============================================================================
# BLOCK 32B: COGNITIVE STORAGE PROVISIONING & MOUNT ENFORCEMENTS
# DESCRIPTION: Allocates clean copy-on-write-disabled backup swap storage blocks
#              safely using native modern Btrfs filesystem capabilities.
# =============================================================================
    - name: "STORAGE | SWAPFILE | Build secure Btrfs fallback block if no physical swap partition exists"
      ansible.builtin.shell: |
        set -euo pipefail
        TARGET_SIZE={{ target_formula_swap_mb | int }}
        mkdir -p /swap
        
        # If swapfile exists and matches size, do nothing
        if [ -f /swap/swapfile ] && [ "$(du -m /swap/swapfile | awk '{print $1}')" -eq "$TARGET_SIZE" ]; then
            echo "MATCH_FOUND"
            exit 0
        fi
        
        # Completely re-allocate to clear block layer constraints
        swapoff /swap/swapfile 2>/dev/null || true
        rm -f /swap/swapfile
        btrfs filesystem mkswapfile --size ${TARGET_SIZE}M /swap/swapfile
        chmod 0600 /swap/swapfile
        mkswap -f /swap/swapfile
        echo "RECREATED"
      args:
        executable: /bin/bash
      register: fallback_swapfile_creation_status
      changed_when: "'RECREATED' in fallback_swapfile_creation_status.stdout"
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not has_swap_partition | bool"
        - "not ansible_check_mode"

    - name: "SWAP CONFIG | ALLOCATION | Traditional swapfile allocation block if target platform is non-btrfs filesystem"
      ansible.builtin.shell: |
        set -euo pipefail
        TARGET_SIZE={{ target_formula_swap_mb | int }}
        mkdir -p /swap
        
        if [ -f /swap/swapfile ] && [ "$(du -m /swap/swapfile | awk '{print $1}')" -eq "$TARGET_SIZE" ]; then
            echo "MATCH_FOUND"
            exit 0
        fi
        
        swapoff /swap/swapfile 2>/dev/null || true
        rm -f /swap/swapfile
        fallocate -l ${TARGET_SIZE}M /swap/swapfile || dd if=/dev/zero of=/swap/swapfile bs=1M count=$TARGET_SIZE status=none
        chmod 0600 /swap/swapfile
        mkswap -f /swap/swapfile
        echo "RECREATED"
      args:
        executable: /bin/bash
      register: traditional_swapfile_creation_status
      changed_when: "'RECREATED' in traditional_swapfile_creation_status.stdout"
      when:
        - "is_btrfs_layout is defined and not is_btrfs_layout | bool"
        - "not has_swap_partition | bool"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 32C: SWAP LIFECYCLE ACTIVATION & CUSTOM TELEMETRY
# DESCRIPTION: Stabilizes fstab references for filesystems, calls hot targets,
#              and renders the exact custom checkmark size confirmation banner.
# =============================================================================
    - name: "SWAP CONFIG | PERSISTENCE | Force lock fallback swapfile entry to permanent fstab structure"
      ansible.posix.mount:
        path: "none"
        src: "/swap/swapfile"
        fstype: "swap"
        opts: "sw,pri=10,nofail"
        state: "present"
      when:
        - "not has_swap_partition | bool"
        - "not ansible_check_mode"

    - name: "SWAP CONFIG | ACTIVATION | Force live kernel integration to bring swap storage online"
      ansible.builtin.shell: |
        set -euo pipefail
        TARGET_SIZE={{ target_formula_swap_mb | int }}
        
        if ! swapon --show=NAME | grep -q '/swap/swapfile'; then
            # Clear old signatures and unmount stale descriptors cleanly
            swapoff /swap/swapfile 2>/dev/null || true
            rm -f /swap/swapfile
            
            # Use native Btrfs allocation to enforce pristine non-CoW contiguous blocks
            btrfs filesystem mkswapfile --size ${TARGET_SIZE}M /swap/swapfile
            chmod 0600 /swap/swapfile
            
            mkswap -f /swap/swapfile
            swapon -p 10 /swap/swapfile
        fi
      args:
        executable: /bin/bash
      changed_when: true
      when:
        - "not has_swap_partition | bool"
        - "not ansible_check_mode"

    - name: "SWAP CONFIG | TELEMETRY | Render active swap file size confirmation string"
      ansible.builtin.debug:
        msg:
          - "======================================================================================="
          - "[✓] SWAP FILE LIFECYCLE FORCED LIVE | SIZE: {{ target_formula_swap_mb | int }} MB ACTIVE IN KERNEL"
          - "======================================================================================="
      when:
        - "not ansible_check_mode"
        - "not has_swap_partition | bool"
# =============================================================================
# BLOCK 33: AMORPHOUS TRANSIENT MEMORY BOUNDARY DIRECTIVES
# DESCRIPTION: Enforces high-security virtual execution mount arrays explicitly
#              at the very bottom of the fstab lifecycle matrix path.
# =============================================================================
    - name: "STORAGE | HARDENING | Secure virtual execution interfaces universally at the bottom of fstab arrays"
      ansible.builtin.blockinfile:
        path: "/etc/fstab"
        marker: "# {mark} ANSIBLE VIRTUAL TIMEMAPS ENGINE PLATFORMS"
        insertafter: EOF
        block: |
          tmpfs /tmp tmpfs defaults,noexec,nosuid,nodev,size=50% 0 0
          tmpfs /dev/shm tmpfs defaults,noexec,nosuid,nodev,size=1G 0 0
      become: true
# =============================================================================
# BLOCK 34: SYSTEMD ZRAM GENERATOR MEMORY ACCELERATION
# DESCRIPTION: Automatically configures systemd-zram generators to optimize
#              userland swap priority spaces matching identified physical profiles.
# =============================================================================
    - name: "ZRAM PROVISION | Deploy chosen compression algorithm setup matching scanned hardware profile"
      ansible.builtin.copy:
        dest: "/etc/systemd/zram-generator.conf"
        content: |
          # =========================================================================
          # 🎛️ HARDENED POST-INSTALL USERLAND MEMORY ACCELERATION PRESETS (PRIORITY 100)
          # =========================================================================
          [zram0]
          zram-size = min(ram / 2, 2048)
          compression-algorithm = {{ target_compression }}
          swap-priority = 100
        mode: '0644'
      notify: "Reload Active Systemd Core"
      when:
        - "not ansible_check_mode"
        - "(ansible_facts['memtotal_mb'] | default(2048) | int) <= 16384"

# =============================================================================
# BLOCK 35: USERLAND OUT-OF-MEMORY COMPLIANCE MATRIX
