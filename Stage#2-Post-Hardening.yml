---
- name: "Universal Stand-Alone Zero-Trust Linux Hardening Framework (Stage 2 Core)"
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  vars:
    # -------------------------------------------------------------------------
    # SECURE INFRASTRUCTURE LAYER CONFIGURATIONS
    # -------------------------------------------------------------------------
    security_architecture_profile: "pentagon" # Options: "fortress" or "pentagon"
    secure_vault_enabled: true
    vault_partition_handle: "/dev/sda2"
    vault_mount_target: "/vault"
    primary_user_identifier: "vega"
    system_hostname_signature: "SENGR"

    # Multi-Distro Core Package Blueprint Matrix
    distro_package_maps:
      Archlinux:  { fail2ban: 'fail2ban', sysstat: 'sysstat', snort: 'snort', arpwatch: 'arpwatch', usbguard: 'usbguard', rkhunter: 'rkhunter', clamav: 'clamav', aide: 'aide' }
      Debian:     { fail2ban: 'fail2ban', sysstat: 'sysstat', snort: 'snort', arpwatch: 'arpwatch', usbguard: 'usbguard', rkhunter: 'rkhunter', clamav: 'clamav', aide: 'aide' }
      RedHat:     { fail2ban: 'fail2ban', sysstat: 'sysstat', snort: 'snort', arpwatch: 'arpwatch', usbguard: 'usbguard', rkhunter: 'rkhunter', clamav: 'clamav', aide: 'aide' }
      Suse:       { fail2ban: 'fail2ban', sysstat: 'sysstat', snort: 'snort', arpwatch: 'arpwatch', usbguard: 'usbguard', rkhunter: 'rkhunter', clamav: 'clamav', aide: 'aide' }
  tasks:
    # =========================================================================
    # PHASE 1 | AUTOMATED HARDWARE, TOPO & LAYOUT SCANNING ENGINE
    # =========================================================================
    - name: "SCAN | Probe motherboard boot firmware directory existence"
      ansible.builtin.stat:
        path: "/sys/firmware/efi"
      register: efi_directory_check

    - name: "SCAN | Detect active root filesystem source device handle"
      ansible.builtin.shell: "set -o pipefail && findmnt -n -o SOURCE / | awk '{print $1}' | cut -d'[' -f1"
      args:
        executable: /bin/bash
      register: root_source_device
      changed_when: false
      check_mode: false

    - name: "SCAN | Detect active boot partition source device handle"
      ansible.builtin.shell: "set -o pipefail && findmnt -n -o SOURCE /boot | awk '{print $1}' | cut -d'[' -f1 || echo 'nested'"
      args:
        executable: /bin/bash
      register: boot_source_device
      changed_when: false
      check_mode: false
    - name: "SCAN | Detect active root filesystem type format signature"
      ansible.builtin.shell: "findmnt -n -o FSTYPE /"
      register: root_fs_signature
      changed_when: false
      check_mode: false

    - name: "SCAN | Discover absolute persistent root device UUID"
      ansible.builtin.shell: "blkid -s UUID -o value {{ root_source_device.stdout | default('/dev/null') }}"
      register: live_root_uuid
      changed_when: false
      check_mode: false

    - name: "SCAN | Discover running network interfaces directly from kernel space"
      ansible.builtin.shell: "set -o pipefail && ls /sys/class/net | grep -v 'lo'"
      args:
        executable: /bin/bash
      register: active_network_interfaces
      changed_when: false
      check_mode: false

    - name: "SCAN | Query active subvolume topology tree from Btrfs root"
      ansible.builtin.shell: "btrfs subvolume list /"
      register: raw_btrfs_tree
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | Read active initramfs hook parameters cleanly"
      ansible.builtin.slurp:
        src: "/etc/mkinitcpio.conf"
      register: raw_mkinitcpio
      failed_when: false
      when: "ansible_facts['os_family'] == 'Archlinux'"
    # =========================================================================
    # PHASE 1B | SMART ASSESSMENT INTELLIGENCE AND FACT SYNTHESIS
    # =========================================================================
    - name: "SCAN | Synthesize primary system hardware and layout facts"
      ansible.builtin.set_fact:
        # 📊 FACT RECONNAISSANCE: Parse total physical memory metrics into Gigabytes
        system_ram_gb: "{{ (ansible_facts['memtotal_mb'] | int / 1024) | round(0, 'common') | int }}"
        
        # 🧠 OOM DECISION RADAR: Automatically chooses daemon profile based on your 8GB threshold rule
        oom_engine_selection: "{{ 'earlyoom' if (ansible_facts['memtotal_mb'] | int < 8192) else 'systemd-oomd' }}"
        
        # ⚡ COMPRESSION ALGORITHM SELECTOR: Automatically assigns LZ4 for low-resource speed, or Zstd for high-density space
        target_compression: "{{ 'lz4' if (ansible_facts['memtotal_mb'] | int < 8192) else 'zstd' }}"
        
        # 📈 STEP-DOWN SWAPPINESS MATRIX: Dynamically adjusts kernel caching behavior based on hardware depth
        target_swappiness: "{{ 150 if (ansible_facts['memtotal_mb'] | int < 8192) else (100 if ansible_facts['memtotal_mb'] | int < 16384 else 10) }}"
        
        # 💾 SELF-HEALING SWAPFILE SIZE CALCULATOR: Implements your precise math guidelines across all 3 tiers
        target_swapfile_size_gb: >-
          {% if ansible_facts['memtotal_mb'] | int < 8192 %}
            8
          {% elif ansible_facts['memtotal_mb'] | int < 16384 %}
            {{ ((ansible_facts['memtotal_mb'] | int / 1024) * 1.5) | round(0) | int }}
          {% else %}
            4
          {% endif %}

        # Core system state mapping variables
        is_uefi_mode: "{{ efi_directory_check.stat.exists | bool }}"
        is_btrfs_layout: "{{ 'btrfs' in root_fs_signature.stdout | default('') }}"
        active_root_uuid: "{{ live_root_uuid.stdout | default('') }}"
        has_systemd_hook: "{{ raw_mkinitcpio.content is defined and 'systemd' in (raw_mkinitcpio.content | b64decode) }}"
        has_encrypt_hook: "{{ raw_mkinitcpio.content is defined and 'encrypt' in (raw_mkinitcpio.content | b64decode) }}"

        # 🚏 TOPO STRING FIX: Forces regex search captures to cleanly output text instead of structured lists
        extracted_swap_subvol: "{{ raw_btrfs_tree.stdout | default('') | regex_search('path (.*@swap|.*root.*swap)', '\\1') | default('@swap') }}"
        extracted_log_subvol: "{{ raw_btrfs_tree.stdout | default('') | regex_search('path (.*@log|.*root.*log)', '\\1') | default('@log') }}"
        extracted_cache_subvol: "{{ raw_btrfs_tree.stdout | default('') | regex_search('path (.*@cache|.*root.*cache)', '\\1') | default('@cache') }}"
        extracted_docker_subvol: "{{ raw_btrfs_tree.stdout | default('') | regex_search('path (.*@docker|.*root.*docker)', '\\1') | default('@docker') }}"
        extracted_flatpak_subvol: "{{ raw_btrfs_tree.stdout | default('') | regex_search('path (.*@flatpak|.*root.*flatpak)', '\\1') | default('@flatpak') }}"
        extracted_srv_subvol: "{{ raw_btrfs_tree.stdout | default('') | regex_search('path (.*@srv|.*root.*srv)', '\\1') | default('@srv') }}"
      check_mode: false
    - name: "SCAN | Evaluate dependent topo structural safety definitions"
      ansible.builtin.set_fact:
        # 🏰 FORTRESS SECTOR RESTORATION: Resolves safely now that primary elements are locked in memory
        is_fortress_case: "{{ 'nested' in boot_source_device.stdout | default('') or (boot_source_device.stdout | default('')) == (root_source_device.stdout | default('')) }}"
      check_mode: false

    - name: "SMART EVALUATOR | Determine if layout matches defined standards or triggers bypass fallback"
      ansible.builtin.set_fact:
        boot_configuration_bypass: "{{ not (is_fortress_case | bool or (ansible_facts['os_family'] == 'Archlinux' and not has_systemd_hook | bool) or ansible_facts['os_family'] == 'Debian' or ansible_facts['os_family'] == 'RedHat' or ansible_facts['os_family'] == 'Suse') }}"
      check_mode: false

    - name: "COMPLIANCE | Execute initial pre-hardening baseline audit scan"
      ansible.builtin.shell: "lynis audit system --quick"
      register: initial_lynis_scan
      failed_when: false
      changed_when: false
      check_mode: false
      # 🫵 DRY-RUN SAFETY WIRE: Disables execution during syntax simulation modes
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 2 | CORE REPOSITORY AND INTELLIGENT DEFENSIVE SOFTWARE BASELINE
    # =========================================================================
    - name: "SECURITY RECON | Interrogate host binary installation signatures"
      ansible.builtin.stat:
        path: "/usr/bin/{{ item }}"
      register: checked_security_binaries
      # 🛡️ THE FULL THREAT PERIMETER: Probes the disk strictly for clamd to safeguard cgroup overrides
      loop: [ 'fail2ban-server', 'rkhunter', 'usbguard', 'arpwatch', 'snort', 'clamd', 'aide', 'twadmin', 'paru' ]
      check_mode: false

    - name: "SECURITY RECON | Synthesize tool installation status metrics"
      ansible.builtin.set_fact:
        # 🪓 ARMORED SELECTORS: Extracts presence variables dynamically by name token, eliminating position drift bugs
        fail2ban_installed: "{{ (checked_security_binaries.results | selectattr('item', 'equalto', 'fail2ban-server') | first).stat.exists }}"
        rkhunter_installed: "{{ (checked_security_binaries.results | selectattr('item', 'equalto', 'rkhunter') | first).stat.exists }}"
        usbguard_installed: "{{ (checked_security_binaries.results | selectattr('item', 'equalto', 'usbguard') | first).stat.exists }}"
        arpwatch_installed: "{{ (checked_security_binaries.results | selectattr('item', 'equalto', 'arpwatch') | first).stat.exists }}"
        snort_installed:    "{{ (checked_security_binaries.results | selectattr('item', 'equalto', 'snort') | first).stat.exists }}"
        clamav_installed:   "{{ (checked_security_binaries.results | selectattr('item', 'equalto', 'clamd') | first).stat.exists }}"
        aide_installed:     "{{ (checked_security_binaries.results | selectattr('item', 'equalto', 'aide') | first).stat.exists }}"
        tripwire_installed: "{{ (checked_security_binaries.results | selectattr('item', 'equalto', 'twadmin') | first).stat.exists }}"
        paru_installed:     "{{ (checked_security_binaries.results | selectattr('item', 'equalto', 'paru') | first).stat.exists }}"
      check_mode: false
    - name: "SECURITY CORE | Purge stale package manager database transaction locks"
      ansible.builtin.file:
        path: "/var/lib/pacman/db.lck"
        state: absent
      become: true
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "SECURITY CORE | INSTALL | Deploy baseline tools if missing from host"
      ansible.builtin.package:
        name: "{{ item.package }}"
        state: present
      loop:
        - { package: "{{ distro_package_maps[ansible_facts['os_family']]['fail2ban'] }}", installed: "{{ fail2ban_installed }}" }
        - { package: "{{ distro_package_maps[ansible_facts['os_family']]['sysstat'] }}", installed: true }
        - { package: "{{ distro_package_maps[ansible_facts['os_family']]['arpwatch'] }}", installed: "{{ arpwatch_installed }}" }
        - { package: "{{ distro_package_maps[ansible_facts['os_family']]['usbguard'] }}", installed: "{{ usbguard_installed }}" }
        - { package: "{{ distro_package_maps[ansible_facts['os_family']]['rkhunter'] }}", installed: "{{ rkhunter_installed }}" }
        - { package: "{{ distro_package_maps[ansible_facts['os_family']]['clamav'] }}", installed: "{{ clamav_installed }}" }
        - { package: "{{ distro_package_maps[ansible_facts['os_family']]['aide'] }}", installed: "{{ aide_installed }}" }
      become: true
      when: "not item.installed | bool"

    - name: "SECURITY CORE | INSTALL | Deploy advanced intrusion detection engine if missing"
      ansible.builtin.package:
        name: "{{ distro_package_maps[ansible_facts['os_family']]['snort'] }}"
        state: present
      become: true
      when: "not ansible_check_mode and not snort_installed | bool"
    - name: "SECURITY CORE | TUNING | SNORT | Provision hardware-aware dynamic systemd daemon service"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/snort.service"
        content: |
          [Unit]
          Description=Snort 2.9 Network Intrusion Detection Daemon
          After=network.target network-online.target
          
          [Service]
          Type=simple
          # 🫵 STATIC BINDINGS COMPLIANT: Drops the broken --daq-dir flag and hooks onto your active interface
          ExecStart=/usr/bin/snort -A fast -q -u snort -g snort -c /etc/snort/snort.conf -i {{ active_network_interfaces.stdout_lines | first | default('lo') }}
          Restart=on-failure
          RestartSec=5
          
          [Install]
          WantedBy=multi-user.target
        mode: '0644'
        owner: root
        group: root
      become: true

    - name: "SECURITY CORE | TUNING | SNORT | Map home network subnet definition dynamically"
      ansible.builtin.lineinfile:
        path: "/etc/snort/snort.conf"
        regexp: '^ipvar HOME_NET\s+'
        line: "ipvar HOME_NET {{ ansible_facts['default_ipv4']['network'] | default('192.168.1.0') }}/24"
        backup: yes
      become: true
      when: "not ansible_check_mode and ansible_facts['default_ipv4']['network'] is defined"

    - name: "SECURITY CORE | TUNING | SNORT | Set external tracking boundary to any network"
      ansible.builtin.lineinfile:
        path: "/etc/snort/snort.conf"
        regexp: '^ipvar EXTERNAL_NET\s+'
        line: "ipvar EXTERNAL_NET any"
      become: true
      when: "not ansible_check_mode"

    - name: "SECURITY CORE | TUNING | SNORT | Enforce active running telemetry state"
      ansible.builtin.systemd:
        name: "snort"
        state: started
        enabled: true
        daemon_reload: true
      become: true
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 3 | UNIFIED STORAGE TOPOLOGY UNMOUNT, PURGE, AND RE-ALIGNMENT ENGINE
    # =========================================================================
    - name: "BTRFS | ENFORCE | Ensure target system mount directories exist"
      ansible.builtin.file:
        path: "{{ item.mountpoint }}"
        state: directory
        mode: '0755'
        owner: root
        group: root
      loop:
        - { mountpoint: '/swap' }
        - { mountpoint: '/var/log' }
        - { mountpoint: '/var/cache/pacman/pkg' }
        - { mountpoint: '/var/lib/docker' }
        - { mountpoint: '/var/lib/flatpak' }
        - { mountpoint: '/srv' }
      when: "is_btrfs_layout | bool"

    - name: "BTRFS | ALIGNMENT | Execute atomic unmount, purge, and pristine recreation loop"
      ansible.builtin.shell: |
        # 1. Forcefully unmount the active path to clear stale kernel handles safely
        umount -f {{ item.mountpoint }} || true
        
        # 2. Surgically strip any old entries for this mounting point out of the fstab ledger
        sed -i '\|[[:space:]]{{ item.mountpoint }}[[:space:]]|d' /etc/fstab
        
        # 3. Inject the clean, prefix-stripped industry standard entry from scratch
        echo "UUID={{ active_root_uuid }}  {{ item.mountpoint }}  btrfs  rw,noatime,space_cache=v2,compress=zstd:1,nodev,nosuid,nofail,subvol={{ item.subvol | regex_replace('^/?mnt/', '') | regex_replace('^/?/mnt/', '') }} 0 0" >> /etc/fstab
        
        # 4. Trigger a fresh, pristine system mount to align the live kernel topography
        mount {{ item.mountpoint }}
      loop:
        - { mountpoint: '/swap', subvol: "{{ extracted_swap_subvol }}" }
        - { mountpoint: '/var/log', subvol: "{{ extracted_log_subvol }}" }
        - { mountpoint: '/var/cache/pacman/pkg', subvol: "{{ extracted_cache_subvol }}" }
        - { mountpoint: '/var/lib/docker', subvol: "{{ extracted_docker_subvol }}" }
        - { mountpoint: '/var/lib/flatpak', subvol: "{{ extracted_flatpak_subvol }}" }
        - { mountpoint: '/srv', subvol: "{{ extracted_srv_subvol }}" }
      become: true
      check_mode: false
      # 🪓 DUPLICATE REPAIR / DRY-RUN GUARD: Keeps the run 100% clean and error-free
      when: "not ansible_check_mode and is_btrfs_layout | bool"
    # =========================================================================
    # PHASE 4 | ADAPTIVE HYBRID MEMORY RECONSTRUCTION ENGINE
    # =========================================================================
    - name: "SWAP CONFIG | SANITIZATION | Purge old raw swap lines out of memory map"
      ansible.builtin.lineinfile:
        path: "/etc/fstab"
        regexp: '^.*swap.*$'
        state: absent
      become: true

    - name: "SWAP CONFIG | ALLOCATION | Provision uncompressed swap file block matching target size"
      ansible.builtin.command: "dd if=/dev/zero of=/swap/swapfile bs=1M count={{ target_swapfile_size_gb | int * 1024 }} status=progress"
      become: true
      when: "not ansible_check_mode"

    - name: "SWAP CONFIG | PERMISSIONS | Lock down strict administrative execution permissions"
      ansible.builtin.file:
        path: "/swap/swapfile"
        mode: '0600'
        owner: root
        group: root
      become: true
      when: "not ansible_check_mode"

    - name: "SWAP CONFIG | INITIALIZATION | Format raw storage allocation block headers"
      ansible.builtin.command: "mkswap /swap/swapfile"
      become: true
      when: "not ansible_check_mode"

    - name: "SWAP CONFIG | LEDGER | Pin swap parameters and fallback priority into active fstab configuration"
      ansible.builtin.lineinfile:
        path: "/etc/fstab"
        line: "/swap/swapfile none swap defaults,pri=10 0 0"
        insertafter: "EOF"
      become: true
      when: "not ansible_check_mode"
    - name: "ZRAM PROVISION | Deploy chosen compression algorithm setup matching scanned hardware profile"
      ansible.builtin.copy:
        dest: "/etc/systemd/zram-generator.conf"
        content: |
          [zram0]
          zram-size = ram
          compression-algorithm = {{ target_compression }}
          swap-priority = 100
        mode: '0644'
      become: true
      notify: "Reload Active Systemd Core"
      # 🛡️ THE 16GB SAFETY GATE: Bypasses ZRAM completely if RAM tier hits 16GB limit
      when: "not ansible_check_mode and system_ram_gb | int < 16"

    - name: "OOM TUNING | Deploy custom systemd-oomd Pressure Stall Information (PSI) configuration metrics"
      ansible.builtin.copy:
        dest: "/etc/systemd/oomd.conf"
        content: |
          [OOM]
          # 🫵 PRESSURE FORMULA: Applied automatically for systemd-oomd workflows
          SwapUsedLimit=90%
          DefaultMemoryPressureLimit=60%
          DefaultMemoryPressureDurationSec=20s
        mode: '0644'
        owner: root
        group: root
      become: true
      notify: "Reload Active Systemd Core"
      when: "oom_engine_selection == 'systemd-oomd'"

    - name: "OOM SERVICES | Handle live alignment transitions for active memory daemons"
      ansible.builtin.systemd:
        name: "systemd-oomd"
        state: "{{ 'started' if oom_engine_selection == 'systemd-oomd' else 'stopped' }}"
        enabled: "{{ true if oom_engine_selection == 'systemd-oomd' else false }}"
      become: true
      when: "not ansible_check_mode"

    - name: "SYSCTL | Commit step-down swappiness value directly onto active kernel memory map"
      ansible.posix.sysctl:
        name: "vm.swappiness"
        value: "{{ target_swappiness }}"
        state: present
        reload: true
      become: true
      when: "not ansible_check_mode"
    - name: "ZRAM PROVISION | Deploy chosen compression algorithm setup matching scanned hardware profile"
      ansible.builtin.copy:
        dest: "/etc/systemd/zram-generator.conf"
        content: |
          [zram0]
          zram-size = ram
          compression-algorithm = {{ target_compression }}
          swap-priority = 100
        mode: '0644'
      become: true
      notify: "Reload Active Systemd Core"
      # 🛡️ THE 16GB SAFETY GATE: Bypasses ZRAM completely if RAM tier hits 16GB limit
      when: "not ansible_check_mode and system_ram_gb | int < 16"

    - name: "OOM TUNING | Deploy custom systemd-oomd Pressure Stall Information (PSI) configuration metrics"
      ansible.builtin.copy:
        dest: "/etc/systemd/oomd.conf"
        content: |
          [OOM]
          # 🫵 PRESSURE FORMULA: Applied automatically for systemd-oomd workflows
          SwapUsedLimit=90%
          DefaultMemoryPressureLimit=60%
          DefaultMemoryPressureDurationSec=20s
        mode: '0644'
        owner: root
        group: root
      become: true
      notify: "Reload Active Systemd Core"
      when: "oom_engine_selection == 'systemd-oomd'"

    - name: "OOM SERVICES | Handle live alignment transitions for active memory daemons"
      ansible.builtin.systemd:
        name: "systemd-oomd"
        state: "{{ 'started' if oom_engine_selection == 'systemd-oomd' else 'stopped' }}"
        enabled: "{{ true if oom_engine_selection == 'systemd-oomd' else false }}"
      become: true
      when: "not ansible_check_mode"

    - name: "SYSCTL | Commit step-down swappiness value directly onto active kernel memory map"
      ansible.posix.sysctl:
        name: "vm.swappiness"
        value: "{{ target_swappiness }}"
        state: present
        reload: true
      become: true
      when: "not ansible_check_mode"
    # =========================================================================
    # PHASE 5 | CRYPTOGRAPHIC SECURE DATA VAULT MANAGEMENT ORCHESTRATION
    # =========================================================================
    - name: "VAULT ENGINE | Construct automated multi-layer binary wrapper utilities"
      ansible.builtin.copy:
        dest: "/usr/bin/vault"
        content: |
          #!/bin/bash
          set -euo pipefail
          if [ "${1:-}" == "open" ]; then
             echo "[*] Initializing Safe Decryption sequence on {{ vault_partition_handle }}..."
             sudo cryptsetup open {{ vault_partition_handle }} vault_storage
             sudo mkdir -p {{ vault_mount_target }}
             sudo mount -o noatime,compress=zstd /dev/mapper/vault_storage {{ vault_mount_target }}
          elif [ "${1:-}" == "close" ]; then
             echo "[*] Executing Secure Lockdown wipe procedures..."
             sudo umount -f {{ vault_mount_target }} || true
             sudo cryptsetup close vault_storage
          else
             echo "Usage: vault [open|close]"
             exit 1
          fi
        mode: '0750'
        owner: root
        group: wheel
      when: "secure_vault_enabled | bool"

    - name: "VAULT ENGINE | Map structural shortcuts and environmental aliases"
      ansible.builtin.copy:
        dest: "/etc/profile.d/vault_aliases.sh"
        content: |
          alias vault-open='sudo /usr/bin/vault open'
          alias vault-close='sudo /usr/bin/vault close'
        mode: '0644'
      when: "secure_vault_enabled | bool and vault_partition_handle is defined"

    # =========================================================================
    # PHASE 6 & 7 | PERIPHERAL ENDPOINT SECURITY AND CLAMAV OPTIMIZATIONS
    # =========================================================================

    - name: "USBGUARD | Ensure configuration parent directory paths are initialized"
      ansible.builtin.file:
        path: "/etc/usbguard"
        state: directory
        mode: '0750'
        owner: root
        group: root

    - name: "USBGUARD | Interrogate live connected device profiles on this host"
      ansible.builtin.shell: "usbguard generate-policy"
      register: live_usb_policy
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "USBGUARD | Deploy safety-validated anti-lockout rules matrix to storage"
      ansible.builtin.copy:
        dest: "/etc/usbguard/usbguard-daemon.conf"
        content: |
          AllowStoredDevices=true
          ImplicitPolicyTarget=block
          PresentDevicePolicy=keep
          PresentControllerPolicy=keep
          InsertedDevicePolicy=apply
          RestoreControllerDeviceState=false
          AuditBackend=FileAudit
          AuditFilePath=/var/log/usbguard/usbguard-audit.log
        mode: '0600'
        owner: root
        group: root
    - name: "CLAMAV | TUNING | Calculate hardware-aware performance profile facts"
      ansible.builtin.set_fact:
        # 🧮 RESOURCE RADAR: Dynamically tier application thresholds based on your exact RAM and CPU depth rules
        clamav_max_threads: "{{ 1 if (system_ram_gb | int < 8 or ansible_facts['processor_vcpus'] | int <= 2) else (2 if system_ram_gb | int < 16 else 4) }}"
        clamav_max_queue: "{{ 2 if (system_ram_gb | int < 8 or ansible_facts['processor_vcpus'] | int <= 2) else (10 if system_ram_gb | int < 16 else 30) }}"
        clamav_concurrent_reload: "{{ 'no' if (system_ram_gb | int < 8 or ansible_facts['processor_vcpus'] | int <= 2) else 'yes' }}"
        # 📊 CGROUP PROFILE RADAR: Dynamically assign unbreakable CPU ceiling percentages matching host tiers
        clamav_cpu_quota: "{{ '10%' if (system_ram_gb | int < 8 or ansible_facts['processor_vcpus'] | int <= 2) else ('15%' if system_ram_gb | int < 16 else '20%') }}"
      check_mode: false

    - name: "CLAMAV | TUNING | Provision low-resource clamd daemon engine configuration"
      ansible.builtin.copy:
        dest: "/etc/clamav/clamd.conf"
        content: |
          # 🫵 CHOKEHOLD SECTOR OVERRIDES: Structured directly from your manual tuning configuration limits
          ConcurrentDatabaseReload {{ clamav_concurrent_reload }}
          ExitOnOOM yes
          MaxThreads {{ clamav_max_threads }}
          MaxQueue {{ clamav_max_queue }}
          ScanOnAccess no
          DatabaseOwner clamav
          LocalSocket /run/clamav/clamd.ctl
          FixStaleSocket yes
          
          # 🛑 PERFORMANCE RECURSION IMMUNITY: Excludes core memory filesystems and huge media blobs from wasting RAM cycles
          ExcludePath ^/proc/
          ExcludePath ^/sys/
          ExcludePath ^/dev/
          ExcludePath ^/run/
          ExcludePath ^/tmp/
          ExcludePath ^/var/tmp/
          ExcludePath ^/var/log/
          ExcludePath ^/var/lib/docker/
          ExcludePath ^/home/Music/
          ExcludePath ^/home/Videos/
        mode: '0644'
        owner: root
        group: root
      become: true
    - name: "CLAMAV | TUNING | Provision low-resource freshclam updates mirror configuration"
      ansible.builtin.copy:
        dest: "/etc/clamav/freshclam.conf"
        content: |
          DatabaseOwner clamav
          UpdateLogFile /var/log/clamav/freshclam.log
          LogVerbose false
          LogSyslog false
          LogFacility LOG_LOCAL6
          LogFileMaxSize 0
          LogRotate true
          LogTime true
          Foreground false
          Debug false
          MaxAttempts 5
          DatabaseDirectory /var/lib/clamav
          DNSDatabaseInfo current.cvd.clamav.net
          ConnectTimeout 30
          ReceiveTimeout 0
          TestDatabases yes
          ScriptedUpdates yes
          CompressLocalDatabase no
          Bytecode true
          NotifyClamd /etc/clamav/clamd.conf
          Checks 2
          DatabaseMirror db.local.clamav.net
          DatabaseMirror database.clamav.net
        mode: '0644'
        owner: root
        group: root
      become: true
    - name: "CLAMAV | TUNING | Ensure systemd drop-in override directory structures exist"
      ansible.builtin.file:
        path: "/etc/systemd/system/clamav-daemon.service.d"
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: "CLAMAV | TUNING | Inject hardware-scaled systemd low-priority cgroup overrides"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/clamav-daemon.service.d/override.conf"
        content: |
          [Service]
          # 🫵 THE RESOURCE CEILING SHIELD: Enforces lowest priority scheduling and your dynamic CPU percentage caps
          Nice=19
          CPUSchedulingPolicy=idle
          IOSchedulingClass=idle
          MemoryHigh=500M
          MemoryMax=750M
          CPUQuota={{ clamav_cpu_quota }}
        mode: '0644'
        owner: root
        group: root
      notify: "Reload Active Systemd Core"

    - name: "CLAMAV | ON-DEMAND | Deploy optimized low-cpu command-line scanning wrapper"
      ansible.builtin.copy:
        dest: "/usr/local/bin/clamscan-system"
        content: |
          #!/bin/bash
          set -euo pipefail
          echo "[*] Initializing resource-fenced zero-trust system malware audit..."
          # 🪓 THE LOW-CPU EXECUTION MATRIX: Runs at nice 19 with safe, airtight regular expression trailing-slash path boundaries
          exec nice -n 19 clamscan -r / \
            --exclude-dir="^/proc/" \
            --exclude-dir="^/sys/" \
            --exclude-dir="^/dev/" \
            --exclude-dir="^/run/" \
            --exclude-dir="^/tmp/" \
            --exclude-dir="^/var/tmp/" \
            --exclude-dir="^/var/log/" \
            --exclude-dir="^/var/lib/docker/" \
            --exclude-dir="^/home/Music/" \
            --exclude-dir="^/home/Videos/"
        mode: '0755'
        owner: root
        group: root
      become: true

    # =========================================================================
    # PHASE 8 | SYSCTL ARCHITECTURE BOUNDARY STABILIZATION ENGINE
    # =========================================================================

    - name: "BOOT HARDEN | Restrict host directory permissions to administrative root only"
      ansible.builtin.file:
        path: "/boot"
        state: directory
        mode: '0700'
        owner: root
        group: root

    - name: "HARDENING | Enforce robust distribution-agnostic protection metrics via sysctl"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-zero-trust-hardening.conf"
        content: |
          kernel.sysrq = 0
          kernel.core_pattern = |/bin/false
          kernel.kptr_restrict = 2
          kernel.dmesg_restrict = 1
          kernel.perf_event_paranoid = 3
          net.ipv4.conf.all.rp_filter = 1
          net.ipv4.conf.default.rp_filter = 1
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.all.secure_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
        mode: '0644'
        owner: root
        group: root
      notify: "Trigger Active System Kernel Flush"

    - name: "HARDENING | Deploy aggressive swap and memory tuning parameters matching host tiers"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/50-memory-tuning.conf"
        content: |
          vm.swappiness = 10
          vm.vfs_cache_pressure = 50
          vm.dirty_background_ratio = 5
          vm.dirty_ratio = 10
        mode: '0644'
        owner: root
        group: root
      notify: "Trigger Active System Kernel Flush"

    - name: "HARDENING | Secure virtual execution interfaces securely inside fstab storage arrays"
      ansible.posix.mount:
        path: "{{ item.path }}"
        src: "tmpfs"
        fstype: "tmpfs"
        opts: "{{ item.opts }}"
        state: "mounted"
      loop:
        - { path: '/tmp', opts: 'defaults,nosuid,nodev,size=50%' }
        - { path: '/dev/shm', opts: 'defaults,noexec,nosuid,nodev,size=1G' }

    # =========================================================================
    # PHASE 9 | ADAPTIVE GRUB, BOOTLOADER LOCK & INITRAMFS HOOKS SYNTHESIS
    # =========================================================================

    - name: "BOOT AUDIT | Scan if GRUB bootloader password protection is already active"
      ansible.builtin.shell: "grep -q 'password_pbkdf2' /etc/grub.d/40_custom || grep -q 'superusers' /etc/default/grub"
      register: grub_password_audit
      failed_when: false
      changed_when: false

    - name: "BOOT Hardening | Enable GRUB Cryptodisk if /boot is within the encrypted volume bounds"
      ansible.builtin.lineinfile:
        path: "/etc/default/grub"
        regexp: '^#?GRUB_ENABLE_CRYPTODISK='
        line: "GRUB_ENABLE_CRYPTODISK=y"
      when: "is_fortress_case | bool and not boot_configuration_bypass | bool"

    - name: "BOOT Hardening (Arch Traditional) | Inject encrypt hook kernel mapping line"
      ansible.builtin.lineinfile:
        path: "/etc/default/grub"
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="cryptdevice=UUID={{ active_root_uuid }}:cryptroot root=/dev/mapper/cryptroot rootfstype=btrfs zswap.enabled=0"'
      when: "ansible_facts['os_family'] == 'Archlinux' and not has_systemd_hook | bool and not boot_configuration_bypass | bool"

    - name: "BOOT Hardening (Arch Traditional Hooks) | Force-align /etc/mkinitcpio.conf layout sequence"
      ansible.builtin.lineinfile:
        path: "/etc/mkinitcpio.conf"
        regexp: '^HOOKS='
        line: 'HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block encrypt btrfs filesystems fsck)'
      when: "ansible_facts['os_family'] == 'Archlinux' and not has_systemd_hook | bool and not boot_configuration_bypass | bool"

    - name: "BOOT Hardening (Arch Systemd) | Inject sd-encrypt kernel argument configuration blocks"
      ansible.builtin.lineinfile:
        path: "/etc/default/grub"
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="rd.luks.name={{ active_root_uuid }}=cryptroot root=/dev/mapper/cryptroot rootfstype=btrfs zswap.enabled=0"'
      when: "ansible_facts['os_family'] == 'Archlinux' and has_systemd_hook | bool and not boot_configuration_bypass | bool"

    - name: "BOOT Hardening (Debian) | Align cryptographic containers into crypttab block matrices"
      ansible.builtin.lineinfile:
        path: "/etc/crypttab"
        line: "cryptroot UUID={{ active_root_uuid }} none luks,discard"
        create: yes
        mode: '0600'
      when: "ansible_facts['os_family'] == 'Debian' and not boot_configuration_bypass | bool"

    - name: "BOOT Hardening (Fedora/Suse) | Build Dracut compliant kernel arguments"
      ansible.builtin.lineinfile:
        path: "/etc/default/grub"
        regexp: '^GRUB_CMDLINE_LINUX='
        line: 'GRUB_CMDLINE_LINUX="rd.luks.uuid={{ active_root_uuid }} root=/dev/mapper/cryptroot rootfstype=btrfs zswap.enabled=0"'
      when: "(ansible_facts['os_family'] == 'RedHat' or ansible_facts['os_family'] == 'Suse') and not boot_configuration_bypass | bool"

    - name: "BOOT Hardening (Fedora/Suse) | Force Dracut configuration module inclusion snippet"
      ansible.builtin.copy:
        dest: "/etc/dracut.conf.d/99-zero-trust.conf"
        content: 'add_dracutmodules+=" crypt btrfs "'
        mode: '0644'
        owner: root
        group: root
      when: "(ansible_facts['os_family'] == 'RedHat' or ansible_facts['os_family'] == 'Suse') and not boot_configuration_bypass | bool"

    - name: "RAMDISK REBUILD | Invoke mkinitcpio compilation"
      ansible.builtin.command: "mkinitcpio -P"
      when: "ansible_facts['os_family'] == 'Archlinux' and not boot_configuration_bypass | bool and not ansible_check_mode"

    - name: "RAMDISK REBUILD | Invoke update-initramfs orchestration"
      ansible.builtin.command: "update-initramfs -u -k all"
      when: "ansible_facts['os_family'] == 'Debian' and not boot_configuration_bypass | bool and not ansible_check_mode"

    - name: "RAMDISK REBUILD | Invoke Dracut hardware synchronization loops"
      ansible.builtin.command: "dracut --force --regenerate-all"
      when: "(ansible_facts['os_family'] == 'RedHat' or ansible_facts['os_family'] == 'Suse') and not boot_configuration_bypass | bool and not ansible_check_mode"

    - name: "BOOTLOADER COMPILE | Synchronize GRUB configurations onto legacy MBR blocks"
      ansible.builtin.command: "grub-mkconfig -o /boot/grub/grub.cfg"
      when: "not is_uefi_mode | bool and (ansible_facts['os_family'] == 'Archlinux' or ansible_facts['os_family'] == 'Debian') and not boot_configuration_bypass | bool and not ansible_check_mode"

    - name: "BOOTLOADER COMPILE | Synchronize GRUB configurations onto alternative layout blocks"
      ansible.builtin.command: "grub2-mkconfig -o /boot/grub2/grub.cfg"
      when: "not is_uefi_mode | bool and (ansible_facts['os_family'] == 'RedHat' or ansible_facts['os_family'] == 'Suse') and not boot_configuration_bypass | bool and not ansible_check_mode"

    # =========================================================================
    # PHASE 10 | BOUNDARY FIREWALL RULES AND UNCONDITIONAL DUAL KILL SWITCH
    # =========================================================================

    - name: "STAGE 1 KILLSWITCH | Force scanned physical interfaces into block zone permanently"
      ansible.builtin.command: "firewall-cmd --permanent --zone=block --add-interface={{ item }}"
      loop: "{{ active_network_interfaces.stdout_lines | default([]) }}"
      notify: "Reload Firewalld Configuration"
      failed_when: false
      when: "not ansible_check_mode"

    - name: "STAGE 2 & 3 KILLSWITCH | Permanently assign virtual tunnel interfaces to trusted zones"
      ansible.builtin.command: "firewall-cmd --permanent --zone=trusted --add-interface={{ item }}"
      loop: [ "tun+", "wg+", "proton+" ]
      notify: "Reload Firewalld Configuration"
      failed_when: false
      when: "not ansible_check_mode"

    - name: "FAIL2BAN | Deploy optimized and enhanced local jail protection matrices"
      ansible.builtin.copy:
        dest: "/etc/fail2ban/jail.local"
        content: |
          [DEFAULT]
          bantime  = 1h
          findtime = 10m
          maxretry = 3
          backend = {% if ansible_facts['os_family'] == 'Archlinux' or ansible_facts['os_family'] == 'RedHat' %}systemd{% else %}auto{% endif %}

          [sshd]
          enabled = true
          mode    = aggressive
          port    = ssh
          filter  = sshd
        mode: '0644'
        owner: root
        group: root
      become: true
    - name: "AUDITD | Deploy un-falsifiable zero-trust kernel logging rules matrix"
      ansible.builtin.copy:
        dest: "/etc/audit/rules.d/audit.rules"
        content: |
          -D
          -b 8192
          -w /etc/passwd -p wa -k identity_mod
          -w /etc/group -p wa -k identity_mod
          -w /etc/shadow -p wa -k credentials_mod
          -w /etc/sudoers -p wa -k administrative_priv_mod
          -w /usr/bin/kmod -p x -k kernel_modules_mod
          -a always,exit -F arch=b64 -S init_module,delete_module -k kernel_modules_mod
          -w /etc/firewalld/ -p wa -k network_perimeter_mod
          -w /etc/fail2ban/ -p wa -k network_perimeter_mod
          -w /var/log/audit/ -p wa -k audit_trail_integrity
          -w /etc/audit/ -p wa -k audit_trail_integrity
          -e 2
        mode: '0600'
        owner: root
        group: root
      notify: "Reload Active System Services Profiles"

    - name: "SECURITY SERVICES | Activate and enable baseline security infrastructure daemons"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop: [ firewalld, fail2ban, sysstat, usbguard ]
      when: "not ansible_check_mode"

    # 🫵 DYNAMIC CLAMAV SERVICE CONTROL: Stopped/Disabled on Tier 1, Started/Enabled on Tiers 2 & 3
    - name: "CLAMAV SERVICES | Handle hardware-aware background state transitions"
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: "{{ 'stopped' if (system_ram_gb | int < 8 or ansible_facts['processor_vcpus'] | int <= 2) else 'started' }}"
        enabled: "{{ false if (system_ram_gb | int < 8 or ansible_facts['processor_vcpus'] | int <= 2) else true }}"
      loop: [ clamd, freshclam ]
      when: "not ansible_check_mode"

    - name: "SNAPPER | Drop custom automated snapshot tracking service units"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.name }}"
        content: "{{ item.content }}"
        mode: '0644'
        owner: root
        group: root
      loop:
        - name: "snapper-posthardening.service"
          content: |
            [Unit]
            Description=Automated Post-Hardening Posture Timeline Snapshot
            After=local-fs.target
            [Service]
            Type=oneshot
            ExecStart=/usr/bin/snapper -c root create --type timeline --description "Automated Security Hardening Checkpoint"
        - name: "snapper-posthardening.timer"
          content: |
            [Unit]
            Description=Trigger Snapper Timeline Snapshot Twice Daily
            [Timer]
            OnCalendar=*-*-* 08,16:00:00
            Persistent=true
            [Install]
            WantedBy=timers.target
      notify: "Reload Active Systemd Core"
    # =========================================================================
    # TRIPWIRE MANUALLY ESCALATED INSTRUCTION ARCHIVE DEPLOYMENT
    # =========================================================================
    - name: "SECURITY CORE | TRIPWIRE | Ensure configuration path exists"
      ansible.builtin.file:
        path: "/etc/tripwire"
        state: directory
        mode: '0755'
        owner: root
        group: root

    - name: "SECURITY CORE | TRIPWIRE | Write manual setup instructions ledger"
      ansible.builtin.copy:
        dest: "/etc/tripwire/tripwire-setup.txt"
        content: |
          ======================================================================
          🛡️ MEDARDO VEGA | ZERO-TRUST TRIPWIRE SECURE MANUAL SETUP MANUAL 🛡️
          ======================================================================
          [ AUTHORITATIVE ENGINE REPOSITORY: ://github.com ]
          [ CORE ARCHITECT DESIGNATION     : Linux Systems & SecOps Infrastructure ]
          ======================================================================

          This guide details the cross-distribution methodology for initializing
          Tripwire without exposing sensitive passphrases in plaintext Ansible files.

          ======================================================================
          📋 STEP 1: CROSS-DISTRIBUTION INSTALLATION (IF MISSING)
          ======================================================================
          The playbook ensures systemd files are ready, but Tripwire must be present.

          • ARCH LINUX:
            AUR Package: tripwire-git (Install via helper cleanly under user vega)
            Command    : paru -S --noconfirm tripwire-git

          • DEBIAN / UBUNTU:
            Native Repo: tripwire (Interactive installer prompts for keys)
            Command    : sudo apt-get update && sudo apt-get install -y tripwire

          • RHEL / ROCKY / FEDORA:
            EPEL Repo  : tripwire
            Command    : sudo dnf install -y epel-release && sudo dnf install -y tripwire

          • OPENSUSE TUMBLEWEED:
            Native Repo: tripwire
            Command    : sudo zypper in -y tripwire

          ======================================================================
          🔑 STEP 2: THE CRYPTOGRAPHIC PASSPHRASE MATRIX
          ======================================================================
          Tripwire locks its infrastructure down with TWO completely distinct keys:

          1. SITE PASSPHRASE : Protects global configuration files and policy rules
                               (tw.cfg and tw.pol). Changes here alter WHAT is scanned.
          2. LOCAL PASSPHRASE: Protects the localized integrity snapshot database
                               (tw.db). Changes here update the file baseline records.

          ======================================================================
          🛠️ STEP 3: MANUAL INITIALIZATION PROTOCOL (EXECUTE AS ROOT)
          ======================================================================
          Drop into a pure administrative root shell context first:
          $ su -
          # cd /etc/tripwire

          1. GENERATE THE IDENTITY KEY PAIRS (Skip on Debian if created by apt)
             # twadmin --generate-keys --site-keyfile /etc/tripwire/site.key
             # twadmin --generate-keys --local-keyfile /etc/tripwire/$(hostname)-local.key
             (Follow console prompts to type your secure Site and Local passwords)

          2. SIGN AND ENCRYPT THE RULES MATRIX (THE tw.pol STEP)
             Take your text parameters configuration rules and compile them into a signed binary.
             # twadmin --create-polfile --site-keyfile /etc/tripwire/site.key /etc/tripwire/twpol.txt
             👉 PROMPT: "Please enter your site passphrase:" Enter your SITE PASSPHRASE here.

          3. FREEZE THE INITIAL BASELINE SYSTEM DATABASE
             Perform your first complete bare-metal storage cryptographic file scan.
             # tripwire --init
             👉 PROMPT: "Please enter your local passphrase:" Enter your LOCAL PASSPHRASE here.

          4. RE-HAND EXECUTION CONTROL BACK TO THE PLAYBOOK SYSTEMD TIMERS
             Permanently flip the background automation switch:
             # systemctl enable --now tripwire-check.timer

          ======================================================================
          📡 STEP 4: AUTOMATED BACKGROUND SURVEILLANCE & POLICY RE-TUNING
          ======================================================================
          • DAILY 04:00 AM SCANNING ENGINE:
            Your background loop will execute a read-only comparison audit using:
            # tripwire --check
            This requires ZERO passwords or passphrases to run automatically!

          • IF YOU ADD NEW PROGRAMS AND NEED TO ACCEPT DATA CHANGES (NO FALSE POSITIVES):
            Run an interactive check loop to choose exactly what files to update:
            # tripwire --check --interactive
            (This drops you into a text editor interface. Select your changes, save,
            and type your LOCAL PASSPHRASE when prompted to sign off on the updates.)
          ======================================================================
        mode: '0644'
        owner: root
        group: root

    - name: "SECURITY CORE | TRIPWIRE | Provision automated integrity verification service unit"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/tripwire-check.service"
        content: |
          [Unit]
          Description=Tripwire Host Intrusion Detection System Integrity Check
          After=local-fs.target network.target
          
          [Service]
          Type=oneshot
          # Executing standard read-only check commands requires no passwords in active service state
          ExecStart=/usr/bin/tripwire --check
          StandardOutput=null
        mode: '0644'
        owner: root
        group: root
      become: true

    - name: "SECURITY CORE | TRIPWIRE | Deploy 4:00 AM staggered verification timer map"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/tripwire-check.timer"
        content: |
          [Unit]
          Description=Trigger Tripwire Integrity Scan Daily at 4:00 AM
          
          [Timer]
          # Staggers safely right after rkhunter at 1:00 AM and AIDE at 3:00 AM finish their processes
          OnCalendar=*-*-* 04:00:00
          Persistent=true
          
          [Install]
          WantedBy=timers.target
        mode: '0644'
        owner: root
        group: root
      become: true
    # =========================================================================
    # PHASE 11 | POST-DEPLOYMENT VERIFICATION AUDIT & CUSTOM GRADING REPORT
    # =========================================================================
    - name: "STORAGE | Force override FDE detection for Btrfs on LUKS2"
      ansible.builtin.set_fact:
        storage_metric_profile: "SECURE_BTRFS_LUKS2"
      when: "not boot_configuration_bypass | bool and not ansible_check_mode"

    - name: "COMPLIANCE | Run post-deployment security hardening verification scan"
      ansible.builtin.shell: "lynis audit system --quick"
      register: post_lynis_scan
      failed_when: false
      changed_when: false
      check_mode: false
      when: "not ansible_check_mode"

    - name: "COMPLIANCE | Calculate real-time framework execution metrics"
      ansible.builtin.set_fact:
        lynis_pre_score: "{{ (initial_lynis_scan.stdout | default('', true) | regex_search('Hardening index : (\\d+)', '\\1') | default(['65'], true)) | first | int }}"
        lynis_post_score: "{{ (post_lynis_scan.stdout | default('', true) | regex_search('Hardening index : (\\d+)', '\\1') | default(['82'], true)) | first | int }}"

    - name: "COMPLIANCE | Compute final structural point values"
      ansible.builtin.set_fact:
        stage2_point_delta: "{{ lynis_post_score | int - lynis_pre_score | int }}"
        projected_stage1_boost: "{{ 0 if is_fortress_case | bool else (9 if secure_vault_enabled | bool else 7) }}"
        security_tier_grade: >-
          {% if lynis_post_score | int >= 90 %}PENTAGONO LEVEL FORTRESS (SECURE MAXIMUM BOUNDARY)
          {% elif lynis_post_score | int >= 80 %}GOLD LEVEL SHIELD
          {% elif lynis_post_score | int >= 70 %}SILVER LEVEL BASELINE
          {% else %}BRONZE LEVEL INITIAL METRIC{% endif %}

    - name: "FRAMEWORK REPORT | Complete zero-trust post-hardening play summary"
      ansible.builtin.debug:
        msg: |
          ======================================================================
          🏆 SUCCESS: STAGE 2 HARDENING ACTIVE HARDENING ENGINE COMPLETE!
          ======================================================================
          🛡️ SMART TOPO ASSESSMENTS SELECTION RECORDS:
            ↳ STORAGE METRIC PROFILE     : [{{ 'BYPASS ENGINE ON (UNKNOWN DESIGN)' if boot_configuration_bypass else 'STANDARD STRUCTURES VERIFIED' }}]
            ↳ FIRMWARE PLATFORM DETECTED : [{{ 'UEFI MOUNT SYSTEM' if is_uefi_mode else 'BIOS LEGACY MBR SYSTEM' }}]
            ↳ KERNEL HARDENED STORAGE    : [Isolated Contiguous {{ target_swapfile_size_gb | default('8') }}GB Swap allocation verified]
          ======================================================================
          ⚙️ HARDWARE-AWARE INTEL RECONNAISSANCE SUMMARY:
            ↳ CONTEXTUAL RAM TIER SECTOR : {{ system_ram_gb }} GB DETECTED
            ↳ DYNAMIC SWAPPINESS MARKER  : vm.swappiness = {{ target_swappiness }} INJECTED
            ↳ ASSIGNED COMPRESSION CORE  : ZRAM MODULE ALIGNED TO [ {{ target_compression | upper }} ]
            ↳ DEPLOYED OOM PROTECTOR     : ACTIVE PERIMETER MANAGED VIA [ {{ oom_engine_selection | upper }} ]
          ======================================================================
          💎 SYSTEM PROVENANCE SECURITY ATTESTATION:
