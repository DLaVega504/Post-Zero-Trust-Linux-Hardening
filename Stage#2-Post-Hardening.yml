            ↳ STORAGE AT-REST ENCRYPTION SHIELD: {{ 'ACTIVE LUKS WRAPPER MAPPED (/dev/mapper/root)' if root_disk_is_encrypted | bool else '⚠️  UNENCRYPTED (FAILSAFE RUNTIME CONTAINMENT ACTIVE)' }}
