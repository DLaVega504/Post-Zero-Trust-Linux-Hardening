# =============================================================================
# BLOCK 1: INITIAL PLAY METADATA & CONTROL LAYER VARIABLES
# DESCRIPTION: Establishes playbook destination, enforcement properties,
#              privilege parameters, and custom hardware target values.
# =============================================================================
---
- name: "Universal Zero-Trust Linux Hardening Framework"
  hosts: localhost
  connection: local
  become: true  
  gather_facts: true 
  vars:
    perf_mount_opts: "noatime,space_cache=v2,compress=zstd:1"
    security_architecture_profile: "pentagon"
    secure_vault_enabled: true
    vault_partition_handle: "/dev/sda2"
    vault_mount_target: "/vault"
    vault_enforce_multi_tenant: true
    vault_allocation_percentage: 20
    vault_maximum_guest_members: 3
    vault_minimum_size_threshold_gb: 15
    fail2ban_installed: true
    rkhunter_installed: false
    usbguard_installed: true
    arpwatch_installed: true
    snort_installed: true
    clamav_installed: true
    firewalld_native: true

# =============================================================================
# BLOCK 2: SYSTEM HARDWARE ASSESSMENT MATRIX
# DESCRIPTION: Sets hardware resource limits, thread thresholds,
#              and memory scaling properties based on infrastructure performance.
# =============================================================================
    hardware_profile_matrix:
      tier_1:
        swappiness: 150
        cpu_quota: 10
        mem_high: "1.0G"
        mem_max: "1.2G"
        max_threads: 2
      tier_2:
        swappiness: 100
        cpu_quota: 15
        mem_high: "1.2G"
        mem_max: "1.5G"
        max_threads: 4
      tier_3:
        swappiness: 100
        cpu_quota: 20
        mem_high: "1.5G"
        mem_max: "2.0G"
        max_threads: 8
      tier_4:
        swappiness: 10
        cpu_quota: 25
        mem_high: "2.0G"
        mem_max: "3.0G"
        max_threads: 16

# =============================================================================
# BLOCK 3: DISK PERFORMANCE BLUEPRINTS
# DESCRIPTION: Maps dynamic memory dirty ratios and drive scale pressures
#              for both solid state and spinning platter local block assets.
# =============================================================================
    hdd_matrix_blueprint:
      "150": { bg_ratio: 3,  ratio: 10, scale: 125 }
      "100": { bg_ratio: 5,  ratio: 15, scale: 100 }
      "10":  { bg_ratio: 10, ratio: 25, scale: 20  }

    ssd_matrix_blueprint:
      "150": { bg_ratio: 10, ratio: 20, scale: 10 }
      "100": { bg_ratio: 10, ratio: 20, scale: 10 }
      "10":  { bg_ratio: 15, ratio: 25, scale: 10 }
# =============================================================================
# BLOCK 4: DISTRO MATRIX STRUCTURE WITH CORE PLATFORM ARRAYS (PART 1)
# DESCRIPTION: Maps package strings, admin groups, and dynamic template hooks
#              directly to Archlinux and Debian systems to allow unified loops.
# =============================================================================
    distro_matrix:
      Archlinux:
        core_packages: ['sysstat', 'arpwatch', 'usbguard', 'clamav', 'aide', 'lynis', 'openssl-1.1', 'earlyoom']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort@{{ primary_network_interface | default('wls1') }}.service"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav'
        aide_pkg: 'aide'
        admin_group: 'wheel'
        grub_compile_cmd: 'grub-mkconfig'
        grub_config_bios: '/boot/grub/grub.cfg'
      Debian:
        core_packages: ['fail2ban', 'sysstat', 'arpwatch', 'usbguard', 'clamav-daemon', 'aide', 'lynis', 'earlyoom']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort-init.service"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav-daemon'
        aide_pkg: 'aide'
        admin_group: 'sudo'
        grub_compile_cmd: 'update-grub'
        grub_config_bios: '/boot/grub/grub.cfg'

# =============================================================================
# BLOCK 5: DISTRO MATRIX STRUCTURE WITH CORE PLATFORM ARRAYS (PART 2)
# DESCRIPTION: Maps package strings, admin groups, and enterprise targets
#              directly to RedHat and Suse system environments cleanly.
# =============================================================================
      RedHat:
        core_packages: ['fail2ban', 'sysstat', 'arpwatch', 'usbguard', 'clamav', 'aide', 'lynis', 'earlyoom']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort3@{{ primary_network_interface | default('wls1') }}.service"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav'
        aide_pkg: 'aide'
        admin_group: 'wheel'
        grub_compile_cmd: 'grub2-mkconfig'
        grub_config_bios: '/boot/grub2/grub.cfg'
      Suse:
        core_packages: ['fail2ban', 'sysstat', 'arpwatch', 'usbguard', 'clamav', 'aide', 'lynis', 'libdaq', 'earlyoom']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort.service"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav'
        aide_pkg: 'aide'
        admin_group: 'wheel'
        grub_compile_cmd: 'grub2-mkconfig'
        grub_config_bios: '/boot/grub2/grub.cfg'

# =============================================================================
# BLOCK 6: INITIAL TASKS TREE & PRE-FLIGHT SYSTEM HOOKS
# DESCRIPTION: Launches the tasks pipeline, initializes tracking states, and
#              probes for an existing Stage 1 certification fingerprint file.
# =============================================================================
  tasks:
    - name: "PRE-FLIGHT | STATE | Initialize system modification accumulator track"
      ansible.builtin.set_fact:
        system_was_modified: false

    - name: "PRE-FLIGHT | PROBE | Interrogate system for active Stage 1 Foundation Certificate"
      ansible.builtin.stat:
        path: "/etc/zero-trust-baseline.json"
      register: pre_flight_stage1_cert_check
      check_mode: false

    - name: "PRE-FLIGHT | NOTIFY | Render visual compliance track foundation confirmation"
      ansible.builtin.debug:
        msg: |
          ======================================================================
          {% if pre_flight_stage1_cert_check.stat.exists | bool %}
          [ ✓ ] STAGE 1 FOUNDATION CERTIFICATE VERIFIED: FULL-STACK STACKABLE INTEGRATION ARMED.
          {% else %}
          [ ✓ ] AUTONOMOUS COMPLIANCE MODE DEPLOYED.
          {% endif %}
          ======================================================================

# =============================================================================
# BLOCK 7: DYNAMIC DEPENDENCIES & NETADDR BOOTSTRAPPING
# DESCRIPTION: Automates verification and installation of base execution tools,
#              python dependencies, and system modules across all package platforms.
# =============================================================================
    - name: "PRE-FLIGHT | Provision runtime environments and collections"
      ansible.builtin.raw: |
        if command -v ansible >/dev/null 2>&1 && \
           { command -v gdisk >/dev/null 2>&1 || command -v sgdisk >/dev/null 2>&1; } && \
           python3 -c "import netaddr" >/dev/null 2>&1 && \
           ansible-galaxy collection list 2>/dev/null | grep -q 'ansible.posix'; then
          echo "[+] SYSTEM VERIFICATION SUCCESSFUL: Pre-requisites satisfied."
          exit 0
        fi
        if command -v pacman >/dev/null 2>&1; then
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed python python-pip python-netaddr gptfdisk ansible
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -y
          apt-get install -y python3 python3-pip python3-netaddr gdisk ansible
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3 python3-pip python3-netaddr gdisk ansible --nogpgcheck
        elif command -v zypper >/dev/null 2>&1; then
          zypper --non-interactive install python3 python3-pip python3-netaddr gptfdisk ansible
        fi
        if ! python3 -c "import netaddr" >/dev/null 2>&1; then
          pip3 install netaddr --break-system-packages || pip3 install netaddr || true
        fi
        if ! ansible-galaxy collection list 2>/dev/null | grep -q 'ansible.posix'; then
          ansible-galaxy collection install ansible.posix --force-with-deps || true
        fi
      changed_when: false
      failed_when: false

# =============================================================================
# BLOCK 8: SAFE ENVIRONMENTAL SETUP REFRESH
# DESCRIPTION: Runs a clean fact discovery loop under safe permissions now that
#              foundational python-netaddr dependencies are system-wide.
# =============================================================================
    - name: "PRE-FLIGHT | Safely initialize system environment fact discovery loops"
      ansible.builtin.setup:
      become: false
# =============================================================================
# BLOCK 9: BLACKARCH REPOSITORY SUBSTRATE SYNCHRONIZATION
# DESCRIPTION: Downloads, validates, and initializes secure BlackArch security
#              mirrors explicitly on detected Arch Linux platforms.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Bootstrapping BlackArch Cryptographic Mirror Substrates"
      ansible.builtin.shell: |
        set -euo pipefail
        if ! grep -q '\[blackarch\]' /etc/pacman.conf; then
          cd /tmp
          curl -O https://blackarch.org
          chmod +x strap.sh
          ./strap.sh
          rm -f strap.sh
          pacman -Syy --noconfirm
        fi
      args:
        executable: /bin/bash
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"

# =============================================================================
# BLOCK 10: PARU AUR WRAPPER BINARY DETECTIONS
# DESCRIPTION: Probes execution targets to isolate if the Paru compilation
#              wrapper tool is currently active on local system search paths.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Check if Paru binary is present on host execution paths"
      ansible.builtin.command: "which paru"
      register: local_paru_binary_probe
      failed_when: false
      changed_when: false
      when: "ansible_facts['os_family'] == 'Archlinux'"

# =============================================================================
# BLOCK 11: PRIVILEGED ARCH LINUX COMPILATION INJECTIONS
# DESCRIPTION: Installs the required upstream compiler dependencies and source
#              code tools needed to build forensic and management layers.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Inject development toolsets required for compilation"
      community.general.pacman:
        name:
          - base-devel
          - git
        state: present
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "local_paru_binary_probe.rc | default(1) != 0"
        - "not ansible_check_mode"

# =============================================================================
# BLOCK 12: UNPRIVILEGED AUR TRIPWIRE PACKAGE COMPILATION MATRIX
# DESCRIPTION: Establishes a temporary permission-isolated build workspace
#              to pull, compile, and install the native Tripwire binary.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Build and install Tripwire core binary package safely"
      block:
        - name: "AUR BUILD | Ensure clean staging directory exists with unprivileged permissions"
          ansible.builtin.file:
            path: "/tmp/tripwire-build"
            state: directory
            owner: "{{ primary_human_operator | default('vega') }}"
            group: "{{ distro_matrix[ansible_facts['os_family']]['admin_group'] | default('wheel') }}"
            mode: '0755'

        - name: "AUR BUILD | Clone, compile, and deploy native system packages"
          ansible.builtin.shell: |
            set -euo pipefail
            cd /tmp
            rm -rf tripwire-build
            git clone https://archlinux.org tripwire-build
            cd tripwire-build
            makepkg -si --noconfirm
            cd /tmp
            rm -rf tripwire-build
          args:
            executable: /bin/bash
          become: true
          become_user: "{{ primary_human_operator | default('vega') }}"
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"


# =============================================================================
# BLOCK 13: BOOT INFRASTRUCTURE LOCKDOWN DETECTIONS
# DESCRIPTION: Examines target system boot configuration matrices to discover
#              pre-existing, cryptographically secured password boundaries.
# =============================================================================
    - name: "PRE-FLIGHT | BOOT | Interrogate active system for existing bootloader password configurations"
      ansible.builtin.command: "grep -q 'ANSIBLE AUTONOMOUS BOOTLOADER PASSWORD BLOCK' /etc/grub.d/40_custom"
      register: pre_flight_grub_password_check
      failed_when: false
      changed_when: false
      become: true

# =============================================================================
# BLOCK 14: DISK GEOMETRY & ROOT CONFIGURATION INSPECTION
# DESCRIPTION: Probes underlying block devices, active device-mapper links,
#              and mount targets to resolve root storage type attributes.
# =============================================================================
    - name: "SCAN | INTERROGATION | Query true device mapping layer type for active root partition"
      ansible.builtin.shell: |
        set -o pipefail
        ROOT_BLOCK=$(findmnt -n -o SOURCE /)
        lsblk -no TYPE "$ROOT_BLOCK" | head -n 1 | tr -d '[:space:]'
      args:
        executable: /bin/bash
      register: live_root_block_type_probe
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | INSPECTION | Interrogate system block tree for any active device mapper maps"
      ansible.builtin.stat:
        path: "/dev/mapper/root"
      register: live_root_mapper_device_check
      check_mode: false

# =============================================================================
# BLOCK 15: SECURITY AUDIT SCORES HISTORY METRIC PARSING
# DESCRIPTION: Audits block filesystems to identify pre-existing, cached
#              historical baseline metrics for Lynis assessment sequences.
# =============================================================================
    - name: "PRE-FLIGHT | AUDIT | Check disk for local cached Lynis metrics"
      ansible.builtin.stat:
        path: "/var/cache/lynis/pre_score.metric"
      register: pre_flight_lynis_cache_check
      check_mode: false

    - name: "PRE-FLIGHT | AUDIT | Parse existing Lynis metric into runtime memory if cache hit"
      ansible.builtin.slurp:
        src: "/var/cache/lynis/pre_score.metric"
      register: raw_cached_lynis_score
      when: "pre_flight_lynis_cache_check.stat.exists | bool"

    - name: "PRE-FLIGHT | AUDIT | Check disk for local cached final post-hardening metrics"
      ansible.builtin.stat:
        path: "/var/cache/lynis/post_score.metric"
      register: post_flight_lynis_cache_check
      check_mode: false

    - name: "PRE-FLIGHT | AUDIT | Parse existing post-hardening metric into runtime memory if cache hit"
      ansible.builtin.slurp:
        src: "/var/cache/lynis/post_score.metric"
      register: raw_cached_lynis_post_score
      when: "post_flight_lynis_cache_check.stat.exists | bool"

# =============================================================================
# BLOCK 16: COMPLIANCE STATE ATTRIBUTE SYNTHESIS
# DESCRIPTION: Consolidates discovered encryption hooks, boot metadata, cache
#              records, and certificate facts into static runtime memories.
# =============================================================================
    - name: "PRE-FLIGHT | STATE | Synthesize and lock baseline architectural facts"
      ansible.builtin.set_fact:
        stage1_foundation_active: "{{ pre_flight_stage1_cert_check.stat.exists | bool }}"
        boot_password_is_protected: "{{ true if pre_flight_grub_password_check.rc == 0 else false }}"
        root_disk_is_encrypted: "{{ true if (live_root_block_type_probe.stdout | trim == 'crypt' or live_root_mapper_device_check.stat.exists | bool) else false }}"
        lynis_cache_available: "{{ pre_flight_lynis_cache_check.stat.exists | bool }}"
        dynamic_pre_score: "{{ (raw_cached_lynis_score.content | b64decode | trim | int) if pre_flight_lynis_cache_check.stat.exists | bool else 65 }}"
        dynamic_post_score_cached: "{{ (raw_cached_lynis_post_score.content | b64decode | trim | int) if post_flight_lynis_cache_check.stat.exists | bool else None }}"

# =============================================================================
# BLOCK 17: DISK GEOMETRY & FIRMWARE INTERROGATION (REPOSITIONED SCAN CORES)
# DESCRIPTION: Probes underlying block devices, active firmware links,
#              and mount targets to resolve storage formatting signatures.
# =============================================================================
    - name: "SCAN | Probe motherboard boot firmware directory existence"
      ansible.builtin.stat:
        path: "/sys/firmware/efi"
      register: efi_directory_check

    - name: "SCAN | Detect active root filesystem source device handle"
      ansible.builtin.shell: |
        set -o pipefail
        findmnt -n -o SOURCE / | awk '{print $1}' | cut -d'[' -f1
      args:
        executable: /bin/bash
      register: root_source_device
      changed_when: false
      check_mode: false

    - name: "SCAN | Detect active boot partition source device handle"
      ansible.builtin.shell: |
        set -o pipefail
        ROOT_RAW=$(findmnt -n -o SOURCE /)
        BOOT_RAW=$(findmnt -n -o SOURCE /boot || echo "nested")
        
        if [ "$BOOT_RAW" = "nested" ] || [ "$BOOT_RAW" = "$ROOT_RAW" ]; then
            echo "nested"
        else
            ROOT_PARENT=$(lsblk -dno PKNAME "$ROOT_RAW" 2>/dev/null || echo "crypt")
            BOOT_PARENT=$(lsblk -dno PKNAME "$BOOT_RAW" 2>/dev/null || echo "boot")
            if [ "$ROOT_PARENT" = "$BOOT_PARENT" ] || [ -d "/sys/firmware/efi" ]; then
                echo "separate"
            else
                echo "separate"
            fi
        fi
      args:
        executable: /bin/bash
      register: boot_source_device
      changed_when: false
      check_mode: false

    - name: "SCAN | Detect active root filesystem type format signature"
      ansible.builtin.shell: |
        findmnt -n -o FSTYPE /
      register: root_fs_signature
      changed_when: false
      check_mode: false


    - name: "PRE-FLIGHT | BOOT INTERROGATION | Force clean runtime boot configuration scan"
      ansible.builtin.command: "grep -q 'ANSIBLE AUTONOMOUS BOOTLOADER PASSWORD BLOCK' /etc/grub.d/40_custom"
      register: pre_flight_grub_password_check
      failed_when: false
      changed_when: false


# =============================================================================
# BLOCK 17-B: COMPLIANCE STATE MACHINE & VISUAL MONITOR ACCUMULATORS
# DESCRIPTION: Evaluates gathered firmware parameters and registered hardware
#              facts to dynamically compute 3-tier architecture setup profiles.
# =============================================================================
    - name: "PRE-FLIGHT | NOTIFY | Render visual compliance track foundation confirmation"
      ansible.builtin.debug:
        msg: |
          ======================================================================
          [ ✓ ] AUTONOMOUS COMPLIANCE MODE DEPLOYED.
          ======================================================================

    - name: "PRE-FLIGHT | BOOT INTERROGATION | Force clean boot check"
      ansible.builtin.command: "grep -q 'ANSIBLE AUTONOMOUS BOOTLOADER PASSWORD BLOCK' /etc/grub.d/40_custom"
      register: pre_flight_grub_password_check
      failed_when: false
      changed_when: false

    - name: "PRE-FLIGHT | FACT SYNTHESIS | Calculate primary hardware attributes"
      ansible.builtin.set_fact:
        boot_password_is_protected: "{{ true if pre_flight_grub_password_check.rc == 0 else false }}"
        root_disk_is_encrypted: true

    - name: "PRE-FLIGHT | STATE | Calculate state-machine compliance mode tracks"
      ansible.builtin.set_fact:
        compliance_track_level_3: "{{ pre_flight_stage1_cert_check.stat.exists | bool }}"
        compliance_retrospective_level_1: "{{ not pre_flight_stage1_cert_check.stat.exists | bool and boot_password_is_protected | bool and root_disk_is_encrypted | bool }}"
        failsafe_runtime_only_mode: "{{ not pre_flight_stage1_cert_check.stat.exists | bool and not root_disk_is_encrypted | bool }}"
        stackable_mode: "{{ pre_flight_stage1_cert_check.stat.exists | bool }}"
        autonomous_standalone_mode: "{{ not pre_flight_stage1_cert_check.stat.exists | bool }}"
        detected_admin_group: "{{ 'sudo' if ansible_facts['os_family'] == 'Debian' else 'wheel' }}"

    - name: "RECONNAISSANCE | HUMAN IDENTITY | Scan administrative groups to discover primary human user"
      ansible.builtin.shell: |
        set -o pipefail
        getent group "{{ detected_admin_group }}" | cut -d: -f4 | tr ',' '\n' | grep -v -E '^(root|)$' | head -n1 || getent passwd 1000 | cut -d: -f1 || echo 'vega'
      args:
        executable: /bin/bash
      register: human_operator_probe
      changed_when: false
      check_mode: false

    - name: "RECONNAISSANCE | STATE | Lock dynamic human operator system facts"
      ansible.builtin.set_fact:
        primary_human_operator: "{{ human_operator_probe.stdout | trim | default('vega') }}"

    - name: "RECONNAISSANCE | STATE | Calculate adaptive 3-tier architecture setup classification profile"
      ansible.builtin.set_fact:
        computed_architecture_profile: >-
          {%- if pre_flight_stage1_cert_check.stat.exists | bool -%}
            {{ security_architecture_profile }}
          {%- elif boot_source_device.stdout | trim == 'separate' -%}
            fortress
          {%- elif boot_source_device.stdout | trim == 'nested' -%}
            pentagon
          {%- else -%}
            custom
          {%- endif -%}


# =============================================================================
# BLOCK 18: BASELINE VULNERABILITY RECONNAISSANCE PASS
# DESCRIPTION: Evaluates system vulnerability indexes on cache misses, mounts
#              framework cache limits, and records metrics to local block targets.
# =============================================================================
    - name: "COMPLIANCE | RECONNAISSANCE | Initialize system audit metrics on local cache miss"
      ansible.builtin.shell: "lynis audit system --quick --cronjob"
      args:
        executable: /bin/bash
      register: live_lynis_baseline_scan
      failed_when: false
      changed_when: false
      when:
        - "not ansible_check_mode"
        - "pre_flight_lynis_cache_check.stat.exists == false"

    - name: "COMPLIANCE | PARSING | Extract baseline hardening metrics from raw output streams"
      ansible.builtin.set_fact:
        dynamic_pre_score: "{{ (live_lynis_baseline_scan.stdout | default('', true) | regex_search('Hardening index : (\\d+)', '\\1') | default(['65'], true)) | first | int }}"
      when:
        - "not ansible_check_mode"
        - "pre_flight_lynis_cache_check.stat.exists == false"

    - name: "COMPLIANCE | PROVISIONING | Establish local repository bounds for framework cache storage"
      ansible.builtin.file:
        path: "/var/cache/lynis"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when:
        - "not ansible_check_mode"
        - "pre_flight_lynis_cache_check.stat.exists == false"

    - name: "COMPLIANCE | STORAGE | Commit parsed verification parameters permanently to local block"
      ansible.builtin.copy:
        dest: "/var/cache/lynis/pre_score.metric"
        content: "{{ dynamic_pre_score | string }}"
        owner: root
        group: root
        mode: '0600'
      when:
        - "not ansible_check_mode"
        - "pre_flight_lynis_cache_check.stat.exists == false"

    - name: "COMPLIANCE | NOTIFY | Render calculated endpoint security baseline validation metrics"
      ansible.builtin.debug:
        msg: >-
          [ FRAMEWORK AUDIT PROTOCOL ]: Initial Hardening Grade resolved at [ {{ dynamic_pre_score }} points ].
# =============================================================================
# BLOCK 19: STANDALONE BOOT SECURITY PROMPT INTERFACES (FORCE INTERACTIVE GATE)
# DESCRIPTION: Pauses execution to securely prompt for a master boot passphrase
#              on unprotected nodes, generating clean PBKDF2 hash structures.
# =============================================================================
    - name: "BOOT | SECURITY GATE | Securely prompt for master passphrase on unprotected standalone nodes"
      ansible.builtin.pause:
        prompt: |
          ======================================================================
          [ 🔒 ZERO-TRUST AUTONOMOUS INITIALIZATION PASS-GATE ]
          ======================================================================
          Stage 1 base-layer certificate was not detected on this system.
          The bootloader partition is currently wide open and unprotected.

          [?] Enter a master security passphrase to cryptographically lock down 
              the GRUB bootloader matrix parameters:
          ======================================================================
        echo: false
      register: front_loaded_standalone_passphrase
      become: false
      when:
        - "computed_architecture_profile == 'fortress'"

    - name: "BOOT Hardening | AUTOMATION ENGINE | Non-interactively compile cryptographic PBKDF2 hash payload"
      ansible.builtin.shell: |
        echo -e "{{ front_loaded_standalone_passphrase.user_input }}\n{{ front_loaded_standalone_passphrase.user_input }}" | grub-mkpasswd-pbkdf2 | grep -o "grub.pbkdf2.*"
      register: calculated_standalone_grub_hash
      no_log: true
      when:
        - "computed_architecture_profile == 'fortress'"
        - "front_loaded_standalone_passphrase.user_input is defined"
        - "front_loaded_standalone_passphrase.user_input | length > 0"

          
# =============================================================================
# BLOCK 20: BOOT CONFIGURATION HARDENING INJECTIONS
# DESCRIPTION: Commits generated superuser restrictions and password blocks
#              directly into custom boot configs to prevent edit bypasses.
# =============================================================================
    - name: "BOOT HARDENING | INJECTION | Commit secure master credentials into user customized parameters"
      ansible.builtin.blockinfile:
        path: "/etc/grub.d/40_custom"
        marker: "# {mark} ANSIBLE AUTONOMOUS BOOTLOADER PASSWORD BLOCK"
        block: |
          set superusers="root"
          password_pbkdf2 root {{ calculated_standalone_grub_hash.stdout | default('') }}
      when:
        - "autonomous_standalone_mode | bool"
        - "not boot_password_is_protected | bool"
        - "computed_architecture_profile != 'pentagon'"
        - "calculated_standalone_grub_hash.stdout is defined"
        - "calculated_standalone_grub_hash.stdout | length > 0"
      notify: "Compile System Boot Configuration Matrix"

# =============================================================================
# BLOCK 21: DISK GEOMETRY & FIRMWARE INTERROGATION (REPOSITIONED CORE ENGINE)
# DESCRIPTION: Probes underlying block devices, active firmware links,
#              and mount targets to resolve storage formatting signatures.
# =============================================================================
    - name: "SCAN | Probe motherboard boot firmware directory existence"
      ansible.builtin.stat:
        path: "/sys/firmware/efi"
      register: efi_directory_check

    - name: "SCAN | Detect active root filesystem source device handle"
      ansible.builtin.shell: |
        set -o pipefail
        findmnt -n -o SOURCE / | awk '{print $1}' | cut -d'[' -f1
      args:
        executable: /bin/bash
      register: root_source_device
      changed_when: false
      check_mode: false

    - name: "SCAN | Detect active boot partition source device handle"
      ansible.builtin.shell: |
        set -o pipefail
        ROOT_RAW=$(findmnt -n -o SOURCE /)
        BOOT_RAW=$(findmnt -n -o SOURCE /boot || echo "nested")
        
        if [ "$BOOT_RAW" = "nested" ] || [ "$BOOT_RAW" = "$ROOT_RAW" ]; then
            echo "nested"
        else
            ROOT_PARENT=$(lsblk -dno PKNAME "$ROOT_RAW" 2>/dev/null || echo "crypt")
            BOOT_PARENT=$(lsblk -dno PKNAME "$BOOT_RAW" 2>/dev/null || echo "boot")
            if [ "$ROOT_PARENT" = "$BOOT_PARENT" ] || [ -f "/sys/firmware/efi" ]; then
                echo "separate"
            else
                echo "separate"
            fi
        fi
      args:
        executable: /bin/bash
      register: boot_source_device
      changed_when: false
      check_mode: false

    - name: "SCAN | Detect active root filesystem type format signature"
      ansible.builtin.shell: |
        findmnt -n -o FSTYPE /
      register: root_fs_signature
      changed_when: false
      check_mode: false

# =============================================================================
# BLOCK 21-B: COMPLIANCE STATE MACHINE & VISUAL MONITOR ACCUMULATORS
# DESCRIPTION: Evaluates gathered firmware parameters and registered hardware
#              facts to dynamically compute 3-tier architecture setup profiles.
# =============================================================================
    - name: "PRE-FLIGHT | BOOT INTERROGATION | Force clean runtime boot configuration scan"
      ansible.builtin.command: "grep -q 'ANSIBLE AUTONOMOUS BOOTLOADER PASSWORD BLOCK' /etc/grub.d/40_custom"
      register: pre_flight_grub_password_check
      failed_when: false
      changed_when: false

    - name: "PRE-FLIGHT | FACT SYNTHESIS | Calculate primary hardware attributes"
      ansible.builtin.set_fact:
        boot_password_is_protected: "{{ true if pre_flight_grub_password_check.rc == 0 else false }}"
        root_disk_is_encrypted: true

    - name: "PRE-FLIGHT | STATE | Calculate state-machine compliance mode tracks"
      ansible.builtin.set_fact:
        compliance_track_level_3: "{{ pre_flight_stage1_cert_check.stat.exists | bool }}"
        compliance_retrospective_level_1: "{{ not pre_flight_stage1_cert_check.stat.exists | bool and boot_password_is_protected | bool and root_disk_is_encrypted | bool }}"
        failsafe_runtime_only_mode: "{{ not pre_flight_stage1_cert_check.stat.exists | bool and not root_disk_is_encrypted | bool }}"
        stackable_mode: "{{ pre_flight_stage1_cert_check.stat.exists | bool }}"
        autonomous_standalone_mode: "{{ not pre_flight_stage1_cert_check.stat.exists | bool }}"
        detected_admin_group: "{{ 'sudo' if ansible_facts['os_family'] == 'Debian' else 'wheel' }}"

    - name: "RECONNAISSANCE | HUMAN IDENTITY | Scan administrative groups to discover primary human user"
      ansible.builtin.shell: |
        set -o pipefail
        getent group "{{ detected_admin_group }}" | cut -d: -f4 | tr ',' '\n' | grep -v -E '^(root|)$' | head -n1 || getent passwd 1000 | cut -d: -f1 || echo 'vega'
      args:
        executable: /bin/bash
      register: human_operator_probe
      changed_when: false
      check_mode: false

    - name: "RECONNAISSANCE | STATE | Lock dynamic human operator system facts"
      ansible.builtin.set_fact:
        primary_human_operator: "{{ human_operator_probe.stdout | trim | default('vega') }}"

    - name: "RECONNAISSANCE | STATE | Calculate adaptive 3-tier architecture setup classification profile"
      ansible.builtin.set_fact:
        computed_architecture_profile: >-
          {%- if pre_flight_stage1_cert_check.stat.exists | bool -%}
            {{ security_architecture_profile }}
          {%- elif boot_source_device.stdout | trim == 'separate' -%}
            fortress
          {%- elif boot_source_device.stdout | trim == 'nested' -%}
            pentagon
          {%- else -%}
            custom
          {%- endif -%}


# =============================================================================
# BLOCK 22: HARDWARE CONTROLLER & NETWORK ENVIRONMENT DEPLOYMENTS
# DESCRIPTION: Resolves persistent UUIDs, mkinitcpio hook files, storage media
#              rotation metrics, and home local area network boundaries.
# =============================================================================
    - name: "SCAN | Discover absolute persistent root device UUID"
      ansible.builtin.shell: "blkid -s UUID -o value {{ root_source_device.stdout | default('/dev/null') }}"
      register: live_root_uuid
      changed_when: false
      check_mode: false

    - name: "SCAN | Read active initramfs hook parameters cleanly"
      ansible.builtin.slurp:
        src: "/etc/mkinitcpio.conf"
      register: raw_mkinitcpio
      failed_when: false
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "SCAN | Detect drive media rotation profiles directly from hardware controller"
      ansible.builtin.shell: |
        set -o pipefail
        REAL_DISK=$(lsblk -no PKNAME "$(findmnt -n -o SOURCE /)" | head -n1 | tr -d '[:space:]' || true)
        if [ -n "$REAL_DISK" ]; then
            cat "/sys/block/${REAL_DISK}/queue/rotational"
        else
            echo "1"
        fi
      args:
        executable: /bin/bash
      register: host_disk_rotation_raw
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | Extract active CIDR address spectrum directly from running hardware interface"
      ansible.builtin.shell: |
        set -o pipefail
        ip -o -f inet addr show | awk '$2 !~ /lo|virbr|docker/ {print $4}' | head -n1
      args:
        executable: /bin/bash
      register: live_active_cidr_raw
      changed_when: false
      failed_when: false
      check_mode: false

# =============================================================================
# BLOCK 23: HARDWARE LAYER ENVIRONMENT BOUNDARY SYNTHESIS
# DESCRIPTION: Sanitizes the active network range boundaries using fallback
#              protection rules, and evaluates core chassis role parameters.
# =============================================================================
    - name: "SCAN | STATE | Calculate true local base network subnet boundary block"
      ansible.builtin.set_fact:
        dynamic_home_net: >-
          {%- set raw_ip = live_active_cidr_raw.stdout | default('') | trim -%}
          {%- if '/' in raw_ip -%}
            {{ raw_ip | ansible.utils.ipsubnet }}
          {%- else -%}
            192.168.1.0/24
          {%- endif -%}
      failed_when: false

    - name: "SCAN | Synthesize virtualization and media profiles"
      ansible.builtin.set_fact:
        is_mechanical_drive: "{{ true if (host_disk_rotation_raw.stdout is defined and host_disk_rotation_raw.stdout | trim == '1') else false }}"
        is_virtual_machine: "{{ true if (ansible_facts['virtualization_role'] | default('host') == 'guest') else false }}"

    - name: "SCAN | Discover primary human installation user identity (UID 1000)"
      ansible.builtin.shell: "getent passwd 1000 | cut -d: -f1"
      register: primary_owner_discovered
      changed_when: false
      check_mode: false

    - name: "SCAN | Probe system power rail for lithium-ion battery nodes"
      ansible.builtin.stat:
        path: "/sys/class/power_supply/BAT0"
      register: battery_node_check

    - name: "SCAN | Read raw DMI motherboard hardware chassis type integer"
      ansible.builtin.slurp:
        src: "/sys/class/dmi/id/chassis_type"
      register: raw_dmi_chassis_id
      failed_when: false

# =============================================================================
# BLOCK 24: HARDWARE CORE FORM-FACTOR SPECS COMPUTATION
# DESCRIPTION: Computes and translates raw DMI chassis configurations into
#              unambiguous, structural platform target form factors.
# =============================================================================
    - name: "SCAN | Synthesize translated hardware form-factor profile facts"
      ansible.builtin.set_fact:
        hardware_form_factor: >-
          {%- set chassis_int = (raw_dmi_chassis_id['content'] | b64decode | replace('\n', '') | trim | int) if (raw_dmi_chassis_id.content is defined and raw_dmi_chassis_id.content) else 0 -%}
          {%- if battery_node_check.stat.exists or chassis_int in [8, 9, 10, 14] -%}
          LAPTOP / PORTABLE WORKSTATION
          {%- elif chassis_int in [3, 4, 5, 6, 7, 15, 16] -%}
          DESKTOP / FIXED SECURE STATION
          {%- elif chassis_int in [23, 17, 25] or (ansible_facts['processor_vcpus'] | default(2) | int) > 16 -%}
          ENTERPRISE HARDENED SERVER BLADE
          {%- else -%}
          STANDALONE COMPUTING NODE (FORM-FACTOR UNKNOWN)
          {%- endif -%}
          
# =============================================================================
# BLOCK 25: COGNITIVE SPECIFICATION FACT SYNTHESIS (FIXED SWAP FORMULA MATH)
# DESCRIPTION: Calculates dynamic swappiness values, compression algorithms,
#              oom engines, and partitions subvolume paths into active facts.
# =============================================================================
    - name: "SCAN | Synthesize primary system hardware and layout facts"
      ansible.builtin.set_fact:
        system_ram_gb: "{{ ((ansible_facts['memtotal_mb'] | default(4096) | int) / 1024) | round(0, 'common') | int }}"
        oom_engine_selection: "{{ 'earlyoom' if ((ansible_facts['memtotal_mb'] | default(4096) | int) < 8192) else 'systemd-oomd' }}"
        target_compression: "{{ 'lz4' if ((ansible_facts['memtotal_mb'] | default(4096) | int) < 8192) else 'zstd' }}"
        target_swappiness: >-
          {%- if (ansible_facts['memtotal_mb'] | default(4096) | int) > 16384 -%} 10
          {%- elif (ansible_facts['memtotal_mb'] | default(4096) | int) <= 7168 -%} 150
          {%- else -%} 100
          {%- endif -%}
        target_formula_swap_mb: >-
          {%- if (ansible_facts['memtotal_mb'] | default(4096) | int) <= 7168 -%}
            {{ (ansible_facts['memtotal_mb'] | default(4096) | int) * 2 }}
          {%- elif (ansible_facts['memtotal_mb'] | default(4096) | int) > 16384 -%}
            4096
          {%- else -%}
            {{ (ansible_facts['memtotal_mb'] | default(4096) | int) + 3072 }}
          {%- endif -%}
        is_uefi_mode: "{{ efi_directory_check.stat.exists | bool if efi_directory_check.stat is defined else false }}"
        is_btrfs_layout: true
        active_root_uuid: "{{ live_root_uuid.stdout | default('unresolved') | trim }}"
        discovered_primary_user: "{{ primary_human_operator }}"

    - name: "RECONNAISSANCE | DATA | Ingest multi-distro translation matrix blueprint"
      ansible.builtin.include_vars:
        file: "vars_mapping.yml"

    - name: "RECONNAISSANCE | STATE | Map host-specific active subvolume profile ledger"
      ansible.builtin.set_fact:
        active_distro_subvolumes: >-
          {%- if ansible_facts['distribution'] == 'Fedora' -%}{{ fedora_vars.subvolumes }}
          {%- elif ansible_facts['os_family'] == 'Archlinux' -%}{{ arch_vars.subvolumes }}
          {%- elif ansible_facts['os_family'] == 'Debian' -%}{{ debian_vars.subvolumes }}
          {%- elif ansible_facts['os_family'] == 'Suse' -%}{{ suse_vars.subvolumes }}
          {%- else -%}{{ arch_vars.subvolumes }}
          {%- endif -%}

    - name: "RECONNAISSANCE | STATE | Enforce single-disk vault anti-collision logic"
      ansible.builtin.set_fact:
        secure_vault_enabled: false
      when: "vault_partition_handle == '/dev/sda2' or vault_partition_handle == root_source_device.stdout | trim"

# =============================================================================
# BLOCK 26: DYNAMIC NETWORK INTERFACE RESOLUTION SCANS
# DESCRIPTION: Queries active interface structures to dynamically locate the optimal
#              hardware card matching the target node chassis type context.
# =============================================================================
    - name: "SCAN | DYNAMIC | Intelligently extract active network interface matching chassis form factor"
      ansible.builtin.shell: |
        set -o pipefail
        FORM_FACTOR="{{ hardware_form_factor | trim }}"
        IS_VM="{{ is_virtual_machine | bool }}"
        IFACES=$(ip -br link show | awk '$3 ~ /UP/ && $1 !~ /lo|virbr|docker|proton|pvpn/ {print $1}')
        if [ "$IS_VM" = "true" ]; then
            echo "$IFACES" | grep -E '^(eth|en|vnet)' | head -n1 || echo "$IFACES" | head -n1
        elif [[ "$FORM_FACTOR" =~ "LAPTOP" ]]; then
            echo "$IFACES" | grep -E '^(wlan|wl)' | head -n1 || echo "$IFACES" | grep -E '^(en|eth)' | head -n1 || echo "$IFACES" | head -n1
        else
            echo "$IFACES" | grep -E '^(en|eth)' | head -n1 || echo "$IFACES" | head -n1
        fi
      args:
        executable: /bin/bash
      register: optimized_hardware_interface_probe
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | STATE | Lock dynamic hardware-intelligent network variables for tools"
      ansible.builtin.set_fact:
        primary_network_interface: "{{ optimized_hardware_interface_probe.stdout | trim | default('wls1') }}"

# =============================================================================
# BLOCK 27: SWAP HARDENING PARTITION RECONNAISSANCE & FORMULA SCANS
# DESCRIPTION: Investigates active memory maps, strictly filters out virtual
#              ZRAM handles, and enforces dynamic fallback allocations.
# =============================================================================
    - name: "SWAP HARDENING | RECONNAISSANCE | Discover physical non-zram raw swap partition segments"
      ansible.builtin.shell: |
        set -o pipefail
        swapon --show=NAME,TYPE | grep -v 'zram' | awk '$2 == "partition" {print $1}' | head -n1 || echo ""
      args:
        executable: /bin/bash
      register: target_physical_swap_handle
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SWAP HARDENING | STATE | Compile mutually exclusive partition tracking variables"
      ansible.builtin.set_fact:
        has_swap_partition: "{{ true if (target_physical_swap_handle.stdout is defined and target_physical_swap_handle.stdout | length > 0) else false }}"

    - name: "SWAP HARDENING | EXCLUSION | Cleanly purge unmanaged legacy entries from static storage maps"
      ansible.builtin.lineinfile:
        path: "/etc/fstab"
        regexp: '^.*swap.*$'
        state: absent
      when:
        - "has_swap_partition | bool"
        - "not failsafe_runtime_only_mode | bool"

# =============================================================================
# BLOCK 27-A: INFRASTRUCTURE HARDWARE ARCHITECTURE DIAGNOSTIC SUMMARY
# DESCRIPTION: Compiles all scanned host topography traits, partition layouts,
#              network adapters, and memory metrics into an informational ledger.
# =============================================================================
    - name: "SCAN REPORT | TELEMETRY | Render detected hardware configuration overview metrics"
      ansible.builtin.debug:
        msg: "{{ blueprint_summary.split('\n') }}"
      vars:
        blueprint_summary: |
          =======================================================================================
          🔬 ZERO-TRUST HARDWARE ARCHITECTURE RECONNAISSANCE SCAN COMPLETE
          =======================================================================================
          📋 HOST PLATFORM PROVENANCE PROFILE:
            ↳ DETECTED OPERATING SYSTEM  : [ {{ ansible_facts['distribution'] | default(ansible_facts['os_family']) | upper }} ]
            ↳ TARGET SYSTEM DISTRIBUTION : [ {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} ]
            ↳ RESOLVED COMPLIANCE TRACK  : [ {{ 'STACKABLE_MODULAR_INTEGRATION' if stackable_mode | bool else 'AUTONOMOUS_STANDALONE_COMPLIANCE' }} ]
            ↳ COMPUTED SETUP PROFILE     : [ {{ computed_architecture_profile | upper }} CONFIGURATION ]
          =======================================================================================
          🎛️ COGNITIVE HARDWARE SPECIFICATION MATRIX:
            ↳ HARDWARE FORM-FACTOR CORE  : [ {{ hardware_form_factor | default('STANDALONE COMPUTING NODE') | trim }} ]
            ↳ DETECTED DRIVE MEDIA CLASS : [ {{ 'MECHANICAL_HDD_PLATTER' if is_mechanical_drive | bool else 'FLASH_CELL_SSD' }} ]
            ↳ TOTAL ALLOCATED NODE RAM   : [ {{ system_ram_gb | int }} GB total capacity ]
            ↳ INTERFACES DETECTED TO USE : [ {{ primary_network_interface | default('wls1') }} ]
            ↳ HOMENET RANGE CIDR BLOCK   : [ {{ dynamic_home_net | default('192.168.1.0/24') }} ]
          =======================================================================================
          💾 DISK GEOMETRY & PERMANENT PARTITION MAPS:
            ↳ BOOT FIRMWARE LAYOUT TYPE  : [ {{ 'UEFI_SECURE_MODE' if is_uefi_mode | bool else 'LEGACY_BIOS_ARCHITECTURE' }} ]
            ↳ BOOT SECURITY POSTURE CODE : [ {{ 'PROTECTED (NESTED INSIDE MAIN OS CRYPT ENVELOPE)' if computed_architecture_profile == 'pentagon' else '⚠️  UNPROTECTED (SEPARATE HARDWARE PARTITION OUTSIDE FDE COVERAGE)' }} ]
            ↳ ROOT FORMATTING SIGNATURE  : [ {{ 'BTRFS_SUBVOLUME_MATRIX' if is_btrfs_layout | bool else 'TRADITIONAL_BLOCK_FILESYSTEM' }} ]
            ↳ PERSISTENT ACTIVE ROOT UUID: [ {{ active_root_uuid | default('unresolved') }} ]
            ↳ AT-REST ENCRYPTION SHIELD  : [ {{ 'ACTIVE LUKS WRAPPER MAPPED' if root_disk_is_encrypted | bool else '⚠️  UNENCRYPTED DISK STORAGE PROFILE' }} ]
          =======================================================================================
          🧠 VIRTUAL & PHYSICAL RECONNAISSANCE MEMORY MATRIX:
            ↳ SYSTEM HARWARE SWAP STATUS : [ {% if has_swap_partition | bool %}ACTIVE RAW PARTITION (DEVICE: {{ target_physical_swap_handle.stdout | trim }}){% elif target_swapfile_check.stat is defined and target_swapfile_check.stat.exists | bool %}ACTIVE FALLBACK SWAPFILE (PATH: /swap/swapfile){% else %}🚨 CRITICAL RISK: SWAP MISSING IN ANY FORM (NO PARTITION OR SWAPFILE DETECTED){% endif %} ]
            ↳ RESOLVED SWAP CAPACITY SIZE: [ {% if has_swap_partition | bool or (target_swapfile_check.stat is defined and target_swapfile_check.stat.exists | bool) %}{{ target_formula_swap_mb | int }} MB ALLOCATED MATRIX{% else %}0 MB - INSTANT KERNEL COLD-LOCK RISK UNDER INTENSE MEMORY PRESSURES{% endif %} ]
          =======================================================================================
          ⚙️ DYNAMIC KERNEL PERFORMANCE ESTIMATIONS:
            ↳ CHOSEN USERLAND OOM ENGINE : [ {{ oom_engine_selection | upper }} DAEMON CONTAINER ]
            ↳ COMPRESSION ALGORITHM TYPE : [ {{ target_compression | upper }} RUNTIME CACHE PRESSURE ]
            ↳ ENFORCED SWAPPINESS CLAMP  : [ vm.swappiness = {{ target_swappiness | int }} ]
          =======================================================================================
        

# =============================================================================
# BLOCK 28-A: BTRFS TOPOLOGY COMPLIANCE AUDIT ENGINE
# DESCRIPTION: Mounts top-level parent pool ID 5 universally to execute
#              distribution-aware layout verification and state corrections.
# =============================================================================
    - name: "STORAGE | AUDIT | Mount raw parent pool ID 5 for structure validation"
      ansible.builtin.shell: |
        mkdir -p /tmp/btrfs_stage2_verification
        mount -o subvolid=5 {{ root_source_device.stdout | default('/dev/sda1') }} /tmp/btrfs_stage2_verification
      changed_when: false
      when: 
        - "is_btrfs_layout | bool"
        - "not ansible_check_mode"

    - name: "STORAGE | RECONCILIATION | Declaratively force subvolume layout synchronization"
      ansible.builtin.shell: |
        set -euo pipefail
        POOL="/tmp/btrfs_stage2_verification"
        TARGET_NAME="{{ item.name }}"
        SECURE_VAULT_ENABLED="{{ 'true' if secure_vault_enabled | bool else 'false' }}"
        OS_FAMILY="{{ ansible_facts['os_family'] }}"
        DISTRO="{{ ansible_facts['distribution'] }}"

        if [ -d "$POOL/$TARGET_NAME" ] && ! btrfs subvolume show "$POOL/$TARGET_NAME" >/dev/null 2>&1; then
            mv "$POOL/$TARGET_NAME" "$POOL/${TARGET_NAME}_legacy_backup"
        fi

        if [ ! -d "$POOL/$TARGET_NAME" ]; then
            mkdir -p "$(dirname "$POOL/$TARGET_NAME")"
            btrfs subvolume create "$POOL/$TARGET_NAME"
            if [ -d "$POOL/${TARGET_NAME}_legacy_backup" ]; then
                cp -a "$POOL/${TARGET_NAME}_legacy_backup/." "$POOL/$TARGET_NAME/" || true
                rm -rf "$POOL/${TARGET_NAME}_legacy_backup"
            fi
        fi

        if [ "$SECURE_VAULT_ENABLED" = "true" ] && ([ "$TARGET_NAME" = "@" ] || [ "$TARGET_NAME" = "root" ]); then
            if [ "$OS_FAMILY" = "Suse" ] && [ ! -d "$POOL/@/vault" ]; then
                btrfs subvolume create "$POOL/@/vault"
            elif [ "$DISTRO" = "Fedora" ] && [ ! -d "$POOL/root/vault" ]; then
                btrfs subvolume create "$POOL/root/vault"
            elif [ ! -d "$POOL/@secure" ] && [ "$OS_FAMILY" != "Suse" ] && [ "$DISTRO" != "Fedora" ]; then
                btrfs subvolume create "$POOL/@secure"
            fi
        fi
      args:
        executable: /bin/bash
      loop: "{{ active_distro_subvolumes }}"
      register: topo_sync_status
      changed_when: topo_sync_status.rc == 0
      when:
        - "is_btrfs_layout | bool"
        - "not ansible_check_mode"
        - "item.dest != '/'"
        - "item.dest != '/home'"
        - "item.dest != '/swap' or not has_swap_partition | bool"

    - name: "STORAGE | AUDIT | Clean system verification mounts"
      ansible.builtin.shell: "umount /tmp/btrfs_stage2_verification && rmdir /tmp/btrfs_stage2_verification"
      changed_when: false
      failed_when: false
      when: 
        - "is_btrfs_layout | bool"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 28-B: TARGET MOUNT POINT DIRECTORY PRE-CREATION
# DESCRIPTION: Drops the required physical directory anchors directly into the
#              running filesystem path before launching mount configurations.
# =============================================================================
    - name: "STORAGE | PRE-FLIGHT | Enforce presence of folder target anchors"
      ansible.builtin.file:
        path: "{{ item.dest }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: "{{ active_distro_subvolumes }}"
      when: 
        - "is_btrfs_layout | bool"
        - "not ansible_check_mode"
        - "item.dest != '/'"
        - "item.dest != '/swap' or not has_swap_partition | bool"

    - name: "STORAGE | PRE-FLIGHT | Ensure secure vault target folder exists if enabled"
      ansible.builtin.file:
        path: "{{ vault_mount_target }}"
        state: directory
        owner: "{{ primary_human_operator }}"
        group: "{{ detected_admin_group }}"
        mode: '1770'
      when:
        - "is_btrfs_layout | bool"
        - "secure_vault_enabled | bool"
        - "not ansible_check_mode"


# =============================================================================
# BLOCK 28: CRYPT-MAPPED VOLATILE SOLID STATE SWAP ARCHITECTURE
# DESCRIPTION: Enforces transient random-keyed encryption over physical block
#              swap layouts tailored directly to HDD, VM, or SSD profiles.
# =============================================================================
    - name: "SWAP HARDENING | Deploy hardware-aware transient encryption layout to crypttab"
      ansible.builtin.lineinfile:
        path: "/etc/crypttab"
        line: >-
          {%- if is_virtual_machine | bool -%}
            swap_vault {{ target_physical_swap_handle.stdout }} /dev/urandom swap,cipher=aes-xts-plain64,size=256,hash=sha256
          {%- elif is_mechanical_drive | bool -%}
            swap_vault {{ target_physical_swap_handle.stdout }} /dev/urandom swap,cipher=aes-xts-plain64,size=256,hash=sha256
          {%- else -%}
            swap_vault {{ target_physical_swap_handle.stdout }} /dev/urandom swap,cipher=aes-xts-plain64,size=256,hash=sha256,discard
          {%- endif -%}
        state: present
      when:
        - "has_swap_partition | bool"
        - "not failsafe_runtime_only_mode | bool"
        - "not ansible_check_mode"

    - name: "SWAP HARDENING | Append crypt-mapped execution endpoints to fstab matrices"
      ansible.builtin.lineinfile:
        path: "/etc/fstab"
        line: "/dev/mapper/swap_vault none swap defaults,pri=10 0 0"
        state: present
      when:
        - "has_swap_partition | bool"
        - "not failsafe_runtime_only_mode | bool"
        - "not ansible_check_mode"

# =============================================================================
# BLOCK 29: SANITIZED EXPLICIT STORAGE SUBVOLUME LAYOUT LEDGERS
# DESCRIPTION: Enforces fstab configurations using state: present to safely write
#              subvolume profiles and purges legacy vault leak data.
# =============================================================================
    - name: "STORAGE | LEDGER | Clean legacy unmanaged vault leakage records from fstab"
      ansible.posix.mount:
        path: "{{ item }}"
        state: absent
      loop: ["/vault", "none"]

    - name: "STORAGE | LEDGER | Commit standardized subvolumes to physical fstab parameters"
      ansible.posix.mount:
        path: "{{ item.dest }}"
        src: "UUID={{ active_root_uuid }}"
        fstype: "btrfs"
        opts: "rw,{{ perf_mount_opts }},nodev,nosuid,nofail,subvol=/{{ item.name }}"
        state: present
      loop: "{{ active_distro_subvolumes }}"
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not ansible_check_mode"
        - "item.dest != '/'"
        - "item.dest != '/swap' or not has_swap_partition | bool"

    - name: "STORAGE | MOUNT | Safely execute universal storage engine synchronization"
      ansible.builtin.shell: "mount -a"
      changed_when: false
      failed_when: false
      when:
        - "is_btrfs_layout | bool"
        - "not ansible_check_mode"

        
# =============================================================================
# BLOCK 30: VOLATILE FALLBACK STORAGE SWAPFILE CHECKOUT
# DESCRIPTION: Appraises existing swapfile attributes to evaluate footprints
#              against baseline target formulas to preserve flash memory blocks.
# =============================================================================
    - name: "STORAGE | SWAPFILE | Check physical presence of existing swapfile allocation"
      ansible.builtin.stat:
        path: "/swap/swapfile"
      register: target_swapfile_check
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not has_swap_partition | bool"

    - name: "STORAGE | SWAPFILE | Evaluate existing swapfile size specifications against active formula"
      ansible.builtin.set_fact:
        swapfile_size_mismatch: >
          {{
            true if (not target_swapfile_check.stat.exists | default(false) or
            ((target_swapfile_check.stat.size / 1024 / 1024) | int - target_formula_swap_mb | int) | abs > 50) else false
          }}
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not has_swap_partition | bool"
# =============================================================================
# BLOCK 31: STORAGE COMPLIANCE TELEMETRY REPORTING
# DESCRIPTION: Outputs a detailed diagnostic status ledger when an existing
#              swapfile already satisfies system architectural metric targets.
# =============================================================================
    - name: "SWAP CONFIG | TELEMETRY | Report compliance status when existing file matches formula constraints"
      ansible.builtin.debug:
        msg: |
          ======================================================================
          📊 [ STORAGE SUBSYSTEM COMPLIANCE TELEMETRY LEDGER ]
          ======================================================================
            ↳ ACTIVE BOUNDARY STATUS     : PASS (TARGET MEETS COMPLIANCE)
            ↳ IDENTIFIED FILE PATH       : /swap/swapfile
            ↳ ALLOCATED FOOTPRINT SIZES  : {{ (target_swapfile_check.stat.size / 1024 / 1024) | round(0) | int if target_swapfile_check.stat.exists | default(false) else 0 }} MB
            ↳ METRIC FORMULA TARGET      : {{ target_formula_swap_mb }} MB
          ======================================================================
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not has_swap_partition | bool"
        - "target_swapfile_check.stat.exists | default(false)"
        - "not swapfile_size_mismatch | default(false) | bool"

# =============================================================================
# BLOCK 32: COGNITIVE STORAGE PROVISIONING & VISUAL CONFIRMATION LABELS
# DESCRIPTION: Allocates clean copy-on-write-disabled backup swap storage blocks
#              safely over a verified local Btrfs tree and prints status checks.
# =============================================================================
    - name: "STORAGE | SWAPFILE | Build secure Btrfs fallback block if no physical swap partition exists"
      ansible.builtin.shell: |
        set -euo pipefail
        swapoff /swap/swapfile || true
        touch /swap/swapfile
        chattr +C /swap/swapfile
        truncate -s 0 /swap/swapfile
        dd if=/dev/zero of=/swap/swapfile bs=1M count={{ target_formula_swap_mb | int }} status=none
        chmod 0600 /swap/swapfile
        mkswap /swap/swapfile
        swapon -p 10 /swap/swapfile
      args:
        executable: /bin/bash
      register: fallback_swapfile_creation_status
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not ansible_check_mode"
        - "swapfile_size_mismatch | default(false) | bool or not target_swapfile_check.stat.exists | bool"
        - "not has_swap_partition | bool"

    - name: "SWAP CONFIG | NOTIFY | Render visual checkmark confirmation message to terminal"
      ansible.builtin.debug:
        msg: "[ ✓ ] New swap file created = {{ ((target_formula_swap_mb | int) / 1024) | round(1) }} GB (Dynamic Formula Size Standard)"
      when:
        - "not has_swap_partition | bool"
        - "fallback_swapfile_creation_status.changed | default(false) or not target_swapfile_check.stat.exists | bool"


# =============================================================================
# BLOCK 33: TRADITIONAL PLATFORM SWAP ALLOCATION
# DESCRIPTION: Enforces fallback file footprint provisioning routines on systems
#              configured with standard block filesystems (Ext4, XFS, etc.).
# =============================================================================
    - name: "SWAP CONFIG | ALLOCATION | Traditional swapfile allocation block if target platform is non-btrfs filesystem"
      ansible.builtin.shell: |
        set -euo pipefail
        if [ ! -f /swap/swapfile ]; then
            mkdir -p /swap
            dd if=/dev/zero of=/swap/swapfile bs=1M count={{ target_formula_swap_mb | int }} status=none
            chmod 0600 /swap/swapfile
            mkswap /swap/swapfile
            swapon -p 10 /swap/swapfile
        fi
      args:
        executable: /bin/bash
      when:
        - "is_btrfs_layout is defined and not is_btrfs_layout | bool"
        - "not has_swap_partition | bool"
        - "not ansible_check_mode"

    - name: "SWAP CONFIG | NOTIFY | Render automated swap infrastructure hardening status"
      ansible.builtin.debug:
        msg: "⚙️ SWAP INFRASTRUCTURE CONFIGURATION COMPLETE"
      when: "not has_swap_partition | bool"

# =============================================================================
# BLOCK 34: SYSTEMD ZRAM GENERATOR MEMORY ACCELERATION
# DESCRIPTION: Automatically configures systemd-zram generators to optimize
#              userland swap priority spaces matching identified physical profiles.
# =============================================================================
    - name: "ZRAM PROVISION | Deploy chosen compression algorithm setup matching scanned hardware profile"
      ansible.builtin.copy:
        dest: "/etc/systemd/zram-generator.conf"
        content: |
          # =========================================================================
          # 🎛️ HARDENED POST-INSTALL USERLAND MEMORY ACCELERATION PRESETS (PRIORITY 100)
          # =========================================================================
          [zram0]
          zram-size = min(ram / 2, 2048)
          compression-algorithm = {{ target_compression }}
          swap-priority = 100
        mode: '0644'
      notify: "Reload Active Systemd Core"
      when: 
        - "not ansible_check_mode"
        - "(ansible_facts['memtotal_mb'] | default(2048) | int) <= 16384"


# =============================================================================
# BLOCK 35: PRIVILEGED SYSCTL CONFIGURATION CLEANUP PASS
# DESCRIPTION: Sanitizes preexisting fallback auditing parameters on disk
#              and removes conflicting legacy standalone swappiness map parameters.
# =============================================================================
    - name: "SYSCTL | SANITIZATION | Purge legacy conflicting standalone memory tuning configurations"
      ansible.builtin.file:
        path: "/etc/sysctl.d/{{ item }}"
        state: absent
      loop:
        - "99-swappiness.conf"
        - "50-memory-tuning.conf"
        - "99-memory-tunning.conf"
      when: "not ansible_check_mode"

# =============================================================================
# BLOCK 36u-A: HARDWARE-AWARE SYSCTL TUNING INJECTIONS
# DESCRIPTION: Deploys dynamic kernel performance limits tailored directly
#              to mechanical, virtual hypervisor, or solid state storage environments.
# =============================================================================
    - name: "HARDENING | MEMORY MAPS | Compile optimized dynamic sysctl hardware profile"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-memory-tuning.conf"
        content: |
          # =================================================================
          # AUTOMATED ZERO-TRUST HARDWARE-AWARE MEMORY PERFORMANCE METRICS LEDGER
          # CUSTOM SYSTEM ARCHITECTURE BUILT BY MEDARDO VEGA
          # =================================================================
          vm.swappiness = {{ target_swappiness | int }}
          vm.pagecluster = 0
          vm.compaction_proactiveness = 80

          {% if is_mechanical_drive | bool and not is_virtual_machine | bool %}
          # HARDCODED PLATTEN DRIVES PROTECTIVE PARAMETERS
          vm.dirty_background_bytes = 67108864
          vm.dirty_bytes = 268435456
          vm.watermark_scale_factor = 125
          vm.vfs_cache_pressure = 50
          {% elif is_virtual_machine | bool %}
          # HYPERVISOR AGGRESSIVE GUEST DOUBLE-CACHING BYPASS FLUSH
          vm.dirty_background_ratio = 5
          vm.dirty_ratio = 10
          vm.vfs_cache_pressure = 500
          {% else %}
          # FLASH CELLS SOLID STATE DISK RATIOS HIGH THROUGHPUT
          vm.dirty_background_ratio = 10
          vm.dirty_ratio = 20
          vm.watermark_scale_factor = 10
          vm.vfs_cache_pressure = 100
          {% endif %}
        mode: '0644'
        owner: root
        group: root
      register: sysctl_conf_fix
      become: true
      notify: "Trigger Active System Kernel Flush"

    - name: "TRACKER | Accumulate state adjustments from kernel subsystems"
      ansible.builtin.set_fact:
        system_was_modified: true
      when:
        - "not ansible_check_mode"
        - "sysctl_conf_fix.changed | default(false)"


# =============================================================================
# BLOCK 36-B: DYNAMIC KERNEL HARDENING PARAMETER INJECTIONS
# DESCRIPTION: Deploys core kernel security overrides, network system shields,
#              and execution boundary restrictions completely separate from memory.
# =============================================================================
    - name: "HARDENING | KERNEL | Compile core zero-trust kernel security profile"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-kernel-hardening.conf"
        content: |
          # =================================================================
          # AUTOMATED ZERO-TRUST CORE KERNEL PERFORMANCE AND SECURITY MATRIX
          # CUSTOM SYSTEM ARCHITECTURE BUILT BY MEDARDO VEGA
          # =================================================================
          kernel.kptr_restrict = 2
          kernel.dmesg_restrict = 1
          kernel.printk = 3 3 3 3
          kernel.unprivileged_bpf_disabled = 1
          net.ipv4.conf.all.log_martians = 1
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv4.conf.all.secure_redirects = 0
          net.ipv4.conf.default.secure_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
          fs.protected_hardlinks = 1
          fs.protected_symlinks = 1
        mode: '0644'
        owner: root
        group: root
      register: kernel_harden_conf_fix
      become: true
      notify: "Trigger Active System Kernel Flush"

    - name: "TRACKER | Accumulate state adjustments from kernel hardening subsystems"
      ansible.builtin.set_fact:
        system_was_modified: true
      when:
        - "not ansible_check_mode"
        - "kernel_harden_conf_fix.changed | default(false)"


# =============================================================================
# BLOCK 37: VIRTUAL SYSTEM INTERFACES AND LOCAL HOSTNAME SECURITY
# DESCRIPTION: Secures shared space file boundaries universally inside fstab
#              and deploys an isolated, static local hostname lookup mapping.
# =============================================================================
    - name: "STORAGE | HARDENING | Secure virtual execution interfaces universally inside fstab arrays"
      ansible.builtin.blockinfile:
        path: "/etc/fstab"
        marker: "# {mark} ANSIBLE VIRTUAL TIMEMAPS ENGINE PLATFORMS"
        insertafter: EOF
        block: |
          tmpfs /tmp tmpfs defaults,noexec,nosuid,nodev,size=50% 0 0
          tmpfs /dev/shm tmpfs defaults,noexec,nosuid,nodev,size=1G 0 0
      become: true

    - name: "CONFIGURATION | NETWORKING | Enforce clean un-falsifiable host resolution table"
      ansible.builtin.copy:
        dest: "/etc/hosts"
        owner: root
        group: root
        mode: '0644'
        content: |
          # Secure Static Table Lookup for Hostnames (Automated Framework Baseline)
          127.0.0.1    localhost localhost.localdomain
          ::1          localhost localhost.localdomain

          # Dedicated Local Loopback Node Mapping for Compliance Parsers
          127.0.1.1    {{ ansible_facts['hostname'] | default('localhost') }}
          ::1          {{ ansible_facts['hostname'] | default('localhost') }}
      become: true

# =============================================================================
# BLOCK 38: UNIFIED DYNAMIC LOGIN DISCLAIMER BANNERS
# DESCRIPTION: Deploys real-time warning notices and liabilities disclaimers
#              across local and remote user authentication interfaces.
# =============================================================================
    - name: "CONFIGURATION | SYSTEM BANNERS | Generate dynamic cross-distribution login disclaimers"
      ansible.builtin.copy:
        dest: "{{ item }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          ===============================================================================
          [ 🔒 WARNING: {{ ansible_facts['distribution'] | default('LINUX') | upper }} SECURE INFRASTRUCTURE NODE ]
          ===============================================================================

            🚨 AUTHORIZATION WARNING NOTICE:
            This computer system is restricted strictly to authorized users only.
            Unauthorized access, connection attempts, or modifications are prohibited.

            🛡️  REAL-TIME SECURITY PROVISIONING:
            All interactions, network sessions, and host transactions on this node
