# =============================================================================
# BLOCK 57: CLAMAV DAEMON RESOURCE SANDBOXING & OVERRIDES
# DESCRIPTION: Deploys drop-in directories for your systemd configuration tree
#              and injects hardware-proportional cgroup resource constraints.
# =============================================================================
    - name: "CLAMAV | CONFIGURATION | Establish systemd drop-in override containment path"
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ 'clamav-daemon' if ansible_facts['os_family'] == 'Debian' else 'clamd' }}.service.d"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: "not ansible_check_mode"

    - name: "CLAMAV | CONFIGURATION | Inject hardware-proportional resource management parameters"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ 'clamav-daemon' if ansible_facts['os_family'] == 'Debian' else 'clamd' }}.service.d/override.conf"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          Nice=19
          CPUSchedulingPolicy=idle
          CPUQuota={{ calculated_quota | trim }}%
          MemoryHigh={{ calculated_mem_high | trim }}
          MemoryMax={{ calculated_mem_max | trim }}
          TimeoutStartSec=300
      vars:
        calculated_quota: >
          {%- if (system_ram_gb | default(4) | int) <= 4 -%} 10
          {%- elif (system_ram_gb | default(4) | int) > 4 and (system_ram_gb | default(4) | int) < 8 -%} 15
          {%- elif (system_ram_gb | default(4) | int) >= 8 and (system_ram_gb | default(4) | int) <= 16 -%} 20
          {%- else -%} 25
          {%- endif -%}
        calculated_mem_high: >
          {%- if (system_ram_gb | default(4) | int) <= 4 -%} 1.0G
          {%- elif (system_ram_gb | default(4) | int) > 4 and (system_ram_gb | default(4) | int) < 8 -%} 1.2G
          {%- elif (system_ram_gb | default(4) | int) >= 8 and (system_ram_gb | default(4) | int) <= 16 -%} 1.5G
          {%- else -%} 2.0G
          {%- endif -%}
        calculated_mem_max: >
          {%- if (system_ram_gb | default(4) | int) <= 4 -%} 1.2G
          {%- elif (system_ram_gb | default(4) | int) > 4 and (system_ram_gb | default(4) | int) < 8 -%} 1.5G
          {%- elif (system_ram_gb | default(4) | int) >= 8 and (system_ram_gb | default(4) | int) <= 16 -%} 2.0G
          {%- else -%} 3.0G
          {%- endif -%}
      register: clamav_override_state
      when: "not ansible_check_mode"
      notify: "Reload Active Systemd Core"
# =============================================================================
