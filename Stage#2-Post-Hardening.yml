            },
            "hardware_cognitive_topology": {
              "storage_media_type": "{{ 'MECHANICAL_HDD_PLATTER' if is_mechanical_drive | default(false) | bool else 'FLASH_CELL_SSD' }}",
              "system_ram_allocated_gb": {{ system_ram_gb | default(4) | int }},
              "chassis_form_factor": "{{ hardware_form_factor | default('STANDALONE NODE') | trim }}",
              "primary_active_hardware_interface": "{{ primary_network_interface | default('wls1') }}"
            },
            "disk_geometry_and_layout": {
              "boot_firmware_type": "{{ 'UEFI_SECURE_MODE' if is_uefi_mode | default(false) | bool else 'LEGACY_BIOS_ARCHITECTURE' }}",
              "root_filesystem_signature": "{{ 'BTRFS_SUBVOLUME_MATRIX' if is_btrfs_layout | default(true) | bool else 'TRADITIONAL_BLOCK_FILESYSTEM' }}",
              "persistent_root_uuid": "{{ active_root_uuid | default('') }}"
            },
            "applied_security_hardening_improvements": {
              "at_rest_storage_encryption": {{ root_disk_is_encrypted | default(true) | bool }},
              "bootloader_password_protected": {{ boot_password_is_protected | default(false) | bool }},
              "secure_vault_subvolume_active": {{ secure_vault_enabled | default(true) | bool }},
              "allocated_swap_footprint_mb": {{ target_formula_swap_mb | default(4096) | int }},
              "applied_memory_swappiness_tuning": {{ target_swappiness | default(10) | int }},
              "userland_oom_defense_engine": "{{ oom_engine_selection | default('earlyoom') }}"
            }
          }
      when: "not ansible_check_mode"
      become: true
# =============================================================================
# BLOCK 92: POST-HARDENING DEPLOYMENT ASYNCHRONOUS HANDLERS
# DESCRIPTION: Mounts low-overhead asynchronous execution queues to trigger
#              systemd unit reloads and kernel state refreshes when called.
# =============================================================================
  handlers:
    - name: "Reload Active Systemd Core"
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    - name: "Trigger Active System Kernel Flush"
      ansible.builtin.shell: "sysctl --system"
      args:
        executable: /bin/bash
      become: true

    - name: "Reload Firewalld Configuration"
      ansible.builtin.shell: "firewall-cmd --reload"
      args:
        executable: /bin/bash
      become: true

    - name: "Compile System Boot Configuration Matrix"
      ansible.builtin.shell: "{{ distro_matrix[ansible_facts['os_family']]['grub_compile_cmd'] | default('grub-mkconfig') }} -o {{ distro_matrix[ansible_facts['os_family']]['grub_config_bios'] | default('/boot/grub/grub.cfg') }}"
      args:
        executable: /bin/bash
      become: true
 
