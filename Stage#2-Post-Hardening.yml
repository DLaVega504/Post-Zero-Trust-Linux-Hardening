              "bootloader_password_protected": {{ boot_password_is_protected | bool }},
              "secure_vault_subvolume_active": {{ secure_vault_enabled | bool if (is_btrfs_layout | bool and not failsafe_runtime_only_mode | bool) else false }},
              "allocated_swap_footprint_mb": {{ target_formula_swap_mb | int }},
              "applied_memory_swappiness_tuning": {{ target_swappiness | int }},
              "userland_oom_defense_engine": "{{ oom_engine_selection }}"
            },
            "stage3_deployment_directives": {
              "established_compliance_tier": "{{ security_tier_grade | regex_replace('^[^A-Za-z0-9]*', '') | regex_replace('[^A-Za-z0-9 ]*$', '') | trim }}",
              "framework_operational_topology": "{{ 'STACKABLE_MODULAR_INTEGRATION' if stackable_mode | bool else 'AUTONOMOUS_STANDALONE_COMPLIANCE' }}"
            }
          }
      when: "not ansible_check_mode"
      become: true
# =============================================================================
# BLOCK 92: POST-HARDENING DEPLOYMENT ASYNCHRONOUS HANDLERS
# DESCRIPTION: Mounts low-overhead asynchronous execution queues to trigger
#              systemd unit reloads and kernel state refreshes when called.
# =============================================================================
  handlers:
    - name: "Reload Active Systemd Core"
      ansible.builtin.systemd:
        daemon_reload: true
      become: true

    - name: "Trigger Active System Kernel Flush"
      ansible.builtin.shell: "sysctl --system"
      args:
        executable: /bin/bash
      become: true

    - name: "Reload Firewalld Configuration"
      ansible.builtin.shell: "firewall-cmd --reload"
      args:
        executable: /bin/bash
      become: true

    - name: "Compile System Boot Configuration Matrix"
      ansible.builtin.shell: "{{ distro_matrix[ansible_facts['os_family']]['grub_compile_cmd'] | default('grub-mkconfig') }} -o {{ distro_matrix[ansible_facts['os_family']]['grub_config_bios'] | default('/boot/grub/grub.cfg') }}"
      args:
        executable: /bin/bash
      become: true
          
