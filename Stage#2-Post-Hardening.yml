# =============================================================================
# BLOCK 1: INITIAL PLAY METADATA & CONTROL LAYER VARIABLES
# DESCRIPTION: Establishes playbook destination, enforcement properties,
#              privilege parameters, and custom hardware target values.
# =============================================================================
---
- name: "Universal Zero-Trust Linux Hardening Framework"
  hosts: localhost
  connection: local
  become: true  
  gather_facts: true 
  vars:
    perf_mount_opts: "noatime,space_cache=v2,compress=zstd:1"
    security_architecture_profile: "pentagon"
    secure_vault_enabled: true
    vault_allocation_percentage: 20
    vault_maximum_guest_members: 3
    vault_minimum_size_threshold_gb: 15
    fail2ban_installed: true
    rkhunter_installed: false
    usbguard_installed: true
    arpwatch_installed: true
    snort_installed: true
    clamav_installed: true
    firewalld_native: true

# =============================================================================
# BLOCK 2: SYSTEM HARDWARE ASSESSMENT MATRIX
# DESCRIPTION: Sets hardware resource limits, thread thresholds,
#              and memory scaling properties based on infrastructure performance.
# =============================================================================
    hardware_profile_matrix:
      tier_1:
        swappiness: 150
        cpu_quota: 10
        mem_high: "1.0G"
        mem_max: "1.2G"
        max_threads: 2
      tier_2:
        swappiness: 100
        cpu_quota: 15
        mem_high: "1.2G"
        mem_max: "1.5G"
        max_threads: 4
      tier_3:
        swappiness: 100
        cpu_quota: 20
        mem_high: "1.5G"
        mem_max: "2.0G"
        max_threads: 8
      tier_4:
        swappiness: 10
        cpu_quota: 25
        mem_high: "2.0G"
        mem_max: "3.0G"
        max_threads: 16

# =============================================================================
# BLOCK 3: DISK PERFORMANCE BLUEPRINTS
# DESCRIPTION: Maps dynamic memory dirty ratios and drive scale pressures
#              for both solid state and spinning platter local block assets.
# =============================================================================
    hdd_matrix_blueprint:
      "150": { bg_ratio: 3,  ratio: 10, scale: 125 }
      "100": { bg_ratio: 5,  ratio: 15, scale: 100 }
      "10":  { bg_ratio: 10, ratio: 25, scale: 20  }

    ssd_matrix_blueprint:
      "150": { bg_ratio: 10, ratio: 20, scale: 10 }
      "100": { bg_ratio: 10, ratio: 20, scale: 10 }
      "10":  { bg_ratio: 15, ratio: 25, scale: 10 }

# =============================================================================
# BLOCK 4: DISTRO MATRIX STRUCTURE WITH CORE PLATFORM ARRAYS (PART 1)
# DESCRIPTION: Maps package strings, admin groups, and dynamic template hooks
#              directly to Archlinux and Debian systems to allow unified loops.
# =============================================================================
    distro_matrix:
      Archlinux:
        core_packages: ['sysstat', 'arpwatch', 'usbguard', 'clamav', 'aide', 'lynis', 'openssl-1.1', 'earlyoom', 'snort']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort@{{ primary_network_interface | default('wls1') }}.service"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav'
        aide_pkg: 'aide'
        admin_group: 'wheel'
        grub_compile_cmd: 'grub-mkconfig'
        grub_config_bios: '/boot/grub/grub.cfg'
      Debian:
        core_packages: ['fail2ban', 'sysstat', 'arpwatch', 'usbguard', 'clamav-daemon', 'aide', 'lynis', 'earlyoom']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort-init.service"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav-daemon'
        aide_pkg: 'aide'
        admin_group: 'sudo'
        grub_compile_cmd: 'update-grub'
        grub_config_bios: '/boot/grub/grub.cfg'

# =============================================================================
# BLOCK 5: DISTRO MATRIX STRUCTURE WITH CORE PLATFORM ARRAYS (PART 2)
# DESCRIPTION: Maps package strings, admin groups, and enterprise targets
#              directly to RedHat and Suse system environments cleanly.
# =============================================================================
      RedHat:
        core_packages: ['fail2ban', 'sysstat', 'arpwatch', 'usbguard', 'clamav', 'aide', 'lynis', 'earlyoom']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort3@{{ primary_network_interface | default('wls1') }}.service"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav'
        aide_pkg: 'aide'
        admin_group: 'wheel'
        grub_compile_cmd: 'grub2-mkconfig'
        grub_config_bios: '/boot/grub2/grub.cfg'
      Suse:
        core_packages: ['fail2ban', 'sysstat', 'arpwatch', 'usbguard', 'clamav', 'aide', 'lynis', 'libdaq', 'earlyoom']
        fail2ban_pkg: 'fail2ban'
        sysstat_pkg: 'sysstat'
        snort_pkg: 'snort'
        snort_service_name: "snort.service"
        arpwatch_pkg: 'arpwatch'
        usbguard_pkg: 'usbguard'
        rkhunter_pkg: 'rkhunter'
        clamav_pkg: 'clamav'
        aide_pkg: 'aide'
        admin_group: 'wheel'
        grub_compile_cmd: 'grub2-mkconfig'
        grub_config_bios: '/boot/grub2/grub.cfg'


# =============================================================================
# BLOCK 6: INITIAL TASKS TREE & PRE-FLIGHT SYSTEM HOOKS
# DESCRIPTION: Launches the tasks pipeline, initializes tracking states, and
#              probes for an existing Stage 1 certification fingerprint file.
# =============================================================================
  tasks:
    - name: "PRE-FLIGHT | STATE | Initialize system modification accumulator track"
      ansible.builtin.set_fact:
        system_was_modified: false

    - name: "PRE-FLIGHT | PROBE | Interrogate system for active Stage 1 Foundation Certificate"
      ansible.builtin.stat:
        path: "/etc/zero-trust-baseline.json"
      register: pre_flight_stage1_cert_check
      check_mode: false

    - name: "PRE-FLIGHT | NOTIFY | Render visual compliance track foundation confirmation"
      ansible.builtin.debug:
        msg: "{{ banner_content.split('\n') }}"
      vars:
        banner_content: |
          ======================================================================
          {% if pre_flight_stage1_cert_check.stat.exists | bool %}
             [ ✓ ] STAGE 1 FOUNDATION CERTIFICATE VERIFIED: INTEGRATION ARMED.
          {% else %}
                     [ ✓ ] AUTONOMOUS COMPLIANCE MODE DEPLOYED.
          {% endif %}
          ======================================================================

# =============================================================================
# BLOCK 7: DYNAMIC DEPENDENCIES & NETADDR BOOTSTRAPPING
# DESCRIPTION: Automates verification and installation of base execution tools,
#              python dependencies, and system modules across all package platforms.
# =============================================================================
    - name: "PRE-FLIGHT | Provision runtime environments and collections"
      ansible.builtin.raw: |
        if command -v ansible >/dev/null 2>&1 && \
           { command -v gdisk >/dev/null 2>&1 || command -v sgdisk >/dev/null 2>&1; } && \
           python3 -c "import netaddr" >/dev/null 2>&1 && \
           ansible-galaxy collection list 2>/dev/null | grep -q 'ansible.posix'; then
          echo "[+] SYSTEM VERIFICATION SUCCESSFUL: Pre-requisites satisfied."
          exit 0
        fi
        if command -v pacman >/dev/null 2>&1; then
          pacman -Sy --noconfirm
          pacman -S --noconfirm --needed python python-pip python-netaddr gptfdisk ansible
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -y
          apt-get install -y python3 python3-pip python3-netaddr gdisk ansible
        elif command -v dnf >/dev/null 2>&1; then
          dnf install -y python3 python3-pip python3-netaddr gdisk ansible --nogpgcheck
        elif command -v zypper >/dev/null 2>&1; then
          zypper --non-interactive install python3 python3-pip python3-netaddr gptfdisk ansible
        fi
        if ! python3 -c "import netaddr" >/dev/null 2>&1; then
          pip3 install netaddr --break-system-packages || pip3 install netaddr || true
        fi
        if ! ansible-galaxy collection list 2>/dev/null | grep -q 'ansible.posix'; then
          ansible-galaxy collection install ansible.posix --force-with-deps || true
        fi
      changed_when: false
      failed_when: false


# =============================================================================
# BLOCK 8: SAFE ENVIRONMENTAL SETUP REFRESH
# DESCRIPTION: Runs a clean fact discovery loop under safe permissions now that
#              foundational python-netaddr dependencies are system-wide.
# =============================================================================
    - name: "PRE-FLIGHT | Safely initialize system environment fact discovery loops"
      ansible.builtin.setup:
      become: false

    - name: "PRE-FLIGHT | PROVISIONING | Universally install core security package arrays across platforms"
      ansible.builtin.package:
        name: "{{ distro_matrix[ansible_facts['os_family']]['core_packages'] }}"
        state: present
      when: "not ansible_check_mode"

# =============================================================================
# BLOCK 9: BLACKARCH REPOSITORY SUBSTRATE SYNCHRONIZATION
# DESCRIPTION: Downloads, validates, and initializes secure BlackArch security
#              mirrors explicitly on detected Arch Linux platforms.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Bootstrapping BlackArch Cryptographic Mirror Substrates"
      ansible.builtin.shell: |
        set -euo pipefail
        if ! grep -q '\[blackarch\]' /etc/pacman.conf; then
          cd /tmp
          curl -O https://blackarch.org
          chmod +x strap.sh
          ./strap.sh
          rm -f strap.sh
          pacman -Syy --noconfirm
        fi
      args:
        executable: /bin/bash
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"

# =============================================================================
# BLOCK 10: PARU AUR WRAPPER BINARY DETECTIONS
# DESCRIPTION: Probes execution targets to isolate if the Paru compilation
#              wrapper tool is currently active on local system search paths.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Check if Paru binary is present on host execution paths"
      ansible.builtin.command: "which paru"
      register: local_paru_binary_probe
      failed_when: false
      changed_when: false
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "PRE-FLIGHT | ARCH | Verify if Tripwire package and configuration are present on disk"
      ansible.builtin.stat:
        path: "/etc/tripwire/tw.cfg"
      register: local_tripwire_config_probe
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "PRE-FLIGHT | ARCH | Set structural skip state fact for local package compilation matrices"
      ansible.builtin.set_fact:
        skip_tripwire_installation: "{{ true if (local_tripwire_config_probe.stat is defined and local_tripwire_config_probe.stat.exists | bool) else false }}"
      when: "ansible_facts['os_family'] == 'Archlinux'"

# =============================================================================
# BLOCK 11: UNPRIVILEGED AUR WRAPPER TRIPWIRE INSTALLATION
# DESCRIPTION: Leverages the discovered local Paru binary wrapper path to
#              natively pull down and deploy the AUR Tripwire package cleanly.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Ensure compiler dependencies are natively active"
      community.general.pacman:
        name: "openssl-1.1"
        state: present
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not skip_tripwire_installation | bool"
        - "not ansible_check_mode"

    - name: "PRE-FLIGHT | ARCH | Clone Tripwire repository via Paru wrapper"
      ansible.builtin.command: "paru -G tripwire-git"
      args:
        chdir: "/tmp"
        creates: "/tmp/tripwire-git/PKGBUILD"
      become: true
      become_user: "{{ primary_human_operator | default('vega') }}"
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not skip_tripwire_installation | bool"
        - "not ansible_check_mode"

    - name: "PRE-FLIGHT | ARCH | Compile Tripwire git package via native makepkg flags"
      ansible.builtin.command: "makepkg --noconfirm --needed"
      args:
        chdir: "/tmp/tripwire-git"
        creates: "/tmp/tripwire-git/*.pkg.tar.zst"
      become: true
      become_user: "{{ primary_human_operator | default('vega') }}"
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not skip_tripwire_installation | bool"
        - "not ansible_check_mode"

    - name: "PRE-FLIGHT | ARCH | Natively commit compiled AUR package to system files"
      ansible.builtin.shell: "pacman -U --noconfirm --needed /tmp/tripwire-git/tripwire-git-*.pkg.tar.zst"
      register: pacman_aur_install_result
      changed_when: "'up to date' not in pacman_aur_install_result.stdout"
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not skip_tripwire_installation | bool"
        - "not ansible_check_mode"

# =============================================================================
# BLOCK 12: PRIVILEGED ARCH LINUX COMPILATION INJECTIONS
# DESCRIPTION: Installs the required upstream compiler dependencies and source
#              code tools needed to build forensic and management layers.
# =============================================================================
    - name: "PRE-FLIGHT | ARCH | Inject development toolsets required for compilation"
      community.general.pacman:
        name:
          - base-devel
          - git
        state: present
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "local_paru_binary_probe.rc | default(1) != 0"
        - "not skip_tripwire_installation | bool"
        - "not ansible_check_mode"

# =============================================================================
# BLOCK 13: UNPRIVILEGED AUR TRIPWIRE PACKAGE COMPILATION MATRIX
# DESCRIPTION: Establishes a temporary permission-isolated build workspace
#              to pull, compile, and install the native Tripwire binary.
# ============================================================================
    - name: "AUR BUILD | Clone, compile, and deploy native system packages"
      ansible.builtin.shell: |
        set -euo pipefail
        cd /tmp
        rm -rf tripwire-build
        git clone https://archlinux.org tripwire-build
        cd tripwire-build
        makepkg -si --noconfirm
        cd /tmp
        rm -rf tripwire-build
      args:
        executable: /bin/bash
      become: true
      become_user: "{{ primary_human_operator | default('vega') }}"
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "local_paru_binary_probe.rc | default(1) != 0"
        - "not skip_tripwire_installation | bool"
        - "not ansible_check_mode"

# =============================================================================
# BLOCK 14: BOOT INFRASTRUCTURE LOCKDOWN DETECTIONS
# DESCRIPTION: Examines target system boot configuration matrices to discover
#              pre-existing, cryptographically secured password boundaries.
# =============================================================================
    - name: "PRE-FLIGHT | BOOT | Interrogate active system for existing bootloader password configurations"
      ansible.builtin.command: "grep -q 'ANSIBLE AUTONOMOUS BOOTLOADER PASSWORD BLOCK' /etc/grub.d/40_custom"
      register: pre_flight_grub_password_check
      failed_when: false
      changed_when: false
      become: true

# =============================================================================
# BLOCK 15: DISK GEOMETRY & ROOT CONFIGURATION INSPECTION
# DESCRIPTION: Probes underlying block devices, active device-mapper links,
#              and mount targets to resolve root storage type attributes.
# =============================================================================
    - name: "SCAN | INTERROGATION | Query true device mapping layer type for active root partition"
      ansible.builtin.shell: |
        set -o pipefail
        ROOT_BLOCK=$(findmnt -n -o SOURCE /)
        lsblk -no TYPE "$ROOT_BLOCK" | head -n 1 | tr -d '[:space:]'
      args:
        executable: /bin/bash
      register: live_root_block_type_probe
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | INSPECTION | Interrogate system block tree for any active device mapper maps"
      ansible.builtin.stat:
        path: "/dev/mapper/root"
      register: live_root_mapper_device_check
      check_mode: false

# =============================================================================
# BLOCK 16: SECURITY AUDIT SCORES HISTORY METRIC PARSING
# DESCRIPTION: Audits block filesystems to identify pre-existing, cached
#              historical baseline metrics for Lynis assessment sequences.
# =============================================================================
    - name: "PRE-FLIGHT | AUDIT | Check disk for local cached Lynis metrics"
      ansible.builtin.stat:
        path: "/var/cache/lynis/pre_score.metric"
      register: pre_flight_lynis_cache_check
      check_mode: false

    - name: "PRE-FLIGHT | AUDIT | Parse existing Lynis metric into runtime memory if cache hit"
      ansible.builtin.slurp:
        src: "/var/cache/lynis/pre_score.metric"
      register: raw_cached_lynis_score
      when: "pre_flight_lynis_cache_check.stat.exists | bool"

    - name: "PRE-FLIGHT | AUDIT | Check disk for local cached final post-hardening metrics"
      ansible.builtin.stat:
        path: "/var/cache/lynis/post_score.metric"
      register: post_flight_lynis_cache_check
      check_mode: false

    - name: "PRE-FLIGHT | AUDIT | Parse existing post-hardening metric into runtime memory if cache hit"
      ansible.builtin.slurp:
        src: "/var/cache/lynis/post_score.metric"
      register: raw_cached_lynis_post_score
      when: "post_flight_lynis_cache_check.stat.exists | bool"

# =============================================================================
# BLOCK 17: COMPLIANCE STATE ATTRIBUTE SYNTHESIS
# DESCRIPTION: Consolidates discovered encryption hooks, boot metadata, cache
#              records, and certificate facts into static runtime memories.
# =============================================================================
    - name: "PRE-FLIGHT | STATE | Synthesize and lock baseline architectural facts"
      ansible.builtin.set_fact:
        stage1_foundation_active: "{{ pre_flight_stage1_cert_check.stat.exists | bool }}"
        boot_password_is_protected: "{{ true if pre_flight_grub_password_check.rc == 0 else false }}"
        root_disk_is_encrypted: "{{ true if (live_root_block_type_probe.stdout | trim == 'crypt' or live_root_mapper_device_check.stat.exists | bool) else false }}"
        lynis_cache_available: "{{ pre_flight_lynis_cache_check.stat.exists | bool }}"
        dynamic_pre_score: "{{ (raw_cached_lynis_score.content | b64decode | trim | int) if pre_flight_lynis_cache_check.stat.exists | bool else 65 }}"
        dynamic_post_score_cached: "{{ (raw_cached_lynis_post_score.content | b64decode | trim | int) if post_flight_lynis_cache_check.stat.exists | bool else None }}"

# =============================================================================
# BLOCK 18: DISK GEOMETRY & FIRMWARE INTERROGATION (REPOSITIONED SCAN CORES)
# DESCRIPTION: Probes underlying block devices, active firmware links,
#              and mount targets to resolve storage formatting signatures.
# =============================================================================
    - name: "SCAN | Probe motherboard boot firmware directory existence"
      ansible.builtin.stat:
        path: "/sys/firmware/efi"
      register: efi_directory_check

    - name: "SCAN | Detect active root filesystem source device handle"
      ansible.builtin.shell: |
        set -o pipefail
        findmnt -n -o SOURCE / | awk '{print $1}' | cut -d'[' -f1
      args:
        executable: /bin/bash
      register: root_source_device
      changed_when: false
      check_mode: false

    - name: "SCAN | Detect active boot partition source device handle"
      ansible.builtin.shell: |
        set -o pipefail
        ROOT_RAW=$(findmnt -n -o SOURCE /)
        BOOT_RAW=$(findmnt -n -o SOURCE /boot || echo "nested")

        if [ "$BOOT_RAW" = "nested" ] || [ "$BOOT_RAW" = "$ROOT_RAW" ]; then
            echo "nested"
        else
            ROOT_PARENT=$(lsblk -dno PKNAME "$ROOT_RAW" 2>/dev/null || echo "crypt")
            BOOT_PARENT=$(lsblk -dno PKNAME "$BOOT_RAW" 2>/dev/null || echo "boot")
            if [ "$ROOT_PARENT" = "$BOOT_PARENT" ] || [ -d "/sys/firmware/efi" ]; then
                echo "separate"
            else
                echo "separate"
            fi
        fi
      args:
        executable: /bin/bash
      register: boot_source_device
      changed_when: false
      check_mode: false

    - name: "SCAN | Detect active root filesystem type format signature"
      ansible.builtin.shell: |
        findmnt -n -o FSTYPE /
      register: root_fs_signature
      changed_when: false
      check_mode: false
# =============================================================================
# BLOCK 19: STANDALONE BOOT SECURITY PROMPT INTERFACES (FORCE INTERACTIVE GATE)
# DESCRIPTION: Pauses execution to securely prompt for a master boot passphrase
#              on unprotected nodes, generating clean PBKDF2 hash structures.
# =============================================================================
    - name: "BOOT | SECURITY GATE | Securely prompt for master passphrase on unprotected standalone nodes"
      ansible.builtin.pause:
        prompt: |
          ======================================================================
          [ 🔒 ZERO-TRUST AUTONOMOUS INITIALIZATION PASS-GATE ]
          ======================================================================
          Stage 1 base-layer certificate was not detected on this system.
          The bootloader partition is currently wide open and unprotected.

          [?] Enter a master security passphrase to cryptographically lock down
              the GRUB bootloader matrix parameters:
          ======================================================================
        echo: false
      register: front_loaded_standalone_passphrase
      become: false
      when:
        - "computed_architecture_profile | default('fortress') == 'fortress'"
        - "not boot_password_is_protected | default(false) | bool"

    - name: "BOOT Hardening | AUTOMATION ENGINE | Non-interactively compile cryptographic PBKDF2 hash payload"
      ansible.builtin.shell: |
        set -o pipefail
        echo -e "{{ front_loaded_standalone_passphrase.user_input }}\n{{ front_loaded_standalone_passphrase.user_input }}" | grub-mkpasswd-pbkdf2 | awk -F' ' '{print $NF}' | tail -n1 | tr -d '\n'
      register: calculated_standalone_grub_hash
      no_log: true
      when:
        - "computed_architecture_profile | default('fortress') == 'fortress'"
        - "not boot_password_is_protected | default(false) | bool"
        - "front_loaded_standalone_passphrase.user_input is defined"
        - "front_loaded_standalone_passphrase.user_input | length > 0"

# =============================================================================
# BLOCK 20A: BOOT CONFIGURATION HARDENING INJECTIONS
# DESCRIPTION: Commits generated superuser restrictions and password blocks
#              directly into custom boot configs to prevent edit bypasses.
# =============================================================================
    - name: "BOOT HARDENING | INJECTION | Commit secure master credentials into user customized parameters"
      ansible.builtin.blockinfile:
        path: "/etc/grub.d/40_custom"
        marker: "# {mark} ANSIBLE AUTONOMOUS BOOTLOADER PASSWORD BLOCK"
        block: |
          set superusers="root"
          password_pbkdf2 root {{ calculated_standalone_grub_hash.stdout | default('') }}
      when:
        - "autonomous_standalone_mode | default(true) | bool"
        - "not boot_password_is_protected | default(false) | bool"
        - "computed_architecture_profile | default('fortress') != 'pentagon'"
        - "calculated_standalone_grub_hash.stdout is defined"
        - "calculated_standalone_grub_hash.stdout | length > 0"
      register: grub_custom_file_state
# =============================================================================
# BLOCK 21-B: COMPLIANCE STATE MACHINE & VISUAL MONITOR ACCUMULATORS
# DESCRIPTION: Evaluates gathered firmware parameters and registered hardware
#              facts to dynamically compute 3-tier architecture setup profiles.
# =============================================================================
    - name: "PRE-FLIGHT | FACT SYNTHESIS | Calculate primary hardware attributes"
      ansible.builtin.set_fact:
        root_disk_is_encrypted: true

    - name: "PRE-FLIGHT | STATE | Calculate state-machine compliance mode tracks"
      ansible.builtin.set_fact:
        compliance_track_level_3: "{{ pre_flight_stage1_cert_check.stat.exists | bool }}"
        compliance_retrospective_level_1: "{{ not pre_flight_stage1_cert_check.stat.exists | bool and boot_password_is_protected | bool and root_disk_is_encrypted | bool }}"
        failsafe_runtime_only_mode: "{{ not pre_flight_stage1_cert_check.stat.exists | bool and not root_disk_is_encrypted | bool }}"
        stackable_mode: "{{ pre_flight_stage1_cert_check.stat.exists | bool }}"
        autonomous_standalone_mode: "{{ not pre_flight_stage1_cert_check.stat.exists | bool }}"
        detected_admin_group: "{{ 'sudo' if ansible_facts['os_family'] == 'Debian' else 'wheel' }}"

    - name: "RECONNAISSANCE | HUMAN IDENTITY | Scan administrative groups to discover primary human user"
      ansible.builtin.shell: |
        set -o pipefail
        getent group "{{ detected_admin_group }}" | cut -d: -f4 | tr ',' '\n' | grep -v -E '^(root|)$' | head -n1 || getent passwd 1000 | cut -d: -f1 || echo 'vega'
      args:
        executable: /bin/bash
      register: human_operator_probe
      changed_when: false
      check_mode: false

    - name: "RECONNAISSANCE | STATE | Lock dynamic human operator system facts"
      ansible.builtin.set_fact:
        primary_human_operator: "{{ human_operator_probe.stdout | trim | default('vega') }}"

    - name: "RECONNAISSANCE | STATE | Calculate adaptive 3-tier architecture setup classification profile"
      ansible.builtin.set_fact:
        computed_architecture_profile: >-
          {%- if pre_flight_stage1_cert_check.stat.exists | bool -%}
            {{ security_architecture_profile }}
          {%- elif boot_source_device.stdout | trim == 'separate' -%}
            fortress
          {%- elif boot_source_device.stdout | trim == 'nested' -%}
            pentagon
          {%- else -%}
            custom
          {%- endif -%}
# =============================================================================
# BLOCK 22: HARDWARE CONTROLLER & NETWORK ENVIRONMENT DEPLOYMENTS
# DESCRIPTION: Resolves persistent UUIDs, mkinitcpio hook files, storage media
#              rotation metrics, and home local area network boundaries.
# =============================================================================
    - name: "SCAN | Discover absolute persistent root device UUID"
      ansible.builtin.shell: "blkid -s UUID -o value {{ root_source_device.stdout | default('/dev/null') }}"
      register: live_root_uuid
      changed_when: false
      check_mode: false

    - name: "SCAN | Read active initramfs hook parameters cleanly"
      ansible.builtin.slurp:
        src: "/etc/mkinitcpio.conf"
      register: raw_mkinitcpio
      failed_when: false
      when: "ansible_facts['os_family'] == 'Archlinux'"

    - name: "SCAN | Detect drive media rotation profiles directly from hardware controller"
      ansible.builtin.shell: |
        set -euo pipefail
        ROOT_RAW=$(findmnt -n -o SOURCE / | cut -d'[' -f1)
        if [[ "${ROOT_RAW}" == /dev/mapper/* ]]; then
            MAPPER_NAME=$(basename "${ROOT_RAW}")
            if [ -f "/sys/class/block/${MAPPER_NAME}/slaves/"* ]; then
                REAL_DISK=$(basename "$(ls -d /sys/class/block/${MAPPER_NAME}/slaves/* | head -n1)")
            else
                REAL_DISK=""
            fi
        else
            REAL_DISK=$(lsblk -dno PKNAME "${ROOT_RAW}" | tr -d '[:space:]' || echo "")
        fi
        if [ -n "${REAL_DISK}" ] && [ -f "/sys/block/${REAL_DISK}/queue/rotational" ]; then
            cat "/sys/block/${REAL_DISK}/queue/rotational"
        else
            echo "1"
        fi
      args:
        executable: /bin/bash
      register: host_disk_rotation_raw
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | Extract active CIDR address spectrum directly from running hardware interface"
      ansible.builtin.shell: |
        set -o pipefail
        ip -o -f inet addr show | awk '$2 !~ /lo|virbr|docker/ {print $4}' | head -n1
      args:
        executable: /bin/bash
      register: live_active_cidr_raw
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | DYNAMIC | Isolate all unmapped and candidate vault block partitions"
      ansible.builtin.shell: |
        set -o pipefail
        ROOT_RAW=$(findmnt -n -o SOURCE / | cut -d'[' -f1)
        if [[ "${ROOT_RAW}" == /dev/mapper/* ]]; then
            MAPPER_NAME=$(basename "${ROOT_RAW}")
            ROOT_PARENT=$(basename "$(ls -d /sys/class/block/${MAPPER_NAME}/slaves/* | head -n1)" | grep -oE '^[a-z]+')
        else
            ROOT_PARENT=$(lsblk -no PKNAME "${ROOT_RAW}" | head -n1 | tr -d '[:space:]')
        fi
        if [ -z "${ROOT_PARENT}" ]; then
            ROOT_PARENT="unresolved_parent"
        fi
        lsblk -rno NAME,TYPE,MOUNTPOINT | awk -v rparent="${ROOT_PARENT}" '
          $2 == "part" && $3 == "" { print "/dev/" $1 }
          $2 == "part" && $3 ~ /^\/@vault/ { print "/dev/" $1 }
        ' | grep -E "^/dev/${ROOT_PARENT}" || true
      args:
        executable: /bin/bash
      register: local_unmapped_partitions_probe
      failed_when: false
      changed_when: false
      check_mode: false

    - name: "SCAN | DYNAMIC | Probe candidate partitions for cryptographic and file signatures"
      ansible.builtin.shell: |
        set -o pipefail
        TYPE_SIG=$(blkid -p -o value -s TYPE "{{ item }}" 2>/dev/null || echo "BLANK")
        echo "{{ item }}:${TYPE_SIG}"
      args:
        executable: /bin/bash
      loop: "{{ local_unmapped_partitions_probe.stdout_lines | default([]) }}"
      register: candidate_vault_signatures_probe
      changed_when: false
      failed_when: false
      check_mode: false
# =============================================================================
# BLOCK 23: HARDWARE LAYER ENVIRONMENT BOUNDARY SYNTHESIS
# DESCRIPTION: Sanitizes the active network range boundaries using fallback
#              protection rules, and evaluates core chassis role parameters.
# =============================================================================
    - name: "SCAN | STATE | Calculate true local base network subnet boundary block"
      ansible.builtin.set_fact:
        dynamic_home_net: >-
          {%- set raw_ip = live_active_cidr_raw.stdout | default('') | trim -%}
          {%- if '/' in raw_ip -%}
            {{ raw_ip | ansible.utils.ipsubnet }}
          {%- else -%}
            192.168.1.0/24
          {%- endif -%}
      failed_when: false

    - name: "SCAN | Synthesize virtualization and media profiles"
      ansible.builtin.set_fact:
        is_mechanical_drive: "{{ true if (host_disk_rotation_raw.stdout is defined and host_disk_rotation_raw.stdout | trim == '1') else false }}"
        is_virtual_machine: "{{ true if (ansible_facts['virtualization_role'] | default('host') == 'guest') else false }}"

    - name: "SCAN | Discover primary human installation user identity (UID 1000)"
      ansible.builtin.shell: "getent passwd 1000 | cut -d: -f1"
      register: primary_owner_discovered
      changed_when: false
      check_mode: false

    - name: "SCAN | Probe system power rail for lithium-ion battery nodes"
      ansible.builtin.stat:
        path: "/sys/class/power_supply/BAT0"
      register: battery_node_check

    - name: "SCAN | Read raw DMI motherboard hardware chassis type integer"
      ansible.builtin.slurp:
        src: "/sys/class/dmi/id/chassis_type"
      register: raw_dmi_chassis_id
      failed_when: false

# =============================================================================
# BLOCK 24: HARDWARE CORE FORM-FACTOR SPECS COMPUTATION
# DESCRIPTION: Computes and translates raw DMI chassis configurations into
#              unambiguous, structural platform target form factors.
# =============================================================================
    - name: "SCAN | Synthesize translated hardware form-factor profile facts"
      ansible.builtin.set_fact:
        hardware_form_factor: >-
          {%- set chassis_int = (raw_dmi_chassis_id['content'] | b64decode | replace('\n', '') | trim | int) if (raw_dmi_chassis_id.content is defined and raw_dmi_chassis_id.content) else 0 -%}
          {%- if battery_node_check.stat.exists or chassis_int in [8, 9, 10, 14] -%}
          LAPTOP / PORTABLE WORKSTATION
          {%- elif chassis_int in [3, 4, 5, 6, 7, 15, 16] -%}
          DESKTOP / FIXED SECURE STATION
          {%- elif chassis_int in [23, 17, 25] or (ansible_facts['processor_vcpus'] | default(2) | int) > 16 -%}
          ENTERPRISE HARDENED SERVER BLADE
          {%- else -%}
          STANDALONE COMPUTING NODE (FORM-FACTOR UNKNOWN)
          {%- endif -%}
# =============================================================================
# BLOCK 25: COGNITIVE SPECIFICATION FACT SYNTHESIS (FIXED SWAP FORMULA MATH)
# DESCRIPTION: Calculates dynamic swappiness values, compression algorithms,
#              oom engines, and partitions subvolume paths into active facts.
# =============================================================================
    - name: "SCAN | Synthesize primary system hardware and layout facts"
      ansible.builtin.set_fact:
        system_ram_gb: "{{ ((ansible_facts['memtotal_mb'] | default(4096) | int) / 1024) | round(0, 'common') | int }}"
        oom_engine_selection: "{{ 'earlyoom' if ((ansible_facts['memtotal_mb'] | default(4096) | int) < 8192) else 'systemd-oomd' }}"
        target_compression: "{{ 'lz4' if ((ansible_facts['memtotal_mb'] | default(4096) | int) < 8192) else 'zstd' }}"
        target_swappiness: >-
          {%- if (ansible_facts['memtotal_mb'] | default(4096) | int) > 16384 -%} 10
          {%- elif (ansible_facts['memtotal_mb'] | default(4096) | int) <= 7168 -%} 150
          {%- else -%} 100
          {%- endif -%}
        target_formula_swap_mb: >-
          {%- if (ansible_facts['memtotal_mb'] | default(4096) | int) <= 7168 -%}
            {{ (ansible_facts['memtotal_mb'] | default(4096) | int) * 2 }}
          {%- elif (ansible_facts['memtotal_mb'] | default(4096) | int) > 16384 -%}
            4096
          {%- else -%}
            {{ (ansible_facts['memtotal_mb'] | default(4096) | int) + 3072 }}
          {%- endif -%}
        is_uefi_mode: "{{ efi_directory_check.stat.exists | bool if efi_directory_check.stat is defined else false }}"
        is_btrfs_layout: true
        active_root_uuid: "{{ live_root_uuid.stdout | default('unresolved') | trim }}"
        discovered_primary_user: "{{ primary_human_operator }}"

    - name: "RECONNAISSANCE | DATA | Ingest multi-distro translation matrix blueprint"
      ansible.builtin.include_vars:
        file: "vars_mapping.yml"

    - name: "RECONNAISSANCE | STATE | Map host-specific active subvolume profile ledger"
      ansible.builtin.set_fact:
        active_distro_subvolumes: >-
          {%- if ansible_facts['distribution'] == 'Fedora' -%}{{ fedora_vars.subvolumes }}
          {%- elif ansible_facts['os_family'] == 'Archlinux' -%}{{ arch_vars.subvolumes }}
          {%- elif ansible_facts['os_family'] == 'Debian' -%}{{ debian_vars.subvolumes }}
          {%- elif ansible_facts['os_family'] == 'Suse' -%}{{ suse_vars.subvolumes }}
          {%- else -%}{{ arch_vars.subvolumes }}
          {%- endif -%}

    - name: "RECONNAISSANCE | STATE | Enforce single-disk vault anti-collision logic"
      ansible.builtin.set_fact:
        secure_vault_enabled: false
      when: >
        (vault_partition_handle is defined and (vault_partition_handle == '/dev/sda2' or vault_partition_handle == (root_source_device.stdout | trim))) or
        (final_vault_configs is defined and (final_vault_configs | selectattr('path', 'equalto', (root_source_device.stdout | trim)) | list | length > 0))
# =============================================================================
# BLOCK 26: DYNAMIC NETWORK INTERFACE RESOLUTION SCANS
# DESCRIPTION: Queries active interface structures to dynamically locate the optimal
#              hardware card matching the target node chassis type context.
# =============================================================================
    - name: "SCAN | DYNAMIC | Intelligently extract active network interface matching chassis form factor"
      ansible.builtin.shell: |
        set -o pipefail
        FORM_FACTOR="{{ hardware_form_factor | trim }}"
        IS_VM="{{ is_virtual_machine | bool }}"
        IFACES=$(ip -br link show | awk '$3 ~ /UP/ && $1 !~ /lo|virbr|docker|proton|pvpn/ {print $1}')
        if [ "$IS_VM" = "true" ]; then
            echo "$IFACES" | grep -E '^(eth|en|vnet)' | head -n1 || echo "$IFACES" | head -n1
        elif [[ "$FORM_FACTOR" =~ "LAPTOP" ]]; then
            echo "$IFACES" | grep -E '^(wlan|wl)' | head -n1 || echo "$IFACES" | grep -E '^(en|eth)' | head -n1 || echo "$IFACES" | head -n1
        else
            echo "$IFACES" | grep -E '^(en|eth)' | head -n1 || echo "$IFACES" | head -n1
        fi
      args:
        executable: /bin/bash
      register: optimized_hardware_interface_probe
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SCAN | STATE | Lock dynamic hardware-intelligent network variables for tools"
      ansible.builtin.set_fact:
        primary_network_interface: "{{ optimized_hardware_interface_probe.stdout | trim | default('wls1', true) }}"

# =============================================================================
# BLOCK 27: SWAP HARDENING PARTITION RECONNAISSANCE & FORMULA SCANS
# DESCRIPTION: Investigates active memory maps, strictly filters out virtual
#              ZRAM handles, and enforces dynamic fallback allocations.
# =============================================================================
    - name: "SWAP HARDENING | RECONNAISSANCE | Discover physical non-zram raw swap partition segments"
      ansible.builtin.shell: |
        set -o pipefail
        swapon --show=NAME,TYPE | grep -v 'zram' | awk '$2 == "partition" {print $1}' | head -n1 || echo ""
      args:
        executable: /bin/bash
      register: target_physical_swap_handle
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "SWAP HARDENING | STATE | Compile mutually exclusive partition tracking variables"
      ansible.builtin.set_fact:
        has_swap_partition: "{{ true if (target_physical_swap_handle.stdout is defined and target_physical_swap_handle.stdout | trim | length > 0) else false }}"

    - name: "SWAP HARDENING | SANITIZATION | Purge legacy proto-swap lines from crypttab completely"
      ansible.builtin.lineinfile:
        path: "/etc/crypttab"
        regexp: '^.*swap_(ssd|vault).*$'
        state: absent
      when: "not ansible_check_mode"

    - name: "SWAP HARDENING | SANITIZATION | Purge legacy proto-swap entries from permanent fstab blocks"
      ansible.builtin.lineinfile:
        path: "/etc/fstab"
        regexp: '^.*/dev/mapper/swap_(ssd|vault).*$'
        state: absent
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 27-A: INFRASTRUCTURE HARDWARE ARCHITECTURE DIAGNOSTIC SUMMARY
# DESCRIPTION: Compiles all scanned host topography traits, partition layouts,
#              network adapters, and memory metrics into an informational ledger.
# =============================================================================
    - name: "SCAN REPORT | TELEMETRY | Render detected hardware configuration overview metrics"
      ansible.builtin.debug:
        msg: "{{ blueprint_summary.split('\n') }}"
      vars:
        blueprint_summary: |
          =======================================================================================
          🔬 ZERO-TRUST HARDWARE ARCHITECTURE RECONNAISSANCE SCAN COMPLETE
          =======================================================================================
          📋 HOST PLATFORM PROVENANCE PROFILE:
            ↳ DETECTED OPERATING SYSTEM  : [ {{ ansible_facts['distribution'] | default(ansible_facts['os_family']) | upper }} ]
            ↳ TARGET SYSTEM DISTRIBUTION : [ {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} ]
            ↳ RESOLVED COMPLIANCE TRACK  : [ {{ 'STACKABLE_MODULAR_INTEGRATION' if stackable_mode | bool else 'AUTONOMOUS_STANDALONE_COMPLIANCE' }} ]
            ↳ COMPUTED SETUP PROFILE     : [ {{ computed_architecture_profile | upper }} CONFIGURATION ]
          =======================================================================================
          🎛️ COGNITIVE HARDWARE SPECIFICATION MATRIX:
            ↳ HARDWARE FORM-FACTOR CORE  : [ {{ hardware_form_factor | default('STANDALONE COMPUTING NODE') | trim }} ]
            ↳ DETECTED DRIVE MEDIA CLASS : [ {{ 'MECHANICAL_HDD_PLATTER' if is_mechanical_drive | bool else 'FLASH_CELL_SSD' }} ]
            ↳ TOTAL ALLOCATED NODE RAM   : [ {{ system_ram_gb | int }} GB total capacity ]
            ↳ INTERFACES DETECTED TO USE : [ {{ primary_network_interface | default('wls1') }} ]
            ↳ HOMENET RANGE CIDR BLOCK   : [ {{ dynamic_home_net | default('192.168.1.0/24') }} ]
          =======================================================================================
          💾 DISK GEOMETRY & PERMANENT PARTITION MAPS:
            ↳ BOOT FIRMWARE LAYOUT TYPE  : [ {{ 'UEFI_SECURE_MODE' if is_uefi_mode | bool else 'LEGACY_BIOS_ARCHITECTURE' }} ]
            ↳ BOOT SECURITY POSTURE CODE : [ {{ 'PROTECTED (NESTED INSIDE MAIN OS CRYPT ENVELOPE)' if computed_architecture_profile == 'pentagon' else '⚠️  UNPROTECTED (SEPARATE HARDWARE PARTITION OUTSIDE FDE COVERAGE)' }} ]
            ↳ ROOT FORMATTING SIGNATURE  : [ {{ 'BTRFS_SUBVOLUME_MATRIX' if is_btrfs_layout | bool else 'TRADITIONAL_BLOCK_FILESYSTEM' }} ]
            ↳ PERSISTENT ACTIVE ROOT UUID: [ {{ active_root_uuid | default('unresolved') }} ]
            ↳ AT-REST ENCRYPTION SHIELD  : [ {{ 'ACTIVE LUKS WRAPPER MAPPED' if root_disk_is_encrypted | bool else '⚠️  UNENCRYPTED DISK STORAGE PROFILE' }} ]
          =======================================================================================
          🧠 VIRTUAL & PHYSICAL RECONNAISSANCE MEMORY MATRIX:
            ↳ SYSTEM HARWARE SWAP STATUS : [ {% if has_swap_partition | bool %}ACTIVE RAW PARTITION (DEVICE: {{ target_physical_swap_handle.stdout | trim }}){% elif target_swapfile_check.stat is defined and target_swapfile_check.stat.exists | bool %}ACTIVE FALLBACK SWAPFILE (PATH: /swap/swapfile){% else %}🚨 CRITICAL RISK: SWAP MISSING IN ANY FORM (NO PARTITION OR SWAPFILE DETECTED){% endif %} ]
            ↳ RESOLVED SWAP CAPACITY SIZE: [ {% if has_swap_partition | bool or (target_swapfile_check.stat is defined and target_swapfile_check.stat.exists | bool) %}{{ target_formula_swap_mb | int }} MB ALLOCATED MATRIX{% else %}0 MB - INSTANT KERNEL COLD-LOCK RISK UNDER INTENSE MEMORY PRESSURES{% endif %} ]
          =======================================================================================
          ⚙️ DYNAMIC KERNEL PERFORMANCE ESTIMATIONS:
            ↳ CHOSEN USERLAND OOM ENGINE : [ {{ oom_engine_selection | upper }} DAEMON CONTAINER ]
            ↳ COMPRESSION ALGORITHM TYPE : [ {{ target_compression | upper }} RUNTIME CACHE PRESSURE ]
            ↳ ENFORCED SWAPPINESS CLAMP  : [ vm.swappiness = {{ target_swappiness | int }} ]
          =======================================================================================
# =============================================================================
# BLOCK 28-A: BTRFS TOPOLOGY COMPLIANCE AUDIT ENGINE
# DESCRIPTION: Mounts top-level parent pool ID 5 universally to execute
#              distribution-aware layout verification and state corrections.
# =============================================================================
    - name: "STORAGE | AUDIT | Mount raw parent pool ID 5 for structure validation"
      ansible.builtin.shell: |
        mkdir -p /tmp/btrfs_stage2_verification
        mount -o subvolid=5 {{ root_source_device.stdout | default('/dev/sda1') }} /tmp/btrfs_stage2_verification
      changed_when: false
      when:
        - "is_btrfs_layout | bool"
        - "not ansible_check_mode"

    - name: "STORAGE | RECONCILIATION | Declaratively force subvolume layout synchronization"
      ansible.builtin.shell: |
        set -euo pipefail
        POOL="/tmp/btrfs_stage2_verification"
        TARGET_NAME="{{ item.name }}"
        SECURE_VAULT_ENABLED="{{ 'true' if secure_vault_enabled | bool else 'false' }}"
        OS_FAMILY="{{ ansible_facts['os_family'] }}"
        DISTRO="{{ ansible_facts['distribution'] }}"

        if [ -d "$POOL/$TARGET_NAME" ] && ! btrfs subvolume show "$POOL/$TARGET_NAME" >/dev/null 2>&1; then
            mv "$POOL/$TARGET_NAME" "$POOL/${TARGET_NAME}_legacy_backup"
        fi

        if [ ! -d "$POOL/$TARGET_NAME" ]; then
            mkdir -p "$(dirname "$POOL/$TARGET_NAME")"
            btrfs subvolume create "$POOL/$TARGET_NAME"
            if [ -d "$POOL/${TARGET_NAME}_legacy_backup" ]; then
                cp -a "$POOL/${TARGET_NAME}_legacy_backup/." "$POOL/$TARGET_NAME/" || true
                rm -rf "$POOL/${TARGET_NAME}_legacy_backup"
            fi
        fi

        if [ "$SECURE_VAULT_ENABLED" = "true" ] && ([ "$TARGET_NAME" = "@" ] || [ "$TARGET_NAME" = "root" ]); then
            if [ "$OS_FAMILY" = "Suse" ] && [ ! -d "$POOL/@/vault" ]; then
                btrfs subvolume create "$POOL/@/vault"
            elif [ "$DISTRO" = "Fedora" ] && [ ! -d "$POOL/root/vault" ]; then
                btrfs subvolume create "$POOL/root/vault"
            elif [ ! -d "$POOL/@secure" ] && [ "$OS_FAMILY" != "Suse" ] && [ "$DISTRO" != "Fedora" ]; then
                btrfs subvolume create "$POOL/@secure"
            fi
        fi
      args:
        executable: /bin/bash
      loop: "{{ active_distro_subvolumes }}"
      register: topo_sync_status
      changed_when: topo_sync_status.rc == 0
      when:
        - "is_btrfs_layout | bool"
        - "not ansible_check_mode"
        - "item.dest != '/'"
        - "item.dest != '/home'"
        - "item.dest != '/swap' or not has_swap_partition | bool"

    - name: "STORAGE | AUDIT | Clean system verification mounts"
      ansible.builtin.shell: "umount /tmp/btrfs_stage2_verification && rmdir /tmp/btrfs_stage2_verification"
      changed_when: false
      failed_when: false
      when:
        - "is_btrfs_layout | bool"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 28-B: TARGET MOUNT POINT DIRECTORY PRE-CREATION
# DESCRIPTION: Drops the required physical directory anchors directly into the
#              running filesystem path before launching mount configurations.
# =============================================================================
    - name: "STORAGE | PRE-FLIGHT | Enforce presence of folder target anchors"
      ansible.builtin.file:
        path: "{{ item.dest }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop: "{{ active_distro_subvolumes }}"
      when:
        - "is_btrfs_layout | bool"
        - "not ansible_check_mode"
        - "item.dest != '/'"
        - "item.dest != '/swap' or not has_swap_partition | bool"

# =============================================================================
# BLOCK 28i-C: CRYPT-MAPPED VOLATILE SOLID STATE SWAP ARCHITECTURE
# DESCRIPTION: Enforces transient random-keyed encryption over physical block
#              swap layouts tailored directly to HDD, VM, or SSD profiles.
# =============================================================================
    - name: "SWAP HARDENING | Deploy hardware-aware transient encryption layout to crypttab"
      ansible.builtin.lineinfile:
        path: "/etc/crypttab"
        line: >-
          {%- if is_virtual_machine | bool -%}
            swap_vault {{ target_physical_swap_handle.stdout | trim }} /dev/urandom swap,cipher=aes-xts-plain64,size=256,hash=sha256
          {%- elif is_mechanical_drive | bool -%}
            swap_vault {{ target_physical_swap_handle.stdout | trim }} /dev/urandom swap,cipher=aes-xts-plain64,size=256,hash=sha256
          {%- else -%}
            swap_vault {{ target_physical_swap_handle.stdout | trim }} /dev/urandom swap,cipher=aes-xts-plain64,size=256,hash=sha256,discard
          {%- endif -%}
        state: present
      when:
        - "has_swap_partition | bool"
        - "not failsafe_runtime_only_mode | bool"
        - "not ansible_check_mode"

    - name: "SWAP HARDENING | Append crypt-mapped execution endpoints to fstab matrices"
      ansible.builtin.lineinfile:
        path: "/etc/fstab"
        line: "/dev/mapper/swap_vault none swap defaults,pri=10 0 0"
        state: present
      when:
        - "has_swap_partition | bool"
        - "not failsafe_runtime_only_mode | bool"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 29: SANITIZED EXPLICIT STORAGE SUBVOLUME LAYOUT LEDGERS
# DESCRIPTION: Enforces fstab configurations using state: present to safely write
#              subvolume profiles and purges legacy vault leak data.
# =============================================================================
    - name: "STORAGE | LEDGER | Clean legacy unmanaged vault leakage records from fstab"
      ansible.posix.mount:
        path: "{{ item }}"
        state: absent
      loop: ["/vault", "none"]

    - name: "STORAGE | LEDGER | Purge legacy transient virtual allocations text to force correct boot sorting order"
      ansible.builtin.lineinfile:
        path: "/etc/fstab"
        regexp: '^tmpfs\s+(/tmp|/dev/shm)\s+tmpfs.*$'
        state: absent
      become: true
      when: "not ansible_check_mode"

    - name: "STORAGE | LEDGER | Commit standardized subvolumes to physical fstab parameters"
      ansible.posix.mount:
        path: "{{ item.dest }}"
        src: "UUID={{ active_root_uuid }}"
        fstype: "btrfs"
        opts: "rw,{{ perf_mount_opts }},nodev,nosuid,nofail,subvol=/{{ item.name }}"
        state: present
      loop: "{{ active_distro_subvolumes }}"
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not ansible_check_mode"
        - "item.dest != '/'"
        - "item.dest != '/swap' or not has_swap_partition | bool"

    - name: "STORAGE | MOUNT | Safely execute universal storage engine synchronization"
      ansible.builtin.shell: "mount -a"
      changed_when: false
      failed_when: false
      when:
        - "is_btrfs_layout | bool"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 30: VOLATILE FALLBACK STORAGE SWAPFILE CHECKOUT
# DESCRIPTION: Appraises existing swapfile attributes to evaluate footprints
#              against baseline target formulas to preserve flash memory blocks.
# =============================================================================
    - name: "STORAGE | SWAPFILE | Check physical presence of existing swapfile allocation"
      ansible.builtin.stat:
        path: "/swap/swapfile"
      register: target_swapfile_check
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not has_swap_partition | bool"

    - name: "STORAGE | SWAPFILE | Evaluate existing swapfile size specifications against active formula"
      ansible.builtin.set_fact:
        swapfile_size_mismatch: >-
          {%- if not target_swapfile_check.stat.exists | default(false) -%}
            true
          {%- else -%}
            {{ (((target_swapfile_check.stat.size / 1024 / 1024) | int - target_formula_swap_mb | int) | abs > 100) | bool }}
          {%- endif -%}
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not has_swap_partition | bool"

    - name: "SWAP CONFIG | TELEMETRY | Report compliance status when existing file matches formula constraints"
      ansible.builtin.debug:
        msg: "{{ blueprint_summary.split('\n') }}"
      vars:
        blueprint_summary: |
          ======================================================================
          📊 [ STORAGE SUBSYSTEM COMPLIANCE TELEMETRY LEDGER ]
          ======================================================================
            ↳ ACTIVE BOUNDARY STATUS     : PASS (TARGET MEETS COMPLIANCE)
            ↳ IDENTIFIED FILE PATH       : /swap/swapfile
            ↳ ALLOCATED FOOTPRINT SIZES  : {{ (target_swapfile_check.stat.size / 1024 / 1024) | round(0) | int if target_swapfile_check.stat.exists | default(false) else 0 }} MB
            ↳ METRIC FORMULA TARGET      : {{ target_formula_swap_mb }} MB
          ======================================================================
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not has_swap_partition | bool"
        - "target_swapfile_check.stat.exists | default(false)"
        - "not swapfile_size_mismatch | default(false) | bool"
# =============================================================================
# BLOCK 31: COGNITIVE STORAGE PROVISIONING & VISUAL CONFIRMATION LABELS
# DESCRIPTION: Allocates clean copy-on-write-disabled backup swap storage blocks
#              safely over a verified local Btrfs tree and prints status checks.
# =============================================================================
    - name: "STORAGE | SWAPFILE | Build secure Btrfs fallback block if no physical swap partition exists"
      ansible.builtin.shell: |
        set -euo pipefail
        swapoff /swap/swapfile 2>/dev/null || true
        rm -f /swap/swapfile
        touch /swap/swapfile
        chattr +C /swap/swapfile
        btrfs property set /swap/swapfile compression none 2>/dev/null || true
        dd if=/dev/zero of=/swap/swapfile bs=1M count={{ target_formula_swap_mb | int }} status=none
        chmod 0600 /swap/swapfile
        mkswap /swap/swapfile
        swapon -p 10 /swap/swapfile
      args:
        executable: /bin/bash
      register: fallback_swapfile_creation_status
      when:
        - "is_btrfs_layout is defined and is_btrfs_layout | bool"
        - "not ansible_check_mode"
        - "not has_swap_partition | bool"
        - "swapfile_size_mismatch | default(false) | bool or not target_swapfile_check.stat.exists | bool"

    - name: "SWAP CONFIG | NOTIFY | Render visual checkmark confirmation message to terminal"
      ansible.builtin.debug:
        msg: "[ ✓ ] New swap file created = {{ ((target_formula_swap_mb | int) / 1024) | round(1) }} GB (Dynamic Formula Size Standard)"
      when:
        - "not has_swap_partition | bool"
        - "fallback_swapfile_creation_status is changed or not target_swapfile_check.stat.exists | bool"
# =============================================================================
# BLOCK 32: TRADITIONAL PLATFORM SWAP ALLOCATION
# DESCRIPTION: Enforces fallback file footprint provisioning routines on systems
#              configured with standard block filesystems (Ext4, XFS, etc.).
# =============================================================================
    - name: "SWAP CONFIG | ALLOCATION | Traditional swapfile allocation block if target platform is non-btrfs filesystem"
      ansible.builtin.shell: |
        set -euo pipefail
        if [ ! -f /swap/swapfile ]; then
            mkdir -p /swap
            dd if=/dev/zero of=/swap/swapfile bs=1M count={{ target_formula_swap_mb | int }} status=none
            chmod 0600 /swap/swapfile
            mkswap /swap/swapfile
            swapon -p 10 /swap/swapfile
        fi
      args:
        executable: /bin/bash
      when:
        - "is_btrfs_layout is defined and not is_btrfs_layout | bool"
        - "not has_swap_partition | bool"
        - "not ansible_check_mode"

    - name: "SWAP CONFIG | NOTIFY | Render automated swap infrastructure hardening status"
      ansible.builtin.debug:
        msg: "⚙️ SWAP INFRASTRUCTURE CONFIGURATION COMPLETE"
      when: "not has_swap_partition | bool"

    - name: "SWAP CONFIG | PERSISTENCE | Commit fallback swapfile parameters to permanent fstab layout"
      ansible.builtin.lineinfile:
        path: "/etc/fstab"
        line: "/swap/swapfile none swap defaults,pri=10 0 0"
        state: present
      when:
        - "not has_swap_partition | bool"
        - "not ansible_check_mode"

    - name: "SWAP CONFIG | ACTIVATION | Trigger direct kernel parse to pull fallback swap space live"
      ansible.builtin.shell: "swapon -a"
      changed_when: false
      failed_when: false
      when:
        - "not has_swap_partition | bool"
        - "not ansible_check_mode"
# =============================================================================
# BLOCK 33: AMORPHOUS TRANSIENT MEMORY BOUNDARY DIRECTIVES
# DESCRIPTION: Enforces high-security virtual execution mount arrays explicitly
#              at the very bottom of the fstab lifecycle matrix path.
# =============================================================================
    - name: "STORAGE | HARDENING | Secure virtual execution interfaces universally at the bottom of fstab arrays"
      ansible.builtin.blockinfile:
        path: "/etc/fstab"
        marker: "# {mark} ANSIBLE VIRTUAL TIMEMAPS ENGINE PLATFORMS"
        insertafter: EOF
        block: |
          tmpfs /tmp tmpfs defaults,noexec,nosuid,nodev,size=50% 0 0
          tmpfs /dev/shm tmpfs defaults,noexec,nosuid,nodev,size=1G 0 0
      become: true

# =============================================================================
# BLOCK 34: SYSTEMD ZRAM GENERATOR MEMORY ACCELERATION
# DESCRIPTION: Automatically configures systemd-zram generators to optimize
#              userland swap priority spaces matching identified physical profiles.
# =============================================================================
    - name: "ZRAM PROVISION | Deploy chosen compression algorithm setup matching scanned hardware profile"
      ansible.builtin.copy:
        dest: "/etc/systemd/zram-generator.conf"
        content: |
          # =========================================================================
          # 🎛️ HARDENED POST-INSTALL USERLAND MEMORY ACCELERATION PRESETS (PRIORITY 100)
          # =========================================================================
          [zram0]
          zram-size = min(ram / 2, 2048)
          compression-algorithm = {{ target_compression }}
          swap-priority = 100
        mode: '0644'
      notify: "Reload Active Systemd Core"
      when:
        - "not ansible_check_mode"
        - "(ansible_facts['memtotal_mb'] | default(2048) | int) <= 16384"
# =============================================================================
# BLOCK 35: USERLAND OUT-OF-MEMORY COMPLIANCE MATRIX
# DESCRIPTION: Bootstraps enterprise repositories on RedHat nodes, provisions
#              the earlyoom service, and declaratively matches internal settings.
# =============================================================================
    - name: "EARLYOOM | REPOSITORY | Probe RedHat system for active EPEL substrates"
      ansible.builtin.stat:
        path: "/etc/yum.repos.d/epel.repo"
      register: local_epel_repo_probe
      when: "ansible_facts['os_family'] == 'RedHat'"

    - name: "EARLYOOM | REPOSITORY | Deploy EPEL repository package if missing"
      ansible.builtin.dnf:
        name: "epel-release"
        state: present
        disable_gpg_check: yes
      when:
        - "ansible_facts['os_family'] == 'RedHat'"
        - "not local_epel_repo_probe.stat.exists | bool"
        - "not ansible_check_mode"

    - name: "EARLYOOM | PROVISION | Universal package installation loop"
      ansible.builtin.package:
        name: "earlyoom"
        state: present
      when: "not ansible_check_mode"

    - name: "EARLYOOM | CONFIGURATION | Compile hardware-proportional environment profiles"
      ansible.builtin.copy:
        dest: "{{ '/etc/sysconfig/earlyoom' if ansible_facts['os_family'] == 'Suse' else '/etc/default/earlyoom' }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          # =================================================================
          # AUTOMATED ZERO-TRUST USERLAND OUT-OF-MEMORY PERFORMANCE PRESETS
          # CUSTOM SYSTEM ARCHITECTURE BUILT BY MEDARDO VEGA
          # =================================================================
          EARLYOOM_ARGS="-r 3600 -m 10 -M 5 --prefer ^(brave|chrome|firefox)$ --avoid ^(systemd|auditd|sshd|vpn-leak-monitor)$"
      register: earlyoom_config_state
      become: true
      when: "not ansible_check_mode"

    - name: "EARLYOOM | LIFECYCLE | Standardize userland memory defense running state"
      ansible.builtin.systemd:
        name: "earlyoom.service"
        state: "{{ 'restarted' if earlyoom_config_state.changed else 'started' }}"
        enabled: true
        masked: false
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 36: PRIVILEGED SYSCTL CONFIGURATION CLEANUP PASS
# DESCRIPTION: Sanitizes preexisting fallback auditing parameters on disk
#              and removes conflicting legacy standalone swappiness map parameters.
# =============================================================================
    - name: "SYSCTL | SANITIZATION | Purge legacy conflicting standalone memory tuning configurations"
      ansible.builtin.file:
        path: "/etc/sysctl.d/{{ item }}"
        state: absent
      loop:
        - "99-swappiness.conf"
        - "50-memory-tuning.conf"
        - "99-memory-tunning.conf"
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 37: HARDWARE-AWARE SYSCTL TUNING INJECTIONS
# DESCRIPTION: Deploys dynamic kernel performance limits tailored directly
#              to mechanical, virtual hypervisor, or solid state storage environments.
# =============================================================================
    - name: "HARDENING | MEMORY MAPS | Compile optimized dynamic sysctl hardware profile"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-memory-tuning.conf"
        content: |
          # =================================================================
          # AUTOMATED ZERO-TRUST HARDWARE-AWARE MEMORY PERFORMANCE METRICS LEDGER
          # CUSTOM SYSTEM ARCHITECTURE BUILT BY MEDARDO VEGA
          # =================================================================
          vm.swappiness = {{ target_swappiness | int }}
          vm.pagecluster = 0
          vm.compaction_proactiveness = 80

          {% if is_mechanical_drive | bool and not is_virtual_machine | bool %}
          # HARDCODED PLATTEN DRIVES PROTECTIVE PARAMETERS
          vm.dirty_background_bytes = 67108864
          vm.dirty_bytes = 268435456
          vm.watermark_scale_factor = 125
          vm.vfs_cache_pressure = 50
          {% elif is_virtual_machine | bool %}
          # HYPERVISOR AGGRESSIVE GUEST DOUBLE-CACHING BYPASS FLUSH
          vm.dirty_background_ratio = 5
          vm.dirty_ratio = 10
          vm.vfs_cache_pressure = 500
          {% else %}
          # FLASH CELLS SOLID STATE DISK RATIOS HIGH THROUGHPUT
          vm.dirty_background_ratio = 10
          vm.dirty_ratio = 20
          vm.watermark_scale_factor = 10
          vm.vfs_cache_pressure = 100
          {% endif %}
        mode: '0644'
        owner: root
        group: root
      register: sysctl_conf_fix
      become: true
      notify: "Trigger Active System Kernel Flush"

    - name: "TRACKER | Accumulate state adjustments from kernel subsystems"
      ansible.builtin.set_fact:
        system_was_modified: true
      when:
        - "not ansible_check_mode"
        - "sysctl_conf_fix.changed | default(false)"

# =============================================================================
# BLOCK 38: DYNAMIC KERNEL HARDENING PARAMETER INJECTIONS
# DESCRIPTION: Deploys core kernel security overrides, network system shields,
#              and execution boundary restrictions completely separate from memory.
# =============================================================================
    - name: "HARDENING | KERNEL | Compile core zero-trust kernel security profile"
      ansible.builtin.copy:
        dest: "/etc/sysctl.d/99-kernel-hardening.conf"
        content: |
          # =================================================================
          # AUTOMATED ZERO-TRUST CORE KERNEL PERFORMANCE AND SECURITY MATRIX
          # CUSTOM SYSTEM ARCHITECTURE BUILT BY MEDARDO VEGA
          # =================================================================
          kernel.kptr_restrict = 2
          kernel.dmesg_restrict = 1
          kernel.printk = 3 3 3 3
          kernel.unprivileged_bpf_disabled = 1
          net.ipv4.conf.all.log_martians = 1
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv4.conf.all.secure_redirects = 0
          net.ipv4.conf.default.secure_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
          fs.protected_hardlinks = 1
          fs.protected_symlinks = 1
        mode: '0644'
        owner: root
        group: root
      register: kernel_harden_conf_fix
      become: true
      notify: "Trigger Active System Kernel Flush"

    - name: "TRACKER | Accumulate state adjustments from kernel hardening subsystems"
      ansible.builtin.set_fact:
        system_was_modified: true
      when:
        - "not ansible_check_mode"
        - "kernel_harden_conf_fix.changed | default(false)"
# =============================================================================
# BLOCK 39: LOCAL SECURE HOSTNAME SECURITY MATRIX
# DESCRIPTION: Deploys an isolated, static local hostname lookup mapping
#              completely independent of transient drive volumes.
# =============================================================================
    - name: "CONFIGURATION | NETWORKING | Enforce clean un-falsifiable host resolution table"
      ansible.builtin.copy:
        dest: "/etc/hosts"
        owner: root
        group: root
        mode: '0644'
        content: |
          # Secure Static Table Lookup for Hostnames (Automated Framework Baseline)
          127.0.0.1    localhost localhost.localdomain
          ::1          localhost localhost.localdomain

          # Dedicated Local Loopback Node Mapping for Compliance Parsers
          127.0.1.1    {{ ansible_facts['hostname'] | default('localhost') }}
          ::1          {{ ansible_facts['hostname'] | default('localhost') }}
      become: true
# =============================================================================
# BLOCK 40-A: UNIFIED DYNAMIC LOGIN DISCLAIMER BANNERS
# DESCRIPTION: Deploys real-time warning notices and liabilities disclaimers
#              across local and remote user authentication interfaces.
# =============================================================================
    - name: "CONFIGURATION | SYSTEM BANNERS | Generate dynamic cross-distribution login disclaimers"
      ansible.builtin.copy:
        dest: "{{ item }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          ===============================================================================
          [ 🔒 WARNING: {{ ansible_facts['distribution'] | default('LINUX') | upper }} SECURE INFRASTRUCTURE NODE ]
          ===============================================================================

            🚨 AUTHORIZATION WARNING NOTICE:
            This computer system is restricted strictly to authorized users only.
            Unauthorized access, connection attempts, or modifications are prohibited.

            🛡️  REAL-TIME SECURITY PROVISIONING:
            All interactions, network sessions, and host transactions on this node
            are subject to continuous live kernel monitoring, session auditing, and
            forensic payload logging under host administrative authorities.

            ⚠️  LEGAL LIABILITY DISCLAIMER:
            Anyone choosing to access this system explicitly consents to continuous
            auditing. UNAUTHORIZED USERS WILL BE APPREHENDED and prosecuted to the
            fullest extent of the law. Disconnect immediately if you are unauthorized.

          ===============================================================================
      loop:
        - "/etc/issue"
        - "/etc/issue.net"
      become: true


# =============================================================================
# BLOCK 40-B: STORAGE SUBSYSTEM DYNAMIC CANDIDATE REGISTER MATRIX
# DESCRIPTION: Translates discovered block device signatures into a clean 
#              structured list for the interactive target processing loop.
# =============================================================================
    - name: "VAULT ENGINE | SCAN | Parse probe signatures into structural system facts"
      ansible.builtin.set_fact:
        safe_vault_candidates: >-
          [{% for resp in candidate_vault_signatures_probe.results | default([]) %}{% if resp.stdout is defined and ':' in resp.stdout %}{% set split_val = resp.stdout.split(':') %}{% set drive_path = split_val[0] | trim %}{% set sig_type = split_val[1] | trim %}{"path": "{{ drive_path }}", "signature": "{{ sig_type }}"}{% if not loop.last %},{% endif %}{% endif %}{% endfor %}]
        base_vault_index: >-
          {% set count = namespace(val=0) %}{% for resp in candidate_vault_signatures_probe.results | default([]) %}{% if resp.stdout is defined and ':crypto_LUKS' in resp.stdout %}{% set count.val = count.val + 1 %}{% endif %}{% endfor %}{{ count.val }}
      when:
        - "secure_vault_enabled | bool"
        - "candidate_vault_signatures_probe.results is defined"
        - "not ansible_check_mode"

# =============================================================================
# BLOCK 41: VAULT SUITE INTERACTIVE PROMPT INTERFACES
# DESCRIPTION: Pauses execution on discovered unformatted disk targets or unmapped
#              LUKS boundaries to allow naming; fixes partition skipping bugs.
# =============================================================================
    - name: "VAULT SUITE | PROMPT | Interactive Runtime Naming Gate for safe partitions"
      ansible.builtin.pause:
        prompt: |
          ======================================================================
          [ 📁 AUTOMATED VAULT COMPLIANCE: SECURE CONTAINER DISCOVERY ]
          ======================================================================
            ↳ Unmapped Hardware Target Found: {{ item.path }} (Signature: {{ item.signature }})

          [?] Enter a custom name handle to identify this secure vault volume:
              (Press Enter to default to "vault{{ base_vault_index | int + ansible_loop.index0 | int }}")
          ======================================================================
      loop: "{{ safe_vault_candidates | from_yaml | default([]) }}"
      when:
        - "secure_vault_enabled | bool"
        - "not ansible_check_mode"
      register: interactive_vault_names_captured
      loop_control:
        extended: true

# =============================================================================
# BLOCK 41-B: VAULT INTERACTIVE REGISTRATION BRIDGE
# DESCRIPTION: Bridges interactive user names directly into a single unified
#              ledger list object for disk formatting and engine parameters.
# =============================================================================
    - name: "VAULT ENGINE | LEDGER | Compile unified architectural vault specifications"
      ansible.builtin.set_fact:
        final_vault_configs: >-
          {%- set configured_list = [] -%}
          {%- if interactive_vault_names_captured.results is defined -%}
            {%- for response in interactive_vault_names_captured.results -%}
              {%- if response.item is defined and (response.item.signature == 'BLANK' or response.item.signature == 'crypto_LUKS') -%}
                {%- set default_moniker = 'vault' ~ (base_vault_index | int + loop.index0 | int) -%}
                {%- set verified_moniker = default_moniker -%}
                {%- if response.user_input is defined and response.user_input is not none and response.user_input | string | trim | length > 0 -%}
                  {%- set verified_moniker = response.user_input | string | trim -%}
                {%- endif -%}
                {%- set _ = configured_list.append({'path': response.item.path, 'name': verified_moniker, 'size_gb': 20, 'signature': response.item.signature}) -%}
              {%- endif -%}
            {%- endfor -%}
          {%- endif -%}
          {{ configured_list }}
      when:
        - "secure_vault_enabled | bool"
        - "not ansible_check_mode"

# =============================================================================
# BLOCK 42: AUTONOMOUS LUKS2 ARGON2ID CRYPTOGRAPHIC FORMATTING ENGINE
# DESCRIPTION: Validates execution conditions, executes low-level wipefs audits,
#              deploys Argon2id crypto layers, and provisions clean filesystem volumes.
# =============================================================================
    - name: "VAULT ENGINE | INITIALIZATION | Filter and compile clean targets"
      ansible.builtin.set_fact:
        active_vault_initialization_configs: "{{ final_vault_configs | default([]) }}"
      when:
        - "secure_vault_enabled | bool"
        - "not ansible_check_mode"

    - name: "VAULT ENGINE | HARDENING | Audit target blocks for safety to prevent data destruction"
      ansible.builtin.shell: |
        set -o pipefail
        wipefs -n "{{ item.path }}" | awk 'NR>1 {print $1}' | tr '\n' ',' | sed 's/,$//'
      args:
        executable: /bin/bash
      loop: "{{ active_vault_initialization_configs | default([]) }}"
      register: target_partition_emptiness_audit
      changed_when: false
      failed_when: false
      when:
        - "secure_vault_enabled | bool"
        - "active_vault_initialization_configs | default([]) | length > 0"
        - "not ansible_check_mode"

    - name: "VAULT ENGINE | CRYPTO | Deploy argon2id LUKS2 structures and create clean Btrfs file spaces"
      ansible.builtin.shell: |
        set -euo pipefail
        TARGET_DEV="{{ item.item.path }}"
        VAULT_NAME="{{ item.item.name }}"
        DETECTED_REMNANTS="{{ item.stdout | trim }}"

        if [ -n "${DETECTED_REMNANTS}" ] && [ "${DETECTED_REMNANTS}" != "crypto_LUKS" ]; then
            echo "[!] WARNING: Device ${TARGET_DEV} contains active foreign signatures (${DETECTED_REMNANTS}). Skipping."
            exit 0
        fi

        KEY_FILE="/etc/vault_${VAULT_NAME}.key"
        if [ ! -f "${KEY_FILE}" ]; then
            dd if=/dev/urandom of="${KEY_FILE}" bs=1 count=256 status=none
            chmod 0600 "${KEY_FILE}"
            chown root:root "${KEY_FILE}"
        fi

        echo "[+] Initializing LUKS2 container via Argon2id on ${TARGET_DEV}..."
        cryptsetup luksFormat --type luks2 --pbkdf argon2id --key-file "${KEY_FILE}" "${TARGET_DEV}"

        MAPPER_INIT="vault_init_${VAULT_NAME}"
        cryptsetup open "${TARGET_DEV}" "${MAPPER_INIT}" --key-file "${KEY_FILE}"
        
        echo "[+] Provisioning pristine Btrfs filesystem layer..."
        mkfs.btrfs -f -L "${VAULT_NAME}" "/dev/mapper/${MAPPER_INIT}"
        
        cryptsetup close "${MAPPER_INIT}"
        echo "[✓] Cryptographic container execution complete for ${VAULT_NAME}."
      args:
        executable: /bin/bash
      loop: "{{ target_partition_emptiness_audit.results | default([]) }}"
      when:
        - "secure_vault_enabled | bool"
        - "target_partition_emptiness_audit.results is defined"
        - "not item.skipped | default(false) | bool"
        - "not ansible_check_mode"
      register: crypto_formatting_engine_status
      changed_when: "'Cryptographic container execution complete' in crypto_formatting_engine_status.stdout"

# =============================================================================
# BLOCK 43: COMPLIANCE DIRECTORY INFRASTRUCTURE PROVISIONING
# DESCRIPTION: Enforces core path maps, pristine log tracker file parameters,
#              and drops administrative file footprints cleanly.
# =============================================================================
    - name: "COMPLIANCE | ARPWATCH | PROVISIONING | Enforce baseline tracking database directory structure universally"
      ansible.builtin.file:
        path: "/var/lib/arpwatch"
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: "COMPLIANCE | ARPWATCH | PROVISIONING | Initialize pristine state ledger tracker file target if missing"
      ansible.builtin.copy:
        dest: "/var/lib/arpwatch/arp.dat"
        content: ""
        force: false
        owner: root
        group: root
        mode: '0644'
      become: true
# =============================================================================
# BLOCK 44: MULTI-DISTRO DATA CONFIGURATION LEDGER
# DESCRIPTION: Commits parsed path-to-name relationships and size limits
#              permanently to an un-falsifiable lookup map database.
# =============================================================================
    - name: "VAULT ENGINE | TOPOLOGY | Commit standardized lookup maps to local topology block"
      ansible.builtin.copy:
        dest: "/etc/vault-topology.conf"
        content: |
          # Automated Zero-Trust Storage Topology Map
          # Format: [vault_name]:[device_path]:[size_gb]
          {% for item in (final_vault_configs | default([])) %}
          {{ item.name | trim }}:{{ item.path | trim }}:{{ item.size_gb | default(20) | int }}
          {% endfor %}
        owner: root
        group: root
        mode: '0600'
      when: "secure_vault_enabled | bool"

# =============================================================================
# BLOCK 45: EVOLVED ADAPTIVE VAULT EXECUTION UTILITY
# DESCRIPTION: Constructs the dynamic multi-vault quota-enforcing wrapper utility
#              to manage open/close workflows and access boundaries.
# =============================================================================
    - name: "VAULT ENGINE | CORE | Construct automated multi-layer quota-enforcing wrapper utilities"
      ansible.builtin.copy:
        dest: "/usr/bin/vault"
        content: |
          #!/bin/bash
          set -euo pipefail

          MIN_LIMIT={{ vault_minimum_size_threshold_gb | default(15) | int }}
          FAILSAFE_ACTIVE={{ 'true' if failsafe_runtime_only_mode | bool else 'false' }}
          HUMAN_OPERATOR="{{ primary_human_operator }}"
          ADMIN_GRP="{{ detected_admin_group }}"
          TOPOLOGY_MAP="/etc/vault-topology.conf"

          if [ "$(id -u)" -ne 1000 ] && [ "$(id -u)" -ne 0 ] && ! groups | grep -q -E "(${ADMIN_GRP}|root)"; then
             echo "[-] ACCESS DENIED: Core cryptographic storage controls are restricted." >&2
             exit 1
          fi

          if [ "$#" -lt 2 ] || [[ ! "$1" =~ ^(open|close)$ ]]; then
             echo "[-] USAGE: vault [open|close] [vault_name]" >&2
             exit 1
          fi

          ACTION="$1"
          TARGET_NAME="$2"
          VAULT_DEV=""
          V_SIZE=0

          if [ -f "${TOPOLOGY_MAP}" ]; then
             while IFS=: read -r vname vpath vsize || [ -n "$vname" ]; do
                [[ -z "$vname" || "$vname" =~ ^# ]] && continue
                if [ "${vname}" = "${TARGET_NAME}" ]; then
                   VAULT_DEV="${vpath}"
                   V_SIZE="${vsize}"
                   break
                fi
             done < "${TOPOLOGY_MAP}"
          fi

          if [ -z "${VAULT_DEV}" ]; then
             echo "[-] CONFIGURATION ERROR: Vault moniker '${TARGET_NAME}' is unmapped in topology ledger." >&2
             exit 1
          fi

          MNT_TARGET="/run/vault/${TARGET_NAME}"
          MAPPER_NAME="vault_storage_${TARGET_NAME}"

          if [ "${ACTION}" == "open" ]; then
             if [ "${FAILSAFE_ACTIVE}" = "true" ]; then
                sudo mkdir -p "${MNT_TARGET}"
                sudo chmod 0750 "${MNT_TARGET}"
                echo "[!] Failsafe Open: Directory initialized directly over unencrypted storage."
             else
                if [ ! -f "/etc/vault_${TARGET_NAME}.key" ]; then
                    sudo dd if=/dev/urandom of="/etc/vault_${TARGET_NAME}.key" bs=1 count=256 status=none
                    sudo chmod 0600 "/etc/vault_${TARGET_NAME}.key"
                    sudo cryptsetup luksAddKey "${VAULT_DEV}" "/etc/vault_${TARGET_NAME}.key"
                fi
                sudo cryptsetup open "${VAULT_DEV}" "${MAPPER_NAME}" --key-file "/etc/vault_${TARGET_NAME}.key"
                sudo mkdir -p "${MNT_TARGET}"
                sudo mount -o noatime,compress=zstd:1,space_cache=v2 "/dev/mapper/${MAPPER_NAME}" "${MNT_TARGET}" || sudo mount "/dev/mapper/${MAPPER_NAME}" "${MNT_TARGET}"
                echo "[+] Vault storage volume '${TARGET_NAME}' successfully opened."
             fi

             sudo chown "${HUMAN_OPERATOR}:${ADMIN_GRP}" "${MNT_TARGET}"
             if [ "${V_SIZE}" -lt "${MIN_LIMIT}" ]; then
                sudo chmod 1700 "${MNT_TARGET}"
                echo "[*] Capacity constraint < 15GB active. Multi-tenant profiles restricted for '${TARGET_NAME}'."
             else
                sudo groupadd -f vault
                sudo chown "root:vault" "${MNT_TARGET}"
                sudo chmod 1770 "${MNT_TARGET}"
                echo "[*] Multi-tenant storage enabled. Sticky boundaries applied to group 'vault'."
             fi

          elif [ "${ACTION}" == "close" ]; then
             sudo umount -f "${MNT_TARGET}" || true
             if [ "${FAILSAFE_ACTIVE}" = "false" ]; then
                sudo cryptsetup close "${MAPPER_NAME}" || true
             fi
             sudo rmdir "${MNT_TARGET}" 2>/dev/null || true
             echo "[+] Vault volume '${TARGET_NAME}' completely locked and secured."
          fi
        mode: '0750'
        owner: root
        group: "{{ detected_admin_group }}"
      when: "secure_vault_enabled | bool"

# =============================================================================
# BLOCK 46: DYNAMIC LOGON PER-USER ENV ALIAS MATRIX
# DESCRIPTION: Sets interactive shortcut mapping templates inside environment variables
#              to automatically configure user profile session aliases.
# =============================================================================
    - name: "VAULT ENGINE | ALIASES | Enforce dynamic terminal environment environment hooks"
      ansible.builtin.copy:
        dest: "/etc/profile.d/vault_aliases.sh"
        content: |
          # =================================================================
          # AUTOMATED ZERO-TRUST DYNAMIC MULTI-DISTRO VAULT ALIAS GENERATOR
          # =================================================================
          if [ "$(id -un)" = "{{ primary_human_operator }}" ] || [ "$(id -u)" -eq 0 ] || groups | grep -q -E '({{ detected_admin_group }}|wheel|sudo|root)'; then
              if [ -f /etc/vault-topology.conf ]; then
                  while IFS=: read -r vault_name device_path size_gb || [ -n "$vault_name" ]; do
                      [[ -z "$vault_name" || "$vault_name" =~ ^# ]] && continue
                      alias "${vault_name}-open"="sudo /usr/bin/vault open ${vault_name}"
                      alias "${vault_name}-close"="sudo /usr/bin/vault close ${vault_name}"
                  done < /etc/vault-topology.conf
              fi
          fi
        owner: root
        group: root
        mode: '0644'
      when: "secure_vault_enabled | bool"

# =============================================================================
# BLOCK 48: LINK-LAYER ARPWATCH OVERRIDE SANDBOXING (PART 2)
# DESCRIPTION: Ensures master environment paths are configuration safe and touches
#              active host tracking files across targeted card identifiers.
# =============================================================================
    - name: "COMPLIANCE | ARPWATCH | CONFIGURATION | Ensure master configuration path exists"
      ansible.builtin.file:
        path: "/etc/arpwatch"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: "ansible_facts['os_family'] == 'Archlinux' and not ansible_check_mode"
      become: true

    - name: "COMPLIANCE | ARPWATCH | ARCH | Touch instance specific options tracking file"
      ansible.builtin.file:
        path: "/etc/arpwatch/{{ primary_network_interface }}.conf"
        state: touch
        owner: root
        group: root
        mode: '0644'
        modification_time: preserve
        access_time: preserve
      when: "ansible_facts['os_family'] == 'Archlinux' and not ansible_check_mode"
      become: true

# =============================================================================
# BLOCK 49: LINK-LAYER ARPWATCH OVERRIDE SANDBOXING (PART 3)
# DESCRIPTION: Injects strict sandbox containment properties into systemd drop-in
#              directories for active network card instances.
# =============================================================================
    - name: "COMPLIANCE | ARPWATCH | CONFIGURATION | Establish drop-in containment paths"
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ 'arpwatch@' ~ primary_network_interface if ansible_facts['os_family'] in ['Archlinux', 'Debian'] else 'arpwatch' }}.service.d"
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: "COMPLIANCE | ARPWATCH | CONFIGURATION | Inject sandbox containment properties"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ 'arpwatch@' ~ primary_network_interface if ansible_facts['os_family'] in ['Archlinux', 'Debian'] else 'arpwatch' }}.service.d/override.conf"
        mode: '0644'
        owner: root
        group: root
        content: |
          [Unit]
          After=network-online.target
          Wants=network-online.target

          [Service]
          ProtectSystem=true
          ProtectHome=true
          ReadWritePaths=/var/lib/arpwatch
          PrivateTmp=true
          NoNewPrivileges=true
      register: arpwatch_config_state
      notify: "Reload Active Systemd Core"
      become: true
# =============================================================================
# BLOCK 50: ARPWATCH LIFECYCLE SERVICE CORES RE-ALIGNMENT
# DESCRIPTION: Forcefully triggers a systemd backend reload if drop-in override
#              containment sandboxing file parameters were structurally altered.
# =============================================================================
    - name: "COMPLIANCE | ARPWATCH | SERVICE | Trigger systemd core reload if parameters shifted"
      ansible.builtin.systemd:
        daemon_reload: true
      when:
        - "not ansible_check_mode"
        - "arpwatch_config_state.changed | default(false)"
      become: true


# =============================================================================
# BLOCK 51: HARDWARE-AWARE USBGUARD FIREWALLD PROFILE LAYOUTS
# DESCRIPTION: Scans hardware tree, compiles user whitelists, scrubs bad characters
#              from group lookups to fix service startup, and deploys configs.
# =============================================================================
    - name: "USBGUARD | PRE-FLIGHT | Ensure secure backend logging target paths exist"
      ansible.builtin.file:
        path: "/var/log/usbguard"
        state: directory
        owner: root
        group: root
        mode: '0750'

    - name: "USBGUARD | CONFIGURATION | Scan hardware tree and initialize whitelist rules"
      ansible.builtin.shell: |
        set -euo pipefail
        mkdir -p /etc/usbguard
        if [ ! -s /etc/usbguard/rules.conf ]; then
            usbguard generate-policy > /etc/usbguard/rules.conf
        fi
        if ! grep -q "match-all" /etc/usbguard/rules.conf; then
            echo "allow with-interface match-all { bDeviceClass == 03 }" >> /etc/usbguard/rules.conf
        fi
        chmod 0600 /etc/usbguard/rules.conf
        chown root:root /etc/usbguard/rules.conf
      args:
        executable: /bin/bash
      register: usbguard_policy_generation
      changed_when: true
    - name: "USBGUARD | CONFIGURATION | Enforce hardware-intelligent production configuration blueprints"
      ansible.builtin.copy:
        dest: "/etc/usbguard/usbguard-daemon.conf"
        owner: root
        group: root
        mode: '0600'
        content: |
          ImplicitPolicyTarget=block
          PresentDevicePolicy=allow
          PresentControllerPolicy=allow
          InsertedDevicePolicy=block
          RestoreControllerDeviceState=true
          AuditBackend=FileAudit
          AuditFilePath=/var/log/usbguard/usbguard-audit.log
          RuleFile=/etc/usbguard/rules.conf
          IPCAllowedGroups={{ detected_admin_group | default('wheel') | trim }}
          IPCAllowedUsers=root {{ primary_human_operator | default('vega') | trim }}
      register: usbguard_config_state
      notify: "Reload Active Systemd Core"


    - name: "USBGUARD | STAGE 3 | Ensure service is securely enabled for boot"
      ansible.builtin.systemd:
        name: usbguard.service
        enabled: true
      when: "not ansible_check_mode"

# =============================================================================
# BLOCK 52: FIREWALLD STATIC PERIMETER CONTAINMENT CONTROL
# DESCRIPTION: Enforces absolute drop posture on your physical wireless link
#              at cold boot to prevent pre-auth data leaks.
# =============================================================================
    - name: "FIREWALLD | CONFIGURATION | Enforce baseline permanent rule structures"
      ansible.builtin.shell: |
        set -x
        firewall-cmd --permanent --set-default-zone=drop
        firewall-cmd --permanent --zone=public --remove-interface="{{ primary_network_interface | default('wls1') | trim }}" || true
        firewall-cmd --permanent --zone=drop --add-interface="{{ primary_network_interface | default('wls1') | trim }}" || true
        firewall-cmd --permanent --zone=drop --remove-service=$(firewall-cmd --permanent --zone=drop --list-services 2>/dev/null) || true
        firewall-cmd --permanent --zone=drop --add-service=ssh || true
        firewall-cmd --permanent --zone=drop --add-rich-rule='rule family="ipv4" port port="51820" protocol="udp" accept' || true
        firewall-cmd --permanent --zone=drop --add-rich-rule='rule family="ipv4" port port="4500" protocol="udp" accept' || true
        firewall-cmd --permanent --zone=drop --add-rich-rule='rule family="ipv4" port port="1194" protocol="udp" accept' || true
        firewall-cmd --permanent --zone=drop --add-rich-rule='rule family="ipv4" port port="443" protocol="tcp" accept' || true
        firewall-cmd --permanent --zone=trusted --add-source=127.0.0.1/8 || true
        firewall-cmd --permanent --zone=trusted --add-source=::1/128 || true
      args:
        executable: /bin/bash
      when:
        - "not ansible_check_mode"
        - "firewalld_native | bool"

    - name: "FIREWALLD | ENFORCEMENT | Force NetworkManager and Firewalld Sync Live"
      ansible.builtin.shell: |
        set -euo pipefail
        firewall-cmd --reload
        TARGET_IFACE="{{ primary_network_interface | default('wls1') | trim }}"
        ACTIVE_UUID=$(nmcli -t -f UUID,DEVICE connection show --active | awk -F: -v dev="$TARGET_IFACE" '$2 == dev {print $1}')
        if [ -n "$ACTIVE_UUID" ]; then
            nmcli connection modify "$ACTIVE_UUID" connection.zone drop
            nmcli connection up "$ACTIVE_UUID"
        fi
        nmcli connection modify "pvpn-killswitch" connection.zone drop 2>/dev/null || true
        nmcli connection modify "proton0" connection.zone drop 2>/dev/null || true
      args:
        executable: /bin/bash
      register: live_firewall_enforcement_status
      changed_when: true
      when:
        - "not ansible_check_mode"
        - "firewalld_native | bool"

# =============================================================================
# BLOCK 53: SNORT INTRUSION DETECTION ENGINE LAYOUTS
# DESCRIPTION: Deploys a sanitized, modern passive mode Snort 3 Lua configuration
#              map without invalid global parameters or unassigned variables.
# =============================================================================
    - name: "CONFIGURATION | SNORT 3 | Ensure rules and layout environments exist"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - "/etc/snort"
        - "/etc/snort/rules"

    - name: "CONFIGURATION | SNORT 3 | Purge legacy conflicting text configurations"
      ansible.builtin.file:
        path: "/etc/snort/snort.conf"
        state: absent

    - name: "CONFIGURATION | SNORT 3 | Deploy modern structured Lua posture config"
      ansible.builtin.copy:
        dest: "/etc/snort/snort.lua"
        owner: root
        group: root
        mode: '0644'
        content: |
          ips = 
          {
              variables = 
              {
                  HOME_NET = '{{ dynamic_home_net }}',
                  EXTERNAL_NET = '!{{ dynamic_home_net }}'
              }
          }

          daq = { module = "pcap", mode = "passive" }
          stream = { }
          alert_fast = { file = true }
          wizard = { }
          binder = { }
      register: snort_conf_fix
      when:
        - "ansible_facts['os_family'] != 'Debian'"
        - "not ansible_check_mode"
      become: true

# =============================================================================
# BLOCK 54-B: SERVICE POSTURE PRE-REQUISITE ANCHORS (PRE-FLIGHT SERVICE ALIGNMENT)
# DESCRIPTION: Forces the systemd control engine to completely unmask target
#              IDS service files BEFORE initiating execution loops to bypass race traps.
# =============================================================================
    - name: "SECURITY SERVICES | SNORT | Ensure target distribution unit is completely unmasked"
      ansible.builtin.systemd:
        name: >-
          {%- if ansible_facts['os_family'] == 'Archlinux' -%}
            snort@{{ primary_network_interface }}.service
          {%- elif ansible_facts['os_family'] == 'Debian' -%}
            snort-init.service
          {%- else -%}
            {{ distro_matrix[ansible_facts['os_family']]['snort_service_name'] | default('snort.service') }}
          {%- endif -%}
        masked: false
      become: true
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 55: SECURITY SERVICES | SNORT | LIFECYCLE CONTROLS
# DESCRIPTION: Automates systemic restart routines over active intrusion detection
#              daemons dynamically triggered if configuration file layers changed.
# =============================================================================
    - name: "SECURITY SERVICES | SNORT | STAGE 3 | Ensure distribution unit is synchronized"
      ansible.builtin.systemd:
        name: >-
          {%- if ansible_facts['os_family'] == 'Archlinux' -%}
            snort@{{ primary_network_interface | default('wls1') | trim }}.service
          {%- else -%}
            {{ distro_matrix[ansible_facts['os_family']]['snort_service_name'] | default('snort.service') }}
          {%- endif -%}
        state: "{{ 'restarted' if (snort_conf_fix.changed | default(false) or snort_template_state.changed | default(false)) else 'started' }}"
        enabled: true
      when:
        - "snort_installed | bool"
        - "not ansible_check_mode"
      become: true
# =============================================================================
# BLOCK 57: CLAMAV DAEMON RESOURCE SANDBOXING & OVERRIDES
# DESCRIPTION: Deploys drop-in directories for your systemd configuration tree
#              and injects hardware-proportional cgroup resource constraints.
# =============================================================================
    - name: "CLAMAV | CONFIGURATION | Establish systemd drop-in override containment path"
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ 'clamav-daemon' if ansible_facts['os_family'] == 'Debian' else 'clamd' }}.service.d"
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: "not ansible_check_mode"

    - name: "CLAMAV | CONFIGURATION | Inject hardware-proportional resource management parameters"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ 'clamav-daemon' if ansible_facts['os_family'] == 'Debian' else 'clamd' }}.service.d/override.conf"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Service]
          Nice=19
          CPUSchedulingPolicy=idle
          CPUQuota={{ calculated_quota | trim }}%
          MemoryHigh={{ calculated_mem_high | trim }}
          MemoryMax={{ calculated_mem_max | trim }}
          TimeoutStartSec=300
      vars:
        calculated_quota: >
          {%- if (system_ram_gb | int) <= 4 -%} 10
          {%- elif (system_ram_gb | int) > 4 and (system_ram_gb | int) < 8 -%} 15
          {%- elif (system_ram_gb | int) >= 8 and (system_ram_gb | int) <= 16 -%} 20
          {%- else -%} 25
          {%- endif -%}
        calculated_mem_high: >
          {%- if (system_ram_gb | int) <= 4 -%} 1.0G
          {%- elif (system_ram_gb | int) > 4 and (system_ram_gb | int) < 8 -%} 1.2G
          {%- elif (system_ram_gb | int) >= 8 and (system_ram_gb | int) <= 16 -%} 1.5G
          {%- else -%} 2.0G
          {%- endif -%}
        calculated_mem_max: >
          {%- if (system_ram_gb | int) <= 4 -%} 1.2G
          {%- elif (system_ram_gb | int) > 4 and (system_ram_gb | int) < 8 -%} 1.5G
          {%- elif (system_ram_gb | int) >= 8 and (system_ram_gb | int) <= 16 -%} 2.0G
          {%- else -%} 3.0G
          {%- endif -%}
      register: clamav_override_state
      when: "not ansible_check_mode"
      notify: "Reload Active Systemd Core"
# =============================================================================
# BLOCK 58: CLAMAV ENGINE LIFECYCLE MANAGEMENT
# DESCRIPTION: Automates systemic configuration scans over anti-virus components,
#              updates freshclam configurations, and ensures clean daemon locks.
# =============================================================================
    - name: "CLAMAV | CONFIGURATION | Enforce resource-optimized database sync poll maps"
      ansible.builtin.lineinfile:
        path: "/etc/clamav/freshclam.conf"
        regexp: "^#?Checks\\s+\\d+"
        line: "Checks 2"
        state: present
      register: clamav_freshclam_config_state
      when: "not ansible_check_mode"

    - name: "CLAMAV | SERVICE | Ensure database background signature updater is universally active"
      ansible.builtin.systemd:
        name: "clamav-freshclam.service"
        state: "{{ 'restarted' if clamav_freshclam_config_state.changed else 'started' }}"
        enabled: true
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 59: CLAMAV RESOURCE ENFORCED SERVICE REALIGNMENT
# DESCRIPTION: Deploys fallback systemd templates if native service units are
#              missing on disk, dynamically matching host RAM boundaries.
# =============================================================================
    - name: "CLAMAV | STAGE 3 | Resource Enforced Service Engine Realignment"
      ansible.builtin.shell: |
        set -euo pipefail
        if systemctl list-unit-files | grep -q '^clamav-daemon.service'; then
            TARGET_SVC="clamav-daemon.service"
        elif systemctl list-unit-files | grep -E -q '^clamd(@)?\.service'; then
            MATCHED_SVC=$(systemctl list-unit-files | grep -E -o '^clamd(@)?\.service' | head -n1)
            TARGET_SVC="${MATCHED_SVC}"
        else
            echo "[Unit]
            Description=ClamAV AntiVirus Daemon
            After=network.target

            [Service]
            Type=simple
            ExecStart=\$(command -v clamd || echo '/usr/bin/clamd') --foreground
            Restart=always

            [Install]
            WantedBy=multi-user.target" | sudo tee /etc/systemd/system/clamd.service > /dev/null
            TARGET_SVC="clamav-daemon.service"
        fi
        systemctl daemon-reload
        systemctl enable "$TARGET_SVC"
        systemctl start "$TARGET_SVC"
      args:
        executable: /bin/bash
      register: clamav_realignment_status
      changed_when: true
      when:
        - "not ansible_check_mode"
        - "system_ram_gb | int > 4"

# =============================================================================
# BLOCK 60: AIDE FILE INTEGRITY MATRIX DEFINITIONS
# DESCRIPTION: Deploys core security systemd oneshot workers to enforce local
#              file compliance profiles headlessly without invalid parameters.
# =============================================================================
    - name: "AIDE | SCHEDULER | Deploy daily oneshot service check files"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/aide-check.service"
        content: |
          [Unit]
          Description=Automated Post-Hardening File Integrity Security Scan
          After=local-fs.target network.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/aide --check
          SuccessExitStatus=0 1 2 3 4 5 6 7
          Nice=19
          CPUSchedulingPolicy=idle
          IOSchedulingClass=idle
          OOMScoreAdjust=1000
          MemoryHigh=750M
          MemoryMax=900M
        owner: root
        group: root
        mode: '0644'
      notify: "Reload Active Systemd Core"



# =============================================================================
# BLOCK 61: AIDE FILE INTEGRITY MATRIX DEFINITIONS
# DESCRIPTION: Stages baseline tracking schemas for AIDE filesystems and aligns
#              text paths to completely eliminate database compression errors.
# =============================================================================
    - name: "AIDE | CONFIGURATION | Populate baseline configuration landscape across platform variants"
      ansible.builtin.copy:
        dest: "{{ '/etc/aide/aide.conf' if ansible_facts['os_family'] in ['Debian', 'RedHat'] else '/etc/aide.conf' }}"
        content: |
          {% if ansible_facts['os_family'] == 'Archlinux' %}
          database_in=file:/var/lib/aide/aide.db
          database_out=file:/var/lib/aide/aide.db.new
          gzip_dbout=no
          {% else %}
          database_in=file:/var/lib/aide/aide.db.gz
          database_out=file:/var/lib/aide/aide.db.new.gz
          gzip_dbout=yes
          {% endif %}
          report_url=stdout

          {% if ansible_facts['os_family'] == 'Archlinux' %}
          FIPSR = p+i+n+u+g+s+m+c+acl+xattrs+sha256
          ALLX  = p+i+n+u+g+s+m+c+sha256
          {% else %}
          FIPSR = p+i+n+u+g+s+m+c+acl+selinux+xattrs+sha256
          ALLX  = p+i+n+u+g+s+m+c+sha256
          {% endif %}

          /etc/.* FIPSR
          /usr/bin/.* ALLX
          /usr/sbin/.* ALLX
        owner: root
        group: root
        mode: '0600'
      register: aide_schema_fix
      when: "not ansible_check_mode"
# =============================================================================
# BLOCK 62: AIDE DECOUPLED SMART ENGINE AUTOMATION HOOKS
# DESCRIPTION: Provisions an intelligent decoupled backend shell verification utility script
#              and a clean post-transaction hook configuration file layout map.
# =============================================================================
    - name: "INTEGRITY | ENGINE | Deploy robust backend smart update utility script"
      ansible.builtin.copy:
        dest: "/usr/local/bin/aide-smart-update"
        mode: '0750'
        owner: root
        group: root
        content: |
          #!/bin/bash
          set -euo pipefail

          if [ ! -x /usr/bin/aide ]; then
              exit 0
          fi

          ROOT_DEV=$(findmnt -n -o SOURCE / | cut -d'[' -f1)

          if [[ "${ROOT_DEV}" == /dev/mapper/* ]]; then
              MAPPER_NAME=$(basename "${ROOT_DEV}")
              if [ -f "/sys/class/block/${MAPPER_NAME}/slaves/"* ]; then
                  REAL_DISK=$(basename "$(ls -d /sys/class/block/${MAPPER_NAME}/slaves/* | head -n1)")
              else
                  REAL_DISK=""
              fi
          else
              REAL_DISK=$(lsblk -dno PKNAME "${ROOT_DEV}" | tr -d '[:space:]' || echo "")
          fi

          if [ -n "${REAL_DISK}" ] && [ -f "/sys/block/${REAL_DISK}/queue/rotational" ]; then
              if [ "$(cat "/sys/block/${REAL_DISK}/queue/rotational")" = "1" ]; then
                  echo "[!] Rotational platter storage media profile detected (${REAL_DISK})."
                  echo "[*] Skipping post-transaction integrity database rebuild to preserve I/O bandwidth."
                  exit 0
              fi
          fi

          echo "[+] Synchronizing zero-trust filesystem baseline matrix..."
          if /usr/bin/aide --update > /dev/null 2>&1; then
              if [ -f /var/lib/aide/aide.db.new ]; then
                  mv -f /var/lib/aide/aide.db.new /var/lib/aide/aide.db || true
              elif [ -f /var/lib/aide/aide.db.new.gz ]; then
                  mv -f /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz || true
              fi
              echo "[✓] File integrity signature database synchronization complete."
          else
              if [ -f /var/lib/aide/aide.db.new ]; then
                  mv -f /var/lib/aide/aide.db.new /var/lib/aide/aide.db || true
              elif [ -f /var/lib/aide/aide.db.new.gz ]; then
                  mv -f /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz || true
              fi
          fi
          exit 0
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"

    - name: "AIDE | AUTOMATION | Deploy post-transaction pacman database hook"
      ansible.builtin.copy:
        dest: "/etc/pacman.d/hooks/99-aide-update.hook"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Trigger]
          Operation = Install
          Operation = Upgrade
          Operation = Remove
          Type = Package
          Target = *

          [Action]
          Description = Synchronizing filesystem baseline matrix via Smart Engine...
          When = PostTransaction
          Depends = aide
          Exec = /usr/local/bin/aide-smart-update
      when:
        - "ansible_facts['os_family'] == 'Archlinux'"
        - "not ansible_check_mode"

    - name: "AIDE | SCHEDULER | Drop 3:00 AM dynamic cron-free timer schedules"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/aide-check.timer"
        content: |
          [Unit]
          Description=Trigger Automated System Integrity Scan Daily at 3AM

          [Timer]
          OnCalendar=*-*-* 03:00:00
          Persistent=true

          [Install]
          WantedBy=timers.target
        owner: root
        group: root
        mode: '0644'
      notify: "Reload Active Systemd Core"

# =============================================================================
# BLOCK 63: MULTI-DISTRIBUTION PACKAGING INTEGRITY HOOKS
# DESCRIPTION: Deploys dynamic transaction hooks for apt, dnf, and zypper
#              to automatically sync core signature ledgers.
# =============================================================================
    - name: "INTEGRITY AUTOMATION | DEBIAN | Deploy transaction apt invocation filters"
      ansible.builtin.copy:
        dest: "/etc/apt/apt.conf.d/99aide-update"
        owner: root
        group: root
        mode: '0644'
        content: |
          DPkg::Post-Invoke { "if [ -x /usr/bin/aide ]; then echo '[+] Updating AIDE database...'; aide --update && (mv -f /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz || mv -f /var/lib/aide/aide.db.new /var/lib/aide/aide.db) || true; fi"; };
      when: "ansible_facts['os_family'] == 'Debian' and not ansible_check_mode"

    - name: "INTEGRITY AUTOMATION | REDHAT | Deploy custom dnf transaction wrappers"
      ansible.builtin.copy:
        dest: "/etc/dnf/plugins/aide_update.py"
        owner: root
        group: root
        mode: '0644'
        content: |
          import os
          from dnfpluginscore import DnfPlugin
          class AideUpdatePlugin(DnfPlugin):
              name = 'aide_update'
              def __init__(self, base, cli):
                  super(AideUpdatePlugin, self).__init__(base, cli)
              def transaction(self):
                  os.system("aide --update && (mv -f /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz || mv -f /var/lib/aide/aide.db.new /var/lib/aide/aide.db) >/dev/null 2>&1 || true")
      when: 
        - "ansible_facts['os_family'] == 'RedHat'"
        - "not ansible_check_mode"

    - name: "INTEGRITY AUTOMATION | SUSE | Deploy dynamic post-transaction zypper hooks"
      ansible.builtin.copy:
        dest: "/usr/lib/zypp/plugins/commit/aide-update-hook.sh"
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          if [ "\$1" = "POST" ] && command -v aide >/dev/null 2>&1; then
              aide --update && (mv -f /var/lib/aide/aide.db.new /var/lib/aide/aide.db || mv -f /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz) || true
          fi
      when: "ansible_facts['os_family'] == 'Suse' and not ansible_check_mode"

# =============================================================================
# BLOCK 60: AIDE FILE INTEGRITY MATRIX DEFINITIONS
# DESCRIPTION: Deploys core security systemd oneshot workers to enforce local
#              file compliance profiles headlessly without invalid parameters.
# =============================================================================
    - name: "AIDE | SCHEDULER | Deploy daily oneshot service check files"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/aide-check.service"
        content: |
          [Unit]
          Description=Automated Post-Hardening File Integrity Security Scan
          After=local-fs.target network.target

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/aide --check
          SuccessExitStatus=0 1 2 3 4 5 6 7
          Nice=19
          CPUSchedulingPolicy=idle
          IOSchedulingClass=idle
          OOMScoreAdjust=1000
          MemoryHigh=750M
          MemoryMax=900M
        owner: root
        group: root
        mode: '0644'
      notify: "Reload Active Systemd Core"

