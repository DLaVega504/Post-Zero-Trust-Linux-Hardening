      loop: "{{ active_network_interfaces.stdout.split(',') if active_network_interfaces.stdout is defined else [] }}"
      become: true
      when: 
        - "active_network_interfaces.stdout is defined and active_network_interfaces.stdout | length > 0"
        - "hardware_form_factor in ['LAPTOP / PORTABLE WORKSTATION', 'DESKTOP / FIXED SECURE STATION']"
