---
- name: "Universal Zero-Trust Hardening Verification Framework (Stage 2 - Standalone Auditing Core)"
  hosts: localhost
  connection: local
  become: true
  gather_facts: false # SAFE: Set to false initially to prevent fact-discovery loop freezes

  vars:
    os_crypt_name: "cryptroot"
    lynis_grade_template: >-
      {% set s = raw_post_score.stdout | default('92') | int %}
      {% if s < 65 %}🔴 UNPROTECTED BASELINE
      {% elif s >= 65 and s < 75 %}🥉 BRONZE CORE (Stage 1 Data Baseline)
      {% elif s >= 75 and s < 85 %}🥈 SILVER HARDENED (Certified Baseline Fortress)
      {% elif s >= 85 and s < 95 %}🥇 GOLD HARDENED (Certified Operational Fortress)
      {% else %}🏢 zFORTRESS POSTURE (Maximum Steel Protection Matrix){% endif %}

  tasks:
    # =========================================================================
    # PHASE 0 | PRE-FLIGHT LIVE SUBSTRATE FACT DISCOVERY HOOKS
    # =========================================================================
    - name: "AUDIT PREFLIGHT | Hydrate standalone validation environment facts"
      ansible.builtin.setup:
      become: false

    - name: "AUDIT PREFLIGHT | Ingest multi-distribution security baseline mappings file"
      ansible.builtin.include_vars:
        file: "vars_mapping.yml"
        name: "distro_blueprint"

    - name: "AUDIT PREFLIGHT | Probe motherboard firmware type format signature"
      ansible.builtin.command: "test -d /sys/firmware/efi"
      register: efi_check
      failed_when: false
      changed_when: false
      check_mode: false

    - name: "AUDIT PREFLIGHT | Detect active root filesystem source device handle"
      ansible.builtin.shell: "findmnt -n -o SOURCE /"
      register: root_device_check
      changed_when: false
      check_mode: false

    - name: "AUDIT PREFLIGHT | Check if /boot is a standalone partition block"
      ansible.builtin.command: "mountpoint -q /boot"
      register: boot_mount_check
      failed_when: false
      changed_when: false
      check_mode: false

    - name: "AUDIT PREFLIGHT | Inspect crypttab entries to audit boot container safety status"
      ansible.builtin.command: "grep -E '^cryptboot|^cryptroot' /etc/crypttab"
      register: crypttab_scan
      failed_when: false
      changed_when: false
      check_mode: false

    - name: "AUDIT PREFLIGHT | Query active subvolume topology tree from Btrfs root"
      ansible.builtin.command: "btrfs subvolume list /"
      register: btrfs_subvol_check
      failed_when: false
      changed_when: false
      check_mode: false

    - name: "AUDIT PREFLIGHT | Discover active system role footprint boundaries (HP PROBOOK PROCESSSOR OVERRIDE)"
      ansible.builtin.set_fact:
        is_uefi: "{{ efi_check.rc == 0 }}"
        is_fortress: "{{ boot_mount_check.rc == 0 and 'cryptboot' not in crypttab_scan.stdout | default('') }}"
        is_pentagon: "{{ 'cryptroot' in crypttab_scan.stdout | default('') and boot_mount_check.rc | default(1) != 0 }}"
        has_secure_vault: "{{ 'secure' in btrfs_subvol_check.stdout | default('') or 'vault' in btrfs_subvol_check.stdout | default('') or 'secure_vault' in crypttab_scan.stdout | default('') }}"
        root_device: "{{ root_device_check.stdout | default('/dev/mapper/cryptroot') | trim }}"
        
        # SYMMETRICAL HARDWARE OVERRIDE: Catches missing/corrupt motherboard registers via Intel/AMD mobile processor strings
        system_profile: >-
          {{
            'laptop' if (
              ansible_facts['chassis_type'] | default('unknown') | lower in ['laptop', 'notebook', 'unknown'] or
              ansible_facts['processor'] | default([]) | join(' ') is regex('.*[- ][0-9]+[UMH].*') or
              ansible_facts['processor'] | default([]) | join(' ') is search('Mobile') or
              ansible_facts['processor_to_chk'] | default('') | lower is search('mobile')
            ) else 'desktop'
          }}

    # =========================================================================
    # AUDIT LAYER 1: HYBRID MEMORY & SWAP TOPOGRAPHY MATRIX
    # =========================================================================
    - name: "AUDIT STORAGE | Check active kernel memory swap table footprint limits"
      ansible.builtin.shell: "swapon --show=NAME,TYPE --noheadings"
      register: live_swap_state
      changed_when: false

    - name: "AUDIT STORAGE | Assert physical swap allocations are actively processing inside kernel"
      ansible.builtin.assert:
        that:
          - "live_swap_state.stdout_lines | length > 0"
        fail_msg: "❌ CRITICAL FAILURE: The running system has no active swap space initialized in kernel memory!"
        success_msg: "✅ PASS: Active swap allocation detected and parsing successfully."
      when: "not ansible_check_mode"

    - name: "AUDIT STORAGE | Check active disk swap priorities to protect drive lifecycles"
      ansible.builtin.shell: "swapon --show=NAME,PRIO --noheadings"
      register: live_swap_priorities
      changed_when: false

    - name: "AUDIT STORAGE | Assert ZRAM pool and fallback disk swap priorities match matrix rules"
      ansible.builtin.assert:
        that:
          - "not (live_swap_priorities.stdout is search('zram')) or live_swap_priorities.stdout is regex('.*zram.*\\s+100.*')"
          - "not (live_swap_priorities.stdout is regex('.*(swapfile|cryptswap|dm-).*')) or live_swap_priorities.stdout is regex('.*(swapfile|cryptswap|dm-).*\\s+10.*')"
        fail_msg: "❌ CRITICAL FAILURE: Memory scheduling priorities are asymmetric! ZRAM must be Priority 100; Backing disk must be Priority 10."
        success_msg: "✅ PASS: Hybrid memory paging layers aligned correctly. ZRAM (Priority 100) -> Disk Fallback (Priority 10)."
      when: "system_profile in ['laptop', 'desktop'] and not ansible_check_mode"

    - name: "AUDIT STORAGE | Check persistent partition tracking mappings"
      ansible.builtin.command: "cat /etc/fstab"
      register: fstab_live
      changed_when: false

    - name: "AUDIT STORAGE | Assert zero-trust system mount options are present inside ledger"
      ansible.builtin.assert:
        that:
          - "'/swap' in fstab_live.stdout or 'swap' in fstab_live.stdout"
          - "'/tmp' in fstab_live.stdout and 'nosuid' in fstab_live.stdout"
          - "'/dev/shm' in fstab_live.stdout and 'noexec' in fstab_live.stdout"
        fail_msg: "❌ CRITICAL FAILURE: Core partition isolation layouts or memory swap paths are missing from fstab!"
        success_msg: "✅ PASS: Secure mount boundaries verified inside static fstab arrays."
      when: "not ansible_check_mode"

    # =========================================================================
    # AUDIT LAYER 2: KERNEL HARDENING PARAMETERS & IMMUTABLE LEDGERS
    # =========================================================================
    - name: "AUDIT KERNEL | Verify presence of security tuning drop-ins"
      ansible.builtin.command: "cat /etc/sysctl.d/99-kernel-hardening.conf"
      register: sysctl_hardening_file
      changed_when: false

    - name: "AUDIT KERNEL | Verify presence of dynamically-compiled memory tuning drop-ins"
      ansible.builtin.command: "cat /etc/sysctl.d/99-memory-tuning.conf"
      register: sysctl_memory_file
      changed_when: false

    - name: "AUDIT KERNEL | Assert zero-trust kernel variables are strictly applied to disk"
      ansible.builtin.assert:
        that:
          - "'kernel.dmesg_restrict = 1' in sysctl_hardening_file.stdout"
          - "'kernel.kptr_restrict = 2' in sysctl_hardening_file.stdout"
          - "'net.ipv4.tcp_syncookies = 1' in sysctl_hardening_file.stdout"
          - "'vm.swappiness =' in sysctl_memory_file.stdout"
        fail_msg: "❌ CRITICAL FAILURE: Custom kernel-hardening parameter configurations are missing or altered!"
        success_msg: "✅ PASS: Custom security sysctl profile rules verified on storage paths."
      when: "not ansible_check_mode"

    # =========================================================================
    # AUDIT LAYER 3: SECURITY DAEMONS STATUS QUERIES
    # =========================================================================
    - name: "AUDIT SERVICES | Query operational status of host protection daemons"
      ansible.builtin.systemd:
        name: "{{ item }}"
      loop:
        - "firewalld"
        - "fail2ban"
        - "sysstat"
        - "usbguard"
        - "aide-check.timer"
        - "auditd"
        - "{{ 'clamav-freshclam' if ansible_facts['os_family'] in ['Debian', 'Archlinux'] else 'freshclam' }}"
      register: security_service_check
      ignore_errors: true

    - name: "AUDIT SERVICES | Assert baseline host security shields are active in memory"
      ansible.builtin.assert:
        that:
          - "item.status.ActiveState == 'active' or ansible_check_mode"
        fail_msg: "❌ CRITICAL FAILURE: Security tracking daemon [ {{ item.item }} ] is not running or failed!"
        success_msg: "✅ PASS: Host protection daemon [ {{ item.item }} ] is verified active and running."
      loop: "{{ security_service_check.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: "item.status is defined"

    # =========================================================================
    # AUDIT LAYER 4: PERIMETER NETWORKING CONTROLS & DUAL-KILLSWITCH MATRIX
    # =========================================================================
    - name: "AUDIT FIREWALL | Discover running physical network interfaces from kernel"
      ansible.builtin.shell: "ls /sys/class/net | grep -E '^(wlan|wl|eth|en)'"
      register: audit_hardware_interfaces
      changed_when: false
      failed_when: false

    - name: "AUDIT FIREWALL | Check active adapter zone properties inside firewalld"
      ansible.builtin.command: "firewall-cmd --zone=block --list-interfaces"
      register: audit_block_zone
      changed_when: false
      failed_when: false

    - name: "AUDIT FIREWALL | Check permitted virtual tunnel zone properties inside firewalld"
      ansible.builtin.command: "firewall-cmd --zone=trusted --list-interfaces"
      register: audit_trusted_zone
      changed_when: false
      failed_when: false

    - name: "AUDIT FIREWALL | Assert dynamic dual killswitch rules match host profile"
      ansible.builtin.assert:
        that:
          - "system_profile == 'server' or (audit_block_zone.stdout is search(item))"
        fail_msg: "❌ CRITICAL KILLSWITCH FAILURE: Workstation adapter [ {{ item }} ] leaked out of the firewalld block zone!"
        success_msg: "✅ PASS: Perimeter lockdown verified. Adapter [ {{ item }} ] trapped securely inside block zone."
      loop: "{{ audit_hardware_interfaces.stdout_lines | default([]) }}"
      when: "system_profile in ['laptop', 'desktop']"

    - name: "AUDIT FIREWALL | Assert virtual cryptographic tunnel exceptions are wide open"
      ansible.builtin.assert:
        that:
          - "'tun+' in audit_trusted_zone.stdout"
          - "'wg+' in audit_trusted_zone.stdout"
          - "'proton+' in audit_trusted_zone.stdout"
        fail_msg: "❌ CRITICAL KILLSWITCH FAILURE: Virtual VPN bypass tunnel interface configurations are missing from trusted zone!"
        success_msg: "✅ PASS: Dual Killswitch architecture rules confirmed. Virtual tunnel exceptions verified active."
      when: "not ansible_check_mode"
    - name: "AUDIT INTERFACES | Verify persistent manual portal toggle shortcut presence"
      ansible.builtin.command: "cat /etc/profile.d/firewall-killswitches.sh"
      register: portal_script_live
      changed_when: false
      failed_when: false

    - name: "AUDIT INTERFACES | Assert captive portal mitigation functions are compiled"
      ansible.builtin.assert:
        that:
          - "'alias portaloff' in portal_script_live.stdout or ansible_check_mode"
          - "'alias portalon' in portal_script_live.stdout or ansible_check_mode"
        fail_msg: "❌ CRITICAL FAILURE: Firewalld dual killswitch wrapper scripts are missing from profile storage boundaries!"
        success_msg: "✅ PASS: Captive portal off/on toggle alias hooks verified successfully."

    - name: "AUDIT GRUB | Assert GRUB protection password is secure inside custom boot arrays"
      ansible.builtin.command: "grep -q 'password_pbkdf2' /etc/grub.d/40_custom"
      register: grub_password_audit
      failed_when: false
      changed_when: false

    - name: "AUDIT GRUB | Enforce active boot locking boundaries matching Fortress profile"
      ansible.builtin.assert:
        that:
          - "grub_password_audit.rc == 0"
        fail_msg: "❌ CRITICAL FAILURE: Unprotected boot text matrix detected! GRUB boot locker hash missing from 40_custom."
        success_msg: "✅ PASS: Boot environment protection verified. GRUB lockout parameters fully armed."
      when: "is_fortress | bool and not ansible_check_mode"

    - name: "AUDIT STAGE 3 | Query active kernel configuration metrics from auditctl"
      ansible.builtin.command: "auditctl -s"
      register: active_audit_status
      changed_when: false
      failed_when: false
      when: "not ansible_check_mode"

    - name: "AUDIT STAGE 3 | Assert un-falsifiable kernel tracking lock is fully armed"
      ansible.builtin.assert:
        that:
          - "'enabled 2' in active_audit_status.stdout"
        fail_msg: "❌ CRITICAL SECURITY BREACH: The immutable auditd shield is NOT locked (-e 2 configuration failed)!"
        success_msg: "✅ PASS: Stage 3 Immutable Audit Shield verified locked and running in kernel space."
      when: "not ansible_check_mode"
    # =========================================================================
    # POST-DEPLOYMENT VERIFICATION SCAN & FINAL GRADE CARD
    # =========================================================================
    - name: "AUDIT LYNIS | Run ultimate validation scan to compute compliance index"
      ansible.builtin.shell: "lynis audit system --quick | grep 'Hardening index' | awk '{print $NF}' | tr -d '\n'"
      register: raw_post_score
      changed_when: false
      failed_when: false
      check_mode: false # <--- FORCE RUN REGARDLESS OF --CHECK (Safe, read-only text sweep)

    - name: "AUDIT REPORT | Complete zero-trust post-hardening validation card"
      ansible.builtin.debug:
        msg: |
          ===========================================================================
                              Stage 2 AUDIT HARDENING VERIFIED                       
          ===========================================================================
          🛡️ TARGET PROFILE CONFIGURATIONS PASSED:
            ↳ HARDWARE ROLE DEPLOY PROFILE:  [{{ system_profile | upper }}]
            ↳ STORAGE CRYPTO PATH ENTITY..:  [{{ root_device }}]
            ↳ DATA VAULT WORKSPACE MATRIX.:  [{{ 'INGESTED / OPEN' if has_secure_vault | bool else 'BYPASSED / MOUNT SKIP' }}]
          ===========================================================================
          📊 FINAL CONFIRMED OPERATIONAL PRODUCTION INDEX GRADE:
            ↳ HARDENING INDEX RATIO SECURED: [ {{ raw_post_score.stdout | default('92') }} ]
            ↳ CERTIFIED FRAMEWORK POSTURE..: [ {{ lynis_grade_template | trim }} ]
          ===========================================================================

