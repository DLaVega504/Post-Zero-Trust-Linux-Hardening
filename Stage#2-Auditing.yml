---
- name: "Universal Stand-Alone Zero-Trust Linux Hardening Framework (Stage 2 Auditing)"
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  vars:
    # -------------------------------------------------------------------------
    # SECURE AUDITING CONFIGURATIONS
    # -------------------------------------------------------------------------
    primary_user_identifier: "vega"
    system_hostname_signature: "SENGR"

    # Multi-Distro Auditing System Package Blueprint Matrix
    distro_audit_packages:
      Archlinux: 'audit'
      Debian:    'auditd'
      RedHat:    'audit'
      Suse:      'audit'

  tasks:
    # =========================================================================
    # PHASE 1 | NATIVE SYSTEM COMPLIANCE ENVIRONMENT SCANS
    # =========================================================================
    - name: "AUDIT SCAN | Query active filesystem structure parameters"
      ansible.builtin.shell: "findmnt -n -o SOURCE / | awk '{print $1}' | cut -d'[' -f1"
      register: live_root_device
      changed_when: false
      check_mode: false

    - name: "AUDIT SCAN | Interrogate existing systemd logging frameworks"
      ansible.builtin.stat:
        path: "/etc/audit/rules.d"
      register: audit_rules_directory

    # =========================================================================
    # PHASE 2 | TOOL PROVISIONING AND SYSTEM SUBSYSTEM HARDENING
    # =========================================================================
    - name: "AUDIT CORE | Enforce system auditing daemon is installed natively"
      ansible.builtin.package:
        name: "{{ distro_audit_packages[ansible_facts['os_family']] }}"
        state: present

    - name: "AUDIT CORE | Verify sub-directory permission settings match secure guidelines"
      ansible.builtin.file:
        path: "/etc/audit"
        state: directory
        mode: '0750'
        owner: root
        group: root

    # =========================================================================
    # PHASE 3 | COMPREHENSIVE ZERO-TRUST INTEGRITY MATRIX INJECTION
    # =========================================================================
    - name: "AUDIT RULES | Deploy un-falsifiable zero-trust kernel monitoring rules matrix"
      ansible.builtin.copy:
        dest: "/etc/audit/rules.d/audit.rules"
        content: |
          # ------------------------------------------------------------------
          # CORE LOG BUFFER RESET AND BUFFER OPTIMIZATION
          # ------------------------------------------------------------------
          # Delete all existing tracking hooks to prevent rules pollution
          -D
          
          # Increase local log buffer allocations to prevent data loss bursts
          -b 8192
          
          # Trigger panic error handling states if kernel log storage fills completely
          -f 1
          
          # ------------------------------------------------------------------
          # ADMINISTRATIVE ACCESS AND USER IDENTITY PROTECTION WATCHES
          # ------------------------------------------------------------------
          -w /etc/passwd -p wa -k identity_mod
          -w /etc/group -p wa -k identity_mod
          -w /etc/shadow -p wa -k credentials_mod
          -w /etc/sudoers -p wa -k administrative_priv_mod
          -w /etc/sudoers.d/ -p wa -k administrative_priv_mod
          
          # ------------------------------------------------------------------
          # PRIVILEGE ESCALATION AND CHOWN/CHMOD SURVEILLANCE
          # ------------------------------------------------------------------
          -a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k privilege_escalation_alert
          -a always,exit -F arch=b64 -S chown,fchown,fchownat,lchown -F auid>=1000 -F auid!=unset -k privilege_escalation_alert
          
          # ------------------------------------------------------------------
          # LOW-LEVEL KERNEL ROOTKIT AND MODULE MODIFICATION WATCHES
          # ------------------------------------------------------------------
          -w /usr/bin/kmod -p x -k kernel_modules_mod
          -a always,exit -F arch=b64 -S init_module,delete_module,finit_module -k kernel_modules_mod
          
          # ------------------------------------------------------------------
          # NETWORK PERIMETER KILLSWITCH AND TAMPERING EXPOSURE PLUGINS
          # ------------------------------------------------------------------
          -w /etc/firewalld/ -p wa -k network_perimeter_mod
          -w /etc/fail2ban/ -p wa -k network_perimeter_mod
          -w /etc/usbguard/ -p wa -k peripheral_perimeter_mod
          
          # ------------------------------------------------------------------
          # TELEMETRY LOG INTEGRITY AND ACCESS VECTOR DEFENSES
          # ------------------------------------------------------------------
          -w /var/log/audit/ -p wa -k audit_trail_integrity
          -w /etc/audit/ -p wa -k audit_trail_integrity
          
          # ------------------------------------------------------------------
          # THE IMMUTABILITY SHIELD
          # ------------------------------------------------------------------
          # Locks the engine parameter keys. Any runtime rule deletions or
          # adjustments are blocked by the kernel until the host reboots.
          -e 2
        mode: '0600'
        owner: root
        group: root
      notify: "Trigger Active Auditd Rebuild"

    # =========================================================================
    # PHASE 4 | DEFENSIVE SUBSYSTEM LIFECYCLE ACTIVATION
    # =========================================================================
    - name: "AUDIT DAEMON | Enforce background tracking services are fully armed"
      ansible.builtin.systemd:
        name: "{{ 'auditd' if ansible_facts['os_family'] == 'Debian' else 'auditd' }}"
        state: started
        enabled: true

    - name: "AUDIT COMPLIANCE REPORT | Signal success of zero-trust auditing layer"
      ansible.builtin.debug:
        msg: |
          ======================================================================
          🛡️ SUCCESS: STAGE 2 SYSTEM SURVEILLANCE LOGGING MATRIX DEPLOYED!
          ======================================================================
            ↳ MONITORING METRICS : System Integrity Tracks Active
            ↳ KERNEL LOCK ACTIVE : Immutable Shield Armed via [-e 2]
            ↳ TARGET BOUNDARIES  : Auditing trail synchronized with Post-Hardening!
          ======================================================================

  handlers:
    - name: "Trigger Active Auditd Rebuild"
      ansible.builtin.systemd:
        name: auditd
        state: restarted
      failed_when: false

