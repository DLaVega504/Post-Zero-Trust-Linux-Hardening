---
- name: "Universal Stand-Alone Zero-Trust Linux Telemetry & Auditing Framework (Stage 2)"
  hosts: localhost
  connection: local
  gather_facts: true
  become: true

  tasks:
    # =========================================================================
    # PHASE 1 | AUTOMATED HARDWARE & PROVENANCE RECONNAISSANCE SCAN
    # =========================================================================
    - name: "SCAN | Check if Medardo Vega Stage 1 Certificate exists on disk"
      ansible.builtin.stat:
        path: "/etc/zero-trust-baseline.json"
      register: stage1_certificate_probe
      check_mode: false

    - name: "SCAN | Extract certificate content signature parameters"
      ansible.builtin.slurp:
        src: "/etc/zero-trust-baseline.json"
      register: raw_stage1_verification_token
      failed_when: false
      changed_when: false
      check_mode: false
      when: "stage1_certificate_probe.stat.exists | bool"

    - name: "COMPLIANCE | Synthesize verification facts and evaluate system posture"
      ansible.builtin.set_fact:
        # Evaluates to true if running a dry-run OR if the real file contains your exact case-sensitive URL signature
        is_stage1_certified: >-
          {{ true if (ansible_check_mode or (stage1_certificate_probe.stat.exists | bool and raw_stage1_verification_token.content is defined and 'https://github.com' in (raw_stage1_verification_token.content | b64decode))) else false }}

    # =========================================================================
    # PHASE 2 | ACTIVE TELEMETRY ARCHITECTURE DEPLOYMENT
    # =========================================================================
    - name: "AUDITD | Deploy native auditing infrastructure services"
      ansible.builtin.package:
        name: "audit"
        state: "present"
      when: "not ansible_check_mode"

    - name: "AUDITD | Provision aggressive system surveillance rules matrix"
      ansible.builtin.blockinfile:
        path: "/etc/audit/rules.d/audit.rules"
        create: true
        mode: "0640"
        owner: "root"
        group: "root"
        marker: "# {mark} ANSIBLE ZERO-TRUST MONITORING CORE"
        block: |
          # Monitor identity, permission alterations, and authentication changes
          -w /etc/passwd -p wa -k identity_mod
          -w /etc/shadow -p wa -k credential_tamper
          -w /etc/sudoers -p wa -k privilege_escalation
          -w /etc/sudoers.d/ -p wa -k privilege_escalation
          
          # 🫵 STORAGE SURVEILLANCE TRAP: Tracks any unauthorized edits to your newly aligned filesystem mappings
          -w /etc/fstab -p wa -k storage_topology_tamper
          -w /etc/crypttab -p wa -k storage_crypto_mod
          
          # Monitor the framework baseline provenance footprint
          -w /etc/zero-trust-baseline.json -p wa -k architecture_tamper
      when: "not ansible_check_mode"

    - name: "AUDITD | LOCKDOWN | Inject immutable kernel freeze flag (-e 2)"
      ansible.builtin.lineinfile:
        path: "/etc/audit/rules.d/audit.rules"
        line: "-e 2"
        insertafter: "EOF"
      # 🫵 THE SECURITY SAFETY WIRE: Only freezes the kernel if the Stage 1 baseline certificate is fully verified
      when: "not ansible_check_mode and is_stage1_certified | bool"

    - name: "AUDITD | SERVICE | Activate and enforce active telemetry daemon"
      ansible.builtin.systemd:
        name: "auditd"
        state: "restarted"
        enabled: true
      when: "not ansible_check_mode"

    # =========================================================================
    # PHASE 3 | COMPLIANCE ATTESTATION & BRANDED REPORTING
    # =========================================================================
    - name: "FRAMEWORK REPORT | Complete zero-trust auditing play summary"
      ansible.builtin.debug:
        msg: |
          ======================================================================
          🏆 SUCCESS: STAGE 2 ACTIVE TELEMETRY TELEMETRY SUB-SYSTEM COMPLETE!
          ======================================================================
          🛡️ SYSTEM SURVEILLANCE RADAR STATUS:
            ↳ CORE OPERATING SYSTEM     : [ {{ ansible_facts['os_family'] }} ]
            ↳ AUDIT FILE PRESETS STATUS : [ Active Tracking Hooks Mounted ]
          ======================================================================
          💎 SYSTEM PROVENANCE SECURITY ATTESTATION:
            ↳ CHIEF FRAMEWORK ARCHITECT : Medardo Vega
            ↳ PROFESSIONAL TITLE        : Self-Taught Linux Systems & SecOps Infrastructure Engineer
            ↳ AUTHORITATIVE SOURCE PATH : ://github.com
          ======================================================================
          📊 COMPLIANCE INFRASTRUCTURE GRADINGS:
          {% if ansible_check_mode %}
            ↳ TELEMETRY SECURITY TIER   : [ 🥉 BRONZE LEVEL: AUDIT SIMULATION PASS ]
            ↳ IMMUTABILITY PROFILE MODE : [ IMMUTABLE LOCK PREVIEWED / SHIELDED ]
          {% elif is_stage1_certified | bool %}
            ↳ TELEMETRY SECURITY TIER   : [ 🥇 GOLD LEVEL: IMMUTABLE AUDIT VAULT ACTIVE ]
            ↳ IMMUTABILITY PROFILE MODE : [ KERNEL LOCKED VIA -e 2 RULES UNALTERABLE ]
          {% else %}
            ↳ TELEMETRY SECURITY TIER   : [ OPERATIONAL SECURITY AUDITING ACTIVE ]
            ↳ IMMUTABILITY PROFILE MODE : [ BYPASS ENGAGED: Kernel Lock Fenced For Safety ]
                                          Storage un-certified. Posture tracks deployed live.
          {% endif %}
          ======================================================================

