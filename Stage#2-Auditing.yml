---
- name: "Universal Stand-Alone Zero-Trust Linux Hardening Framework (Stage 2 Audit)"
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  vars:
    # =========================================================================
    # DYNAMIC HARDWARE-AWARE MEMORY PROFILE METRIC TARGETS
    # =========================================================================
    target_swappiness: "{{ '150' if (ansible_facts['memtotal_mb'] | int < 8192) else ('100' if (ansible_facts['memtotal_mb'] | int < 16384) else '10') }}"

  tasks:
    # =========================================================================
    # PHASE 1 | AUTONOMOUS HARDWARE & COMPLIANCE TELEMETRY SCANNING
    # =========================================================================
    - name: "AUDIT SCAN | Probe presence of Stage 1 Framework Hardening Certificate"
      ansible.builtin.stat:
        path: "/etc/zero-trust-stage1.cert"
      register: stage1_certificate_check

    - name: "AUDIT SCAN | Probe system power rail for lithium-ion battery nodes"
      ansible.builtin.stat:
        path: "/sys/class/power_supply/BAT0"
      register: battery_node_check

    - name: "AUDIT SCAN | Read raw DMI motherboard hardware chassis type integer"
      ansible.builtin.slurp:
        src: "/sys/class/dmi/id/chassis_type"
      register: raw_dmi_chassis_id
      failed_when: false

    - name: "AUDIT SCAN | Verify active VFS memory mount table state for containers"
      ansible.builtin.shell: "set -o pipefail && findmnt -m /var/lib/containers -o FSTYPE,OPTIONS | grep btrfs"
      args:
        executable: /bin/bash
      register: container_vfs_mount_check
      failed_when: false
      changed_when: false

    - name: "AUDIT SCAN | Capture live kernel memory parameters from sysctl registers"
      ansible.builtin.shell: "sysctl vm.swappiness vm.dirty_background_bytes vm.dirty_bytes vm.vfs_cache_pressure"
      register: live_kernel_sysctl_metrics
      changed_when: false

    - name: "AUDIT SCAN | Extract firewalld runtime card isolation containment states"
      ansible.builtin.shell: "firewall-cmd --zone=drop --list-interfaces && firewall-cmd --zone=public --list-interfaces && firewall-cmd --zone=trusted --list-interfaces"
      register: live_firewall_zone_trace
      changed_when: false
    - name: "AUDIT SCAN | Evaluate framework background services supervisor lifecycles"
      ansible.builtin.systemd:
        name: "{{ item }}"
      loop:
        - "vpn-monitor.service"
      register: daemon_lifecycle_states

    - name: "AUDIT SCAN | Verify existence of daily automated cron maintenance cleaners"
      ansible.builtin.stat:
        path: "/etc/cron.daily/btrfs-snapshot-cleaner"
      register: cron_cleaner_check

    - name: "AUDIT SCAN | Synthesize translated hardware form-factor profile facts"
      ansible.builtin.set_fact:
        hardware_form_factor: >-
          {%- set chassis_int = (raw_dmi_chassis_id.content | b64decode | trim | int) if (raw_dmi_chassis_id.content is defined and raw_dmi_chassis_id.content) else 0 -%}
          {%- if battery_node_check.stat.exists or chassis_int in [8, 9, 10, 14] -%}
          LAPTOP / PORTABLE WORKSTATION
          {%- elif chassis_int in [3, 4, 6, 7] -%}
          DESKTOP / FIXED SECURE STATION
          {%- elif chassis_int in [23, 24, 25] or ansible_facts['processor_vcpus'] | int > 16 -%}
          ENTERPRISE HARDENED SERVER BLADE
          {%- else -%}
          STANDALONE COMPUTING NODE (FORM-FACTOR UNKNOWN)
          {%- endif -%}

    # =========================================================================
    # PHASE 2 | CUSTOM COMPLIANCE TELEMETRY ATTESTATION LEDGER
    # =========================================================================
    - name: "AUDIT REPORT | Print framework post-deployment security ledger"
      ansible.builtin.debug:
        msg: "{{ audit_ledger_content.split('\n') }}"
      vars:
        audit_ledger_content: |
          ======================================================================
          🔬 VERIFICATION COMPLETE: ZERO-TRUST STAGE 2 RUNTIME AUDIT SUITE
          ======================================================================
          📁 STORAGE ARCHITECTURE PERSISTENCE STATE:
          {% if container_vfs_mount_check.rc == 0 %}
            ↳ CONTAINER SUBVOLUME     : [ SECURE ] @container subvolume mounted cleanly on /var/lib/containers
          {% else %}
            ↳ CONTAINER SUBVOLUME     : [ WARNING ] @container subvolume missing or unmounted
          {% endif %}
          {% if stage1_certificate_check.stat.exists %}
            ↳ STORAGE METRIC PROFILE  : [ COMPLIANT STAGE 1 FOUNDATIONS VERIFIED ]
          {% else %}
            ↳ STORAGE METRIC PROFILE  : [ UNTRACKED PROFILE (NON-OPTIMIZED CORES) ]
          {% endif %}
            ↳ TARGET NODE CHASSIS     : [ {{ hardware_form_factor }} ]
          ======================================================================
          ⚙️ HARDWARE-AWARE PLATTER MECHANICS METRICS (LIVE KERNEL STATE):
          {% for sysctl_line in live_kernel_sysctl_metrics.stdout_lines %}
              ↳ {{ sysctl_line }}
          {% endfor %}
          ======================================================================
          🌐 AIRTIGHT KILLSWITCH ZONE SHIFTING RECORDS:
          {% for fw_line in live_firewall_zone_trace.stdout_lines %}
              ↳ {{ fw_line }}
          {% endfor %}
          ======================================================================
          ⚡ BACKGROUND FRAMEWORK DAEMONS LIFECYCLE STATE:
          {% if daemon_lifecycle_states.results[0].status.ActiveState == 'active' %}
            ↳ REALTIME LEAK SHIELD    : [ ACTIVE ] Monitor service tracking active VPN tunnels
          {% else %}
            ↳ REALTIME LEAK SHIELD    : [ INACTIVE ] WARNING: Network interface leak guard daemon stopped
          {% endif %}
          {% if cron_cleaner_check.stat.exists %}
            ↳ DAILY CRON CLEANER      : [ ACTIVE ] Btrfs platter-optimized maintenance script present
          {% else %}
            ↳ DAILY CRON CLEANER      : [ INACTIVE ] WARNING: Automated snapshot pruning profile missing
          {% endif %}
          ======================================================================
          {% if not stage1_certificate_check.stat.exists %}
          💡 SECURE ARCHITECTURE NOTE : Security grades could drastically improve with an optimized Stage 1 base layer.
          ======================================================================
          {% endif %}

