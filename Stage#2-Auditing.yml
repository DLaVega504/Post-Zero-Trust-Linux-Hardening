---
- name: "Universal Stand-Alone Zero-Trust Linux Hardening Framework (Stage 2 Audit)"
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  vars:
    system_hostname_signature: "SecEngr"
    target_swappiness: "{{ '150' if (ansible_facts['memtotal_mb'] | int < 8192) else ('100' if (ansible_facts['memtotal_mb'] | int < 16384) else '10') }}"

  tasks:
    # =========================================================================
    # PHASE 1 | AUTONOMOUS HARDWARE & COMPLIANCE TELEMETRY SCANNING
    # =========================================================================

    - name: "AUDIT SCAN | Probe presence of Stage 1 Framework Hardening Certificate"
      ansible.builtin.stat:
        path: "/etc/zero-trust-stage1.cert"
      register: stage1_certificate_check

    - name: "AUDIT SCAN | Probe system power rail for lithium-ion battery nodes"
      ansible.builtin.stat:
        path: "/sys/class/power_supply/BAT0"
      register: battery_node_check

    - name: "AUDIT SCAN | Read raw DMI motherboard hardware chassis type integer"
      ansible.builtin.slurp:
        src: "/sys/class/dmi/id/chassis_type"
      register: raw_dmi_chassis_id
      failed_when: false

    - name: "AUDIT SCAN | Discover running network interfaces directly from kernel space"
      ansible.builtin.shell: "set -o pipefail && ip -br link show | awk '$1 !~ /lo|virbr|docker/ {print $1}' | paste -sd ',' -"
      args:
        executable: /bin/bash
      register: active_network_interfaces
      changed_when: false

    - name: "AUDIT SCAN | Verify active VFS memory mount table state for containers"
      ansible.builtin.shell: "set -o pipefail && findmnt -m /var/lib/containers -o FSTYPE,OPTIONS | grep btrfs"
      args:
        executable: /bin/bash
      register: container_vfs_mount_check
      failed_when: false
      changed_when: false

    - name: "AUDIT SCAN | Capture live kernel memory parameters from sysctl registers"
      ansible.builtin.shell: "sysctl vm.swappiness vm.dirty_background_ratio vm.dirty_ratio vm.vfs_cache_pressure"
      register: live_kernel_sysctl_metrics
      changed_when: false

    - name: "AUDIT SCAN | Inspect live ZRAM device allocation and compression parameters"
      ansible.builtin.shell: "zramctl --status --noheadings -o NAME,ALGORITHM,DISKSIZE"
      register: live_zram_metrics
      failed_when: false
      changed_when: false

    - name: "AUDIT SCAN | Extract firewalld runtime card isolation containment states"
      ansible.builtin.shell: |
        echo "=== DROP ZONE INTERFACES ===" && firewall-cmd --zone=drop --list-interfaces
        echo "=== TRUSTED ZONE SOURCES ===" && firewall-cmd --zone=trusted --list-sources
        echo "=== PUBLIC ZONE SERVICES ===" && firewall-cmd --zone=public --list-services
      register: live_firewall_zone_trace
      changed_when: false

    - name: "AUDIT SCAN | Interrogate local fallback name resolution entries"
      ansible.builtin.shell: "grep '{{ system_hostname_signature }}' /etc/hosts"
      register: live_hosts_alignment_check
      failed_when: false
      changed_when: false

    - name: "AUDIT SCAN | Evaluate framework background services supervisor lifecycles"
      ansible.builtin.systemd:
        name: "{{ item }}"
      loop:
        - "vpn-monitor.service"
        - "fail2ban.service"
      register: daemon_lifecycle_states

    - name: "AUDIT SCAN | Evaluate distribution network card tracking service lifecycle"
      ansible.builtin.systemd:
        name: "{{ 'arpwatch@' + (active_network_interfaces.stdout.split(',') | first | default('wls1')) if ansible_facts['os_family'] in ['Archlinux', 'Debian'] else 'arpwatch' }}"
      register: arpwatch_lifecycle_state
      failed_when: false

    - name: "AUDIT SCAN | Verify existence of daily automated cron maintenance cleaners"
      ansible.builtin.stat:
        path: "/etc/cron.daily/btrfs-snapshot-cleaner"
      register: cron_cleaner_check

    - name: "AUDIT SCAN | Synthesize translated hardware form-factor profile facts"
      ansible.builtin.set_fact:
        hardware_form_factor: >-
          {%- set chassis_int = (raw_dmi_chassis_id.content | b64decode | trim | int) if (raw_dmi_chassis_id.content is defined and raw_dmi_chassis_id.content) else 0 -%}
          {%- if battery_node_check.stat.exists or chassis_int in [8, 9, 10, 14] -%}
          LAPTOP / PORTABLE WORKSTATION
          {%- elif chassis_int in [3, 4, 6, 7] -%}
          DESKTOP / FIXED SECURE STATION
          {%- elif chassis_int in [23, 24, 25] or ansible_facts['processor_vcpus'] | int > 16 -%}
          ENTERPRISE HARDENED SERVER BLADE
          {%- else -%}
          STANDALONE COMPUTING NODE (FORM-FACTOR UNKNOWN)
          {%- endif -%}

    # =========================================================================
    # PHASE 2 | CUSTOM COMPLIANCE TELEMETRY ATTESTATION LEDGER
    # =========================================================================
    - name: "AUDIT REPORT | Print framework post-deployment security ledger"
      ansible.builtin.debug:
        msg: "{{ audit_ledger_content.split('\n') }}"
      vars:
        vpn_audit_item: "{{ daemon_lifecycle_states.results | selectattr('item', 'equalto', 'vpn-monitor.service') | first | default(none) }}"
        f2b_audit_item: "{{ daemon_lifecycle_states.results | selectattr('item', 'equalto', 'fail2ban.service') | first | default(none) }}"
        audit_ledger_content: |
          ======================================================================
          🔬 VERIFICATION COMPLETE: ZERO-TRUST STAGE 2 RUNTIME AUDIT SUITE
          ======================================================================
          📁 STORAGE ARCHITECTURE PERSISTENCE STATE:
          {% if container_vfs_mount_check.rc is defined and container_vfs_mount_check.rc == 0 %}
            ↳ CONTAINER SUBVOLUME     : [ SECURE ] @container subvolume mounted cleanly on /var/lib/containers
          {% else %}
            ↳ CONTAINER SUBVOLUME     : [ WARNING ] @container subvolume missing or unmounted
          {% endif %}
          {% if stage1_certificate_check.stat.exists %}
            ↳ STORAGE METRIC PROFILE  : [ COMPLIANT STAGE 1 FOUNDATIONS VERIFIED ]
          {% else %}
            ↳ STORAGE METRIC PROFILE  : [ UNTRACKED PROFILE (NON-OPTIMIZED CORES) ]
          {% endif %}
            ↳ TARGET NODE CHASSIS     : [ {{ hardware_form_factor }} ]
          ======================================================================
          ⚙️ HARDWARE-AWARE PERFORMANCE METRICS (LIVE KERNEL STATE):
          {% for sysctl_line in (live_kernel_sysctl_metrics.stdout_lines | default([])) %}
              ↳ {{ sysctl_line }}
          {% endfor %}
          {% if live_zram_metrics.stdout is defined and live_zram_metrics.stdout | length > 0 %}
            ↳ ACTIVE ZRAM INTERFACE   : {{ live_zram_metrics.stdout | trim }}
          {% else %}
            ↳ ACTIVE ZRAM INTERFACE   : [ INACTIVE ] WARNING: Compressed RAM swap block missing
          {% endif %}
          ======================================================================
          🌐 AIRTIGHT KILLSWITCH ZONE SHIFTING RECORDS:
          {% for fw_line in (live_firewall_zone_trace.stdout_lines | default([])) %}
              ↳ {{ fw_line }}
          {% endfor %}
          {% if live_hosts_alignment_check.rc is defined and live_hosts_alignment_check.rc == 0 %}
            ↳ STATIC HOST RESOLUTION  : [ SECURE ] Signature '{{ system_hostname_signature }}' verified in /etc/hosts
          {% else %}
            ↳ STATIC HOST RESOLUTION  : [ WARNING ] '{{ system_hostname_signature }}' missing from local resolution tables
          {% endif %}
          ======================================================================
          ⚡ BACKGROUND FRAMEWORK DAEMONS LIFECYCLE STATE:
          {% if vpn_audit_item is not none and vpn_audit_item.status is defined and vpn_audit_item.status and vpn_audit_item.status.ActiveState is defined and vpn_audit_item.status.ActiveState == 'active' %}
            ↳ REALTIME LEAK SHIELD    : [ ACTIVE ] Monitor service tracking active VPN tunnels
          {% else %}
            ↳ REALTIME LEAK SHIELD    : [ INACTIVE ] WARNING: Network interface leak guard daemon stopped or skipped
          {% endif %}
          {% if f2b_audit_item is not none and f2b_audit_item.status is defined and f2b_audit_item.status and f2b_audit_item.status.ActiveState is defined and f2b_audit_item.status.ActiveState == 'active' %}
            ↳ BRUTE-FORCE INTRUSION   : [ ACTIVE ] Fail2ban active defense network shield engaged
          {% else %}
            ↳ BRUTE-FORCE INTRUSION   : [ INACTIVE ] WARNING: Brute-force monitoring service stopped or skipped
          {% endif %}
          {% if arpwatch_lifecycle_state.status is defined and arpwatch_lifecycle_state.status and arpwatch_lifecycle_state.status.ActiveState is defined and arpwatch_lifecycle_state.status.ActiveState == 'active' %}
            ↳ ARP WATCH DAEMON        : [ ACTIVE ] Hardware interface network map snooping active
          {% else %}
            ↳ ARP WATCH DAEMON        : [ INACTIVE ] WARNING: ARP tracking service stopped or missing
          {% endif %}
          {% if cron_cleaner_check.stat.exists %}
            ↳ DAILY CRON CLEANER      : [ ACTIVE ] Btrfs platter-optimized maintenance script present
          {% else %}
            ↳ DAILY CRON CLEANER      : [ INACTIVE ] WARNING: Automated snapshot pruning profile missing
          {% endif %}
          ======================================================================
          {% if not stage1_certificate_check.stat.exists %}
          💡 SECURE ARCHITECTURE NOTE : Security grades could drastically improve with an optimized Stage 1 base layer.
          ======================================================================
          {% endif %}

